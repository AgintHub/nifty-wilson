dag_type: plain_text
description: Generated workflow from UI.
name: plan_military_invasion_campaign_for_china
nodes:
  assess_risk_and_mitigation:
    agent: false
    description: Conduct a rigorous, multi‑dimensional risk assessment for the planned
      operations against the targeted Chinese region, integrating insights from the
      maneuver and assault sequence and the tactical operations schedule. For each
      threat—Chinese counter‑attacks, cyber interference, logistical delays, political
      fallout, and international sanctions—evaluate likelihood, impact, and risk score,
      then propose tailored mitigation actions, contingency plans, responsible ownership,
      and monitoring indicators. Output the assessment as a structured JSON risk matrix.
    name: assess_risk_and_mitigation
    nodes_depended_on:
    - create_maneuver_and_assault_sequence
    - draft_tactical_operations_plan
    nodes_dependent_on: []
    prompt: "Using the maneuver and assault sequence and the tactical operations timeline\
      \ generated by the parent nodes, conduct a comprehensive risk assessment for\
      \ the operation in China. Identify, classify, and evaluate the following risk\
      \ categories:\n\n1. **Chinese counter‑attacks** – ground, air, maritime, and\
      \ cyber countermeasures.\n2. **Cyber interference** – network disruption, espionage,\
      \ sabotage.\n3. **Logistical delays** – transport bottlenecks, supply‑line vulnerabilities,\
      \ resupply windows.\n4. **Political fallout** – regional tensions, domestic\
      \ backlash, diplomatic incidents.\n5. **International sanctions** – trade embargoes,\
      \ financial restrictions, asset freezes.\n\nFor each identified risk, compute:\n\
      - **Likelihood** (scale 1–5 or low–medium–high),\n- **Impact** (scale 1–5 or\
      \ low–medium–high),\n- **Risk score** (likelihood × impact).\n\nRank the risks\
      \ and propose:\n- **Mitigation actions** (specific, actionable steps),\n- **Contingency\
      \ plans** (fallback options),\n- **Responsible units** (who will execute the\
      \ mitigation),\n- **Implementation timeline**,\n- **Monitoring indicators**\
      \ (KPIs or alerts).\n\nDeliver the results as a JSON‑formatted risk matrix with\
      \ the following structure for each entry:\n```\n{\n  \"risk_id\": \"R001\",\n\
      \  \"risk_category\": \"Chinese counter‑attacks\",\n  \"description\": \"High‑probability\
      \ rapid counter‑attack on primary insertion point.\",\n  \"likelihood\": 4,\n\
      \  \"impact\": 5,\n  \"risk_score\": 20,\n  \"priority\": \"High\",\n  \"mitigation_actions\"\
      : [\"Pre‑strike neutralization\", \"Air superiority\", \"Cyber counter‑measure\
      \ deployment\"],\n  \"responsible\": \"Joint Operations Center\",\n  \"status\"\
      : \"Not Started\",\n  \"monitoring\": [\"Real‑time air traffic analysis\", \"\
      Signal‑intelligence alerts\"]\n}\n```\nThe final output should be a JSON array\
      \ containing all risk entries."
  assess_target_defenses:
    agent: false
    description: Conducts a comprehensive, multi‑domain assessment of the defensive
      posture of a specified Chinese region. Synthesizes troop deployments, fortification
      layers, integrated air defense networks, naval and maritime deterrents, cyber/space
      capabilities, and intelligence‑gathering infrastructure to produce a structured
      risk matrix. The output identifies key strengths, vulnerabilities, and critical
      defensive lines, enabling precise operational planning.
    name: assess_target_defenses
    nodes_depended_on:
    - gather_initial_geopolitical_data
    nodes_dependent_on: []
    prompt: 'Using the geopolitical, demographic, economic, and strategic data provided
      by the "gather_initial_geopolitical_data" node, perform a detailed evaluation
      of the target Chinese region’s defensive posture. Structure your analysis into
      the following domains:


      1. **Ground Forces & Fortifications** – troop strengths, unit types, defensive
      positions, fortification density, and supply lines.

      2. **Integrated Air Defense** – radar coverage, surface‑to‑air missile batteries
      (HQ‑9, S‑300, etc.), anti‑aircraft artillery, and early‑warning systems.

      3. **Naval & Maritime Defenses** – coastal missile batteries, anti‑ship missile
      sites, naval presence, and maritime patrol assets.

      4. **Cyber & Space Capabilities** – cyber‑defense units, electronic warfare
      assets, space‑based sensors, and satellite command & control.

      5. **Intelligence, Surveillance & Reconnaissance (ISR)** – satellite assets,
      aerial ISR platforms, signals‑intelligence nodes, and human‑intelligence networks.

      6. **Command & Control & Logistics** – communication networks, decision‑making
      hubs, supply depots, and redundancy measures.


      For each domain, list:

      - **Strengths** (e.g., high-density radar network, robust supply lines)

      - **Weaknesses** (e.g., reliance on single‑point logistics, limited cyber‑defense
      coverage)

      - **Critical Defensive Lines** (e.g., riverine barriers, coastal missile zones).


      Conclude with an overall assessment that weighs the aggregate strengths and
      weaknesses, identifies the most vulnerable points, and highlights the primary
      defensive lines that would need to be addressed or leveraged in operational
      planning. Output the entire analysis as a well‑structured JSON object with clear
      keys for each domain, including sub‑lists for strengths, weaknesses, and defensive
      lines. Ensure the JSON is valid and can be consumed by downstream nodes without
      modification.'
  compile_campaign_briefing:
    agent: false
    description: Synthesizes the finalized campaign timeline, risk assessment, and
      operational details into a concise, executive briefing tailored for deployment
      in China, providing a structured, decision‑ready document for senior leadership.
    name: compile_campaign_briefing
    nodes_depended_on:
    - finalize_campaign_timeline
    nodes_dependent_on: []
    prompt: 'Produce a concise, executive‑level briefing for deployment in China that
      fully incorporates the finalized campaign timeline, risk assessment, and operational
      parameters. The briefing must be formatted in Markdown and include the following
      sections:


      1. **Executive Summary** – A one‑page synopsis of the campaign’s purpose, key
      objectives, and expected outcomes.

      2. **Strategic Objectives & Key Performance Indicators (KPIs)** – Clear, measurable
      goals tied to the broader mission.

      3. **Force Allocation Matrix** – A tabular representation of unit types, sizes,
      capabilities, and geographic assignments, highlighting any China‑specific adjustments
      (e.g., joint‑force integration, local partner roles).

      4. **Logistical Support Plan** – Overview of supply chains, transportation hubs,
      communication networks, and sustainment schedules, with emphasis on Chinese
      infrastructure constraints and regulatory requirements.

      5. **Operational Phases & Timeline** – A chronological Gantt‑style table aligned
      with the timeline from `finalize_campaign_timeline`, mapping phases, milestones,
      and force rotations.

      6. **Risk Assessment & Mitigation Matrix** – A risk register that pairs identified
      threats with corresponding mitigation actions, probability–impact ratings, and
      contingency timelines.

      7. **Appendices** – Supporting tables, reference documents, and annexed intelligence
      summaries.


      The document should use consistent headings, bolded key terms, and embedded
      tables or charts where appropriate. All content must be derived from the inputs
      of the parent nodes and tailored to the operational context of China, addressing
      geopolitical, cultural, and logistical nuances. Output the completed briefing
      as a single Markdown file.

      '
  create_maneuver_and_assault_sequence:
    agent: false
    description: Develop a synchronized, terrain‑aware assault and maneuver sequence
      for the Chinese theater by integrating the tactical timeline from *draft_tactical_operations_plan*
      and the resupply schedule from *outline_support_and_resupply*. The plan will
      specify ingress routes, force concentration nodes, engagement triggers, fallback
      corridors, and logistical choke points, all timed to the overall command and
      control framework.
    name: create_maneuver_and_assault_sequence
    nodes_depended_on:
    - draft_tactical_operations_plan
    - outline_support_and_resupply
    nodes_dependent_on: []
    prompt: 'Create a detailed, multi‑phase maneuver and assault flow for the designated
      Chinese theater. The output must:

      1. **Ingress** – list seaward, aerial, and land routes with terrain‑specific
      constraints (e.g., coastal low‑lying plains, urban districts along the Yangtze,
      mountainous border passes).

      2. **Force Concentration** – identify primary and secondary concentration nodes,
      linking them to the day‑to‑day timeline from *draft_tactical_operations_plan*.

      3. **Engagement Triggers** – tie each concentration point to specific engagement
      rules and time markers from the tactical schedule.

      4. **Fallback & Extraction** – delineate secure fallback lines, extraction corridors,
      and contingency routes.

      5. **Logistics & Resupply** – map resupply nodes, intervals, and transport assets
      as detailed in *outline_support_and_resupply*; indicate choke points and resupply
      windows.

      6. **Command & Control Checkpoints** – place coordination points that reflect
      the established C2 structure.

      7. **Timing** – provide phase‑level timing (Phase I, II, III) in hours/minutes,
      noting any terrain or weather modifiers.

      The final product should be a structured text representation ready for conversion
      into a visual flow diagram, ensuring it aligns with the tactical timeline and
      logistic plan while addressing the specific operational context of China.'
  define_campaign_goals:
    agent: false
    description: Synthesizes strategic, operational, and tactical objectives for an
      invasion campaign against a specified Chinese region, leveraging the geopolitical
      intelligence collected in the preceding node. The output is a clear, actionable
      bullet list that aligns mission goals with national strategy and situational
      constraints.
    name: define_campaign_goals
    nodes_depended_on:
    - gather_initial_geopolitical_data
    nodes_dependent_on: []
    prompt: 'Using the structured JSON summary produced by **gather_initial_geopolitical_data**,
      formulate the primary objectives of an invasion campaign targeting the specified
      Chinese region. Organize these objectives into three hierarchical levels:


      1. **Strategic Objectives** – high‑level, policy‑driven outcomes that shape
      national security priorities.

      2. **Operational Objectives** – medium‑tier goals that translate strategy into
      actionable plans for theater‑level forces.

      3. **Tactical Objectives** – granular, ground‑level actions that achieve the
      operational ends.


      For each level, provide a concise bullet list (no more than five bullets per
      level). Each bullet should:

      - State a clear, measurable goal.

      - Reference a key element from the geopolitical data (political actors, military
      assets, terrain, infrastructure, or hotspots) that justifies the goal.

      - Note any critical constraints or risk mitigations relevant to that goal.


      Output the result as plain text, using headings **Strategic Objectives:**, **Operational
      Objectives:**, and **Tactical Objectives:** followed by the bullet lists. Do
      not include code blocks or JSON formatting.

      '
  design_force_allocation:
    agent: false
    description: Creates a high‑level, objective‑driven force distribution plan that
      aligns with the campaign’s strategic, operational, and tactical goals, accounts
      for the assessed Chinese defensive posture, and reflects the available force
      set. The plan balances combat power, speed, and sustainability, and outputs
      a concise JSON distribution table for downstream operational planning.
    name: design_force_allocation
    nodes_depended_on:
    - define_campaign_goals
    - assess_target_defenses
    - evaluate_force_capabilities
    nodes_dependent_on: []
    prompt: 'Using the strategic, operational, and tactical objectives from *define_campaign_goals*,
      the assessed enemy defenses from *assess_target_defenses*, and the inventory
      of available forces from *evaluate_force_capabilities*, devise an optimal force
      allocation plan tailored to the chosen Chinese theater.


      1. For each campaign objective, rank it by priority (Strategic > Operational
      > Tactical). 2. For each priority level, identify the required capabilities
      (e.g., maneuver warfare, anti‑air, cyber, logistics support, rapid‑reaction).
      3. Allocate ground, air, naval, cyber, and special‑operations units to each
      objective, ensuring a balance of combat power, speed of deployment, and sustainability
      (fuel, supplies, maintenance). 4. Specify the deployment zone for each unit
      (e.g., coastal ingress, inland breakthrough, airfield seizure, cyber‑attack
      node). 5. Summarize the allocation in a JSON table with the following fields:
      *objective_id*, *unit_type*, *quantity*, *mission_description*, *deployment_zone*,
      *combat_power_rating*, *speed_factor*, *sustainability_rating*.


      The final JSON should be human‑readable, include a brief comment on how the
      allocation mitigates identified defensive weaknesses, and reference the key
      enemy defenses that influenced your distribution choices. Do not output any
      explanatory text outside the JSON.

      '
  develop_logistics_plan:
    agent: false
    description: Creates a comprehensive, China‑specific logistics architecture that
      supports the campaign forces allocated by the previous node.  It integrates
      supply chains, transport networks, fuel and ammunition provisioning, medical
      services, and command communications into a machine‑readable JSON framework,
      including contingency pathways for potential disruptions.
    name: develop_logistics_plan
    nodes_depended_on:
    - design_force_allocation
    nodes_dependent_on: []
    prompt: 'Develop a China‑centric logistics framework that aligns with the force
      allocation defined by the *design_force_allocation* node.  The plan must:


      1. **Supply Chain Architecture** – Map primary supply chains from domestic and
      border sources to frontline units, detailing procurement points, inventory buffers,
      and replenishment schedules.

      2. **Transport Network Design** – Identify optimal multimodal corridors (rail,
      highway, sea, air) connecting major hubs such as Shanghai, Guangzhou, Beijing,
      and strategic ports, and specify transit capacities, scheduling windows, and
      routing redundancies.

      3. **Fuel & Ammunition Logistics** – Outline fuel depots, ammunition storage
      facilities, and secure transport routes, including contingency routes for border
      closures or security incidents.

      4. **Medical & Sustainment Support** – Position medical facilities and field
      hospitals, plan casualty evacuation routes, and establish supply lines for medical
      consumables.

      5. **Command & Control Connectivity** – Design robust communication links (satellite,
      fiber, secure radio) that remain operational under cyber or electronic warfare
      conditions.

      6. **Risk & Contingency Planning** – Evaluate potential disruptions (border
      restrictions, cyber‑attacks, rapid redeployments) and propose alternative pathways
      with risk ratings.

      7. **JSON Output** – Return a hierarchical JSON structure capturing nodes, routes,
      capacities, risk scores, and redundancy options, ready for integration with
      subsequent nodes.


      Use clear, concise language and structure your JSON so that each logistic element
      is self‑contained and machine‑readable.  The output should be a single JSON
      object named `logistics_plan` containing all the above components.'
  draft_tactical_operations_plan:
    agent: false
    description: Develop a phased, day‑by‑day tactical operations schedule that aligns
      force allocation, ISR intelligence, and command‑and‑control directives for a
      coordinated invasion of a specified Chinese operational theater. The schedule
      specifies objectives, asset deployment, movement corridors, engagement protocols,
      coordination hubs, risk mitigations, and contingency actions, all tailored to
      China’s dense terrain, layered air defenses, cyber and electronic warfare capabilities,
      and logistical constraints.
    name: draft_tactical_operations_plan
    nodes_depended_on:
    - design_force_allocation
    - plan_intelligence_and_surveillance
    - establish_command_and_control_structure
    nodes_dependent_on: []
    prompt: 'Using the force allocation table, ISR plan, and command structure, craft
      a comprehensive, phased tactical operations schedule for the invasion of the
      designated Chinese region. Produce a JSON array where each entry represents
      a single operational phase and contains:


      1. **Date & Time Window** – Exact dates and start/end times.

      2. **Objective** – Primary mission for the phase (e.g., seize airfield, suppress
      SAM batteries).

      3. **Assets Involved** – List of force units, ISR assets, and C2 nodes assigned.

      4. **Movement Routes** – Coordinates, terrain descriptors, and corridor constraints.

      5. **Engagement Rules** – Rules of engagement, fire thresholds, target classification,
      and escalation protocols.

      6. **Coordination Points** – C2 hubs, liaison teams, ISR feeds, and communication
      links.

      7. **Risk Assessment & Contingency Actions** – Potential Chinese counter‑capabilities,
      civilian impact, and fallback options.

      8. **Key Milestones & Success Metrics** – Measurable indicators and decision
      points.


      Ensure the schedule reflects Chinese‑specific factors: dense urban areas, layered
      air defense, cyber/electronic warfare, supply chain limits, and civilian considerations.
      Align all dates and times with the campaign timeline established in the force
      allocation and command‑and‑control nodes. Output the schedule **strictly in
      JSON format**.'
  establish_command_and_control_structure:
    agent: false
    description: Defines a resilient, hierarchical command and control framework for
      the China campaign, detailing reporting lines, decision rights, communication
      protocols, and integration with intelligence, logistics, and cyber‑electronic
      warfare assets.
    name: establish_command_and_control_structure
    nodes_depended_on:
    - design_force_allocation
    nodes_dependent_on: []
    prompt: 'Construct a comprehensive, multi‑tiered command hierarchy tailored for
      operations in China.  The table must include:

      1. **Level** – e.g., Theater, Sector, Sub‑Sector, Operational Team.

      2. **Role** – Title or functional designation.

      3. **Primary Responsibilities** – Key tasks and mission focus.

      4. **Decision Authority** – Scope of autonomous decisions at this level.

      5. **Reporting Line** – Direct superior and communication path.

      6. **Communication Method** – Secure radio, satellite, cyber‑link, or hybrid.

      7. **Integration Points** – Links with Intelligence Fusion, ISR, Logistics,
      Cyber/Electronic Warfare, and Liaison Teams.

      8. **Contingency Actions** – Default fallback actions if the node is disrupted.


      The hierarchy should reflect China’s geographic diversity (coastal vs inland,
      urban centers vs rural provinces), critical infrastructure nodes (energy grids,
      data hubs), and the heightened cyber‑electronic threat environment.  Use a markdown
      table format with clear headings and a brief example row.  Output only the table
      – no additional text or commentary.

      '
  evaluate_force_capabilities:
    agent: false
    description: Compiles a comprehensive, domain‑segmented inventory of friendly
      forces for the China‑focused campaign, integrating geopolitical insights, logistical
      constraints, and theater‑specific readiness. The output provides a machine‑readable
      JSON catalog detailing unit types, numbers, mission profiles, readiness levels,
      and deployment nuances to enable precise strategy formulation.
    name: evaluate_force_capabilities
    nodes_depended_on:
    - gather_initial_geopolitical_data
    nodes_dependent_on: []
    prompt: "Produce a detailed, machine‑readable JSON inventory of all friendly forces\
      \ earmarked for the China‑focused campaign. For each capability domain—ground,\
      \ air, naval, cyber, and special operations—list:\n\n* **Unit type** (e.g.,\
      \ 1st Infantry Division, F‑35B, DDG‑1000, cyber‑defense squadron, Delta Force)\n\
      * **Size** (troop or asset count)\n* **Primary mission profile** (e.g., air\
      \ superiority, amphibious assault, maritime interdiction, cyber‑offense, clandestine\
      \ operations)\n* **Key equipment or systems** (e.g., F‑35, Aegis, U‑2, J‑UMT,\
      \ Special Forces training modules)\n* **Current readiness level** (e.g., Ready,\
      \ Moderately Ready, Not Ready)\n* **Deployment‑specific attributes** such as\
      \ theater‑tailored readiness (e.g., anti‑sea‑lane capability, airspace saturation,\
      \ cyber‑security posture)\n* **Logistical considerations** (e.g., supply line\
      \ reach, sustainment support, port/dock availability)\n\nOrganize the data into\
      \ a hierarchical JSON structure with top‑level keys for each domain and aggregate\
      \ totals for overall force composition. Ensure that the output schema aligns\
      \ with the downstream nodes’ expectations (e.g., use keys like `unit_type`,\
      \ `count`, `mission`, `readiness`, `theater_readiness`, `logistics`). The JSON\
      \ should be well‑formed, with clear comments removed, and ready for ingestion\
      \ by subsequent analytical nodes.\n\nExample structure for one domain:\n```\n\
      \"ground\": {\n  \"units\": [\n    {\n      \"unit_type\": \"1st Infantry Division\"\
      ,\n      \"count\": 12000,\n      \"mission\": \"Rapid Deployment & Island Assault\"\
      ,\n      \"readiness\": \"Ready\",\n      \"theater_readiness\": \"High (proximity\
      \ to South China Sea)\",\n      \"logistics\": {\n        \"supply_line\": \"\
      Pacific Fleet support\",\n        \"port_access\": \"Okinawa, Guam\"\n     \
      \ }\n    },\n    ...\n  ],\n  \"total\": 12000\n}\n```\n\nThe final JSON must\
      \ contain all domains, aggregate counts, and be syntactically valid for parsing\
      \ by the next node in the workflow."
  finalize_campaign_timeline:
    agent: false
    description: Generates a definitive, phased campaign schedule for operations in
      China, synthesizing risk assessments, force rotation plans, logistical timelines,
      and contingency pathways to guide command through all mission phases from staging
      to final objectives.
    name: finalize_campaign_timeline
    nodes_depended_on:
    - assess_risk_and_mitigation
    nodes_dependent_on: []
    prompt: 'Using the risk matrix produced by the **assess_risk_and_mitigation**
      node, construct a comprehensive, chronological campaign timeline for operations
      in China. The timeline should cover all phases from initial staging through
      final objectives and include:


      1. **Phase identifiers** (e.g., Staging, Maneuver, Assault, Consolidation, Extraction)

      2. **Key milestones and decision points** with explicit dates in YYYY‑MM‑DD
      format

      3. **Assigned units and force‑rotation slots** for each phase

      4. **Logistical support windows** (transport, supply, sustainment)

      5. **Contingency actions** mapped to the identified risks (Chinese counter‑attacks,
      cyber interference, logistical delays, political fallout, sanctions)

      6. **Synchronization checkpoints** with other concurrent operations


      Present the output as an ordered list where each entry contains:

      - Date or date range

      - Action/Phase

      - Responsible unit(s)

      - Primary objective

      - Associated risk mitigation (if any)


      Ensure the timeline is clear, precise, and directly actionable for command and
      control teams.'
  gather_initial_geopolitical_data:
    agent: false
    description: Collect and synthesize multi‑disciplinary, geo‑referenced geopolitical
      intelligence for a targeted Chinese region, integrating political, military,
      economic, demographic, and strategic dimensions into a unified JSON dossier
      to underpin campaign planning and risk assessment.
    name: gather_initial_geopolitical_data
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Using the most recent open‑source, satellite, and classified intelligence
      available, compile a comprehensive, geo‑referenced dossier for the designated
      Chinese region and its surrounding area.  The output must include:


      1. **Political Architecture** – Party leadership, provincial government, local
      military command, and key decision‑makers.

      2. **Military Assets** – Unit designations, equipment inventories, deployment
      footprints, readiness status, and logistical hubs.

      3. **Strategic Terrain** – Topography, natural choke points, critical infrastructure
      (ports, highways, railways, power grids, telecom nodes), and their geographic
      coordinates.

      4. **Demographic & Economic Profile** – Population density, major industries,
      GDP per capita, trade flows, and supply‑chain dependencies.

      5. **Conflict Hotspots** – Intelligence‑verified flash‑points and potential
      escalation scenarios.

      6. **Threat Assessment Matrix** – Actors linked to capabilities, intent, and
      risk level.


      Format the response as a single JSON object with clear, descriptive keys.  Where
      spatial data applies, include latitude/longitude coordinates.  Ensure the schema
      is compatible with downstream analytical nodes.

      '
  outline_support_and_resupply:
    agent: false
    description: Generates a detailed, China‑specific resupply logistics table for
      each combat element, integrating depot networks, transport modalities, frequency,
      volume, and contingency pathways as outlined by the parent logistics framework.
    name: outline_support_and_resupply
    nodes_depended_on:
    - develop_logistics_plan
    nodes_dependent_on: []
    prompt: 'Using the logistics framework developed in the parent node, generate
      a comprehensive resupply plan for each combat element operating under a Chinese
      operational context. The plan must detail:

      1. **Depot Locations** – city or province, including domestic and forward‑deployed
      depots.

      2. **Transport Assets** – applicable modes (air, naval, rail, road) and any
      joint‑force or civilian‑contracted capabilities.

      3. **Resupply Intervals** – frequency in days, aligned with operational tempo
      and supply consumption rates.

      4. **Resupply Volume** – quantity of materiel (fuel, ammunition, rations, medical
      kits) per cycle.

      5. **Contingency Options** – alternate routes, backup depots, and rapid‑replenishment
      assets.


      Present the information in a clear table format with columns: *Combat Element,
      Depot, Transport Mode, Frequency (days), Resupply Volume, Contingency Option*.
      Ensure all data reflects Chinese logistical infrastructure, terrain considerations,
      and current military doctrine. Output only the table, no additional commentary.'
  plan_intelligence_and_surveillance:
    agent: false
    description: Creates a detailed, domain‑wide ISR strategy tailored to the surveillance
      of Chinese military capabilities and infrastructure, synthesizing geopolitical,
      defensive, and technical insights from preceding analysis.
    name: plan_intelligence_and_surveillance
    nodes_depended_on:
    - gather_initial_geopolitical_data
    - assess_target_defenses
    nodes_dependent_on: []
    prompt: 'Develop a comprehensive, multi-domain ISR (Intelligence, Surveillance,
      Reconnaissance) strategy specifically designed to monitor Chinese military forces
      and critical infrastructure. Incorporate the following elements:


      1. **Domain Coverage** – Aerial (fixed-wing, rotary-wing, UAV), satellite (electro‑optical,
      infrared, synthetic aperture radar), signals intelligence (radar, communications,
      electronic emission), human intelligence (HUMINT networks, open-source), and
      cyber intelligence (network infiltration, malware analysis).

      2. **Target Areas** – Geospatial coordinates, key logistics hubs, command and
      control nodes, troop concentrations, air defense sites, anti‑satellite launchers,
      coastal batteries, and cyber‑infrastructure.

      3. **Assets & Frequency** – Specify required aircraft, satellite passes, ground
      stations, signal intercept nodes, HUMINT asset pools, cyber exploitation tools,
      and the operational frequencies or spectrum bands to be monitored.

      4. **Integration with Defenses** – Account for identified Chinese air defense
      radars, missile systems, electronic warfare suites, and anti‑satellite capabilities
      to mitigate detection and loss risks.

      5. **Operational Timing & Cadence** – Define mission windows, revisit periods,
      and escalation thresholds based on the assessment of Chinese defensive posture.

      6. **Risk & Contingency** – Highlight potential counter‑ISR measures, legal/diplomatic
      constraints, and fallback options.


      Provide the output as a single JSON object with the following keys: `domains`,
      `target_areas`, `assets`, `frequencies`, `mission_timeline`, `risk_assessment`,
      and `contingency_plan`. Ensure all fields are populated with concrete values
      or structured sub‑objects so that downstream nodes can consume the plan directly.

      '
  review_and_approve_campaign:
    agent: false
    description: Conduct a comprehensive, strategic endorsement of the campaign plan
      tailored for the China region. Verify that the briefing is complete, accurate,
      and fully aligned with the strategic objectives, operational imperatives, and
      regulatory constraints relevant to China. Deliver a formal, unambiguous approval
      statement authorizing the campaign to proceed, or flag any critical issues.
    name: review_and_approve_campaign
    nodes_depended_on:
    - compile_campaign_briefing
    nodes_dependent_on: []
    prompt: Examine the compiled briefing for the China region, validating each component—objectives,
      force allocation, logistics, operations, timeline, and risk assessment—against
      the strategic goals and regulatory constraints specific to China. Confirm that
      all elements are complete, accurate, and compliant. If any issues arise, note
      them succinctly. Provide a single, definitive approval statement that authorizes
      the campaign to advance.
