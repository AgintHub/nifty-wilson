dag_type: plain_text
description: Workflow for the day-to-day tasks of an investor relations associate,
  including handling emails, calls, writing reports, and updating CRM.
name: day_of_an_investor_relations_associate
nodes:
  answer_email_after_call:
    agent: false
    description: Respond to any email sent by LPs after the call, addressing any follow-up
      questions or concerns.
    name: answer_email_after_call
    nodes_depended_on:
    - join_lp_call
    nodes_dependent_on: []
    prompt: Respond to any email sent by LPs after the call, addressing any follow-up
      questions or concerns.
  answer_prospective_lp_question:
    agent: false
    description: Respond to the prospective LP's question about competitive differentiation,
      providing a clear and compelling answer that highlights the fund's unique strengths
      without mentioning competitors directly.
    name: answer_prospective_lp_question
    nodes_depended_on:
    - rewrite_portco_commentary
    nodes_dependent_on: []
    prompt: Respond to the prospective LP's question about competitive differentiation,
      providing a clear and compelling answer that highlights the fund's unique strengths
      without mentioning competitors directly.
  check_subscription_status:
    agent: false
    description: Verify the subscription status of the prospective LP who inquired
      about competitive differentiation, checking for any delays or updates in their
      status.
    name: check_subscription_status
    nodes_depended_on:
    - send_monthly_update
    nodes_dependent_on: []
    prompt: Verify the subscription status of the prospective LP who inquired about
      competitive differentiation, checking for any delays or updates in their status.
  end_of_day_reminders:
    agent: false
    description: Review the day's progress and tasks, taking note of any outstanding
      issues or responsibilities.
    name: end_of_day_reminders
    nodes_depended_on:
    - swear_to_update_crm
    nodes_dependent_on: []
    prompt: Review the day's progress and tasks, taking note of any outstanding issues
      or responsibilities.
  handle_emails:
    agent: false
    description: Sort and respond to all emails in the inbox, prioritizing critical
      and time-sensitive communications.
    name: handle_emails
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Sort and respond to all emails in the inbox, prioritizing critical and
      time-sensitive communications.
  join_lp_call:
    agent: false
    description: Join the scheduled LP call and participate in all discussions. Engage
      actively with LPs and provide clear responses to their questions.
    name: join_lp_call
    nodes_depended_on:
    - prepare_for_lp_call
    nodes_dependent_on: []
    prompt: Join the scheduled LP call and participate in all discussions. Engage
      actively with LPs and provide clear responses to their questions.
  prepare_for_lp_call:
    agent: false
    description: Review the deck and update any relevant information based on recent
      developments or changes in the portfolio. Ensure all necessary materials are
      readily available for the call.
    name: prepare_for_lp_call
    nodes_depended_on:
    - handle_emails
    nodes_dependent_on: []
    prompt: Review the deck and update any relevant information based on recent developments
      or changes in the portfolio. Ensure all necessary materials are readily available
      for the call.
  request_updated_portco_commentary:
    agent: false
    description: Reach out to the portco team to request updated commentary for the
      quarterly letter. Provide any additional information necessary for their efforts.
    name: request_updated_portco_commentary
    nodes_depended_on:
    - answer_email_after_call
    nodes_dependent_on: []
    prompt: Reach out to the portco team to request updated commentary for the quarterly
      letter. Provide any additional information necessary for their efforts.
  rewrite_portco_commentary:
    agent: false
    description: Rewrite the provided commentary into a full narrative that sounds
      polished, cautious, and optimistic. Ensure the tone and language align with
      the portco's overall strategy.
    name: rewrite_portco_commentary
    nodes_depended_on:
    - request_updated_portco_commentary
    nodes_dependent_on: []
    prompt: Rewrite the provided commentary into a full narrative that sounds polished,
      cautious, and optimistic. Ensure the tone and language align with the portco's
      overall strategy.
  send_monthly_update:
    agent: false
    description: Compose the monthly update email, including an effective opening
      paragraph that captures the essence of the portfolio's recent performance. Ensure
      all relevant information is included in an organized and easy-to-read format.
    name: send_monthly_update
    nodes_depended_on:
    - answer_prospective_lp_question
    nodes_dependent_on: []
    prompt: Compose the monthly update email, including an effective opening paragraph
      that captures the essence of the portfolio's recent performance. Ensure all
      relevant information is included in an organized and easy-to-read format.
  swear_to_update_crm:
    agent: false
    description: Make a mental note to update the CRM properly the next day, but do
      not take any actual action at this time.
    name: swear_to_update_crm
    nodes_depended_on:
    - check_subscription_status
    nodes_dependent_on: []
    prompt: Make a mental note to update the CRM properly the next day, but do not
      take any actual action at this time.
