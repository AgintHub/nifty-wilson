dag_type: typed
description: Generated workflow from UI.
name: hedge_fund_trading_strategy_workflow_with_yahoo_finance_adapter
nodes:
  backtest_trading_strategy:
    agent: false
    description: Performs a rigorous, production‑grade backtest of the fully specified
      trading strategy. It integrates the signal generation logic, the defined asset
      universe, and the historical OHLCV data fetched from Yahoo Finance. The backtest
      simulates realistic order execution—including transaction costs, slippage, and
      position sizing—while maintaining calendar‑aware alignment of data across all
      tickers. The result is a comprehensive, risk‑adjusted performance report that
      quantifies return, volatility, drawdown, trade frequency, and the temporal boundaries
      of the test period.
    name: backtest_trading_strategy
    nodes_depended_on:
    - develop_trading_signal_logic
    - specify_asset_universe
    - fetch_stock_data_yahoo
    nodes_dependent_on: []
    output_structure:
    - description: Cumulative return of the strategy over the backtest period, expressed
        as a decimal (e.g., 0.12 for 12%).
      key: total_return
      type: float
    - description: Annualized Sharpe ratio of the strategy, assuming a risk‑free rate
        of 0%.
      key: annualized_sharpe_ratio
      type: float
    - description: Maximum drawdown observed during the backtest, expressed as a decimal.
      key: max_drawdown
      type: float
    - description: Total count of executed trades (both entries and exits) throughout
        the backtest.
      key: number_of_trades
      type: int
    - description: ISO‑format start date of the backtest period (YYYY‑MM‑DD).
      key: backtest_period_start
      type: str
    - description: ISO‑format end date of the backtest period (YYYY‑MM‑DD).
      key: backtest_period_end
      type: str
    - description: True if the backtest completed without errors; false otherwise.
      key: success
      type: bool
    prompt: "Using the historical price DataFrames (or CSV strings) produced by **fetch_stock_data_yahoo**,\
      \ the asset universe defined by **specify_asset_universe**, and the signal generation\
      \ steps from **develop_trading_signal_logic**, execute a full backtest with\
      \ the following requirements:\n\n1. **Data Preparation**: Align all ticker time‑series\
      \ on a common business‑day index, forward‑fill missing values, and trim to the\
      \ overlapping date range.\n2. **Signal Application**: Apply the buy/sell signal\
      \ logic to generate daily position intents for each asset.\n3. **Execution Model**:\
      \ Simulate trade execution with:\n   - A configurable per‑trade commission (e.g.,\
      \ 0.05% of trade value).\n   - Slippage modeled as a fixed percentage of the\
      \ mid‑price (e.g., 0.02%).\n   - Full‑capital allocation per signal (or a user‑defined\
      \ risk‑budget).\n4. **Equity Curve Construction**: Compute daily portfolio equity,\
      \ accounting for cash balance, transaction costs, and market exposure.\n5. **Metric\
      \ Calculation**:\n   - Cumulative total return (as a decimal).\n   - Annualized\
      \ Sharpe ratio (risk‑free rate assumed to be 0%).\n   - Maximum drawdown (as\
      \ a decimal).\n   - Total number of executed trades.\n   - Start and end dates\
      \ of the backtest period.\n6. **Robustness Checks**: Detect and report any data\
      \ gaps, alignment issues, or execution anomalies that could affect result integrity.\n\
      7. **Output**: Return the performance metrics specified in the output structure\
      \ along with a boolean flag indicating successful completion.\n\nIf any step\
      \ fails, set `success` to false and provide a concise error description in the\
      \ accompanying logs (outside the defined output fields)."
  compile_final_strategy_blueprint:
    agent: false
    description: Synthesizes the refined trading logic, rigorously defined risk‑management
      policies, and the designated asset universe into a single, end‑to‑end blueprint
      ready for implementation, back‑testing, and deployment. The node produces a
      comprehensive, human‑readable strategy dossier that captures objectives, methodology,
      parameters, safeguards, and the full trading universe.
    name: compile_final_strategy_blueprint
    nodes_depended_on:
    - refine_trading_strategy
    - define_risk_management_rules
    nodes_dependent_on: []
    output_structure:
    - description: High‑level narrative summarizing the strategy’s purpose, market
        thesis, target return‑to‑risk ratio, and operational cadence.
      key: blueprint_summary
      type: str
    - description: Technical description of the final entry/exit rules, indicator
        settings, parameter values, and any conditional logic after back‑testing refinement.
      key: refined_strategy_details
      type: str
    - description: Bullet‑point list (3‑5 items) of risk controls such as position
        sizing formulas, stop‑loss/take‑profit levels, max draw‑down limits, and portfolio
        exposure caps.
      key: risk_management_rules
      type: List[str]
    - description: Complete list of tradable symbols, ticker codes, or asset‑class
        identifiers that constitute the strategy’s trading scope.
      key: asset_universe
      type: List[str]
    prompt: 'Integrate the outputs from **refine_trading_strategy** (the fully‑validated
      trading logic) and **define_risk_management_rules** (the disciplined risk‑control
      framework) together with the selected **asset_universe** to construct a production‑grade
      trading‑strategy blueprint.


      Your deliverable must include:

      1. **Blueprint Summary** – a concise, high‑level narrative that states the strategy’s
      objective, market hypothesis, expected return‑to‑risk profile, and operational
      horizon.

      2. **Refined Strategy Details** – a technical exposition of the final entry/exit
      signals, indicator configurations, parameter values, and any conditional logic
      that survived back‑testing and refinement.

      3. **Risk‑Management Rules** – a bullet‑point list (3‑5 items) covering position
      sizing methodology, stop‑loss / take‑profit thresholds, maximum draw‑down caps,
      intraday exposure limits, and any portfolio‑level safeguards.

      4. **Asset Universe** – an explicit enumeration of all tradable symbols, asset
      classes, or ETFs that the strategy will target.

      5. **Implementation Checklist** – optional but highly recommended: data‑feed
      requirements, order‑type preferences, latency considerations, and compliance
      checkpoints.


      Present the information in plain‑text sections matching the output fields below.
      Emphasize clarity, reproducibility, and alignment with institutional‑grade quant
      standards.'
  define_market_analysis:
    agent: false
    description: Develops a detailed, enterprise‑grade blueprint of all external market
      data feeds and internal analytical methods that will be leveraged by the trading
      strategy. The node evaluates data coverage, latency, licensing, and cost, while
      simultaneously mapping each analysis technique to its required inputs, computational
      intensity, and software dependencies. This holistic specification ensures that
      downstream modeling, back‑testing, and execution modules receive a clear, resource‑aware
      foundation.
    name: define_market_analysis
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Primary market data providers or platforms to be consumed (e.g.,
        Bloomberg, Refinitiv, Quandl, Yahoo Finance, ICE Data Services).
      key: market_data_sources
      type: List[str]
    - description: Selected analytical methods, ranging from classic technical indicators
        to advanced sentiment and macro‑factor models.
      key: analysis_techniques
      type: List[str]
    - description: A concise narrative linking the chosen data sources with the analysis
        techniques, emphasizing data fidelity, licensing considerations, and estimated
        computational resource requirements.
      key: summary_note
      type: str
    prompt: 'Compose a comprehensive catalogue of the market data ecosystem and analytical
      toolkit that will underpin the trading strategy. 1) Enumerate the principal
      market data providers or platforms (e.g., Bloomberg, Refinitiv, Quandl, Yahoo
      Finance, ICE Data Services) and for each specify: data type (price, order‑book,
      fundamentals, news, alternative), granularity (tick, minute, daily), latency
      profile, licensing model, and any known cost or quota constraints. 2) List the
      quantitative and qualitative analysis techniques to be applied (e.g., moving‑average
      crossovers, volatility‑scaled Bollinger Bands, order‑flow imbalance, sentiment
      extraction from news/social media, macro‑economic factor models, machine‑learning
      feature engineering). For each technique provide the required data inputs, computational
      complexity (CPU/GPU, memory), typical library dependencies (e.g., TA‑Lib, pandas‑ta,
      NLTK, spaCy, PyTorch), and an approximate resource footprint (e.g., hours of
      data‑processing per day, expected cloud compute instance size). 3) Synthesize
      the above into a concise summary that ties the chosen data sources to the analytical
      methods, highlighting any trade‑offs between data fidelity, cost, and computational
      demand.'
  define_risk_management_rules:
    agent: false
    description: Establishes a rigorous, quantitative risk‑management framework that
      translates the chosen trading strategy into actionable safeguards. The node
      produces a short, well‑structured list of 3–5 risk rules covering position sizing,
      stop‑loss mechanisms, drawdown limits, per‑trade risk, and exposure caps, and
      automatically reports the rule count and the presence of a stop‑loss rule. This
      ensures consistent capital protection, alignment with institutional risk tolerances,
      and compliance with regulatory best‑practice standards while remaining computationally
      lightweight (CPU‑bound, < 100 ms execution, < 10 MB memory).
    name: define_risk_management_rules
    nodes_depended_on:
    - select_trading_strategy_type
    nodes_dependent_on: []
    output_structure:
    - description: Bullet‑point list (3‑5 items) detailing the concrete risk‑management
        rules such as position sizing, stop‑loss, max drawdown, etc.
      key: risk_management_rules
      type: List[str]
    - description: The total number of risk‑management rules provided (must be between
        3 and 5).
      key: rule_count
      type: int
    - description: True if the list includes an explicit stop‑loss rule; otherwise
        false.
      key: has_stop_loss
      type: bool
    prompt: "Draft a concise set of **3–5** concrete risk‑management rules tailored\
      \ to the trading strategy selected in the previous step. Each rule should be\
      \ a single bullet point covering key risk dimensions such as:\n- Position‑sizing\
      \ methodology (e.g., fixed fractional, volatility‑adjusted). \n- Stop‑loss placement\
      \ (price‑based, ATR‑based, or time‑based). \n- Maximum permissible drawdown\
      \ or portfolio‑level exposure cap. \n- Per‑trade risk limit (percentage of equity\
      \ or dollar amount). \n- Any diversification, sector‑exposure, or leverage constraints.\n\
      \nAfter the bullet list, **explicitly** provide:\n- `rule_count`: the total\
      \ number of rules you have listed.\n- `has_stop_loss`: `true` if any rule explicitly\
      \ defines a stop‑loss, otherwise `false`.\n\nPresent the bullet points in plain\
      \ text (no markdown formatting) to facilitate downstream parsing."
  develop_trading_signal_logic:
    agent: false
    description: Transforms the set of technical indicators identified for the chosen
      strategy into a deterministic, production‑grade algorithm that emits precise
      buy and sell signals. The logic integrates multi‑time‑frame confirmation, threshold
      crossings, divergence analysis, and optional risk‑management filters (e.g.,
      volume, volatility, position‑size constraints) to ensure robust, low‑latency
      decision making suitable for live trading.
    name: develop_trading_signal_logic
    nodes_depended_on:
    - identify_trading_indicators
    nodes_dependent_on: []
    output_structure:
    - description: Step‑by‑step outline of the logical rules that convert indicator
        readings into concrete BUY or SELL signals.
      key: signal_logic_steps
      type: List[str]
    - description: Explicit list of technical indicator names (as provided by the
        parent node) that are employed in the signal generation algorithm.
      key: used_indicators
      type: List[str]
    - description: A concise executive summary describing the overall methodology,
        key decision pathways, and any risk‑management overlays.
      key: summary
      type: str
    - description: Flag indicating whether the signal logic accounts for all identified
        indicators and fully defines buy, sell, and neutral decision branches.
      key: is_logic_complete
      type: bool
    prompt: 'Using the indicator list produced by the `identify_trading_indicators`
      node, construct a comprehensive signal‑generation algorithm. Deliver the following
      components:


      1. **signal_logic_steps** – An ordered, bullet‑point list that details every
      logical decision rule (e.g., "If RSI(14) > 70 and price crosses below the 20‑period
      EMA, generate a SELL signal") including threshold values, cross‑overs, divergence
      checks, and any supplemental filters such as volume spikes or time‑of‑day constraints.

      2. **used_indicators** – Explicitly enumerate the technical indicators from
      the parent node that are incorporated into the logic.

      3. **summary** – A concise paragraph summarizing the overall approach, highlighting
      how the individual rules combine to produce coherent buy/sell decisions.

      4. **is_logic_complete** – Set to `true` only if every indicator listed by the
      parent node is addressed and all required decision branches (buy, sell, no‑action)
      are fully specified.


      Additionally, provide a brief estimate of the computational resources required
      to run this logic in a real‑time environment (e.g., number of CPU cores, memory
      footprint). Do **not** include this estimate in the output fields; it should
      be reflected only within the explanatory text.'
  fetch_stock_data_yahoo:
    agent: false
    description: Retrieves high‑fidelity daily OHLCV (Open, High, Low, Close, Volume)
      time‑series for every ticker in the defined asset universe directly from Yahoo
      Finance via the robust `yfinance` Python library. The node performs bulk downloads
      with built‑in retry logic, validates that the returned data is complete and
      chronologically indexed, normalises timestamps to UTC, and finally emits the
      results as a collection of CSV‑encoded strings alongside concise metadata describing
      the success of the operation.
    name: fetch_stock_data_yahoo
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the data download from Yahoo Finance completed
        without errors for all requested tickers.
      key: retrieval_success
      type: bool
    - description: A concise human‑readable confirmation or error summary describing
        the overall retrieval outcome.
      key: retrieval_message
      type: str
    - description: Ordered list of ticker symbols for which historical data was fetched.
      key: tickers
      type: List[str]
    - description: CSV‑formatted string of the OHLCV data for each ticker, preserving
        dates as the index; list order matches `tickers`.
      key: data_csv
      type: List[str]
    - description: Number of rows (trading days) retrieved for each ticker, aligned
        with the order of `tickers`.
      key: record_counts
      type: List[int]
    prompt: "Using the `yfinance` library, download the full historical daily OHLCV\
      \ series for each ticker symbol provided by the upstream asset‑universe node.\
      \ For every ticker:\n1. Fetch data spanning the maximum available history up\
      \ to the most recent market close.\n2. Ensure the DataFrame index is a timezone‑aware\
      \ `DatetimeIndex` (UTC) and that columns are exactly `['Open', 'High', 'Low',\
      \ 'Close', 'Adj Close', 'Volume']`.\n3. If a download fails, automatically retry\
      \ up to three times with exponential back‑off before marking the ticker as failed.\n\
      4. Convert each validated DataFrame to a CSV‑formatted string (including the\
      \ header) preserving the date index.\n5. Assemble the following outputs:\n \
      \  - `retrieval_success`: `true` only if *all* tickers were downloaded without\
      \ fatal errors; otherwise `false`.\n   - `retrieval_message`: a short human‑readable\
      \ note summarising the overall outcome and any ticker‑level issues.\n   - `tickers`:\
      \ the ordered list of ticker symbols attempted.\n   - `data_csv`: the ordered\
      \ list of CSV strings, one per ticker, matching the `tickers` order.\n   - `record_counts`:\
      \ the number of rows (trading days) retrieved for each ticker, aligned with\
      \ the `tickers` list.\nReturn the data exactly as specified in the `output_structure`."
  identify_trading_indicators:
    agent: false
    description: Derives a curated set of quantitative technical indicators and/or
      price‑action signals that concretely instantiate the previously chosen trading‑strategy
      type. The node aligns each indicator with the strategy’s underlying hypothesis,
      eliminates redundancy, and estimates computational resources (approximately
      O(N × M) time where N is the number of price bars and M the number of indicators,
      with modest memory overhead). The resulting list feeds directly into downstream
      signal‑generation and risk‑management nodes.
    name: identify_trading_indicators
    nodes_depended_on:
    - select_trading_strategy_type
    nodes_dependent_on: []
    output_structure:
    - description: List of technical indicator or signal names that will be applied
        in the chosen trading strategy.
      key: indicators
      type: List[str]
    - description: Total number of indicators listed in the "indicators" field.
      key: indicator_count
      type: int
    prompt: Given the selected trading‑strategy type, produce a concise, de‑duplicated
      list of technical indicators or signal formulas that will operationalize that
      strategy. Include only the canonical names (e.g., "RSI", "MACD", "Bollinger
      Bands", "Keltner Channel"). After the list, supply the total number of distinct
      indicators. Ensure the list reflects the strategy’s core hypothesis (momentum,
      mean‑reversion, trend‑following, volatility) and is feasible to compute on typical
      intraday or daily bar data.
  refine_trading_strategy:
    agent: false
    description: Iteratively enhances the quantitative trading strategy by performing
      a data‑driven, statistically rigorous refinement cycle. The node consumes backtest
      performance metrics, benchmarks them against pre‑defined KPI thresholds (e.g.,
      target Sharpe ratio, maximum drawdown, trade frequency), and systematically
      adjusts model parameters, technical indicator configurations, and risk‑management
      rules. It also estimates the computational resources required for each refinement
      iteration, ensuring the workflow remains scalable and cost‑effective.
    name: refine_trading_strategy
    nodes_depended_on:
    - backtest_trading_strategy
    nodes_dependent_on: []
    output_structure:
    - description: A concise narrative summarizing the refined trading strategy, highlighting
        adjusted parameters, indicator configurations, and risk‑management rules.
      key: refined_strategy_summary
      type: str
    - description: A bullet‑point list detailing each model parameter that was changed,
        including old and new values.
      key: parameter_adjustments
      type: str
    - description: A bullet‑point list of technical indicator modifications, specifying
        the indicator name, previous settings, and revised settings.
      key: indicator_adjustments
      type: str
    - description: A bullet‑point list of risk‑management rule changes (e.g., position
        sizing, stop‑loss/take‑profit levels) with before/after values.
      key: risk_rule_adjustments
      type: str
    - description: A thorough explanation linking each adjustment to the observed
        backtest shortcomings and the results of the sensitivity analysis.
      key: reasoning_for_adjustments
      type: str
    prompt: "1. Ingest the full backtest report generated by **backtest_trading_strategy**,\
      \ including total return, annualized Sharpe ratio, max drawdown, trade count,\
      \ and the backtest date range.\n2. Compare each metric against the strategy’s\
      \ performance targets (e.g., Sharpe ≥ 1.5, max drawdown ≤ 0.20, trade count\
      \ within desired frequency). Identify any metric that falls short.\n3. For each\
      \ under‑performing metric, conduct a sensitivity analysis:\n   - Vary key **parameters**\
      \ (e.g., moving‑average windows, momentum thresholds) within a plausible range\
      \ and record simulated impacts.\n   - Adjust **indicator** settings (e.g., Bollinger‑Band\
      \ width, RSI over‑bought/oversold levels) and evaluate their effect.\n   - Re‑configure\
      \ **risk rules** (e.g., position‑sizing factor, stop‑loss/take‑profit percentages,\
      \ volatility‑scaled exposure).\n4. Select the combination of adjustments that\
      \ most improves the deficient metrics while preserving or enhancing the already‑satisfactory\
      \ ones.\n5. Summarize the refined strategy, explicitly listing:\n   - Parameter\
      \ adjustments made.\n   - Indicator adjustments made.\n   - Risk‑rule adjustments\
      \ made.\n   - Rationale for each change, grounded in the backtest evidence and\
      \ sensitivity analysis.\n6. Provide an estimate of the resources needed to execute\
      \ the next backtest iteration of the refined strategy (CPU cores, RAM, expected\
      \ runtime) based on historical execution profiles.\n7. Return the structured\
      \ outputs defined below."
  select_trading_strategy_type:
    agent: false
    description: 'Determines the optimal primary trading strategy category—such as
      momentum, mean‑reversion, statistical arbitrage, or macro‑driven—by rigorously
      aligning it with the market data sources and analytical techniques identified
      in the preceding market analysis step. This node synthesizes the analytical
      context to pinpoint the strategy that maximizes expected alpha while respecting
      risk constraints. Estimated resource usage: minimal CPU load, <1 GB RAM, execution
      time under 5 seconds.'
    name: select_trading_strategy_type
    nodes_depended_on:
    - define_market_analysis
    nodes_dependent_on: []
    output_structure:
    - description: The chosen primary trading strategy type (e.g., "momentum", "mean
        reversion").
      key: strategy_type
      type: str
    - description: A concise one‑sentence explanation of why this strategy type best
        fits the market analysis.
      key: rationale
      type: str
    prompt: Based on the market data sources and analysis techniques defined in the
      previous step, select the single primary trading strategy type (e.g., momentum,
      mean reversion, statistical arbitrage, macro‑driven) that most effectively exploits
      the identified market dynamics. Provide a concise, one‑sentence justification
      that references the specific indicators, time‑frames, or market conditions supporting
      this choice.
  specify_asset_universe:
    agent: false
    description: Defines the full investable universe that aligns with the selected
      trading strategy. This step identifies both broad asset categories and the precise
      securities or contracts to be traded, while also forecasting the data, storage,
      and compute resources necessary to support real‑time pricing, risk assessment,
      and execution across the chosen universe.
    name: specify_asset_universe
    nodes_depended_on:
    - select_trading_strategy_type
    nodes_dependent_on: []
    output_structure:
    - description: High‑level asset classes or instrument families to be traded (e.g.,
        US equities, futures, commodities).
      key: asset_classes
      type: List[str]
    - description: Specific ticker symbols or contract identifiers selected from each
        asset class (e.g., AAPL, MSFT, ESZ2025).
      key: asset_tickers
      type: List[str]
    prompt: 'Based on the chosen trading strategy, delineate the complete investable
      universe:

      1. Enumerate the high‑level asset classes or instrument families (e.g., US large‑cap
      equities, Euro‑dollar futures, emerging‑market corporate bonds) that will be
      considered.

      2. Provide a curated list of concrete ticker symbols or contract codes for each
      class (e.g., AAPL, MSFT, ESZ2025, 10YUS).

      3. For each class, estimate the data‑ingestion and compute resources required
      to maintain the universe in production (e.g., expected daily data volume in
      GB, frequency of updates, API call limits, storage footprint, and CPU/GPU cores
      needed for real‑time pricing and risk calculations).

      Present the information in a clear, bullet‑point format suitable for downstream
      nodes.'
