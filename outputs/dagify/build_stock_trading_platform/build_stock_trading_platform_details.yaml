  select_data_providers:
    agent: false
    description: Select reliable data providers for the required data feeds
    name: select_data_providers
    nodes_depended_on:
    - identify_required_data_feeds
    nodes_dependent_on: []
    output_structure:
    - description: List of names of all candidate data providers
      key: provider_names
      type: str
    - description: Accuracy score for each provider (0 to 1)
      key: provider_accuracy
      type: float
    - description: Average latency in milliseconds for each provider
      key: provider_latency_ms
      type: int
    - description: Monthly cost in USD for each provider
      key: provider_cost_per_month_usd
      type: float
    - description: Boolean flag indicating whether each provider was selected for
        the ingestion pipeline
      key: provider_selected
      type: bool
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Parse identify_required_data_feeds.required_data_feeds into a list
          of feed IDs; concatenate into a query URL with parameters such as 'feeds=ID1,ID2'
          for provider APIs.
        reason: The selection logic must be scoped to feeds that provide live S&P
          500 stock prices, ensuring relevance and reducing noise from unrelated providers.
        text: Extract the required data feed identifiers from the parent node's output
          and construct a query string for provider discovery APIs.
      - complexity: HIGH
        impact: HIGH
        method: Use HTTP GET with appropriate authentication headers; handle rate
          limits via exponential backoff; store raw JSON responses for offline analysis.
        reason: Provider APIs expose pricing service specs (latency, accuracy, cost)
          which are essential for objective comparison.
        text: Invoke each major real‑time market data provider API (e.g., IEX Cloud,
          Polygon.io, Bloomberg Open Data, Refinitiv) to retrieve metadata about their
          S&P 500 pricing feeds.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Map each provider's raw fields to the standardized keys; convert latency
          to milliseconds, adjust accuracy to a 0‑1 scale (e.g., 99.9% → 0.999).
        reason: Different providers use varied metric units; normalization ensures
          fair comparison.
        text: 'Normalize the provider metadata into a unified schema: accuracy (0‑1),
          latency_ms, and cost_usd.'
      - complexity: LOW
        impact: HIGH
        method: Calculate score = (accuracy * 0.4) + ((1 - latency_norm) * 0.3) +
          ((1 - cost_norm) * 0.3); where latency_norm and cost_norm are normalized
          to [0,1] based on min/max across providers.
        reason: Balances trade‑offs; higher accuracy and lower latency are critical
          for live trading, while cost cannot be ignored.
        text: 'Rank providers using a weighted scoring function: 40% accuracy, 30%
          latency, 30% cost.'
