dag_type: plain_text
description: A concurrent workflow to create a complete marketing plan for selling
  a product to music studios.
name: marketing_plan_to_music_studios
nodes:
  analyze_studio_needs:
    agent: false
    description: Identify the key needs and pain points of each target studio type.
    name: analyze_studio_needs
    nodes_depended_on:
    - identify_target_music_studios
    nodes_dependent_on:
    - draft_value_proposition
    prompt: For each studio type listed, identify the primary pain points and needs
      related to audio equipment and services. Summarize each in one sentence.
  assign_responsibilities:
    agent: false
    description: Allocate tasks to specific marketing roles.
    name: assign_responsibilities
    nodes_depended_on:
    - define_marketing_objectives
    - select_marketing_channels
    nodes_dependent_on:
    - create_implementation_timeline
    prompt: Assign each marketing activity to a role (e.g., Content Creator, Social
      Media Manager, Designer, Email Marketer). Provide a one‑line responsibility
      for each role.
  build_case_studies:
    agent: false
    description: Outline case study for a relevant music studio.
    name: build_case_studies
    nodes_depended_on:
    - draft_value_proposition
    nodes_dependent_on: []
    prompt: Generate a brief case study outline for a music studio that successfully
      adopted a similar solution. Include problem, solution, results, and testimonial.
  create_content_plan:
    agent: false
    description: Plan content assets aligned with channels and value proposition.
    name: create_content_plan
    nodes_depended_on:
    - draft_value_proposition
    - select_marketing_channels
    nodes_dependent_on:
    - create_social_media_schedule
    - develop_website_landing_page
    prompt: Develop a two‑month content calendar that includes blog posts, videos,
      and social media posts. Align each piece with the chosen marketing channels
      and the value proposition. Provide dates and titles.
  create_implementation_timeline:
    agent: false
    description: Build a timeline for executing the marketing activities.
    name: create_implementation_timeline
    nodes_depended_on:
    - assign_responsibilities
    - establish_budget_and_resources
    nodes_dependent_on:
    - setup_tracking_and_metrics
    - final_review_and_approval
    prompt: Create a Gantt‑style timeline with key milestones over four months, linking
      activities, responsibilities, and budget checkpoints.
  create_social_media_schedule:
    agent: false
    description: Schedule social media posts for two months.
    name: create_social_media_schedule
    nodes_depended_on:
    - select_marketing_channels
    - create_content_plan
    nodes_dependent_on: []
    prompt: Using the content calendar, produce a detailed social media posting schedule
      with platform, content type, and posting time.
  define_marketing_objectives:
    agent: false
    description: Set clear, measurable objectives for marketing the product to music
      studios.
    name: define_marketing_objectives
    nodes_depended_on: []
    nodes_dependent_on:
    - identify_target_music_studios
    - establish_budget_and_resources
    - assign_responsibilities
    - setup_tracking_and_metrics
    prompt: List three specific, measurable marketing objectives for selling the product
      to music studios. Each objective should include a target metric and a deadline.
  design_email_templates:
    agent: false
    description: Write email templates for outreach.
    name: design_email_templates
    nodes_depended_on:
    - draft_value_proposition
    nodes_dependent_on: []
    prompt: 'Write two email templates: an introductory email and a follow‑up email.
      Both should reference the value proposition and include a clear call to action.'
  develop_website_landing_page:
    agent: false
    description: Draft landing page copy targeting studios.
    name: develop_website_landing_page
    nodes_depended_on:
    - draft_value_proposition
    - create_content_plan
    nodes_dependent_on: []
    prompt: 'Write the copy for a landing page targeting music studios: headline,
      subheadline, benefits, and CTA, all aligned with the value proposition.'
  draft_value_proposition:
    agent: false
    description: Create a concise value proposition that addresses those needs.
    name: draft_value_proposition
    nodes_depended_on:
    - analyze_studio_needs
    nodes_dependent_on:
    - select_marketing_channels
    - create_content_plan
    - design_email_templates
    - build_case_studies
    - develop_website_landing_page
    prompt: Create a concise value proposition (no more than four lines) that directly
      addresses the needs identified for music studios.
  establish_budget_and_resources:
    agent: false
    description: Estimate budget and required resources per channel.
    name: establish_budget_and_resources
    nodes_depended_on:
    - define_marketing_objectives
    - select_marketing_channels
    nodes_dependent_on:
    - create_implementation_timeline
    - final_review_and_approval
    prompt: Estimate a marketing budget in USD, broken down by channel and activity.
      Also list the human resources required for each activity.
  final_review_and_approval:
    agent: false
    description: Compile all outputs into final marketing plan ready for approval.
    name: final_review_and_approval
    nodes_depended_on:
    - create_implementation_timeline
    - setup_tracking_and_metrics
    - establish_budget_and_resources
    nodes_dependent_on: []
    prompt: Compile all previous outputs into a single marketing plan document. Ensure
      all objectives, activities, budget, timeline, and KPIs are included. Mark the
      plan ready for approval.
  identify_target_music_studios:
    agent: false
    description: Specify which types of music studios to target based on the objectives.
    name: identify_target_music_studios
    nodes_depended_on:
    - define_marketing_objectives
    nodes_dependent_on:
    - analyze_studio_needs
    prompt: Using the marketing objectives, list the top 10 types of music studios
      to target (e.g., residential, commercial, independent, university). Provide
      one key characteristic for each type that aligns with the objectives.
  select_marketing_channels:
    agent: false
    description: Choose the most effective marketing channels to reach music studios.
    name: select_marketing_channels
    nodes_depended_on:
    - draft_value_proposition
    nodes_dependent_on:
    - create_content_plan
    - create_social_media_schedule
    - establish_budget_and_resources
    - assign_responsibilities
    prompt: Based on the value proposition, list the top four marketing channels to
      reach music studios (e.g., industry trade shows, social media, email, influencer
      partnerships). Provide a short justification for each channel.
  setup_tracking_and_metrics:
    agent: false
    description: Define KPIs and reporting for each channel.
    name: setup_tracking_and_metrics
    nodes_depended_on:
    - define_marketing_objectives
    - create_implementation_timeline
    nodes_dependent_on:
    - final_review_and_approval
    prompt: Define key performance indicators for each marketing channel. Provide
      target values and reporting frequency.
