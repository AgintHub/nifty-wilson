dag_type: spec
description: Generated workflow from UI.
name: build_aquant_trading_strategy_statarb
nodes:
  backtest_strategy:
    agent: false
    description: Backtest the statistical arbitrage strategy using historical data
    name: backtest_strategy
    nodes_depended_on:
    - develop_trading_signals
    - define_risk_management_rules
    nodes_dependent_on: []
    output_structure:
    - description: Cumulative return of the strategy expressed as a percentage
      key: total_return_pct
      type: float
    - description: Annualized return of the strategy expressed as a percentage
      key: annualized_return_pct
      type: float
    - description: Sharpe ratio of the strategy
      key: sharpe_ratio
      type: float
    - description: Maximum drawdown of the strategy expressed as a percentage
      key: max_drawdown_pct
      type: float
    - description: Total number of trades executed during the backtest
      key: trade_count
      type: int
    - description: Proportion of winning trades (between 0 and 1)
      key: winning_trade_rate
      type: float
    - description: Average profit per trade (positive if profitable)
      key: average_profit_per_trade
      type: float
    - description: Average loss per trade (positive if loss)
      key: average_loss_per_trade
      type: float
    - description: Whether the backtest ran successfully without critical errors
      key: backtest_success
      type: bool
    - description: Concise summary of key backtest results
      key: report_summary
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use pandas’ `merge_asof` or `reindex` to align timestamps; validate
          alignment by checking the number of matched rows against expected signal
          counts.
        reason: Accurate alignment guarantees that signals are evaluated on the correct
          price data and that trade execution times correspond to the intended market
          events.
        text: Load and merge the cleaned historical price series with the generated
          signal timestamps ensuring time alignment across all asset pairs.
      - complexity: MEDIUM
        impact: HIGH
        method: For each signal, compute trade size using `position_sizing_rule`;
          calculate stop‑loss price as `entry_price * (1 ± stop_loss_percent/100)`;
          store these in a structured dataframe for downstream simulation.
        reason: Pre‑computing positions and risk limits ensures that every simulated
          trade adheres to the predefined constraints, preventing unrealistic P&L
          estimates.
        text: Apply the risk‑management rules to each signal to compute position sizing
          and stop‑loss thresholds before any trade execution.
      - complexity: HIGH
        impact: HIGH
        method: Iterate over the sorted signal dataframe; on each new day, update
          unrealized PnL for open positions, close positions at stop‑loss if triggered,
          and record realized PnL; maintain a rolling equity curve.
        reason: Day‑by‑day simulation captures intraday volatility, ensures correct
          PnL accumulation, and respects stop‑loss and max drawdown limits.
        text: Simulate trade execution by stepping through each trading day, applying
          all active positions, and updating portfolio equity based on price changes.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Compute peak equity; if current equity < peak * (1 - max_drawdown_percent/100),
          set a flag to stop opening new positions until equity recovers or simulation
          ends.
        reason: This prevents the backtest from continuing in a regime that would
          violate the strategy’s risk tolerance, mirroring real‑world portfolio constraints.
        text: Enforce the maximum drawdown constraint by monitoring the equity curve
          and halting new positions once the drawdown exceeds `max_drawdown_percent`.
      - complexity: MEDIUM
        impact: MEDIUM
        method: 'Maintain two lists: `wins` and `losses`; append trade PnL to the
          appropriate list; compute means after simulation.'
        reason: Separating wins and losses provides granular insight into trade quality
          and assists in refining signal thresholds.
        text: Calculate realized and unrealized profit‑and‑loss per trade, distinguishing
          winning and losing trades to compute `average_profit_per_trade` and `average_loss_per_trade`.
      - complexity: MEDIUM
        impact: HIGH
        method: Use numpy to calculate total return as last equity / initial equity
          - 1; annualize using `(1+total_return)**(252/num_days)-1`; Sharpe = mean(returns)/std(returns)
          * sqrt(252); drawdown = (cumulative max - equity)/cumulative max.
        reason: These metrics are industry standard for assessing strategy performance
          and risk‑adjusted returns.
        text: Compute cumulative return, annualized return, Sharpe ratio, and maximum
          drawdown from the equity curve.
      - complexity: LOW
        impact: MEDIUM
        method: Count entries in the trade log; compute win rate by dividing number
          of trades where PnL > 0 by total trades.
        reason: Trade count and win rate are key performance indicators that influence
          risk‑adjusted metrics and inform strategy robustness.
        text: Determine the total number of executed trades and calculate the winning
          trade rate as the ratio of winning trades to total trades.
      - complexity: LOW
        impact: LOW
        method: Use string interpolation to format the metrics into a one‑sentence
          paragraph.
        reason: A quick textual summary aids stakeholders in grasping performance
          without parsing all numeric fields.
        text: Generate a concise `report_summary` string summarizing the key results
          (e.g., total return, Sharpe, max drawdown, win rate).
      - complexity: MEDIUM
        impact: HIGH
        method: Wrap the entire simulation in try/except; on any exception, set flag
          to False and log error details.
        reason: Clear success indicator ensures downstream nodes can safely proceed
          or trigger error handling.
        text: Set the `backtest_success` flag to `True` only if the simulation completes
          without unhandled exceptions, missing data issues, or violation of critical
          constraints.
      - complexity: LOW
        impact: MEDIUM
        method: Use assert statements or custom validation functions; if validation
          fails, raise descriptive error.
        reason: Type and range validation protects downstream processes from corrupt
          or malformed data, improving system robustness.
        text: Validate all output fields against expected ranges (e.g., winning_trade_rate
          ∈ [0,1], max_drawdown_pct ≥ 0) and assert type consistency before returning
          results.
    prompt: Simulate the strategy's performance over the historical data period, using
      the developed trading signals and risk management rules.
  clean_and_preprocess_data:
    agent: false
    description: Clean and preprocess the collected historical data
    name: clean_and_preprocess_data
    nodes_depended_on:
    - collect_historical_data
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether cleaned data is successfully produced.
      key: cleaned_data_available
      type: bool
    - description: Total number of missing values filled during preprocessing.
      key: missing_values_count
      type: int
    - description: Total number of outlier records removed during preprocessing.
      key: outliers_removed_count
      type: int
    - description: Proportion of missing data in the original dataset before cleaning.
      key: missing_data_ratio
      type: float
    - description: List of column names that were processed during cleaning.
      key: processed_columns
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Check `success` in parent output; if false, set all outputs to default
          failure values and return.
        reason: Ensures the node only operates on valid data, preventing cascading
          errors downstream.
        text: Validate the success flag from collect_historical_data; abort cleaning
          if the flag is false to avoid processing invalid datasets.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Read CSV/JSON files into DataFrames, set `date` as the first index
          level and `symbol` as the second; ensure datetime dtype.
        reason: A multi‑index allows column‑wise operations across all assets while
          preserving date alignment.
        text: Load raw historical data into a Pandas DataFrame, using asset symbols
          as keys to create a multi‑index (date, symbol) structure for efficient manipulation.
      - complexity: LOW
        impact: MEDIUM
        method: Use `DataFrame.size` for total cells and `DataFrame.isna().sum().sum()`
          for missing count; calculate ratio as missing/total.
        reason: Provides a quantitative baseline of data quality before any imputation.
        text: Compute the total number of cells and the total number of missing cells
          across all numeric columns to derive the missing data ratio.
      - complexity: LOW
        impact: MEDIUM
        method: Apply `DataFrame.drop_duplicates()` with `subset=['date', 'symbol']`.
        reason: Duplicates can bias statistical tests and cointegration analysis.
        text: Identify and remove duplicate rows based on the multi‑index to ensure
          each date‑symbol combination is unique.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Chain `DataFrame.fillna(method='ffill').fillna(method='bfill').interpolate(method='linear')`.
        reason: Combines robust edge‑handling with smoothness for time‑series data.
        text: Apply forward‑fill (`ffill`) then backward‑fill (`bfill`) to propagate
          existing observations into missing slots, followed by linear interpolation
          for remaining gaps.
      - complexity: LOW
        impact: LOW
        method: Subtract pre‑imputation missing count from post‑imputation missing
          count.
        reason: Provides transparency about the extent of imputation performed.
        text: Count the number of missing values that were actually filled during
          imputation to populate `missing_values_count`.
      - complexity: LOW
        impact: LOW
        method: 'Use `DataFrame.rename(columns=lambda x: re.sub(r''[^a-z0-9]'', ''_'',
          x.lower()))`.'
        reason: Ensures consistent column references in downstream modules.
        text: Standardize column names by converting all to lowercase and replacing
          spaces or special characters with underscores.
      - complexity: MEDIUM
        impact: MEDIUM
        method: For each column, compute Q1, Q3, IQR = Q3−Q1; flag rows where value
          < Q1−1.5×IQR or > Q3+1.5×IQR.
        reason: IQR is robust to extreme values and preserves the bulk of the distribution.
        text: Detect outliers in price‑related columns (`open`, `high`, `low`, `close`)
          using the Inter‑Quartile Range (IQR) method with a 1.5× multiplier.
      - complexity: LOW
        impact: MEDIUM
        method: Use boolean indexing to drop flagged rows; sum the number of dropped
          rows.
        reason: Outliers can distort statistical relationships and lead to spurious
          cointegration signals.
        text: Remove all flagged outlier rows from the DataFrame, and record the count
          in `outliers_removed_count`.
      - complexity: LOW
        impact: MEDIUM
        method: Apply `DataFrame.dtypes` check and cast columns using `astype` where
          necessary.
        reason: Prevents type‑related errors in subsequent statistical analyses.
        text: Confirm that all remaining missing values are resolved and that data
          types are correct (e.g., numeric for price columns, integer for volume).
      - complexity: LOW
        impact: LOW
        method: Maintain a set of column names during each transformation step and
          output as a list.
        reason: Provides a traceable record of what was altered, useful for audit
          and debugging.
        text: Generate the `processed_columns` list by extracting the names of all
          columns that underwent cleaning or transformation.
      - complexity: LOW
        impact: LOW
        method: Use `DataFrame.to_parquet('cleaned_data.parquet')`.
        reason: Parquet offers columnar storage and compression, speeding up downstream
          reads.
        text: Persist the cleaned DataFrame to a standardized file format (e.g., Parquet)
          for efficient I/O during cointegration analysis.
      - complexity: LOW
        impact: HIGH
        method: Wrap entire pipeline in try/except; on exception, log error and return
          failure flags.
        reason: Clear success indicator for downstream nodes.
        text: Set `cleaned_data_available` to true upon successful completion of all
          steps; otherwise, set to false and populate remaining outputs with sentinel
          values.
    prompt: Handle missing values, outliers, and other data inconsistencies, and perform
      necessary transformations to prepare the data for analysis.
  collect_historical_data:
    agent: false
    description: Gather raw historical market data for each asset in the selected
      universe, ensuring the dataset is complete, accurate, and formatted for downstream
      preprocessing.
    name: collect_historical_data
    nodes_depended_on:
    - select_universe_of_assets
    nodes_dependent_on: []
    output_structure:
    - description: List of ticker symbols for which data was retrieved.
      key: asset_symbols
      type: List[str]
    - description: Start date of the retrieved data period in ISO 8601 format (YYYY‑MM‑DD).
      key: data_start_date
      type: str
    - description: End date of the retrieved data period in ISO 8601 format (YYYY‑MM‑DD).
      key: data_end_date
      type: str
    - description: Number of data points retrieved for each asset, aligned with asset_symbols.
      key: data_points_per_asset
      type: List[int]
    - description: Indicates whether the data retrieval was successful for all assets.
      key: success
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Use Python set and strip operations; apply .upper() to each symbol;
          remove duplicates.
        reason: Prevents downstream API failures caused by malformed tickers.
        text: Validate and normalise the input asset list from the parent node, ensuring
          no empty strings and all symbols are upper‑case.
      - complexity: MEDIUM
        impact: HIGH
        method: Convert `strategy_horizon_months` to days, subtract from current date
          to get `data_start_date`; set `data_end_date` to today's date.
        reason: Guarantees enough data for cointegration tests while mitigating edge
          effects.
        text: Derive the historical time window required for statistical analysis
          by reading the strategy horizon from `define_strategy_objectives` via the
          `select_universe_of_assets` node’s output, adding an additional safety buffer
          of 30 days to account for missing data.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a wrapper class that abstracts provider specifics; use exponential
          backoff for retry logic.
        reason: Different providers offer varying data coverage and latency; a robust
          client ensures consistent retrieval.
        text: Choose a reliable public or commercial data provider API (e.g., Yahoo
          Finance via `yfinance`, Alpha Vantage, or Bloomberg) and instantiate a client
          with appropriate API keys and rate‑limit handling.
      - complexity: HIGH
        impact: HIGH
        method: For `yfinance`, use `download(tickers=asset_list, start=start_date,
          end=end_date, interval='1d')`; otherwise, parallelise with `concurrent.futures`
          and sleep between requests.
        reason: Maximises throughput and reduces total runtime while avoiding API
          throttling.
        text: Batch download historical OHLCV data for all assets simultaneously where
          the provider supports bulk requests; otherwise loop with a controlled delay
          to respect rate limits.
      - complexity: MEDIUM
        impact: HIGH
        method: Apply `.reset_index()`; rename columns to lowercase; convert `date`
          to datetime; fill missing columns with NaN.
        reason: Uniform structure simplifies downstream preprocessing steps.
        text: 'Parse the returned dataset into a standardized pandas DataFrame, ensuring
          columns: `date`, `open`, `high`, `low`, `close`, `volume`, and any provider‑specific
          metadata.'
      - complexity: MEDIUM
        impact: HIGH
        method: Use `.asfreq('D')` to resample daily, then `.ffill()` for price, `.fillna(0)`
          for volume; log the count of filled rows.
        reason: Missing data can skew statistical tests and signal generation.
        text: Validate data integrity by checking for missing dates (e.g., weekends,
          holidays) and missing values; if missing, attempt forward‑fill for price
          columns and zero‑fill for volume.
      - complexity: LOW
        impact: MEDIUM
        method: Group by asset ticker; apply `.count()` on close price.
        reason: Ensures each asset contributes sufficient data for robust analysis.
        text: Compute `data_points_per_asset` by counting non‑NaN close prices per
          asset, and verify that each asset has at least 90% of the expected daily
          observations.
      - complexity: LOW
        impact: HIGH
        method: Maintain a boolean accumulator across assets; update to false on any
          failure.
        reason: Provides downstream nodes with an explicit success indicator.
        text: Set the `success` flag to true only if all assets have retrieved data,
          the data window covers the full required period, and no critical errors
          were encountered during fetch or parsing.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use `to_parquet` with compression `snappy`; maintain a metadata manifest
          JSON.
        reason: Facilitates audit trails and allows later steps to load data without
          re‑fetching.
        text: Persist the raw data to a local or cloud storage location (e.g., Parquet
          or CSV) with filenames encoded as `<symbol>_<start>_<end>.parquet` for future
          reproducibility.
      - complexity: LOW
        impact: LOW
        method: Use Python’s `logging` module at INFO level.
        reason: Eases debugging and provides auditability.
        text: Log a summary of the operation (asset count, date range, total records,
          errors) to a central logging service or console for traceability.
    prompt: Retrieve historical price, volume, and other relevant data for the chosen
      assets, covering a sufficient time period for statistical analysis.
  define_risk_management_rules:
    agent: false
    description: Establish risk management rules for the strategy
    name: define_risk_management_rules
    nodes_depended_on:
    - develop_trading_signals
    nodes_dependent_on: []
    output_structure:
    - description: Description of the position sizing methodology (e.g., fixed dollar,
        volatility‑based, Kelly criterion).
      key: position_sizing_rule
      type: str
    - description: Maximum acceptable drawdown of the portfolio expressed as a percentage
        (e.g., 10.0 for 10%).
      key: max_drawdown_percent
      type: float
    - description: Stop‑loss threshold for individual trades expressed as a percentage
        of entry price (e.g., 2.5 for 2.5%).
      key: stop_loss_percent
      type: float
    - description: Maximum risk per trade as a percentage of portfolio equity (e.g.,
        1.0 for 1%).
      key: risk_per_trade_percent
      type: float
    - description: Maximum number of simultaneous open positions allowed.
      key: max_positions
      type: int
    - description: Additional textual description of other risk controls (e.g., diversification
        limits, market‑volatility filters).
      key: risk_control_description
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Check boolean flag; use conditional logic to assign defaults.
        reason: Ensures that risk rules are only generated when reliable trading signals
          exist, preventing the propagation of erroneous risk settings.
        text: Validate the input from develop_trading_signals – check the `is_valid`
          flag and ensure that at least one signal is available. If the signals are
          invalid, default to conservative risk parameters (e.g., risk_per_trade_percent
          = 0.5%, stop_loss_percent = 5%).
      - complexity: LOW
        impact: MEDIUM
        method: Apply min(num_signals, 10) to compute max_positions.
        reason: Balances trade execution volume against portfolio risk limits and
          prevents over‑concentration.
        text: Determine the maximum number of simultaneous positions (`max_positions`)
          by taking the minimum of the number of generated signals (`num_signals`)
          and a hard‑coded portfolio capacity limit (e.g., 10). This caps exposure
          and encourages diversification.
      - complexity: LOW
        impact: MEDIUM
        method: Use simple arithmetic; fallback to default if missing.
        reason: Aligns trade risk with the overall strategy risk tolerance, making
          the rule adjustable to different risk profiles.
        text: Compute the base risk‑per‑trade percentage by scaling a default risk
          appetite (1%) with the strategy’s risk tolerance level. For example, `risk_per_trade_percent
          = 1.0 * (risk_tolerance_level / 10)`. If the risk_tolerance_level is not
          available, default to 1.0%.
      - complexity: MEDIUM
        impact: HIGH
        method: Run a volatility rolling window calculation, apply scaling, enforce
          upper bound.
        reason: Dynamic stop‑loss sizing protects against both low‑ and high‑volatility
          regimes, improving risk‑adjusted performance.
        text: Calculate the stop‑loss threshold (`stop_loss_percent`) as a function
          of the asset’s historical volatility. Compute a 30‑day rolling volatility
          of the asset’s returns, convert to a daily volatility, then set `stop_loss_percent
          = 2.0 + (daily_vol * 100 * 0.5)`. Cap the value at 5% to avoid overly tight
          stops during high‑volatility periods.
      - complexity: LOW
        impact: MEDIUM
        method: Multiply objective_max_drawdown by 0.75; fallback to default.
        reason: Ensures portfolio drawdown remains within acceptable bounds, protecting
          capital during adverse market movements.
        text: Set the maximum drawdown limit (`max_drawdown_percent`) to a conservative
          fraction (e.g., 75%) of the strategy objective’s maximum drawdown. If the
          objective maximum drawdown is unavailable, default to 10.0%. This provides
          a hard stop that aligns with strategic goals.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement the formula; generate description string.
        reason: Volatility‑based sizing adapts trade size to market conditions and
          ensures consistent risk exposure per trade.
        text: 'Define the position sizing rule (`position_sizing_rule`) as a volatility‑based
          approach: `position_size = (portfolio_equity * risk_per_trade_percent /
          100) / (stop_loss_percent / 100 * entry_price)`. Store a textual description
          of this methodology.'
      - complexity: LOW
        impact: MEDIUM
        method: Concatenate predefined control statements into a single string.
        reason: Documenting all supplementary controls ensures transparency and auditability
          for the strategy.
        text: 'Compile additional risk controls into `risk_control_description`: include
          diversification limits (no single asset pair >20% of portfolio), a market‑volatility
          filter (skip trades if implied volatility > 30%), daily position limit enforcement,
          and a mandatory stop‑loss audit. Provide a concise paragraph summarizing
          these controls.'
      - complexity: LOW
        impact: HIGH
        method: Apply boundary conditions; log adjustments.
        reason: Prevents unrealistic or unsafe risk parameters that could jeopardize
          portfolio stability.
        text: 'Perform consistency checks: ensure that `stop_loss_percent` is between
          1% and 5%, `risk_per_trade_percent` between 0.1% and 3%, and `max_drawdown_percent`
          not exceeding 20%. If any value falls outside these bounds, adjust to nearest
          permissible limit and record a warning in the `risk_control_description`.'
      - complexity: LOW
        impact: MEDIUM
        method: Cast values to required types; serialize to JSON.
        reason: Guarantees that downstream nodes receive data in the expected format
          for accurate backtesting.
        text: 'Output all computed fields in the specified schema, ensuring type correctness:
          convert percentages to float, integer fields to int, and descriptions to
          string.'
    prompt: Specify position sizing, stop-loss levels, and other risk controls to
      mitigate potential losses and manage overall portfolio risk.
  define_strategy_objectives:
    agent: false
    description: Define the primary objectives of the statistical arbitrage strategy
    name: define_strategy_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of asset markets or sectors that the strategy will focus on.
      key: target_markets
      type: List[str]
    - description: Target expected annual return expressed as a decimal (e.g., 0.12
        for 12%).
      key: expected_annual_return
      type: float
    - description: Maximum acceptable drawdown expressed as a decimal (e.g., 0.15
        for 15%).
      key: maximum_drawdown
      type: float
    - description: Risk tolerance level on a scale from 1 (low) to 10 (high).
      key: risk_tolerance_level
      type: int
    - description: Investment horizon in months for which the strategy is designed.
      key: strategy_horizon_months
      type: int
    - description: Minimum position size in units of the underlying asset or in monetary
        value.
      key: minimum_trade_size
      type: float
    - description: Average number of trades per day the strategy intends to execute.
      key: trade_frequency_per_day
      type: int
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use a standardized interview guide, record responses in a shared spreadsheet,
          and tag each goal with the originating stakeholder.
        reason: Ensures that the objectives are rooted in real business intent and
          not just theoretical constructs.
        text: Gather high‑level business and stakeholder goals through structured
          interviews and questionnaires, capturing desired return targets, acceptable
          risk levels, and investment horizon preferences.
      - complexity: LOW
        impact: HIGH
        method: Apply simple arithmetic (e.g., 12% → 0.12) and a mapping table for
          risk tolerance levels.
        reason: Quantification is required for downstream modeling and risk‑management
          alignment.
        text: 'Translate qualitative goals into quantitative metrics: convert requested
          return percentages into decimal form, define drawdown as a decimal, and
          map qualitative risk appetite to a 1‑10 scale.'
      - complexity: MEDIUM
        impact: MEDIUM
        method: Query a market data repository, apply filters, and generate a CSV
          of markets with key metrics.
        reason: Market selection directly affects transaction costs, slippage, and
          the ability to identify mean‑reverting pairs.
        text: Define target markets by evaluating liquidity, volatility, and historical
          cointegration potential across candidate asset classes; produce a ranked
          list of markets that meet a minimum liquidity threshold (e.g., average daily
          volume > $10M).
      - complexity: MEDIUM
        impact: MEDIUM
        method: Perform a rolling window statistical analysis of historical pair spreads
          and calculate average cycle duration.
        reason: Horizon decisions impact backtest length, risk metrics, and capital
          allocation.
        text: Determine strategy horizon months by analyzing typical mean‑reversion
          cycle lengths and aligning them with the intended capital deployment schedule;
          recommend a horizon that covers at least 3–5 full cycles.
      - complexity: LOW
        impact: MEDIUM
        method: 'Use cost‑to‑trade formulas: trade_size ≥ (average_spread * transaction_cost_factor)
          / expected_profit_per_share.'
        reason: Avoids trade execution that is dominated by cost and ensures meaningful
          signal validation.
        text: Set minimum trade size based on the average bid‑ask spread, slippage
          tolerance, and transaction cost model; compute a conservative size that
          ensures a minimum spread capture relative to cost.
      - complexity: MEDIUM
        impact: LOW
        method: Run a back‑test kernel on a 30‑day window, record signal count, and
          calculate the mean.
        reason: Provides a realistic expectation for infrastructure load and risk‑management
          bandwidth.
        text: Estimate trade frequency per day by simulating the signal generation
          logic on a sample of recent data and counting the average number of valid
          signals per trading day.
      - complexity: MEDIUM
        impact: HIGH
        method: Cross‑reference numerical thresholds and, if necessary, iterate with
          the risk‑management node to reconcile.
        reason: Ensures coherence across strategy definition and risk controls.
        text: Validate that the maximum drawdown and risk tolerance level are consistent
          with the risk‑management rule set produced in define_risk_management_rules;
          adjust if any conflicts exist.
      - complexity: LOW
        impact: LOW
        method: Auto‑generate a markdown template and populate fields using the results
          from previous bullets.
        reason: Facilitates traceability and allows stakeholders to review the objective
          setting process.
        text: Document all assumptions, source data, and decision rationales in a
          single markdown file that will feed into select_universe_of_assets for transparency
          and future audits.
    prompt: Specify the main goals of the statistical arbitrage strategy, such as
      target markets, expected returns, and risk tolerance.
  develop_trading_signals:
    agent: false
    description: Develop trading signals based on the cointegration analysis
    name: develop_trading_signals
    nodes_depended_on:
    - perform_cointegration_analysis
    nodes_dependent_on: []
    output_structure:
    - description: Identifiers of the cointegrated asset pairs or groups used for
        signal generation
      key: pair_ids
      type: List[str]
    - description: Type of each signal (e.g., 'long', 'short') corresponding to the
        asset pair
      key: signal_type
      type: List[str]
    - description: Confidence or strength metric of each generated signal, ranging
        from 0 to 1
      key: signal_strength
      type: List[float]
    - description: Total number of trading signals generated
      key: num_signals
      type: int
    - description: Indicates whether the signal generation process produced valid
        output
      key: is_valid
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Simple length check and conditional comparison of p-value; raise a
          descriptive exception if invalid.
        reason: Early validation prevents downstream errors and guarantees that only
          statistically significant relationships are used for signal generation.
