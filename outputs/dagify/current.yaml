dag_type: shim
description: Generated workflow from UI.
name: symbolic_regression_framework_with_llm
nodes:
  configure_llm_for_proposal_generation:
    agent: false
    code_node_type: stub
    description: Configure all necessary LLM parameters and templates to produce symbolic
      regression proposals that respect the defined objective, constraints, and data
      schema.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass DefineSymbolicRegressionObjectiveOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_symbolic_regression_objective node outputs.\"\
      \"\"\n    objective_description: str = Field(..., description=\"High\\u2011level\
      \ description of the regression objective\")\n    target_variable: str = Field(...,\
      \ description=\"Name of the dependent variable to predict\")\n    feature_variables:\
      \ str = Field(..., description=\"List of independent variable names available\
      \ for modeling\")\n    constraints: str = Field(..., description=\"Explicit\
      \ constraints or domain rules that models must satisfy\")\n    performance_metrics:\
      \ str = Field(..., description=\"Metrics to evaluate model quality (e.g., R\\\
      u00b2, MAE, complexity)\")\n    dataset_description: str = Field(..., description=\"\
      Brief description of the data source or sampling strategy\")\n\n\nclass ConfigureLlmForProposalGenerationOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for configure_llm_for_proposal_generation node outputs.\"\
      \"\"\n    model_name: str = Field(..., description=\"The name of the language\
      \ model to be used (e.g., \"gpt-4o\", \"llama-3.1\")\")\n    temperature: float\
      \ = Field(..., description=\"The sampling temperature controlling randomness\
      \ of the model output\")\n    max_tokens: int = Field(..., description=\"Maximum\
      \ number of tokens the model should generate for each proposal\")\n    prompt_template:\
      \ str = Field(..., description=\"The prompt format that the LLM will use when\
      \ generating proposals, incorporating placeholders for objective and data\"\
      )\n    input_schema: str = Field(..., description=\"Human\\u2011readable description\
      \ or JSON schema of the input data expected by the LLM\")\n    num_proposals:\
      \ int = Field(..., description=\"Number of independent proposal samples the\
      \ LLM should generate\")\n\n\ndef configure_llm_for_proposal_generation(define_symbolic_regression_objective_input:\
      \ DefineSymbolicRegressionObjectiveOutput, **kwargs) -> ConfigureLlmForProposalGenerationOutput:\n\
      \    \"\"\"Configure all necessary LLM parameters and templates to produce symbolic\
      \ regression proposals that respect the defined objective, constraints, and\
      \ data schema.\n\n    Args:\n        define_symbolic_regression_objective_input:\
      \ Input from the 'define_symbolic_regression_objective' node.\n        **kwargs:\
      \ Additional keyword arguments.\n\n    Returns:\n        ConfigureLlmForProposalGenerationOutput:\
      \ Object containing outputs for this node.\n    \"\"\"\n    # TODO: Implement\
      \ this function\n\n    # Return stub output with placeholder values\n    return\
      \ ConfigureLlmForProposalGenerationOutput(\n        model_name=\"\",\n     \
      \   temperature=0.0,\n        max_tokens=0,\n        prompt_template=\"\",\n\
      \        input_schema=\"\",\n        num_proposals=0,\n    )"
    name: configure_llm_for_proposal_generation
    nodes_depended_on:
    - define_symbolic_regression_objective
    nodes_dependent_on: []
    output_structure:
    - description: The name of the language model to be used (e.g., "gpt-4o", "llama-3.1")
      key: model_name
      type: str
    - description: The sampling temperature controlling randomness of the model output
      key: temperature
      type: float
    - description: Maximum number of tokens the model should generate for each proposal
      key: max_tokens
      type: int
    - description: The prompt format that the LLM will use when generating proposals,
        incorporating placeholders for objective and data
      key: prompt_template
      type: str
    - description: Human‑readable description or JSON schema of the input data expected
        by the LLM
      key: input_schema
      type: str
    - description: Number of independent proposal samples the LLM should generate
      key: num_proposals
      type: int
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use JSON parsing and schema validation to map parent fields to local
          variables, ensuring no required field is missing.
        reason: These elements inform the LLM configuration and prompt template to
          ensure proposals align with the task.
        text: Parse the parent output to extract the objective description, target
          variable, feature variables, constraints, performance metrics, and dataset
          description.
      - complexity: LOW
        impact: MEDIUM
        method: Define a priority list (e.g., ["gpt-4o", "llama-3.1", "openai-gpt-3.5"]),
          query availability via the provider SDK, and choose the first available
          model.
        reason: Model choice directly affects proposal quality and latency.
        text: Select a default model name based on the target language and available
          API endpoints; fallback to a safe open‑source model if the preferred one
          is unavailable.
      - complexity: LOW
        impact: MEDIUM
        method: If constraints specify strict compliance, enforce temperature ≤ 0.3;
          otherwise use a heuristic based on the complexity of feature_variables.
        reason: Lower temperature reduces randomness, producing more stable symbolic
          expressions suitable for downstream evaluation.
        text: Determine the temperature setting by balancing exploration and precision;
          default to 0.2 for symbolic regression to favor deterministic, interpretable
          formulas.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Implement a lightweight estimator that counts tokens for a sample
          expression and scales accordingly.
        reason: Ensures enough token space for complex expressions without wasting
          resources.
        text: Compute max_tokens by estimating the typical length of symbolic expressions
          from past runs and adding a buffer; use a formula such as max_tokens = 2
          * (number_of_features * 5).
      - complexity: MEDIUM
        impact: HIGH
        method: Define the template as a Python multiline string with `{objective}`,
          `{data_description}`, and `{target_variable}` placeholders. Wrap instructions
          in a JSON object with keys "instruction" and "input" for compatibility with
          many LLM APIs.
        reason: A well‑structured template reduces hallucinations and improves the
          LLM's focus on symbolic content.
        text: Construct a prompt_template that injects the objective and dataset description,
          and includes placeholders for the model to output a single symbolic expression
          per sample. The template should be JSON‑serializable and contain a clear
          instruction section.
      - complexity: LOW
        impact: HIGH
        method: Serialize a Python dictionary to pretty‑printed JSON and embed it
          in the prompt_template or provide it as a separate configuration field.
        reason: Providing a concrete schema guides the LLM in generating syntactically
          correct expressions and aids downstream validation.
        text: Generate an input_schema string that describes the expected JSON input
          the LLM will receive during generation. Include fields for feature_variables,
          target_variable, and constraints, with data types and example values.
      - complexity: LOW
        impact: MEDIUM
        method: 'Implement a rule: if len(feature_variables) > 10 then num_proposals
          = 20 else num_proposals = 10; allow overrides via an optional configuration
          flag.'
        reason: More proposals increase the chance of finding high‑quality formulas
          but consume more API calls.
        text: Decide the number of proposals (num_proposals) by evaluating the size
          of the feature set and the evaluation budget; default to 10 proposals for
          moderate feature sizes, scaling up to 20 if computational resources allow.
    prompt: Set up the LLM with the necessary parameters and input format for generating
      symbolic regression proposals based on the defined objective.
    shims: []
  define_symbolic_regression_objective:
    agent: false
    code_node_type: stub
    description: Define the objective and scope of the symbolic regression task by
      collecting a high‑level problem statement, identifying the dependent and independent
      variables, and setting constraints and performance metrics.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass DefineSymbolicRegressionObjectiveOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_symbolic_regression_objective node outputs.\"\
      \"\"\n    objective_description: str = Field(..., description=\"High\\u2011level\
      \ description of the regression objective\")\n    target_variable: str = Field(...,\
      \ description=\"Name of the dependent variable to predict\")\n    feature_variables:\
      \ str = Field(..., description=\"List of independent variable names available\
      \ for modeling\")\n    constraints: str = Field(..., description=\"Explicit\
      \ constraints or domain rules that models must satisfy\")\n    performance_metrics:\
      \ str = Field(..., description=\"Metrics to evaluate model quality (e.g., R\\\
      u00b2, MAE, complexity)\")\n    dataset_description: str = Field(..., description=\"\
      Brief description of the data source or sampling strategy\")\n\n\ndef define_symbolic_regression_objective(general_input:\
      \ str, **kwargs) -> DefineSymbolicRegressionObjectiveOutput:\n    \"\"\"Define\
      \ the objective and scope of the symbolic regression task by collecting a high‑level\
      \ problem statement, identifying the dependent and independent variables, and\
      \ setting constraints and performance metrics.\n\n    Args:\n        general_input:\
      \ General input string for the root node.\n        **kwargs: Additional keyword\
      \ arguments.\n\n    Returns:\n        DefineSymbolicRegressionObjectiveOutput:\
      \ Object containing outputs for this node.\n    \"\"\"\n    # TODO: Implement\
      \ this function\n\n    # Return stub output with placeholder values\n    return\
      \ DefineSymbolicRegressionObjectiveOutput(\n        objective_description=\"\
      \",\n        target_variable=\"\",\n        feature_variables=\"\",\n      \
      \  constraints=\"\",\n        performance_metrics=\"\",\n        dataset_description=\"\
      \",\n    )"
    name: define_symbolic_regression_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: High‑level description of the regression objective
      key: objective_description
      type: str
    - description: Name of the dependent variable to predict
      key: target_variable
      type: str
    - description: List of independent variable names available for modeling
      key: feature_variables
      type: str
    - description: Explicit constraints or domain rules that models must satisfy
      key: constraints
      type: str
    - description: Metrics to evaluate model quality (e.g., R², MAE, complexity)
      key: performance_metrics
      type: str
    - description: Brief description of the data source or sampling strategy
      key: dataset_description
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Design the template using JSON Schema, enforce required fields, and
          include regex validators for variable names. Use a front‑end form library
          (e.g., React with Formik) to render the questionnaire.
        reason: A structured template reduces ambiguity, guides the user to provide
          all necessary information, and enables automated parsing of responses.
        text: Create a structured questionnaire template that includes sections for
          a problem narrative, target variable selection, feature list, constraints,
          metrics, and dataset description, ensuring each field has a clear label,
          tooltip, and validation rules.
      - complexity: LOW
        impact: MEDIUM
        method: Write a script that reads the first row of the CSV or Parquet file,
          extracts column names, and maps them to feature_variables. Use a lookup
          table for standard metrics.
        reason: Providing sensible defaults speeds up input and reduces errors, especially
          for large feature sets.
        text: Pre‑populate the template with defaults derived from the dataset metadata
          when available (e.g., infer feature names from column headers, suggest common
          metrics like R² and MAE).
      - complexity: MEDIUM
        impact: HIGH
        method: Use a Python validation library (pydantic or marshmallow) to enforce
          these rules and produce user‑friendly error messages.
        reason: Early validation prevents downstream failures in LLM prompts and model
          generation.
        text: 'Implement a validation step that checks for consistency: target_variable
          must be one of the column names; at least two feature_variables must be
          provided; constraints must reference existing variables.'
      - complexity: LOW
        impact: MEDIUM
        method: Implement a simple string interpolation routine in Python, using list
          joins for arrays, and trim whitespace.
        reason: Automating the description ensures consistency and embeds all essential
          information for the LLM prompt.
        text: 'Generate the objective_description by concatenating the problem narrative
          with the selected target and feature set, using a templated sentence: "Develop
          a symbolic regression model to predict [target_variable] as a function of
          [feature_variables], under the constraints: [constraints], aiming to optimize
          [performance_metrics]."'
      - complexity: LOW
        impact: HIGH
        method: Use Python's `json` module to serialize the dictionary, validate against
          the JSON Schema, and push to an in‑memory store (e.g., Redis) or a workflow
          engine's state store.
        reason: Structured JSON enables downstream nodes to consume the data without
          manual parsing.
        text: Export the completed response as a JSON object matching the defined
          output structure, and store it in a central repository or pass it directly
          to the next node via a message queue.
    prompt: Specify the problem to be solved using symbolic regression, including
      the target variable and relevant constraints.
    shims: []
  evaluate_proposal_quality:
    agent: false
    code_node_type: shim
    description: Assess the generated proposals using relevant metrics such as accuracy,
      complexity, and interpretability.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass GenerateSymbolicRegressionProposalsOutput(BaseModel):\n    \"\"\"\
      Pydantic model for generate_symbolic_regression_proposals node outputs.\"\"\"\
      \n    proposal_expressions: str = Field(..., description=\"The symbolic regression\
      \ expressions generated by the LLM, each represented as a string.\")\n    proposal_complexities:\
      \ int = Field(..., description=\"Integer complexity scores for each proposal,\
      \ indicating the number of operators or depth of the expression tree.\")\n \
      \   proposal_confidences: float = Field(..., description=\"Confidence or probability\
      \ estimates for each proposal, ranging from 0.0 to 1.0.\")\n    proposal_count:\
      \ int = Field(..., description=\"Total number of proposals generated.\")\n \
      \   proposals_valid: bool = Field(..., description=\"Whether the proposal set\
      \ passed preliminary validation (e.g., syntactic correctness).\")\n\n\nclass\
      \ EvaluateProposalQualityOutput(BaseModel):\n    \"\"\"Pydantic model for evaluate_proposal_quality\
      \ node outputs.\"\"\"\n    proposal_ids: List[str] = Field(..., description=\"\
      List of identifiers for each proposal evaluated\")\n    accuracy: List[float]\
      \ = Field(..., description=\"Accuracy metric of each proposal (e.g., R\\u00b2\
      \ or mean squared error)\")\n    complexity: List[float] = Field(..., description=\"\
      Complexity score based on the structural size of the symbolic expression\")\n\
      \    interpretability: List[float] = Field(..., description=\"Interpretability\
      \ score ranging from 0 (poor) to 1 (high), reflecting how easily a human can\
      \ understand the formula\")\n    overall_quality: List[float] = Field(..., description=\"\
      Composite quality score combining accuracy, complexity, and interpretability\"\
      )\n\n\ndef evaluate_proposal_quality(generate_symbolic_regression_proposals_input:\
      \ GenerateSymbolicRegressionProposalsOutput, **kwargs) -> EvaluateProposalQualityOutput:\n\
      \    \"\"\"Assess the generated proposals using relevant metrics such as accuracy,\
      \ complexity, and interpretability.\n\n    Args:\n        generate_symbolic_regression_proposals_input:\
      \ Input from the 'generate_symbolic_regression_proposals' node.\n        **kwargs:\
      \ Additional keyword arguments.\n\n    Returns:\n        EvaluateProposalQualityOutput:\
      \ Object containing outputs for this node.\n    \"\"\"\n    # Validate proposals_valid\
      \ flag and early exit if false\n    if not generate_symbolic_regression_proposals_input.proposals_valid:\n\
      \        log_early_exit(reason=\"proposals_valid is false\")\n        return\
      \ EvaluateProposalQualityOutput(\n            proposal_ids=[],\n           \
      \ accuracy=[],\n            complexity=[],\n            interpretability=[],\n\
      \            overall_quality=[]\n        )\n    \n    # Extract proposal expressions\
      \ and generate deterministic IDs\n    proposal_expressions: List[str] = extract_proposal_expressions(input_data=generate_symbolic_regression_proposals_input)\n\
      \    proposal_ids: List[str] = generate_proposal_ids(expressions=proposal_expressions,\
      \ node_name=\"eval\")\n    \n    # Parse expressions into evaluatable expression\
      \ trees\n    parsed_expressions: List = parse_expressions_to_trees(expressions=proposal_expressions)\n\
      \    \n    # Load training dataset from context\n    training_data = load_training_dataset(context=kwargs)\n\
      \    \n    # Initialize metric lists\n    accuracy_scores: List[float] = []\n\
      \    complexity_scores: List[float] = []\n    interpretability_scores: List[float]\
      \ = []\n    \n    # Evaluate each expression\n    for i, expression_tree in\
      \ enumerate(parsed_expressions):\n        # Evaluate predictions on training\
      \ dataset\n        predictions = evaluate_expression_predictions(expression=expression_tree,\
      \ dataset=training_data)\n        \n        # Compute accuracy metric (R² with\
      \ MSE fallback)\n        accuracy: float = compute_accuracy_metric(predictions=predictions,\
      \ targets=training_data)\n        accuracy_scores.append(accuracy)\n       \
      \ \n        # Calculate structural complexity\n        complexity: float = calculate_structural_complexity(expression=expression_tree)\n\
      \        complexity_scores.append(complexity)\n        \n        # Derive interpretability\
      \ score\n        interpretability: float = calculate_interpretability_score(expression=expression_tree)\n\
      \        interpretability_scores.append(interpretability)\n    \n    # Normalize\
      \ complexity scores\n    normalized_complexity: List[float] = normalize_complexity_scores(complexity_scores=complexity_scores)\n\
      \    \n    # Combine metrics into overall quality scores\n    overall_quality_scores:\
      \ List[float] = compute_overall_quality(\n        accuracy=accuracy_scores,\n\
      \        complexity=normalized_complexity,\n        interpretability=interpretability_scores\n\
      \    )\n    \n    # Log any proposals with warnings\n    log_proposal_warnings(proposal_ids=proposal_ids,\
      \ metrics={\n        \"accuracy\": accuracy_scores,\n        \"complexity\"\
      : normalized_complexity,\n        \"interpretability\": interpretability_scores\n\
      \    })\n    \n    return EvaluateProposalQualityOutput(\n        proposal_ids=proposal_ids,\n\
      \        accuracy=accuracy_scores,\n        complexity=normalized_complexity,\n\
      \        interpretability=interpretability_scores,\n        overall_quality=overall_quality_scores\n\
      \    )"
    name: evaluate_proposal_quality
    nodes_depended_on:
    - generate_symbolic_regression_proposals
    nodes_dependent_on: []
    output_structure:
    - description: List of identifiers for each proposal evaluated
      key: proposal_ids
      type: List[str]
    - description: Accuracy metric of each proposal (e.g., R² or mean squared error)
      key: accuracy
      type: List[float]
    - description: Complexity score based on the structural size of the symbolic expression
      key: complexity
      type: List[float]
    - description: Interpretability score ranging from 0 (poor) to 1 (high), reflecting
        how easily a human can understand the formula
      key: interpretability
      type: List[float]
    - description: Composite quality score combining accuracy, complexity, and interpretability
      key: overall_quality
      type: List[float]
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Simple boolean check; log and return empty lists if false.
        reason: Early exit avoids wasted computation on syntactically invalid proposals.
        text: Validate the `proposals_valid` flag from the parent node and abort evaluation
          if it is false.
      - complexity: LOW
        impact: MEDIUM
        method: Iterate over `proposal_expressions` and generate ID strings.
        reason: Consistent IDs are required for downstream selection and traceability.
        text: Assign a deterministic unique identifier to each proposal by concatenating
          the node name with its index (e.g., `eval_0`).
      - complexity: MEDIUM
        impact: HIGH
        method: Use `sympy.sympify`; handle parsing errors with try‑except and mark
          such proposals as invalid.
        reason: Converting to a parse tree allows systematic traversal for metric
          calculations.
        text: Parse each proposal string into an evaluatable expression tree using
          SymPy or a similar symbolic library.
      - complexity: MEDIUM
        impact: HIGH
        method: Read CSV/SQL or use pre‑loaded DataFrame; validate column names match
          `feature_variables` and `target_variable`.
        reason: Accuracy metrics require actual data for prediction.
        text: Load the training dataset from the `define_symbolic_regression_objective`
          context, ensuring alignment of feature and target variables.
      - complexity: MEDIUM
        impact: HIGH
        method: Vectorize evaluation using `numpy` arrays; handle division by zero
          and overflow by clipping results.
        reason: Predictions are needed to compute accuracy.
        text: For each expression, evaluate predictions on the training dataset by
          substituting feature values.
      - complexity: MEDIUM
        impact: HIGH
        method: Use `sklearn.metrics.r2_score`; compute MSE with `sklearn.metrics.mean_squared_error`
          if required.
        reason: R² provides an interpretable measure of explained variance; fallback
          ensures metric availability.
        text: Compute the accuracy metric as the coefficient of determination R².
          If R² calculation fails (e.g., constant prediction), fall back to negative
          mean squared error.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Traverse the SymPy expression tree; count nodes and compute depth;
          divide by max across all proposals.
        reason: Normalized complexity facilitates fair comparison and weighting.
        text: Calculate the structural complexity as the number of operators plus
          parentheses depth, normalizing by the maximum complexity seen across proposals.
      - complexity: MEDIUM
        impact: MEDIUM
        method: 'Compute a raw score as: 1 - (depth / max_depth + operator_penalty
          + variable_penalty); clip to [0,1].'
        reason: Interpretability is subjective; a rule‑based heuristic offers consistency.
        text: Derive an interpretability score between 0 and 1 using a heuristic that
          penalizes nested functions, uncommon operators, and excessive variable usage.
      - complexity: LOW
        impact: HIGH
        method: overall_quality = 0.4*accuracy + 0.3*(1 - normalized_complexity) +
          0.3*interpretability.
        reason: Weighted sum balances performance with simplicity and human readability.
        text: Combine accuracy, inverse complexity, and interpretability into an overall
          quality score using the weighting scheme 0.4, 0.3, 0.3 respectively.
      - complexity: LOW
        impact: MEDIUM
        method: Append each metric to its respective list; ensure all lists share
          the same length.
        reason: Structured output is required for downstream nodes.
        text: Collect all computed metrics into lists aligned with proposal IDs and
          output them following the defined schema.
      - complexity: LOW
        impact: MEDIUM
        method: Use Python logging; set metric values to `float('nan')`.
        reason: Transparency in evaluation aids debugging and future refinement.
        text: Log any proposals that triggered warnings (e.g., division by zero, overflow)
          and optionally set their metrics to NaN to flag them for review.
    prompt: "For each symbolic regression proposal produced by the LLM:\n1. Assign\
      \ a unique identifier.\n2. Parse the proposal string into an evaluatable expression.\n\
      3. Using the training dataset defined in `define_symbolic_regression_objective`,\
      \ compute predictions and evaluate the model against the target variable.\n\
      4. Compute the following metrics:\n   * **Accuracy** – R² score (or MSE if R²\
      \ is not available).\n   * **Complexity** – structural size of the expression\
      \ (number of operators or tree depth).\n   * **Interpretability** – a heuristic\
      \ score between 0 and 1 based on operator diversity, presence of domain‑specific\
      \ functions, and expression depth.\n5. Combine the three metrics into a composite\
      \ `overall_quality` score using a weighted sum (weights 0.4 for accuracy, 0.3\
      \ for inverse complexity, 0.3 for interpretability).\n6. Return the results\
      \ in the specified output structure."
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Handles early exit logging when proposals are invalid.
      implementation: "def log_early_exit(reason: str) -> str:\n    \"\"\"\n    Handles\
        \ early exit logging when proposals are invalid.\n\n    Args:\n        reason:\
        \ Input parameter of type str\n\n    Returns:\n        str: Output of type\
        \ Any\n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub\
        \ node that needs to be implemented\")\n"
      name: log_early_exit
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type Any
        key: output
        type: str
      - description: Input parameter of type str
        key: reason
        type: str
      prd:
        bullets:
        - complexity: LOW
          impact: Improves logging transparency and debugging.
          method: Use a simple string extraction from the input.
          reason: Required for logging purpose.
          text: Extract the reason for early exit from the input.
        - complexity: MEDIUM
          impact: Facilitates error handling and system diagnosis.
          method: Use a logging library like logging.py to write the log message.
          reason: Needed for logging and debugging purposes.
          text: Implement a function to log the early exit message with the reason.
        - complexity: LOW
          impact: Ensures that the execution does not terminate abruptly.
          method: Use conditional statements to check for early exit and return the
            output accordingly.
          reason: Required to continue the execution of the EvaluateProposalQuality
            function.
          text: Handle the return of the EvaluateProposalQualityOutput object after
            logging.
      prompt: Log an early exit message with a reason.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Extracts the generated symbolic regression expressions from the
        input proposals, which are then used for proposal quality assessment.
      implementation: "def extract_proposal_expressions(input_data: str) -> List[str]:\n\
        \    \"\"\"\n    Extracts the generated symbolic regression expressions from\
        \ the input proposals, which are then used for proposal quality assessment.\n\
        \n    Args:\n        input_data: Input parameter of type str\n\n    Returns:\n\
        \        List[str]: Output of type List[str]\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")\n"
      name: extract_proposal_expressions
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: input_data
        type: str
      prd:
        bullets:
        - complexity: MEDIUM
          impact: Improves the accuracy of proposal quality assessment by utilizing
            the generated expressions.
          method: Utilize a parser library to extract expressions from input proposals.
          reason: To enable the extraction of symbolic regression expressions for
            proposal quality assessment.
          text: Implement a function to parse the input proposals and extract the
            generated symbolic regression expressions.
        - complexity: HIGH
          impact: Reduces the likelihood of errors and exceptions during proposal
            quality assessment.
          method: Implement error handling and exception handling mechanisms to address
            common edge cases.
          reason: To ensure robustness and reliability in the extraction process.
          text: Handle edge cases where the input proposals or expressions are malformed
            or inconsistent.
        - complexity: LOW
          impact: Streamlines the proposal quality assessment process and enables
            efficient processing of expressions.
          method: Update the proposal quality assessment workflow to include the expression
            extraction function.
          reason: To facilitate seamless usage of extracted expressions in the assessment
            pipeline.
          text: Integrate the expression extraction function with the proposal quality
            assessment workflow.
      prompt: Extract the generated symbolic regression expressions from the input
