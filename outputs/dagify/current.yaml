  perform_cointegration_analysis:
    agent: false
    description: Conduct cointegration analysis on the preprocessed data to discover
      statistically meaningful long‑term equilibrium relationships among asset prices.
    name: perform_cointegration_analysis
    nodes_depended_on:
    - clean_and_preprocess_data
    nodes_dependent_on: []
    output_structure:
    - description: List of identified cointegrated asset pairs in the format 'AssetA-AssetB'.
      key: cointegrated_pairs
      type: List[str]
    - description: Johansen trace statistic value for the cointegration test.
      key: johansen_trace_statistic
      type: float
    - description: P‑value associated with the Johansen trace statistic.
      key: johansen_p_value
      type: float
    - description: Whether the cointegration test indicates significant cointegration.
      key: is_significant
      type: bool
    - description: Number of cointegrated pairs identified.
      key: num_pairs
      type: int
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: 'If cleaned_data_available == False: return outputs with defaults.'
        reason: Avoid downstream failures caused by attempting statistical tests on
          missing or incomplete data.
        text: Validate that the parent node produced a usable cleaned dataset by checking
          the 'cleaned_data_available' flag. If false, set all outputs to safe defaults
          (empty list, 0.0, false, 0) and exit.
      - complexity: MEDIUM
        impact: HIGH
        method: Use pandas.read_csv or a global variable. Validate date range consistency
          across assets.
        reason: The Johansen test requires a clean, aligned multivariate time series.
        text: Retrieve the cleaned price matrix from shared storage (e.g., a CSV file
          or in‑memory DataFrame). Ensure columns correspond to asset tickers and
          that the DataFrame is indexed by date with no missing rows.
      - complexity: LOW
        impact: MEDIUM
        method: Select columns where dtype is numeric and not in a blacklist.
        reason: Focus the test only on relevant price series and avoid including non‑numeric
          or auxiliary columns.
        text: Determine the list of asset symbols to test by filtering columns that
          contain price data (e.g., close prices). Use the 'processed_columns' from
          the parent node to confirm these columns.
      - complexity: HIGH
        impact: HIGH
        method: Use statsmodels.tsa.vector_ar.vecm.coint_johansen on the 2‑column
          data. Set det_order=0 to test for a cointegrating relationship without deterministic
          trend.
        reason: Pair‑wise testing captures specific long‑run relationships needed
          for statistical arbitrage signals.
        text: For each unordered asset pair (A,B), construct a 2‑column sub‑DataFrame
          and apply the Johansen cointegration test with lag order 1 (or determine
          optimal lag using AIC/BIC on the full multivariate system).
      - complexity: MEDIUM
        impact: HIGH
        method: Use results.lr1 for trace stats and results.cvt for critical values;
          compute p-value with scipy.stats.chi2.sf(trace_stat, df).
        reason: The trace statistic indicates the number of cointegrating vectors;
          p‑value quantifies significance.
        text: Extract the trace statistic and critical values from the test results.
          Compute the p‑value by comparing the trace statistic to the asymptotic chi‑square
          distribution using the eigenvalues provided by the library.
      - complexity: LOW
        impact: HIGH
        method: Compare trace_stat > results.cvt[0, 4] (5% level).
        reason: Ensures only statistically robust relationships are used downstream.
        text: Declare a pair as cointegrated if the trace statistic exceeds the 5%
          critical value (or any user‑defined significance level). Append the pair
          in 'AssetA-AssetB' format to 'cointegrated_pairs'.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Run coint_johansen on the full DataFrame, use the largest eigenvalue
          statistic as overall trace.
        reason: Provides a global metric of cointegration strength across the selected
          assets.
        text: After iterating over all pairs, compute the overall Johansen trace statistic
          for the full asset universe by running the test on the full cleaned DataFrame
          and aggregating the trace statistics for each possible cointegrating rank.
      - complexity: LOW
        impact: MEDIUM
        method: p_value = scipy.stats.chi2.sf(max_trace, df).
        reason: Allows downstream components to gauge overall market integration.
        text: Calculate a single overall p‑value by assessing the significance of
          the largest trace statistic against its chi‑square distribution with df
          equal to the number of assets minus one.
      - complexity: LOW
        impact: MEDIUM
        method: is_significant = len(cointegrated_pairs) > 0.
        reason: Provides a quick flag for the trading signals module.
        text: Set 'is_significant' to True if at least one pair passed the significance
          test; otherwise False.
      - complexity: LOW
        impact: LOW
