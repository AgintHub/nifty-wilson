dag_type: typed
description: Generated workflow from UI.
name: symbolic_regression_framework_with_llm
nodes:
  configure_llm_for_proposal_generation:
    agent: false
    description: Configure the LLM for generating proposals for symbolic regression
    name: configure_llm_for_proposal_generation
    nodes_depended_on:
    - define_symbolic_regression_objective
    nodes_dependent_on: []
    output_structure:
    - description: The name of the language model to be used (e.g., "gpt-4o", "llama-3.1")
      key: model_name
      type: str
    - description: The sampling temperature controlling randomness of the model output
      key: temperature
      type: float
    - description: Maximum number of tokens the model should generate for each proposal
      key: max_tokens
      type: int
    - description: The prompt format that the LLM will use when generating proposals,
        incorporating placeholders for objective and data
      key: prompt_template
      type: str
    - description: Human‑readable description or JSON schema of the input data expected
        by the LLM
      key: input_schema
      type: str
    - description: Number of independent proposal samples the LLM should generate
      key: num_proposals
      type: int
    prompt: Set up the LLM with the necessary parameters and input format for generating
      symbolic regression proposals based on the defined objective.
  define_symbolic_regression_objective:
    agent: false
    description: Define the objective and scope of the symbolic regression task
    name: define_symbolic_regression_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: High‑level description of the regression objective
      key: objective_description
      type: str
    - description: Name of the dependent variable to predict
      key: target_variable
      type: str
    - description: List of independent variable names available for modeling
      key: feature_variables
      type: List[str]
    - description: Explicit constraints or domain rules that models must satisfy
      key: constraints
      type: List[str]
    - description: Metrics to evaluate model quality (e.g., R², MAE, complexity)
      key: performance_metrics
      type: List[str]
    - description: Brief description of the data source or sampling strategy
      key: dataset_description
      type: str
    prompt: Specify the problem to be solved using symbolic regression, including
      the target variable and relevant constraints.
  evaluate_proposal_quality:
    agent: false
    description: Evaluate the quality of the generated symbolic regression proposals
    name: evaluate_proposal_quality
    nodes_depended_on:
    - generate_symbolic_regression_proposals
    nodes_dependent_on: []
    output_structure:
    - description: List of identifiers for each proposal evaluated
      key: proposal_ids
      type: List[str]
    - description: Accuracy metric of each proposal (e.g., R² or mean squared error)
      key: accuracy
      type: float
    - description: Complexity score based on the structural size of the symbolic expression
      key: complexity
      type: float
    - description: Interpretability score ranging from 0 (poor) to 1 (high), reflecting
        how easily a human can understand the formula
      key: interpretability
      type: float
    - description: Composite quality score combining accuracy, complexity, and interpretability
      key: overall_quality
      type: float
    prompt: Assess the generated proposals using relevant metrics such as accuracy,
      complexity, and interpretability.
  finalize_symbolic_regression_framework:
    agent: false
    description: Finalize the symbolic regression framework based on test results
    name: finalize_symbolic_regression_framework
    nodes_depended_on:
    - test_symbolic_regression_framework
    nodes_dependent_on: []
    output_structure:
    - description: Version identifier of the finalized symbolic regression framework
      key: framework_version
      type: str
    - description: Concise summary of modifications made based on test results
      key: adjustments_summary
      type: str
    - description: Indicates whether the framework meets robustness criteria after
        adjustments
      key: is_framework_robust
      type: bool
    - description: Accuracy metric achieved by the finalized framework on the test
        dataset
      key: final_performance_accuracy
      type: float
    - description: Complexity metric of the finalized model
      key: final_performance_complexity
      type: float
    - description: Interpretability metric of the finalized model
      key: final_performance_interpretability
      type: float
    prompt: Make any necessary adjustments to the framework based on the test results,
      ensuring it is robust and effective.
  generate_symbolic_regression_proposals:
    agent: false
    description: Generate proposals for symbolic regression using the configured LLM
    name: generate_symbolic_regression_proposals
    nodes_depended_on:
    - configure_llm_for_proposal_generation
    nodes_dependent_on: []
    output_structure:
    - description: The symbolic regression expressions generated by the LLM, each
        represented as a string.
      key: proposal_expressions
      type: List[str]
    - description: Integer complexity scores for each proposal, indicating the number
        of operators or depth of the expression tree.
      key: proposal_complexities
      type: List[int]
    - description: Confidence or probability estimates for each proposal, ranging
        from 0.0 to 1.0.
      key: proposal_confidences
      type: List[float]
    - description: Total number of proposals generated.
      key: proposal_count
      type: int
    - description: Whether the proposal set passed preliminary validation (e.g., syntactic
        correctness).
      key: proposals_valid
      type: bool
    prompt: Use the configured LLM to generate a set of symbolic regression proposals
      based on the defined objective and input data.
  integrate_refined_proposals_into_framework:
    agent: false
    description: Integrate the refined proposals into the symbolic regression framework
    name: integrate_refined_proposals_into_framework
    nodes_depended_on:
    - refine_selected_proposals
    nodes_dependent_on: []
    output_structure:
    - description: List of symbolic regression equations integrated into the framework.
      key: integrated_proposals
      type: List[str]
    - description: Whether the integration process completed successfully.
      key: integration_success
      type: bool
    - description: Number of proposals integrated into the framework.
      key: integrated_count
      type: int
    - description: Log or summary of the integration process.
      key: integration_log
      type: str
    prompt: Incorporate the refined proposals into the overall framework, ensuring
      compatibility and optimal performance.
  refine_selected_proposals:
    agent: false
    description: Refine the selected proposals to improve their quality and robustness
    name: refine_selected_proposals
    nodes_depended_on:
    - select_top_proposals
    nodes_dependent_on: []
    output_structure:
    - description: List of symbolic regression expressions that have been refined
      key: refined_proposals
      type: List[str]
    - description: Absolute improvement in predictive accuracy compared to the original
        top proposals
      key: accuracy_improvement
      type: float
    - description: Net change in model complexity (negative indicates simplification,
        positive indicates added complexity)
      key: complexity_change
      type: int
    - description: Overall interpretability score of the refined proposals on a scale
        from 0.0 (least interpretable) to 1.0 (most interpretable)
      key: interpretability_score
      type: float
    prompt: Apply techniques such as hyperparameter tuning or ensemble methods to
      refine the selected proposals and enhance their performance.
  select_top_proposals:
    agent: false
    description: Select the top proposals based on their evaluated quality
    name: select_top_proposals
    nodes_depended_on:
    - evaluate_proposal_quality
    nodes_dependent_on: []
    output_structure:
    - description: Identifiers (or indices) of the proposals selected as top candidates.
      key: top_proposal_ids
      type: List[str]
    - description: Quality score for each selected proposal, reflecting metrics such
        as accuracy, complexity, and interpretability.
      key: top_proposal_scores
      type: List[float]
    - description: Number of proposals selected.
      key: selected_count
      type: int
    - description: The rule or threshold used for selection (e.g., "top-k by score"
        or "score > 0.8").
      key: selection_criteria
      type: str
    - description: Indicates whether the selection process completed without errors.
      key: is_successful
      type: bool
    prompt: Choose the best proposals based on their quality metrics, considering
      factors such as performance and simplicity.
  test_symbolic_regression_framework:
    agent: false
    description: Test the integrated symbolic regression framework
    name: test_symbolic_regression_framework
    nodes_depended_on:
    - integrate_refined_proposals_into_framework
    nodes_dependent_on: []
    output_structure:
    - description: Overall accuracy of the framework on the test datasets
      key: test_accuracy
      type: float
    - description: Root mean squared error on the test datasets
      key: test_rmse
      type: float
    - description: Total execution time in seconds for all test runs
      key: test_runtime_seconds
      type: float
    - description: Whether the framework met the predefined performance thresholds
      key: test_success
      type: bool
    - description: Names of the test datasets used in the evaluation
      key: test_dataset_names
      type: List[str]
    - description: Short textual summary of the test results and observations
      key: test_summary
      type: str
    prompt: Evaluate the performance of the integrated framework using relevant benchmarks
      and test datasets.
