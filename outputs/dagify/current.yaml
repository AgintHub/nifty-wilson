    nodes_dependent_on: []
    prompt: Define the characteristics of acute disease processes including rapid
      onset, short duration, and immediate pathophysiological changes.
  categorize_chronic_diseases:
    agent: false
    description: Define characteristics of chronic disease processes
    name: categorize_chronic_diseases
    nodes_depended_on:
