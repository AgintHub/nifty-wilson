    nodes_dependent_on: []
    prompt: Define the characteristics of chronic disease processes including gradual
      onset, prolonged duration, and progressive pathophysiological changes.
  categorize_system_anatomical_structures:
    agent: false
    description: Break down each system into anatomical components
    name: categorize_system_anatomical_structures
    nodes_depended_on:
    - identify_anatomical_systems
    nodes_dependent_on: []
    prompt: For each identified anatomical system, list the major anatomical structures
      and components that will be included in pathophysiology analysis.
  categorize_system_physiological_functions:
    agent: false
    description: Define normal physiological functions for each system
    name: categorize_system_physiological_functions
    nodes_depended_on:
    - categorize_system_anatomical_structures
    nodes_dependent_on: []
    prompt: For each anatomical system, define the normal physiological functions
      and processes that occur within each anatomical component.
  compile_pathophysiology_compendium:
    agent: false
    description: Synthesizes all validated pathophysiology modules into a single,
      meticulously organized reference compendium. The compendium spans organ‑system
      narratives, cross‑system integration points, disease model schematics, diagnostic
      algorithm blueprints, and therapeutic target road‑maps. It also embeds a dedicated
      immunology section that dissects lymphocyte ontogeny, contrasting positive and
      negative selection, delineating T‑cell versus B‑cell developmental trajectories,
      and enumerating every relevant signaling channel, receptor cascade, and secondary
      messenger system involved.
    name: compile_pathophysiology_compendium
    nodes_depended_on:
    - validate_pathophysiology_coherence
    nodes_dependent_on: []
    prompt: Assemble a master reference document that consolidates every pathophysiology
      component produced by upstream nodes. Structure the output into clearly labeled
      sections for each physiological system, integration interfaces, disease models,
      diagnostic algorithms, and therapeutic targets. Within the immunology chapter,
      provide an exhaustive comparative analysis of positive versus negative selection,
      and of T‑cell versus B‑cell lineage commitment. List all signaling channels
      (e.g., cytokine receptors, co‑stimulatory molecules), intracellular cascades,
      and secondary messengers (Ca²⁺, cAMP, IP₃/DAG, MAPK, PI3K‑Akt, NF‑κB, JAK‑STAT,
      etc.) that drive these processes. Present the material in a consistent, hierarchical
      format (e.g., markdown with tables and diagrams) that facilitates downstream
      validation of coherence and logical flow.
  create_diagnostic_algorithms:
    agent: false
    description: Develop decision trees for differential diagnosis
    name: create_diagnostic_algorithms
    nodes_depended_on:
    - create_differential_diagnosis_trees
    - create_diagnostic_scoring_systems
    nodes_dependent_on: []
    prompt: Create diagnostic algorithms that use clinical manifestations and biomarkers
      to differentiate between various pathophysiological processes. Structure as
      decision trees with clear branching points.
  create_diagnostic_scoring_systems:
    agent: false
    description: Synthesizes mapped clinical manifestations and the established biomarker
      framework with detailed immunological metrics—positive versus negative selection
      ratios, T‑cell versus B‑cell activity indices, and the full spectrum of signaling
      cascades and secondary messengers—to generate a multi‑dimensional, weighted
      diagnostic score that quantifies disease probability with mechanistic transparency.
    name: create_diagnostic_scoring_systems
    nodes_depended_on:
    - map_clinical_manifestations
    - establish_biomarker_framework
    nodes_dependent_on: []
    prompt: "Design a comprehensive diagnostic scoring system that integrates:\n1.\
      \ **Clinical manifestation weights** derived from the `map_clinical_manifestations`\
      \ output (symptoms, signs, diagnostic test results).\n2. **Biomarker values**\
      \ from the `establish_biomarker_framework` (laboratory, imaging, physiological\
      \ parameters).\n3. **Immunological parameters** including:\n   - Positive and\
      \ negative selection ratios for thymic T‑cell development.\n   - Quantitative\
      \ metrics of B‑cell maturation and activation (e.g., surface IgM/IgD, CD27 expression).\n\
      \   - Channel‑specific signaling readouts: phosphorylation levels of ZAP‑70,\
      \ LAT, PLCγ, MAPK, AKT; calcium influx kinetics; cytokine receptor downstream\
      \ JAK/STAT activation.\n   - Concentrations of secondary messengers such as\
      \ cAMP, IP₃, DAG, and nitric oxide.\n4. **Weighting methodology** that justifies\
      \ the relative contribution of each domain (clinical, biomarker, immunological)\
      \ using evidence‑based scaling (e.g., odds ratios, ROC‑AUC, expert‑derived coefficients).\n\
      \nProduce a formulaic scoring algorithm, a clear rationale for each weight,\
      \ and a sample calculation for a hypothetical patient case. Ensure the output\
      \ is ready to feed downstream decision‑support nodes while preserving compatibility\
      \ with the upstream mappings."
  create_differential_diagnosis_trees:
    agent: false
    description: Develop decision trees for distinguishing between diseases
    name: create_differential_diagnosis_trees
    nodes_depended_on:
    - map_clinical_manifestations
    - establish_biomarker_framework
    nodes_dependent_on: []
    prompt: Create differential diagnosis decision trees that use clinical manifestations
      and biomarkers to distinguish between similar disease presentations.
  create_temporal_progression_models:
    agent: false
    description: Define how diseases progress over time
    name: create_temporal_progression_models
    nodes_depended_on:
    - define_decompensation_stages
    nodes_dependent_on: []
    prompt: Create models showing how different disease categories typically progress
      over time. Include acute vs chronic phases, compensatory mechanisms, and stages
      of decompensation.
  define_apoptotic_mechanisms:
    agent: false
    description: Establish programmed cell death pathways
    name: define_apoptotic_mechanisms
    nodes_depended_on:
    - define_molecular_mechanisms
    nodes_dependent_on: []
    prompt: Define apoptotic mechanisms including caspase activation, mitochondrial
      permeability transition, and DNA fragmentation pathways based on molecular processes.
  define_bcell_negative_selection:
    agent: false
    description: Elucidates the integrated positive and negative selection processes
      governing B‑cell and T‑cell development in primary (bone marrow, thymus) and
      peripheral lymphoid compartments, mapping extracellular ligands, receptor engagements,
      co‑receptor cues, and intracellular second‑messenger cascades that enforce central
      and peripheral tolerance.
    name: define_bcell_negative_selection
    nodes_depended_on:
    - define_cellular_signaling_mechanisms
    nodes_dependent_on: []
    prompt: 'Provide a comprehensive, mechanistic comparison of positive versus negative
      selection for B cells and T cells in bone marrow, thymus, and peripheral lymphoid
      tissues. For each lineage, detail: (1) the antigen‑receptor interactions (BCR
      or TCR) with self‑peptide–MHC complexes or soluble self‑antigens, (2) the co‑stimulatory
      or inhibitory receptors (e.g., CD28, CTLA‑4, CD40, BAFF‑R, ICOS, PD‑1) that
      modulate the decision, (3) the intracellular signaling modules and second‑messenger
      cascades (Ca²⁺ flux, IP₃/DAG, cAMP, PI3K/Akt, MAPK/ERK, NF‑κB, JAK/STAT) that
      transduce these cues, (4) the resulting cellular fates—anergy induction, receptor
      editing, clonal deletion, apoptosis, or survival and maturation—and (5) peripheral
      tolerance mechanisms (follicular exclusion, regulatory T/B cell interactions,
      cytokine‑mediated suppression). Synthesize the information into a structured
      table or schematic that highlights shared and distinct pathways between B‑cell
      and T‑cell selection, and explicitly links each outcome to the upstream signals
      and second‑messenger networks.'
  define_bcell_positive_selection:
    agent: false
    description: Elucidates the comprehensive molecular and cellular mechanisms that
      govern both positive and negative selection of B cells within the bone marrow,
      while explicitly contrasting these processes with T‑cell selection in the thymus.
      The description integrates receptor engagement (BCR, pre‑BCR, TCR), co‑receptor
      and adaptor interactions (Syk, ZAP‑70, BLNK, LAT), downstream signaling cascades
      (PI3K‑AKT, MAPK/ERK, NF‑κB, calcium‑calcineurin‑NFAT, cAMP, IP₃/DAG), cytokine/chemokine
      cues, and secondary messenger dynamics that together dictate survival, differentiation,
      or apoptosis.
    name: define_bcell_positive_selection
    nodes_depended_on:
    - define_cellular_signaling_mechanisms
    nodes_dependent_on: []
    prompt: 'Compare and contrast the positive and negative selection pathways of
      B cells in the bone marrow with T‑cell selection in the thymus. For each lineage,
      detail:


      1. Primary antigen receptors (BCR, pre‑BCR, TCR) and the criteria for ligand‑dependent
      versus tonic signaling.

      2. Key kinases and adaptor proteins (Syk, ZAP‑70, BLNK, LAT) that transduce
      these signals.

      3. Downstream second‑messenger pathways, including PI3K‑AKT, MAPK/ERK, NF‑κB,
      calcium‑calcineurin‑NFAT, cAMP, IP₃/DAG, and how they modulate transcriptional
      programs.

      4. Cytokine, chemokine, and survival factors (IL‑7, BAFF, SCF, etc.) that provide
      contextual cues.

      5. The mechanistic role of Ig heavy‑chain/ light‑chain pairing and pre‑BCR checkpoint
      signaling in B‑cell positive selection, and the molecular triggers (e.g., lack
      of signaling, autoreactive BCR engagement) that initiate B‑cell negative selection.

      6. Corresponding positive and negative selection checkpoints for T cells, including
      thymic cortical and medullary cues, and the involvement of self‑peptide–MHC
      interactions.


      Synthesize these elements into a unified mechanistic map that enumerates all
      signaling channels, secondary messengers, and fate‑determining outcomes for
      both B‑ and T‑cell lineages.'
  define_cellular_metabolic_mechanisms:
    agent: false
    description: Establish cellular metabolic pathways and energy processes
    name: define_cellular_metabolic_mechanisms
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Define cellular metabolic mechanisms including glycolysis disruption,
      mitochondrial dysfunction, ATP depletion, and metabolic acidosis that underlie
      disease processes.
  define_cellular_signaling_mechanisms:
    agent: false
    description: Elucidates comprehensive cellular communication and signaling cascades,
      emphasizing immunological selection processes (positive and negative selection)
      in T‑ and B‑lymphocytes, and detailing all receptor channels, intracellular
      second‑messenger systems, and intercellular signaling pathways that drive physiological
      and pathological outcomes.
    name: define_cellular_signaling_mechanisms
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Provide a detailed exposition of cellular signaling mechanisms, encompassing
      receptor dysfunction, second‑messenger cascades, and intercellular communication
      pathways, with explicit focus on:

      1. Positive and negative selection events during thymic T‑cell development and
      bone‑marrow B‑cell maturation;

      2. Comparative signaling architectures of T‑cell receptors (TCR) versus B‑cell
      receptors (BCR);

      3. All major ion channels, cytokine, chemokine, co‑stimulatory, and adhesion
      molecule channels involved in lymphocyte signaling;

      4. The full repertoire of secondary messengers (e.g., cAMP, IP₃/DAG, Ca²⁺, ROS,
      NO, lipid mediators) that transduce these signals;

      Explain how dysregulation of any of these components contributes to disease
      pathology.'
  define_cellular_transport_mechanisms:
    agent: false
    description: Elucidates the full spectrum of cellular transport and membrane dynamics—including
      active transporters, passive diffusion, facilitated diffusion, endocytosis,
      exocytosis, and regulated permeability changes—and integrates these mechanisms
      with immune cell development by detailing positive and negative selection of
      T‑cells versus B‑cells, the ion channels, surface receptors, signaling cascades,
      and secondary messengers that modulate transport processes in health and disease.
    name: define_cellular_transport_mechanisms
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Provide a comprehensive analysis of cellular transport mechanisms—active
      transport, passive diffusion, facilitated diffusion, endocytosis, exocytosis,
      and dynamic changes in membrane permeability—and explain how these processes
      contribute to pathological states. In parallel, delineate the mechanisms of
      positive and negative selection in T cells and B cells, enumerating all relevant
      ion channels, co‑receptors, and signaling pathways (e.g., TCR/BCR signaling,
      CD28, CTLA‑4, cytokine receptors) as well as secondary messengers (e.g., Ca²⁺,
      cAMP, IP₃/DAG, ROS). Highlight cross‑talk between transport and selection signaling,
      and illustrate how dysregulation can lead to immune‑related disorders.
  define_compensatory_mechanisms:
    agent: false
    description: Define physiological compensation in disease
    name: define_compensatory_mechanisms
    nodes_depended_on:
    - categorize_acute_diseases
    - categorize_chronic_diseases
    nodes_dependent_on: []
    prompt: Define physiological compensatory mechanisms that occur in response to
      acute and chronic disease processes.
  define_decompensation_stages:
    agent: false
    description: Define stages of physiological decompensation
    name: define_decompensation_stages
    nodes_depended_on:
    - define_compensatory_mechanisms
    nodes_dependent_on: []
    prompt: Define the stages of physiological decompensation when compensatory mechanisms
      fail, including early, intermediate, and late stages.
  define_inflammatory_mechanisms:
    agent: false
    description: Elucidates the integrated innate and adaptive pathways that drive
      inflammation, encompassing complement cascade activation, cytokine and chemokine
      networks, eicosanoid mediator release, and the cellular selection processes
      that shape T‑cell and B‑cell repertoires.
    name: define_inflammatory_mechanisms
    nodes_depended_on:
    - define_molecular_mechanisms
    nodes_dependent_on: []
    prompt: 'Detail the comprehensive inflammatory mechanisms operative in pathological
      contexts. Include:

      1. **Complement activation** – describe the classical, lectin, and alternative
      pathways, key convertases, and downstream effectors (C3a, C5a, membrane attack
      complex).

      2. **Cytokine and chemokine cascades** – list pivotal cytokines (e.g., IL‑1β,
      TNF‑α, IL‑6, IFN‑γ) and chemokines, their receptors, associated transcription
      factors (NF‑κB, AP‑1, STATs), and feedback regulation.

      3. **Inflammatory mediator release** – outline biosynthesis and actions of prostaglandins,
      leukotrienes, histamine, nitric oxide, and associated enzymes (COX‑2, 5‑LOX),
      noting second‑messenger pathways (cAMP, Ca²⁺, PKC).

      4. **Positive vs. negative selection** – contrast the selection processes in
      the thymus (T‑cells) and bone marrow (B‑cells), specifying the signaling channels
      (TCR/BCR engagement, CD28/CD40 co‑stimulation), intracellular cascades (MAPK/ERK,
      PI3K‑Akt, NF‑κB, calcium flux), and secondary messengers (cAMP, IP₃/DAG, ROS)
      that determine survival or deletion.

      Present the information in a structured, hierarchical format (tables or bulleted
      outlines) that highlights cross‑talk between pathways and key regulatory checkpoints.'
  define_molecular_mechanisms:
    agent: false
    description: Elucidates the core molecular and immunological processes that drive
      disease pathology. This includes canonical molecular insults such as DNA damage,
      protein misfolding, metabolic derangement, and aberrant signal transduction,
      as well as the pivotal immune‑selection events (positive vs. negative selection)
      and activation pathways of T‑cells and B‑cells, with explicit reference to ion
      channels, surface receptors, intracellular signaling cascades, and secondary
      messengers.
    name: define_molecular_mechanisms
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Identify and concisely describe 8‑12 fundamental mechanisms that underlie
      pathological states. Your list should:

      1. Cover classic molecular lesions – e.g., DNA double‑strand breaks, oxidative
      base modifications, protein aggregation/misfolding, mitochondrial dysfunction,
      and dysregulated kinase/phosphatase signaling.

      2. Include immunological selection and activation processes: positive and negative
      selection in the thymus (T‑cells) and bone marrow (B‑cells), receptor editing,
      and central/peripheral tolerance mechanisms.

      3. Specify the primary ion channels, surface receptors, intracellular signaling
      pathways, and secondary messengers (e.g., Ca²⁺ influx, cAMP, IP₃/DAG, MAPK,
      NF‑κB, JAK/STAT) that mediate each mechanism.

      4. Provide a brief (1‑2 sentence) description of how each mechanism contributes
      to disease development or progression.

      Present the output as a numbered list with clear headings for each mechanism.'
  define_oxidative_stress_mechanisms:
    agent: false
    description: Establish reactive oxygen species and antioxidant pathways
    name: define_oxidative_stress_mechanisms
    nodes_depended_on:
    - define_cellular_metabolic_mechanisms
    nodes_dependent_on: []
    prompt: Define oxidative stress mechanisms including free radical generation,
      antioxidant depletion, and lipid peroxidation based on cellular metabolic processes.
  define_tcell_negative_selection:
    agent: false
    description: Provides a comprehensive, mechanistic overview of thymic T‑cell selection,
      contrasting the molecular cues and intracellular signaling cascades that drive
      positive versus negative selection of developing T cells, and juxtaposing these
      processes with B‑cell selection events in the bone marrow. The description integrates
      high‑affinity TCR‑pMHC recognition, calcium influx dynamics, MAPK, NF‑κB, and
      PI3K‑AKT pathways, secondary messengers (e.g., DAG, IP₃, cAMP), pro‑apoptotic
      regulators (Bim, Nur77), caspase cascades, and the role of cortical and medullary
      thymic epithelial cells, dendritic cells, and cytokine milieus in shaping a
      self‑tolerant T‑cell repertoire while highlighting parallel selection checkpoints
      for B cells.
    name: define_tcell_negative_selection
    nodes_depended_on:
    - define_cellular_signaling_mechanisms
    nodes_dependent_on: []
    prompt: Elaborate a detailed, side‑by‑side comparison of positive and negative
      selection mechanisms for T cells in the thymus and the analogous selection processes
      for B cells in the bone marrow. For each selection type, enumerate the cellular
      contexts (cortical vs. medullary thymic epithelial cells, dendritic cells, stromal
      cells, bone‑marrow stromal niches), the critical receptor‑ligand interactions
      (high‑affinity TCR‑pMHC, BCR‑self‑antigen), the full spectrum of signaling channels
      (calcium flux, MAPK/ERK, NF‑κB, PI3K‑AKT, JAK‑STAT), secondary messengers (IP₃,
      DAG, cAMP, ROS), and downstream pro‑apoptotic or survival pathways (Bim, Nur77,
      Bcl‑2 family, caspase activation). Discuss how these molecular events culminate
      in the elimination of autoreactive clones or the rescue of moderately reactive
      clones, and highlight any shared or divergent signaling nodes between T‑cell
      and B‑cell selection. Provide concise mechanistic diagrams or flow‑charts if
      possible.
  define_tcell_positive_selection:
    agent: false
    description: Elucidates the molecular and cellular mechanisms governing thymic
      T‑cell positive and negative selection, contrasting them with B‑cell selection
      processes, and detailing the full repertoire of membrane receptors, co‑receptors,
      intracellular signaling cascades, and secondary messengers that dictate thymocyte
      fate. The description integrates calcium signaling via IP₃/DAG, PKC isoforms,
      MAPK/ERK, NF‑κB, NFAT, PI3K/Akt, mTOR, and apoptotic pathways (Bcl‑2 family,
      Bim, Fas/FasL) to provide a comprehensive view of survival versus deletion signals.
