          is a non-empty list and that ''johansen_p_value'' is below the significance
          threshold (e.g., 0.05). If validation fails, set ''is_valid'' to false and
          terminate early.'
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use a for‑loop with a dictionary lookup or SQL query to pull the two
          series; store them in a pandas DataFrame for vectorized operations.
        reason: Signal generation requires real price data; iterating allows pair‑wise
          processing.
        text: Iterate over each pair in 'cointegrated_pairs' and retrieve the corresponding
          time series of asset prices from the preprocessed dataset (assumed available
          globally or passed via context).
      - complexity: MEDIUM
        impact: HIGH
        method: Leverage statsmodels' OLS; handle singular matrix exceptions; normalize
          β to account for scale differences.
        reason: Hedge ratio defines the linear relationship that should hold under
          equilibrium; accurate β is critical for mean‑reversion detection.
        text: 'Compute the hedge ratio (β) for each pair using ordinary least squares
          (OLS) regression of AssetB on AssetA. Store β to construct the spread series:
          spread = price_B - β * price_A.'
      - complexity: MEDIUM
        impact: HIGH
        method: Use pandas' rolling().mean() and rolling().std(); ensure min_periods=window
          to avoid NaNs.
        reason: Z‑score normalizes the spread, enabling threshold‑based signal decisions
          irrespective of absolute price levels.
        text: 'Calculate the rolling mean and rolling standard deviation of the spread
          using a fixed window (e.g., 30 days). Compute the Z‑score: z = (spread -
          mean_spread) / std_spread.'
      - complexity: MEDIUM
        impact: HIGH
        method: Vectorized comparison; maintain a position flag per pair to avoid
          duplicate signals; use pandas' where() to label signals.
        reason: Thresholds translate statistical deviations into actionable trade
          decisions and help control risk exposure.
        text: 'Define entry and exit thresholds for mean‑reversion: e.g., entry at
          |z| > 1.5 and exit at |z| < 0.5. For each timestamp, generate a ''long''
          signal when z < -entry_threshold and a ''short'' when z > entry_threshold;
          close positions when z crosses the exit threshold.'
      - complexity: LOW
        impact: MEDIUM
        method: Compute max_z once per pair; divide; use numpy.clip.
        reason: Provides a continuous confidence metric that can be used for position
          sizing or risk weighting.
        text: Calculate signal strength as the absolute Z‑score normalized by a maximum
          observed Z‑score across all pairs and time points (strength = |z| / max_z).
