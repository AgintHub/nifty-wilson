      \ CollectCurrentOpensslSourceOutput, setup_static_analysis_environment_input:\
      \ SetupStaticAnalysisEnvironmentOutput, **kwargs) -> RunStaticAnalysisOutput:\n\
      \    \"\"\"Perform static analysis on the OpenSSL source code.\n\n    Args:\n\
