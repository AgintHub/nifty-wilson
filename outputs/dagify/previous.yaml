      \        test_binary_path=setup_dynamic_testing_environment_input.test_binary_path\n\
      \    )\n    \n    if not validation_result:\n        log_environment_error(error=\"\
      Environment validation failed\")\n        return RunDynamicTestsOutput(\n  \
      \          total_tests_run=0,\n            tests_passed=0,\n            tests_failed=0,\n\
      \            crash_count=0,\n            failed_test_cases=\"Environment setup\
      \ failed\",\n            crash_logs=\"\",\n            test_summary=\"Test execution\
      \ aborted due to environment issues\"\n        )\n    \n    # Navigate to source\
      \ root directory\n    working_directory: str = change_directory_to_source_root(\n\
      \        clone_path=collect_current_openssl_source_input.clone_path\n    )\n\
      \    \n    # Execute test suite and capture output\n    test_execution_result:\
      \ dict = execute_test_binary(\n        test_binary_path=setup_dynamic_testing_environment_input.test_binary_path,\n\
      \        working_directory=working_directory\n    )\n    \n    # Parse test\
      \ output for counts and results\n    test_counts: dict = parse_test_output(\n\
      \        stdout_content=test_execution_result[\"stdout\"],\n        stderr_content=test_execution_result[\"\
      stderr\"]\n    )\n    \n    # Aggregate failed test cases\n    failed_tests:\
      \ list = extract_failed_test_cases(\n        test_output=test_execution_result[\"\
      stdout\"]\n    )\n    \n    # Collect crash logs\n    crash_log_excerpts: list\
      \ = extract_crash_logs(\n        stderr_content=test_execution_result[\"stderr\"\
      ]\n    )\n    \n    # Generate test summary\n    summary: str = generate_test_summary(\n\
      \        total_tests=test_counts[\"total\"],\n        passed_tests=test_counts[\"\
      passed\"],\n        failed_tests=test_counts[\"failed\"],\n        crash_count=test_counts[\"\
      crashes\"]\n    )\n    \n    return RunDynamicTestsOutput(\n        total_tests_run=test_counts[\"\
      total\"],\n        tests_passed=test_counts[\"passed\"],\n        tests_failed=test_counts[\"\
      failed\"],\n        crash_count=test_counts[\"crashes\"],\n        failed_test_cases=\"\
