      \    \n    # Log summary for auditability\n    log_rule_generation_summary(strategy=strategy,\
      \ rules=finalized_rules, count=rule_count, has_stop_loss=has_stop_loss)\n  \
      \  \n    return DefineRiskManagementRulesOutput(\n        risk_management_rules=finalized_rules,\n\
      \        rule_count=rule_count,\n        has_stop_loss=has_stop_loss\n    )"
