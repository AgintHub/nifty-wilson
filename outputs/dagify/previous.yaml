      \    clone_success: bool = Field(..., description=\"True if the clone operation\
      \ completed without errors, otherwise False.\")\n\n\nclass SetupDynamicTestingEnvironmentOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for setup_dynamic_testing_environment node outputs.\"\
      \"\"\n    environment_setup_success: bool = Field(..., description=\"Indicates\
