dag_type: plain_text
description: A step‑by‑step, highly concurrent workflow that creates a sophisticated
  market‑neutral equity quant strategy targeting a high Sharpe ratio. It covers objective
  definition, data acquisition, cleaning, factor construction, model training, portfolio
  optimization, backtesting, performance evaluation, robustness checks, execution
  design, risk monitoring and final documentation.
name: build_market_neutral_equity_strategy
nodes:
  align_data_frequencies:
    agent: false
    description: Merge cleaned price, fundamentals and alternative data onto a common
      daily timeline.
    name: align_data_frequencies
    nodes_depended_on:
    - clean_price_data
    - clean_fundamental_data
    - clean_alternative_data
    nodes_dependent_on: []
    prompt: Join the three cleaned CSV files on date and ticker, forward‑filling the
      quarterly fundamentals to daily rows and retaining daily sentiment/ESG. Output
      a single CSV containing all fields.
  build_predictive_model:
    agent: false
    description: Train a machine‑learning model (e.g., Gradient Boosting) to forecast
      next‑day returns using all signals.
    name: build_predictive_model
    nodes_depended_on:
    - compute_factor_exposures
    - perform_signal_exploration
    nodes_dependent_on: []
    prompt: Using the merged dataset (log_ret and all factor, fundamental, sentiment,
      ESG columns), split the data into training (first 70%) and validation (last
      30%). Train a Gradient Boosting Regressor to predict next‑day log_ret. Output
      model hyperparameters and validation RMSE.
  clean_alternative_data:
    agent: false
    description: Impute missing sentiment/ESG values and cap extreme scores.
    name: clean_alternative_data
    nodes_depended_on:
    - fetch_alternative_data
    nodes_dependent_on: []
    prompt: For the alternative data CSV, linearly interpolate missing sentiment scores,
      replace missing ESG ratings with the median grade, and clip sentiment to [-0.95,
      0.95]. Return the cleaned CSV.
  clean_fundamental_data:
    agent: false
    description: Standardize quarterly fundamentals, fill gaps, and align dates to
      trading days.
    name: clean_fundamental_data
    nodes_depended_on:
    - fetch_fundamental_data
    nodes_dependent_on: []
    prompt: 'Process the fundamentals CSV: forward‑fill missing quarterly values,
      convert dates to the nearest trading day, and drop rows with impossible values
      (e.g., negative book value). Return the cleaned CSV.'
  clean_price_data:
    agent: false
    description: Handle missing values, corporate actions and outliers in the raw
      price series.
    name: clean_price_data
    nodes_depended_on:
    - fetch_price_data
    nodes_dependent_on: []
    prompt: Inspect the price CSV, forward‑fill missing prices, adjust for splits/dividends,
      and remove rows where volume is zero. Return a cleaned CSV with the same columns.
  compile_strategy_documentation:
    agent: false
    description: Produce a concise strategy whitepaper that summarizes objectives,
      data pipeline, model, optimization, backtest results, execution and risk controls.
    name: compile_strategy_documentation
    nodes_depended_on:
    - define_investment_objectives
    - define_asset_universe
    - construct_factor_library
    - build_predictive_model
    - evaluate_performance_metrics
    - conduct_robustness_analysis
    - design_execution_algorithm
    - outline_risk_monitoring_framework
    nodes_dependent_on: []
    prompt: 'Write a 2‑page strategy document covering: (1) objectives, (2) asset
      universe, (3) data sources and cleaning, (4) factor & model description, (5)
      optimization formulation, (6) backtest performance table (include Sharpe, max
      drawdown), (7) robustness summary, (8) execution plan, (9) risk monitoring.
      Use headings and bullet points only; no prose paragraphs longer than three sentences.'
  compute_daily_returns:
    agent: false
    description: Calculate log returns for each ticker from the aligned price data.
    name: compute_daily_returns
    nodes_depended_on:
    - align_data_frequencies
    nodes_dependent_on: []
    prompt: From the merged CSV, compute the daily log return using the close price.
      Append a column named 'log_ret' and output the updated CSV.
  compute_factor_exposures:
    agent: false
    description: Estimate each ticker's exposure to the constructed factors on each
      day.
    name: compute_factor_exposures
    nodes_depended_on:
    - construct_factor_library
    - align_data_frequencies
    nodes_dependent_on: []
    prompt: Merge the factor library with the daily returns CSV, ensuring matching
      date‑ticker rows. Output a CSV containing date, ticker, log_ret, and the five
      factor columns.
  conduct_robustness_analysis:
    agent: false
    description: Perform out‑of‑sample, Monte‑Carlo and stress‑test checks on the
      strategy performance.
    name: conduct_robustness_analysis
    nodes_depended_on:
    - run_backtest
    - evaluate_performance_metrics
    nodes_dependent_on: []
    prompt: 'Carry out three robustness tests: (1) rolling 2‑year out‑of‑sample Sharpe,
      (2) 1000 Monte‑Carlo resamples of daily returns to obtain Sharpe confidence
      interval, (3) apply a 30% market shock to all returns and compute new max drawdown.
      Summarize findings in bullet points.'
  construct_factor_library:
    agent: false
    description: Create a set of well‑known equity factors (value, momentum, size,
      quality, low‑vol) using the merged dataset.
    name: construct_factor_library
    nodes_depended_on:
    - align_data_frequencies
    nodes_dependent_on: []
    prompt: 'Calculate daily factor scores for: Size (log market cap), Value (BP/PE),
      Momentum (12‑month prior return), Quality (ROE), Low Volatility (rolling 20‑day
      volatility). Produce a CSV with columns: date, ticker, size_factor, value_factor,
      mom_factor, qual_factor, lowvol_factor.'
  define_asset_universe:
    agent: false
    description: Specify the set of tradable equities (e.g., US large‑cap, sector
      filters) that the strategy will consider.
    name: define_asset_universe
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Define an equity asset universe suitable for a market‑neutral strategy.
      List ticker symbols or a rule‑based description (e.g., all stocks in the S&P
      500 with average daily volume > 1M). Limit the description to one concise rule.
  define_investment_objectives:
    agent: false
    description: State the quantitative goals (target Sharpe, market‑neutral exposure,
      max drawdown, turnover limits) and risk constraints for the strategy.
    name: define_investment_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the core investment objectives for a market‑neutral equity portfolio,
      including target annual Sharpe ratio, maximum gross and net exposure, turnover
      limit (% per month), and maximum drawdown limit (%). Provide only the list,
      no commentary.
  design_execution_algorithm:
    agent: false
    description: Specify a realistic trade execution tactic (e.g., VWAP with participation
      limits) to implement the daily optimal weights.
    name: design_execution_algorithm
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Draft a concise execution algorithm: split the target daily weight changes
      into 5 minute slices, each executed as a VWAP order not exceeding 10% of average
      daily volume, with a price‑improvement cap of 5 bps. Provide only the algorithm
      steps.'
  develop_backtest_engine:
    agent: false
    description: Create a walk‑forward backtesting loop that applies the predictive
      model and optimization each day.
    name: develop_backtest_engine
    nodes_depended_on:
    - build_predictive_model
    - align_data_frequencies
    nodes_dependent_on: []
    prompt: 'Describe a backtesting algorithm that, for each day: (1) trains the model
      on all data up to the prior day, (2) generates expected returns for the day,
      (3) solves the optimization defined above, (4) records portfolio weights and
      returns. Output pseudocode steps only.'
  estimate_covariance_matrix:
    agent: false
    description: Compute the daily excess return covariance matrix across the universe
      for risk modeling.
    name: estimate_covariance_matrix
    nodes_depended_on:
    - compute_daily_returns
    nodes_dependent_on: []
    prompt: 'Using the log_ret column, calculate the sample covariance matrix of returns
      over a rolling 252‑day window. Return the matrix in JSON format: {"ticker1":
      {"ticker1": value, "ticker2": value, ...}, ...}.'
  evaluate_performance_metrics:
    agent: false
    description: Calculate Sharpe ratio, max drawdown, annualized return, turnover,
      and factor exposure statistics from the backtest output.
    name: evaluate_performance_metrics
    nodes_depended_on:
    - run_backtest
    nodes_dependent_on: []
    prompt: 'From the backtest CSV, compute: annualized return (%), annualized volatility
      (%), Sharpe ratio (using risk‑free 0), maximum drawdown (%), average monthly
      turnover (%), and average factor exposure (absolute value). Present results
      in a markdown table.'
  fetch_alternative_data:
    agent: false
    description: Gather non‑price signals such as sentiment scores and ESG ratings.
    name: fetch_alternative_data
    nodes_depended_on:
    - select_data_providers
    nodes_dependent_on: []
    prompt: 'Retrieve daily alternative data for each ticker, including a sentiment
      score (range -1 to 1) and an ESG rating (A‑F). Provide a CSV with columns: date,
      ticker, sentiment, ESG.'
  fetch_fundamental_data:
    agent: false
    description: Collect quarterly fundamental statements and key ratios for each
      ticker.
    name: fetch_fundamental_data
    nodes_depended_on:
    - select_data_providers
    nodes_dependent_on: []
    prompt: 'From the chosen fundamentals provider, obtain quarterly values for earnings
      per share, book value, cash flow, debt/equity, and price‑to‑earnings for every
      ticker in the asset universe over the past ten years. Present as a CSV with
      columns: date, ticker, EPS, Book, CashFlow, D/E, PE.'
  fetch_price_data:
    agent: false
    description: Download daily OHLCV price history for every ticker in the universe.
    name: fetch_price_data
    nodes_depended_on:
    - select_data_providers
    nodes_dependent_on: []
    prompt: 'Using the selected price data provider, retrieve daily open, high, low,
      close, and volume for each ticker in the asset universe covering the last ten
      years. Return the data as a CSV table with columns: date, ticker, open, high,
      low, close, volume.'
  outline_risk_monitoring_framework:
    agent: false
    description: Define real‑time risk metrics and alerts to ensure ongoing market‑neutrality
      and exposure limits.
    name: outline_risk_monitoring_framework
    nodes_depended_on:
    - define_investment_objectives
    nodes_dependent_on: []
    prompt: 'List the daily risk checks: net market exposure, factor exposure drift,
      VaR exceedance, turnover breach, concentration limit. For each, specify the
      threshold and the alert action (e.g., rebalance, halt trading). Output as a
      markdown table.'
  perform_signal_exploration:
    agent: false
    description: Run cross‑sectional regressions to assess predictive power of each
      factor and alternative signal.
    name: perform_signal_exploration
    nodes_depended_on:
    - compute_factor_exposures
    - compute_daily_returns
    nodes_dependent_on: []
    prompt: For each trading day, regress the cross‑section of log_ret against the
      five factor scores plus sentiment and ESG. Report the average t‑stat and R²
      across all days in a concise table.
  refine_model_hyperparameters:
    agent: false
    description: Iterate on the predictive model’s hyperparameters using the evaluation
      and robustness results to improve Sharpe.
    name: refine_model_hyperparameters
    nodes_depended_on:
    - evaluate_performance_metrics
    - conduct_robustness_analysis
    nodes_dependent_on: []
    prompt: Based on the performance and robustness outputs, suggest one adjustment
      to the Gradient Boosting hyperparameters (e.g., learning rate, max depth) that
      would likely increase out‑of‑sample Sharpe. Provide the revised hyperparameter
      values only.
  run_backtest:
    agent: false
    description: Execute the backtesting engine over the full historical period and
      capture daily portfolio performance.
    name: run_backtest
    nodes_depended_on:
    - develop_backtest_engine
    nodes_dependent_on: []
    prompt: 'Run the described backtest (assume all data available) and produce a
      CSV with columns: date, portfolio_return, cumulative_return, turnover, net_exposure,
      factor_neutrality_metric. Provide only the column headers and a short note confirming
      execution.'
  select_data_providers:
    agent: false
    description: Identify reliable sources for price, fundamental and alternative
      data for the chosen universe.
    name: select_data_providers
    nodes_depended_on:
    - define_asset_universe
    nodes_dependent_on: []
    prompt: List three data providers (one for price data, one for fundamentals, one
      for alternative data) that cover the defined asset universe. Provide only the
      provider names and the type of data supplied.
