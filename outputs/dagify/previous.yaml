    nodes_dependent_on:
    - compile_chapters
    prompt: Edit the text of Chapter 8 for clarity, consistency, grammar, and flow.
      Preserve the quantum explanation. Return a revised version.
  edit_chapter_9:
    agent: false
    description: Revise Chapter 9.
    name: edit_chapter_9
    nodes_depended_on:
    - write_chapter_9
    nodes_dependent_on:
    - compile_chapters
    prompt: Edit the text of Chapter 9 for clarity, consistency, grammar, and flow.
      Preserve the quantum explanation. Return a revised version.
  generate_cover:
    agent: false
    description: Create cover design.
    name: generate_cover
    nodes_depended_on:
    - define_novel_title
    - compile_chapters
    nodes_dependent_on:
    - assemble_final_novel
    prompt: Design a cover for the novel. Provide the title, author placeholder, and
      a visual concept that fuses Disneyworld imagery with quantum symbolism. Describe
      layout and color scheme.
  outline_novel:
    agent: false
    description: Generate chapter outlines.
    name: outline_novel
    nodes_depended_on:
    - define_novel_title
    nodes_dependent_on:
    - develop_characters
    - design_disneyworld_settings
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    - write_chapter_4
    - write_chapter_5
    - write_chapter_6
    - write_chapter_7
    - write_chapter_8
    - write_chapter_9
    - write_chapter_10
    prompt: Create a detailed outline for a ten‑chapter novel. For each chapter, list
      a brief description, key plot points, and how quantum mechanics is introduced
      in a Disneyworld setting.
  research_quantum_mechanics:
    agent: false
    description: Provide quantum concept explanations.
    name: research_quantum_mechanics
    nodes_depended_on: []
    nodes_dependent_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    - write_chapter_4
    - write_chapter_5
    - write_chapter_6
    - write_chapter_7
    - write_chapter_8
    - write_chapter_9
    - write_chapter_10
    prompt: Summarize key quantum mechanics concepts (superposition, entanglement,
      uncertainty principle, quantum tunneling, decoherence) in layman's terms, suitable
      for inclusion in a novel.
  write_chapter_1:
    agent: false
    description: Draft Chapter 1.
    name: write_chapter_1
    nodes_depended_on:
    - outline_novel
    - develop_characters
    - design_disneyworld_settings
    - research_quantum_mechanics
    nodes_dependent_on:
    - edit_chapter_1
    prompt: Write Chapter 1 of the novel (≈2000 words). Follow the outline, introduce
      the protagonist, set the Disneyworld scene, and explain a quantum concept in
      an engaging way.
  write_chapter_10:
    agent: false
    description: Draft Chapter 10.
    name: write_chapter_10
    nodes_depended_on:
