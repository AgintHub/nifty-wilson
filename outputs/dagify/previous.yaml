dag_type: plain_text
description: A workflow that generates a ten‑chapter novel combining quantum mechanics
  concepts with Disneyworld adventures, from title creation to final manuscript assembly.
name: write_quantum_mechanics_disneyworld_novel
nodes:
  assemble_final_novel:
    agent: false
    description: Compile the final manuscript.
    name: assemble_final_novel
    nodes_depended_on:
    - compile_chapters
    - generate_cover
    nodes_dependent_on: []
    prompt: Create the final manuscript in markdown format. Include the cover, table
      of contents, and Chapters 1‑10.
  compile_chapters:
    agent: false
    description: Assemble all chapters into one manuscript.
    name: compile_chapters
    nodes_depended_on:
    - edit_chapter_1
    - edit_chapter_2
    - edit_chapter_3
    - edit_chapter_4
    - edit_chapter_5
    - edit_chapter_6
    - edit_chapter_7
    - edit_chapter_8
    - edit_chapter_9
    - edit_chapter_10
    nodes_dependent_on:
    - generate_cover
    - assemble_final_novel
    prompt: Combine the edited Chapter 1 through 10 into a single document in order,
      preserving chapter headings.
  define_novel_title:
    agent: false
    description: Create the novel title.
    name: define_novel_title
    nodes_depended_on: []
    nodes_dependent_on:
    - outline_novel
    - generate_cover
    prompt: Generate a compelling title for a ten‑chapter novel that blends quantum
      mechanics concepts with Disneyworld adventures.
  design_disneyworld_settings:
    agent: false
    description: Create setting descriptions.
    name: design_disneyworld_settings
    nodes_depended_on:
    - outline_novel
    nodes_dependent_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    - write_chapter_4
    - write_chapter_5
    - write_chapter_6
    - write_chapter_7
    - write_chapter_8
    - write_chapter_9
    - write_chapter_10
    prompt: Map key Disneyworld attractions (e.g., Space Mountain, Pirates of the
      Caribbean) to quantum mechanics concepts (e.g., superposition, entanglement).
      Provide setting descriptions and how they relate to the story.
  develop_characters:
    agent: false
    description: Define characters.
    name: develop_characters
    nodes_depended_on:
    - outline_novel
    nodes_dependent_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    - write_chapter_4
    - write_chapter_5
    - write_chapter_6
    - write_chapter_7
    - write_chapter_8
    - write_chapter_9
    - write_chapter_10
    prompt: List main characters including protagonist, antagonist, supporting roles,
      and Disneyworld personalities. Provide brief descriptions, motivations, and
      roles in advancing quantum themes.
  edit_chapter_1:
    agent: false
    description: Revise Chapter 1.
    name: edit_chapter_1
    nodes_depended_on:
    - write_chapter_1
    nodes_dependent_on:
    - compile_chapters
    prompt: Edit the text of Chapter 1 for clarity, consistency, grammar, and flow.
      Preserve the quantum explanation. Return a revised version.
  edit_chapter_10:
    agent: false
    description: Revise Chapter 10.
    name: edit_chapter_10
    nodes_depended_on:
    - write_chapter_10
    nodes_dependent_on:
    - compile_chapters
    prompt: Edit the text of Chapter 10 for clarity, consistency, grammar, and flow.
      Preserve the quantum explanation. Return a revised version.
  edit_chapter_2:
    agent: false
    description: Revise Chapter 2.
    name: edit_chapter_2
    nodes_depended_on:
    - write_chapter_2
    nodes_dependent_on:
    - compile_chapters
    prompt: Edit the text of Chapter 2 for clarity, consistency, grammar, and flow.
      Preserve the quantum explanation. Return a revised version.
  edit_chapter_3:
    agent: false
    description: Revise Chapter 3.
    name: edit_chapter_3
