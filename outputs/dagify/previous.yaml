dag_type: plain_text
description: A highly concurrent workflow that constructs a detailed, multi‑level
  pathophysiology for a chosen disease or condition, from anatomy and baseline physiology
  through molecular, cellular, systemic mechanisms, and produces a narrative and schematic
  diagram.
name: assemble_complex_pathophysiology
nodes:
  collect_environmental_factors:
    agent: false
    description: Identify key environmental or lifestyle contributors.
    name: collect_environmental_factors
    nodes_depended_on:
    - define_target_condition
    nodes_dependent_on: []
    prompt: List up to eight environmental or lifestyle risk factors (e.g., smoking,
      high‑salt diet) with a concise impact phrase.
  collect_genetic_factors:
    agent: false
    description: Identify major genetic variants or heritable traits linked to the
      disease.
    name: collect_genetic_factors
    nodes_depended_on:
    - define_target_condition
    nodes_dependent_on: []
    prompt: Provide up to eight genetic factors (genes or polymorphisms) known to
      influence susceptibility or progression. Include a one‑line functional note.
  create_diagram_specification:
    agent: false
    description: Define the visual schematic requirements for the pathophysiology
      diagram.
    name: create_diagram_specification
    nodes_depended_on:
    - map_key_pathways
    - identify_feedback_loops
    nodes_dependent_on: []
    prompt: 'Outline a diagram layout: list main boxes (e.g., Genetic Factors, Molecular
      Cascade, Cellular Response, Systemic Outcome) and arrows connecting them, indicating
      direction and loop symbols. Provide the specification in plain text.'
  define_target_condition:
    agent: false
    description: Select the specific disease/condition for which the pathophysiology
      will be built.
    name: define_target_condition
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Choose one disease or clinical condition (e.g., chronic heart failure,
      type 2 diabetes) and state its common name and ICD‑10 code. Provide no additional
      detail.
  draft_pathophysiology_narrative:
    agent: false
    description: Compose a comprehensive, paragraph‑style narrative that weaves together
      all levels of pathophysiology.
    name: draft_pathophysiology_narrative
    nodes_depended_on:
    - integrate_molecular_cellular
    - integrate_systemic
    - map_key_pathways
    - identify_feedback_loops
    nodes_dependent_on: []
    prompt: Write a 600‑word narrative describing the disease progression, starting
      with genetic/environmental triggers, moving through molecular/cellular changes,
      and ending with systemic clinical consequences. Incorporate the feedback loops
      where relevant.
  finalize_pathophysiology_document:
    agent: false
    description: Assemble the final document containing the narrative, diagram, and
      a brief reference list.
    name: finalize_pathophysiology_document
    nodes_depended_on:
    - review_for_accuracy
    nodes_dependent_on: []
    prompt: Combine the narrative, the ASCII diagram, and a list of up to ten primary
      literature references (title only) into a single markdown document. Add a heading
      "Pathophysiology of <Condition>" at the top.
  gather_cellular_mechanisms:
    agent: false
    description: Collect cellular‑level dysfunctions (e.g., apoptosis, hypertrophy).
    name: gather_cellular_mechanisms
    nodes_depended_on:
    - define_target_condition
    nodes_dependent_on: []
    prompt: Identify up to ten cellular processes that become abnormal in the disease.
      For each, give a one‑sentence impact statement.
  gather_molecular_mechanisms:
    agent: false
    description: Collect key molecular pathways and signaling events altered in the
      condition.
    name: gather_molecular_mechanisms
    nodes_depended_on:
    - define_target_condition
    nodes_dependent_on: []
    prompt: List up to fifteen molecular mechanisms (e.g., receptor activation, enzyme
      deficiency, gene expression change) that are documented contributors to the
      disease. Provide a brief (≤10‑word) description for each.
  gather_systemic_mechanisms:
    agent: false
    description: Collect organ‑system and whole‑body alterations (e.g., neuro‑humoral
      activation).
    name: gather_systemic_mechanisms
    nodes_depended_on:
    - define_target_condition
    nodes_dependent_on: []
    prompt: List up to twelve systemic pathophysiological changes associated with
      the condition, each with a brief (≤12‑word) description.
  generate_diagram:
    agent: false
    description: Produce a textual diagram (ASCII/markdown) based on the specification.
    name: generate_diagram
    nodes_depended_on:
    - create_diagram_specification
    nodes_dependent_on: []
    prompt: Using the specification, draw a simple ASCII/markdown flow diagram that
      visually represents the integrated pathophysiology. Include labels and arrow
      symbols.
  identify_feedback_loops:
    agent: false
    description: Detect positive and negative feedback loops within the integrated
      pathways.
    name: identify_feedback_loops
    nodes_depended_on:
    - map_key_pathways
    nodes_dependent_on: []
    prompt: From the pathways listed, write two bullet points describing one positive
      feedback loop and one negative feedback loop, specifying the initiating event
      and the looped effect.
  integrate_molecular_cellular:
    agent: false
    description: Combine molecular and cellular mechanisms into a unified cascade.
    name: integrate_molecular_cellular
    nodes_depended_on:
    - gather_molecular_mechanisms
    - gather_cellular_mechanisms
    nodes_dependent_on: []
    prompt: Create a numbered flowchart (1‑N) linking each molecular mechanism to
      the downstream cellular effect(s) it triggers. Use arrows (->) to indicate direction.
  integrate_systemic:
    agent: false
    description: Map how anatomical structures, baseline physiology, and systemic
      mechanisms interact.
    name: integrate_systemic
    nodes_depended_on:
    - list_core_anatomical_structures
    - list_baseline_physiology
    - gather_systemic_mechanisms
    nodes_dependent_on: []
    prompt: 'Produce a table with columns: Anatomical Structure | Normal Physiology
      | Altered Systemic Effect. Fill rows for each structure using information from
      the prior steps.'
  list_baseline_physiology:
    agent: false
    description: Summarize normal physiological functions of the identified structures.
    name: list_baseline_physiology
    nodes_depended_on:
    - list_core_anatomical_structures
    nodes_dependent_on: []
    prompt: For each anatomical structure listed previously, write one concise sentence
      describing its normal physiological role. Use the same order as the list.
  list_core_anatomical_structures:
    agent: false
    description: Identify the primary organs, tissues, and cells directly involved
      in the chosen condition.
    name: list_core_anatomical_structures
    nodes_depended_on:
    - define_target_condition
    nodes_dependent_on: []
    prompt: Based on the selected condition, list up to ten relevant anatomical structures
      (organs, tissues, cell types). Return each item as a bullet point.
  map_key_pathways:
    agent: false
    description: Identify and enumerate the central pathophysiological pathways spanning
      molecular, cellular, and systemic levels.
    name: map_key_pathways
    nodes_depended_on:
    - integrate_molecular_cellular
    - integrate_systemic
    - collect_genetic_factors
    - collect_environmental_factors
    nodes_dependent_on: []
    prompt: Synthesize a list of up to six overarching pathways (e.g., insulin resistance
      → hyperglycemia → microvascular damage). For each, cite the contributing molecular,
      cellular, genetic, and environmental elements in parentheses.
  review_for_accuracy:
    agent: false
    description: Cross‑check narrative and diagram for consistency and completeness.
    name: review_for_accuracy
    nodes_depended_on:
    - draft_pathophysiology_narrative
    - generate_diagram
    nodes_dependent_on: []
    prompt: Compare the narrative and diagram line‑by‑line. List any mismatches or
      missing elements as bullet points. If none, state "All elements consistent."
