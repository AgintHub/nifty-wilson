dag_type: plain_text
description: Workflow with linear projections decomposed into parallel Q/K/V steps,
  then joined for attention scoring
name: parallel_self_attention_heads_split_projections
nodes:
  attention_head_1_score:
    agent: false
    description: Calculate attention scores for head 1
    name: attention_head_1_score
    nodes_depended_on:
    - q_projection
    - k_projection
    nodes_dependent_on:
    - softmax_weighted_sum_head_1
    prompt: "For each pair of tokens in the input JSON array:\n\n  - Compute dot product\
      \ between `q_proj` and `k_proj` for head 1\n  \n  - Scale scores by sqrt(dimension\
      \ of projections)\n  \n  - Add new field `attn_scores_head_1` with attention\
      \ score matrix\n  \n  Preserve all existing fields."
  attention_head_2_score:
    agent: false
    description: Calculate attention scores for head 2
    name: attention_head_2_score
    nodes_depended_on:
    - q_projection
    - k_projection
    nodes_dependent_on:
    - softmax_weighted_sum_head_2
    prompt: "For each pair of tokens in the input JSON array:\n\n  - Compute dot product\
      \ between `q_proj` and `k_proj` for head 2\n  \n  - Scale scores by sqrt(dimension\
      \ of projections)\n  \n  - Add new field `attn_scores_head_2` with attention\
      \ score matrix\n  \n  Preserve all existing fields."
  k_projection:
    agent: false
    description: Compute key vector projection
    name: k_projection
    nodes_depended_on:
    - layernorm_pre_normalization
    nodes_dependent_on:
    - attention_head_1_score
    - attention_head_2_score
    prompt: "For each token:\n\n  - Compute linear projection from `layernorm` for\
      \ keys\n  \n  - Add new field `k_proj` with resulting vector\n  \n  Preserve\
      \ other fields. Output updated JSON array."
  layernorm_pre_normalization:
    agent: false
    description: Apply layer normalization across blocks 1-5
    name: layernorm_pre_normalization
    nodes_depended_on:
    - token_positional_info
    - transformer_block_5
    nodes_dependent_on:
    - q_projection
    - k_projection
    - v_projection
    prompt: "For each token in the JSON array from prior blocks:\n\n  For fields `block1`\
      \ to `block5`:\n\n  - Map string values to numeric: 1 for processed/true/validated/finalized/complete,\
      \ 0 otherwise\n  \n  - Normalize numeric values across fields using layer normalization\n\
      \  \n  - Add new field `layernorm` with normalized value\n  \n  Output updated\
      \ JSON array."
  multi_head_attention:
    agent: false
    description: Combine outputs from multiple attention heads
    name: multi_head_attention
    nodes_depended_on:
    - softmax_weighted_sum_head_1
    - softmax_weighted_sum_head_2
    nodes_dependent_on: []
    prompt: "For each token in the input JSON array:\n\n  - Concatenate `weighted_vals_head_1`\
      \ and `weighted_vals_head_2`\n  \n  - Apply final linear projection on the concatenated\
      \ result\n  \n  - Add new field `block6` with attention-aggregated numeric value\n\
      \  \n  - Output final JSON array with `block6` indicating 1.0 for prioritized\
      \ tokens or 0.5 for others."
  q_projection:
    agent: false
    description: Compute query vector projection
    name: q_projection
    nodes_depended_on:
    - layernorm_pre_normalization
    nodes_dependent_on:
    - attention_head_1_score
    - attention_head_2_score
    prompt: "For each token:\n\n  - Compute linear projection from `layernorm` for\
      \ queries\n  \n  - Add new field `q_proj` with resulting vector\n  \n  Preserve\
      \ other fields. Output updated JSON array."
  softmax_weighted_sum_head_1:
    agent: false
    description: Apply softmax to head 1 attention scores and multiply with values
    name: softmax_weighted_sum_head_1
    nodes_depended_on:
    - attention_head_1_score
    - v_projection
    nodes_dependent_on:
    - multi_head_attention
    prompt: "For each token in the input JSON array:\n\n  - Apply softmax to `attn_scores_head_1`\
      \ dimension\n  \n  - Multiply resulting weights with `v_proj` vectors for head\
      \ 1\n  \n  - Add new field `weighted_vals_head_1` with resulting vectors\n \
      \ \n  Preserve all fields."
  softmax_weighted_sum_head_2:
    agent: false
    description: Apply softmax to head 2 attention scores and multiply with values
    name: softmax_weighted_sum_head_2
    nodes_depended_on:
    - attention_head_2_score
    - v_projection
    nodes_dependent_on:
    - multi_head_attention
    prompt: "For each token in the input JSON array:\n\n  - Apply softmax to `attn_scores_head_2`\
      \ dimension\n  \n  - Multiply resulting weights with `v_proj` vectors for head\
      \ 2\n  \n  - Add new field `weighted_vals_head_2` with resulting vectors\n \
      \ \n  Preserve all fields."
  token_positional_info:
    agent: false
    description: Generate token objects with positional information
    name: token_positional_info
    nodes_depended_on:
    - tokenizer_customization
    nodes_dependent_on:
    - transformer_block_1
    - transformer_block_2
    - transformer_block_3
    - transformer_block_4
    - transformer_block_5
    - layernorm_pre_normalization
    prompt: Using the tokenizer configuration code, apply tokenizer to 'Hello world!'
      and 'Hello world'. For each token, provide start and end character positions.
      Return JSON array with 'token', 'start', 'end', and 'context' ("prompt" or "output").
  tokenizer_customization:
    agent: false
    description: Generate tokenizer configuration code for single letters/words
    name: tokenizer_customization
    nodes_depended_on: []
    nodes_dependent_on:
    - token_positional_info
    prompt: Customize tokenizer to recognize single alphabetic letters (a-z, case-insensitive)
      or full English words. Provide final configuration code/regex.
  transformer_block_1:
    agent: false
    description: Add transformer block 1 completion status flag
    name: transformer_block_1
    nodes_depended_on:
    - token_positional_info
    nodes_dependent_on:
    - transformer_block_2
    prompt: Add 'block1' field set to 'processed' to each token in JSON array.
  transformer_block_2:
    agent: false
    description: Add transformer block 2 processing status flag
    name: transformer_block_2
    nodes_depended_on:
    - token_positional_info
    - transformer_block_1
    nodes_dependent_on:
    - transformer_block_3
    prompt: Add 'block2' field set to 'true' to each token in JSON array.
  transformer_block_3:
    agent: false
    description: Add transformer block 3 validation status flag
    name: transformer_block_3
    nodes_depended_on:
    - token_positional_info
    - transformer_block_1
    - transformer_block_2
    nodes_dependent_on:
    - transformer_block_4
    prompt: Add 'block3' field set to 'validated' to each token in JSON array.
  transformer_block_4:
    agent: false
    description: Add transformer block 4 finalization status flag
    name: transformer_block_4
    nodes_depended_on:
    - token_positional_info
    - transformer_block_1
    - transformer_block_2
    - transformer_block_3
    nodes_dependent_on:
    - transformer_block_5
    prompt: Add 'block4' field set to 'finalized' to each token in JSON array.
  transformer_block_5:
    agent: false
    description: Add transformer block 5 completion status flag
    name: transformer_block_5
    nodes_depended_on:
    - token_positional_info
    - transformer_block_1
    - transformer_block_2
    - transformer_block_3
    - transformer_block_4
    nodes_dependent_on:
    - layernorm_pre_normalization
    prompt: Add 'block5' field set to 'complete' to each token in JSON array.
  v_projection:
    agent: false
    description: Compute value vector projection
    name: v_projection
    nodes_depended_on:
    - layernorm_pre_normalization
    nodes_dependent_on:
    - softmax_weighted_sum_head_1
    - softmax_weighted_sum_head_2
    prompt: "For each token:\n\n  - Compute linear projection from `layernorm` for\
      \ values\n  \n  - Add new field `v_proj` with resulting vector\n  \n  Preserve\
      \ other fields. Output updated JSON array."
