      \    \n    return ReRunStaticAnalysisOutput(\n        warnings_count=total_warnings,\n\
      \        errors_count=total_errors,\n        security_findings=security_findings_str,\n\
      \        analysis_passed=analysis_passed,\n        report_path=report_file_path\n\
