      \ CollectCurrentOpensslSourceOutput, setup_dynamic_testing_environment_input:\
      \ SetupDynamicTestingEnvironmentOutput, **kwargs) -> RunDynamicTestsOutput:\n\
      \    \"\"\"Execute dynamic tests on the OpenSSL source code.\n\n    Args:\n\
