    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass GenerateSecurityReportOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for generate_security_report node outputs.\"\"\"\n    identified_issues: str\
      \ = Field(..., description=\"List of identified security issues, including CVE\
