    name: analyze_immunorenal_glomerular_function
    nodes_depended_on:
    - detail_immune_pathophysiology
    - detail_renal_pathophysiology
    nodes_dependent_on: []
    prompt: Analyze immune-mediated glomerular diseases including complement activation,
      immune complex deposition, and autoimmune glomerulonephritis.
  analyze_immunorenal_inflammatory_responses:
    agent: false
    description: Analyze inflammatory responses in kidney disease
    name: analyze_immunorenal_inflammatory_responses
    nodes_depended_on:
    - detail_immune_pathophysiology
    - detail_renal_pathophysiology
    nodes_dependent_on: []
