dag_type: plain_text
description: A workflow for creating a 12-chapter bildungsroman story where the protagonist
  wins a boxing match using the principles of quantum mechanics.
name: quantum_rocky_story
nodes:
  compile_final_story:
    agent: false
    description: Compile the 12 chapters into a final story.
    name: compile_final_story
    nodes_depended_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    - write_chapter_4
    - write_chapter_5
    - write_chapter_6
    - write_chapter_7
    - write_chapter_8
    - write_chapter_9
    - write_chapter_10
    - write_chapter_11
    - write_chapter_12
    nodes_dependent_on: []
    prompt: Assemble the final story by combining the 12 chapters into a coherent
      narrative.
  create_boxing_match_scenario:
    agent: false
    description: Design the boxing match scenario where quantum mechanics is applied.
    name: create_boxing_match_scenario
    nodes_depended_on:
    - outline_quantum_mechanics_principles
    - develop_protagonist_profile
    nodes_dependent_on: []
    prompt: Describe the boxing match scenario, including how the protagonist uses
      quantum mechanics to gain an advantage.
  define_story_objectives:
    agent: false
    description: Define the core objectives and themes of the story.
    name: define_story_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: State the primary themes and objectives for the 12-chapter bildungsroman
      story. Focus on the protagonist's journey and the role of quantum mechanics
      in the boxing match.
  develop_protagonist_profile:
    agent: false
    description: Create a detailed profile of the protagonist.
    name: develop_protagonist_profile
    nodes_depended_on:
    - define_story_objectives
    nodes_dependent_on: []
    prompt: Based on the story objectives, develop a detailed profile of the protagonist,
      including background, motivations, and boxing skills.
  outline_quantum_mechanics_principles:
    agent: false
    description: Outline the principles of quantum mechanics to be used in the story.
    name: outline_quantum_mechanics_principles
    nodes_depended_on:
    - define_story_objectives
    nodes_dependent_on: []
    prompt: List the key principles of quantum mechanics that will be incorporated
      into the story, such as superposition, entanglement, or wave-particle duality.
  write_chapter_1:
    agent: false
    description: Write the first chapter of the story.
    name: write_chapter_1
    nodes_depended_on:
    - develop_protagonist_profile
    nodes_dependent_on: []
    prompt: Write the first chapter introducing the protagonist and setting the stage
      for the story.
  write_chapter_10:
    agent: false
    description: Write the tenth chapter of the story.
    name: write_chapter_10
    nodes_depended_on:
    - write_chapter_9
    nodes_dependent_on: []
    prompt: Continue the protagonist's journey in the tenth chapter, facing new challenges
      or revelations.
  write_chapter_11:
    agent: false
    description: Write the eleventh chapter of the story.
    name: write_chapter_11
    nodes_depended_on:
    - write_chapter_10
    nodes_dependent_on: []
    prompt: In the eleventh chapter, bring the story to a climax, resolving conflicts
      and setting the stage for the conclusion.
  write_chapter_12:
    agent: false
    description: Write the twelfth and final chapter of the story.
    name: write_chapter_12
    nodes_depended_on:
    - write_chapter_11
    nodes_dependent_on: []
    prompt: Conclude the story in the twelfth chapter, tying together the themes and
      the protagonist's development.
  write_chapter_2:
    agent: false
    description: Write the second chapter of the story.
    name: write_chapter_2
    nodes_depended_on:
    - write_chapter_1
    nodes_dependent_on: []
    prompt: Continue the story in the second chapter, developing the protagonist's
      character and introducing the boxing theme.
  write_chapter_3:
    agent: false
    description: Write the third chapter of the story.
    name: write_chapter_3
    nodes_depended_on:
    - write_chapter_2
    nodes_dependent_on: []
    prompt: In the third chapter, introduce the concept of quantum mechanics and its
      relevance to the protagonist's journey.
  write_chapter_4:
    agent: false
    description: Write the fourth chapter of the story.
    name: write_chapter_4
    nodes_depended_on:
    - write_chapter_3
    nodes_dependent_on: []
    prompt: Develop the protagonist's understanding and application of quantum mechanics
      in the fourth chapter.
  write_chapter_5:
    agent: false
    description: Write the fifth chapter of the story.
    name: write_chapter_5
    nodes_depended_on:
    - write_chapter_4
    nodes_dependent_on: []
    prompt: In the fifth chapter, describe the protagonist's training regimen and
      preparation for the boxing match.
  write_chapter_6:
    agent: false
    description: Write the sixth chapter of the story.
    name: write_chapter_6
    nodes_depended_on:
    - write_chapter_5
    nodes_dependent_on: []
    prompt: The sixth chapter should focus on the days leading up to the boxing match,
      building tension and anticipation.
  write_chapter_7:
    agent: false
    description: Write the seventh chapter of the story.
    name: write_chapter_7
    nodes_depended_on:
    - write_chapter_6
    - create_boxing_match_scenario
    nodes_dependent_on: []
    prompt: Describe the boxing match in the seventh chapter, incorporating the quantum
      mechanics principles outlined earlier.
  write_chapter_8:
    agent: false
    description: Write the eighth chapter of the story.
    name: write_chapter_8
    nodes_depended_on:
    - write_chapter_7
    nodes_dependent_on: []
    prompt: In the eighth chapter, explore the aftermath of the boxing match and the
      protagonist's reflections.
  write_chapter_9:
    agent: false
    description: Write the ninth chapter of the story.
    name: write_chapter_9
    nodes_depended_on:
    - write_chapter_8
    nodes_dependent_on: []
    prompt: The ninth chapter should delve into the protagonist's growth and newfound
      understanding of themselves and quantum mechanics.
