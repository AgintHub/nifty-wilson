dag_type: plain_text
description: A workflow for creating a transformer model, including tokenization,
  token embeddings, positional encoding, repeated transformer blocks, and final normalization
  and output projection.
name: transformer_model_workflow
nodes:
  feed_forward_network:
    agent: false
    description: Apply a feed-forward network within a transformer block
    name: feed_forward_network
    nodes_depended_on:
    - second_pre_normalization
    nodes_dependent_on:
    - residual_connection_2
    prompt: Apply a linear expansion, nonlinearity (GELU/SwiGLU/GeGLU), and linear
      projection to the normalized input.
  final_normalization:
    agent: false
    description: Apply final layer normalization after the last transformer block
    name: final_normalization
    nodes_depended_on:
    - repeated_transformer_blocks
    nodes_dependent_on:
    - output_projection
    prompt: Normalize the output of the last transformer block using layer normalization.
  output_projection:
    agent: false
    description: Project the final output to the vocabulary size
    name: output_projection
    nodes_depended_on:
    - final_normalization
    nodes_dependent_on: []
    prompt: Apply a linear projection to map the final output to the vocabulary size,
      optionally tying with input embeddings.
  positional_encoding:
    agent: false
    description: Inject positional information into token embeddings
    name: positional_encoding
    nodes_depended_on:
    - token_embeddings
    nodes_dependent_on:
    - repeated_transformer_blocks
    prompt: Apply positional encoding (absolute/sinusoidal/learned or relative/RoPE/ALiBi)
      to the token embeddings.
  pre_normalization:
    agent: false
    description: Apply layer normalization before self-attention
    name: pre_normalization
    nodes_depended_on:
    - repeated_transformer_blocks
    nodes_dependent_on:
    - self_attention
    prompt: Normalize the input to the self-attention mechanism using layer normalization.
  repeated_transformer_blocks:
    agent: false
    description: Stack multiple transformer blocks
    name: repeated_transformer_blocks
    nodes_depended_on:
    - token_embeddings
    - positional_encoding
    nodes_dependent_on:
    - final_normalization
    prompt: Create N transformer blocks, each consisting of pre-normalization, self-attention,
      residual connection, second pre-normalization, feed-forward network, and another
      residual connection.
  residual_connection_1:
    agent: false
    description: Add residual connection after self-attention
    name: residual_connection_1
    nodes_depended_on:
    - self_attention
    nodes_dependent_on:
    - second_pre_normalization
    prompt: Add the input to the self-attention mechanism to its output.
  residual_connection_2:
    agent: false
    description: Add residual connection after the feed-forward network
    name: residual_connection_2
    nodes_depended_on:
    - feed_forward_network
    nodes_dependent_on: []
    prompt: Add the input to the feed-forward network to its output.
  second_pre_normalization:
    agent: false
    description: Apply layer normalization before the feed-forward network
    name: second_pre_normalization
    nodes_depended_on:
    - residual_connection_1
    nodes_dependent_on:
    - feed_forward_network
    prompt: Normalize the input to the feed-forward network using layer normalization.
  self_attention:
    agent: false
    description: Compute self-attention within a transformer block
    name: self_attention
    nodes_depended_on:
    - pre_normalization
    nodes_dependent_on:
    - residual_connection_1
    prompt: Calculate self-attention using query, key, and value projections, applying
      a causal mask and softmax to obtain attention weights.
  token_embeddings:
    agent: false
    description: Create token embedding matrix
    name: token_embeddings
    nodes_depended_on:
    - tokenization
    nodes_dependent_on:
    - positional_encoding
    - repeated_transformer_blocks
    prompt: Generate a token embedding matrix of shape (vocab_size, d_model) to map
      token IDs to d_model vectors.
  tokenization:
    agent: false
    description: Map text to discrete symbols using a tokenizer
    name: tokenization
    nodes_depended_on: []
    nodes_dependent_on:
    - token_embeddings
    prompt: Apply a tokenizer (BPE/Unigram/SentencePiece) to map input text to token
      IDs.
