  compile_final_strategy_blueprint:
    agent: false
    code_node_type: shim
    description: Synthesizes the refined trading logic, rigorously defined risk‑management
      policies, and the designated asset universe into a single, end‑to‑end blueprint
      ready for implementation, back‑testing, and deployment.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass RefineTradingStrategyOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for refine_trading_strategy node outputs.\"\"\"\n    refined_strategy_summary:\
      \ str = Field(..., description=\"A concise narrative summarizing the refined\
      \ trading strategy, highlighting adjusted parameters, indicator configurations,\
      \ and risk\\u2011management rules.\")\n    parameter_adjustments: str = Field(...,\
      \ description=\"Bullet\\u2011point list detailing each model parameter that\
      \ was changed, including old and new values.\")\n    indicator_adjustments:\
      \ str = Field(..., description=\"Bullet\\u2011point list of technical indicator\
      \ modifications, specifying the indicator name, previous settings, and revised\
      \ settings.\")\n    risk_rule_adjustments: str = Field(..., description=\"Bullet\\\
      u2011point list of risk\\u2011management rule changes (e.g., position sizing,\
      \ stop\\u2011loss/take\\u2011profit levels) with before/after values.\")\n \
      \   reasoning_for_adjustments: str = Field(..., description=\"A thorough explanation\
      \ linking each adjustment to the observed backtest shortcomings and the results\
      \ of the sensitivity analysis.\")\n\n\nclass DefineRiskManagementRulesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_risk_management_rules node outputs.\"\"\
      \"\n    risk_management_rules: List[str] = Field(..., description=\"Bullet\\\
      u2011point list (3\\u20115 items) detailing the concrete risk\\u2011management\
      \ rules such as position sizing, stop\\u2011loss, max drawdown, etc.\")\n  \
      \  rule_count: int = Field(..., description=\"The total number of risk\\u2011management\
      \ rules provided (must be between 3 and 5).\")\n    has_stop_loss: bool = Field(...,\
      \ description=\"True if the list includes an explicit stop\\u2011loss rule;\
      \ otherwise false.\")\n\n\nclass CompileFinalStrategyBlueprintOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for compile_final_strategy_blueprint node outputs.\"\
      \"\"\n    blueprint_summary: str = Field(..., description=\"High\\u2011level\
      \ narrative summarizing the strategy\\u2019s purpose, market thesis, target\
      \ return\\u2011to\\u2011risk ratio, and operational cadence.\")\n    refined_strategy_details:\
      \ str = Field(..., description=\"Technical description of the final entry/exit\
      \ rules, indicator settings, parameter values, and any conditional logic after\
      \ back\\u2011testing refinement.\")\n    risk_management_rules: List[str] =\
      \ Field(..., description=\"Bullet\\u2011point list (3\\u20115 items) of risk\
      \ controls such as position sizing formulas, stop\\u2011loss/take\\u2011profit\
      \ levels, max draw\\u2011down limits, and portfolio exposure caps.\")\n    asset_universe:\
      \ List[str] = Field(..., description=\"Complete list of tradable symbols, ticker\
      \ codes, or asset\\u2011class identifiers that constitute the strategy\\u2019s\
      \ trading scope.\")\n\n\ndef compile_final_strategy_blueprint(refine_trading_strategy_input:\
      \ RefineTradingStrategyOutput, define_risk_management_rules_input: DefineRiskManagementRulesOutput,\
      \ **kwargs) -> CompileFinalStrategyBlueprintOutput:\n    \"\"\"Synthesizes the\
      \ refined trading logic, rigorously defined risk‑management policies, and the\
      \ designated asset universe into a single, end‑to‑end blueprint ready for implementation,\
      \ back‑testing, and deployment.\n\n    Args:\n        refine_trading_strategy_input:\
      \ Input from the 'refine_trading_strategy' node.\n        define_risk_management_rules_input:\
      \ Input from the 'define_risk_management_rules' node.\n        **kwargs: Additional\
      \ keyword arguments.\n\n    Returns:\n        CompileFinalStrategyBlueprintOutput:\
      \ Object containing outputs for this node.\n    \"\"\"\n    # Extract and concatenate\
      \ refined strategy details\n    refined_details: str = extract_and_concatenate_strategy_details(\n\
      \        summary=refine_trading_strategy_input.refined_strategy_summary,\n \
      \       parameter_adjustments=refine_trading_strategy_input.parameter_adjustments,\n\
      \        indicator_adjustments=refine_trading_strategy_input.indicator_adjustments,\n\
      \        risk_rule_adjustments=refine_trading_strategy_input.risk_rule_adjustments\n\
      \    )\n    \n    # Validate risk management rules\n    validated_rules: List[str]\
      \ = validate_risk_management_rules(\n        rules=define_risk_management_rules_input.risk_management_rules,\n\
      \        has_stop_loss=define_risk_management_rules_input.has_stop_loss\n  \
      \  )\n    \n    # Get asset universe from specify_asset_universe node\n    asset_tickers:\
      \ List[str] = get_asset_universe_from_context(**kwargs)\n    \n    # Generate\
      \ blueprint summary\n    blueprint_summary: str = craft_blueprint_summary(\n\
      \        strategy_summary=refine_trading_strategy_input.refined_strategy_summary,\n\
      \        **kwargs\n    )\n    \n    # Generate implementation checklist (internal\
      \ documentation)\n    implementation_checklist: List[str] = generate_implementation_checklist()\n\
      \    \n    # Validate output types\n    validate_output_types(\n        blueprint_summary=blueprint_summary,\n\
      \        refined_strategy_details=refined_details,\n        risk_management_rules=validated_rules,\n\
      \        asset_universe=asset_tickers\n    )\n    \n    # Return final blueprint\n\
      \    return CompileFinalStrategyBlueprintOutput(\n        blueprint_summary=blueprint_summary,\n\
      \        refined_strategy_details=refined_details,\n        risk_management_rules=validated_rules,\n\
      \        asset_universe=asset_tickers\n    )"
