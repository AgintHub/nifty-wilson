name: hedge_fund_trading_strategy_workflow_with_yahoo_finance_parallel_fetch
nodes:
  backtest_trading_strategy:
    agent: false
    code_node_type: shim
    description: Performs a rigorous, production‑grade backtest of the fully specified
      trading strategy using the fetched Yahoo Finance data, the asset universe, and
      the signal generation logic.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DevelopTradingSignalLogicOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for develop_trading_signal_logic node outputs.\"\"\"\n    signal_logic_steps:\
      \ List[str] = Field(..., description=\"Step\\u2011by\\u2011step outline of the\
      \ logical rules that convert indicator readings into concrete BUY or SELL signals.\"\
      )\n    used_indicators: List[str] = Field(..., description=\"Explicit list of\
      \ technical indicator names (as provided by the parent node) that are employed\
      \ in the signal generation algorithm.\")\n    summary: str = Field(..., description=\"\
      A concise executive summary describing the overall methodology, key decision\
      \ pathways, and any risk\\u2011management overlays.\")\n    is_logic_complete:\
      \ bool = Field(..., description=\"Flag indicating whether the signal logic accounts\
      \ for all identified indicators and fully defines buy, sell, and neutral decision\
      \ branches.\")\n\n\nclass SpecifyAssetUniverseOutput(BaseModel):\n    \"\"\"\
      Pydantic model for specify_asset_universe node outputs.\"\"\"\n    asset_classes:\
      \ List[str] = Field(..., description=\"High\\u2011level asset classes or instrument\
      \ families to be traded (e.g., US equities, futures, commodities).\")\n    asset_tickers:\
      \ List[str] = Field(..., description=\"Specific ticker symbols or contract identifiers\
      \ selected from each asset class (e.g., AAPL, MSFT, ESZ2025).\")\n\n\nclass\
      \ FetchStockDataYahooDataOutput(BaseModel):\n    \"\"\"Pydantic model for fetch_stock_data_yahoo_data\
      \ node outputs.\"\"\"\n    tickers: List[str] = Field(..., description=\"Ordered\
      \ list of ticker symbols for which historical data was fetched.\")\n    data_csv:\
      \ List[str] = Field(..., description=\"CSV\\u2011formatted string of the OHLCV\
      \ data for each ticker, preserving dates as the index; list order matches `tickers`.\"\
      )\n    record_counts: List[int] = Field(..., description=\"Number of rows (trading\
      \ days) retrieved for each ticker, aligned with the order of `tickers`.\")\n\
      \n\nclass FetchStockDataYahooStatusOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for fetch_stock_data_yahoo_status node outputs.\"\"\"\n    retrieval_success:\
      \ bool = Field(..., description=\"Indicates whether the data download from Yahoo\
      \ Finance completed without errors for all requested tickers.\")\n    retrieval_message:\
      \ str = Field(..., description=\"A concise human\\u2011readable confirmation\
      \ or error summary describing the overall retrieval outcome.\")\n\n\nclass BacktestTradingStrategyOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for backtest_trading_strategy node outputs.\"\"\"\n\
      \    total_return: float = Field(..., description=\"Cumulative return of the\
      \ strategy over the backtest period, expressed as a decimal (e.g., 0.12 for\
      \ 12%).\")\n    annualized_sharpe_ratio: float = Field(..., description=\"Annualized\
      \ Sharpe ratio of the strategy, assuming a risk\\u2011free rate of 0%.\")\n\
      \    max_drawdown: float = Field(..., description=\"Maximum drawdown observed\
      \ during the backtest, expressed as a decimal.\")\n    number_of_trades: int\
      \ = Field(..., description=\"Total count of executed trades (both entries and\
      \ exits) throughout the backtest.\")\n    backtest_period_start: str = Field(...,\
      \ description=\"ISO\\u2011format start date of the backtest period (YYYY\\u2011MM\\\
      u2011DD).\")\n    backtest_period_end: str = Field(..., description=\"ISO\\\
      u2011format end date of the backtest period (YYYY\\u2011MM\\u2011DD).\")\n \
      \   success: bool = Field(..., description=\"True if the backtest completed\
      \ without errors; false otherwise.\")\n\n\ndef backtest_trading_strategy(develop_trading_signal_logic_input:\
      \ DevelopTradingSignalLogicOutput, specify_asset_universe_input: SpecifyAssetUniverseOutput,\
      \ fetch_stock_data_yahoo_data_input: FetchStockDataYahooDataOutput, fetch_stock_data_yahoo_status_input:\
      \ FetchStockDataYahooStatusOutput, **kwargs) -> BacktestTradingStrategyOutput:\n\
      \    \"\"\"Performs a rigorous, production‑grade backtest of the fully specified\
      \ trading strategy using the fetched Yahoo Finance data, the asset universe,\
      \ and the signal generation logic.\n\n    Args:\n        develop_trading_signal_logic_input:\
      \ Input from the 'develop_trading_signal_logic' node.\n        specify_asset_universe_input:\
      \ Input from the 'specify_asset_universe' node.\n        fetch_stock_data_yahoo_data_input:\
      \ Input from the 'fetch_stock_data_yahoo_data' node.\n        fetch_stock_data_yahoo_status_input:\
      \ Input from the 'fetch_stock_data_yahoo_status' node.\n        **kwargs: Additional\
      \ keyword arguments.\n\n    Returns:\n        BacktestTradingStrategyOutput:\
      \ Object containing outputs for this node.\n    \"\"\"\n    try:\n        #\
      \ Parse CSV data into pandas DataFrames with UTC timezone and standard columns\n\
      \        dataframes_dict: dict = parse_csv_to_dataframes(\n            csv_strings=fetch_stock_data_yahoo_data_input.data_csv,\n\
      \            tickers=fetch_stock_data_yahoo_data_input.tickers\n        )\n\
      \        \n        # Create master business day calendar and align all ticker\
      \ data\n        aligned_data: dict = align_dataframes_to_master_calendar(\n\
      \            dataframes=dataframes_dict,\n            tickers=specify_asset_universe_input.asset_tickers\n\
      \        )\n        \n        # Convert aligned data to unified multi-index\
      \ DataFrame\n        unified_df: 'pd.DataFrame' = create_unified_dataframe(aligned_data=aligned_data)\n\
      \        \n        # Translate signal logic steps into executable function and\
      \ generate signals\n        signal_function: callable = create_signal_function(\n\
      \            signal_logic_steps=develop_trading_signal_logic_input.signal_logic_steps,\n\
      \            used_indicators=develop_trading_signal_logic_input.used_indicators\n\
      \        )\n        \n        signals_df: 'pd.DataFrame' = generate_trading_signals(\n\
      \            unified_data=unified_df,\n            signal_function=signal_function,\n\
      \            tickers=specify_asset_universe_input.asset_tickers\n        )\n\
      \        \n        # Execute backtest with commission and slippage\n       \
      \ execution_results: dict = execute_backtest_simulation(\n            price_data=unified_df,\n\
      \            signals=signals_df,\n            commission_rate=0.001,\n     \
      \       slippage_rate=0.0005\n        )\n        \n        # Construct daily\
      \ equity curve\n        equity_curve: 'pd.Series' = build_equity_curve(\n  \
      \          cash_series=execution_results['cash'],\n            holdings_series=execution_results['holdings'],\n\
      \            price_data=unified_df\n        )\n        \n        # Calculate\
      \ performance metrics\n        performance_metrics: dict = calculate_performance_metrics(\n\
      \            equity_curve=equity_curve,\n            number_of_trades=execution_results['trade_count']\n\
      \        )\n        \n        return BacktestTradingStrategyOutput(\n      \
      \      total_return=performance_metrics['total_return'],\n            annualized_sharpe_ratio=performance_metrics['annualized_sharpe'],\n\
      \            max_drawdown=performance_metrics['max_drawdown'],\n           \
      \ number_of_trades=performance_metrics['number_of_trades'],\n            backtest_period_start=performance_metrics['period_start'],\n\
      \            backtest_period_end=performance_metrics['period_end'],\n      \
      \      success=True\n        )\n        \n    except Exception as e:\n     \
      \   error_log: str = log_backtest_error(exception=e)\n        \n        return\
      \ BacktestTradingStrategyOutput(\n            total_return=0.0,\n          \
      \  annualized_sharpe_ratio=0.0,\n            max_drawdown=0.0,\n           \
      \ number_of_trades=0,\n            backtest_period_start=\"\",\n           \
      \ backtest_period_end=\"\",\n            success=False\n        )"
    name: backtest_trading_strategy
