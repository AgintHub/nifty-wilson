dag_type: plain_text
description: A workflow for planning a multi-national advertising campaign for a summer
  drink
name: plan_multi_national_advertising_campaign
nodes:
  analyze_competitor_advertising:
    agent: false
    description: Analyze competitor advertising strategies for similar summer drinks
    name: analyze_competitor_advertising
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Research and analyze the advertising strategies used by competitors for
      similar summer drinks, including their messaging, channels, and tactics.
  coordinate_advertising_launch:
    agent: false
    description: Coordinate the launch of the advertising campaign across channels
    name: coordinate_advertising_launch
    nodes_depended_on:
    - create_advertising_content
    - plan_advertising_budget
    nodes_dependent_on: []
    prompt: Coordinate the launch of the advertising campaign, ensuring that all content
      is deployed across the selected channels and that the messaging is consistent.
  create_advertising_content:
    agent: false
    description: Develop high-quality advertising content for the selected channels
    name: create_advertising_content
    nodes_depended_on:
    - develop_advertising_message
    - select_advertising_channels
    nodes_dependent_on: []
    prompt: Create high-quality advertising content, including images, videos, or
      copy, that aligns with the advertising message and resonates with the target
      audience.
  define_advertising_objectives:
    agent: false
    description: Establish clear objectives for the advertising campaign
    name: define_advertising_objectives
    nodes_depended_on:
    - identify_target_audience
    nodes_dependent_on: []
    prompt: Based on the target audience, define specific, measurable objectives for
      the advertising campaign, such as increasing brand awareness or driving sales.
  develop_advertising_message:
    agent: false
    description: Create a compelling advertising message for the summer drink
    name: develop_advertising_message
    nodes_depended_on:
    - identify_target_audience
    - analyze_competitor_advertising
    nodes_dependent_on: []
    prompt: Develop a unique and compelling advertising message that resonates with
      the target audience and differentiates the summer drink from competitors.
  identify_target_audience:
    agent: false
    description: Determine the primary target audience for the summer drink
    name: identify_target_audience
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Identify the demographic characteristics of the primary target audience
      for the summer drink, including age, location, and preferences.
  monitor_advertising_performance:
    agent: false
    description: Track and analyze the performance of the advertising campaign
    name: monitor_advertising_performance
    nodes_depended_on:
    - coordinate_advertising_launch
    nodes_dependent_on: []
    prompt: Monitor and analyze the performance of the advertising campaign, using
      metrics such as reach, engagement, and conversion to assess effectiveness and
      inform future optimizations.
  optimize_advertising_campaign:
    agent: false
    description: Optimize the advertising campaign based on performance data
    name: optimize_advertising_campaign
    nodes_depended_on:
    - monitor_advertising_performance
    nodes_dependent_on: []
    prompt: Use performance data to optimize the advertising campaign, making adjustments
      to targeting, messaging, channels, or budget allocation as needed to improve
      effectiveness.
  plan_advertising_budget:
    agent: false
    description: Determine the advertising budget and allocate resources across channels
    name: plan_advertising_budget
    nodes_depended_on:
    - define_advertising_objectives
    - select_advertising_channels
    nodes_dependent_on: []
    prompt: Determine the total advertising budget and allocate resources across the
      selected channels, considering factors such as cost, reach, and effectiveness.
  select_advertising_channels:
    agent: false
    description: Choose the most effective advertising channels for reaching the target
      audience
    name: select_advertising_channels
    nodes_depended_on:
    - identify_target_audience
    - analyze_competitor_advertising
    nodes_dependent_on: []
    prompt: Select the most effective advertising channels for reaching the target
      audience, including social media, television, print, or outdoor advertising.
