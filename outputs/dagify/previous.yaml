dag_type: shim
description: Generated workflow from UI.
name: build_vulnerability_free_openssl
nodes:
  apply_hardening_flags:
    agent: false
    code_node_type: shim
    description: Set compilation flags to enhance security.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass IntegratePatchOutput(BaseModel):\n    \"\"\"Pydantic model for integrate_patch\
      \ node outputs.\"\"\"\n    patched_cve_ids: List[str] = Field(..., description=\"\
      List of CVE IDs for which patches were successfully applied.\")\n    patch_success_count:\
      \ int = Field(..., description=\"Number of patches that compiled and were applied\
      \ without errors.\")\n    patch_failure_count: int = Field(..., description=\"\
      Number of patches that failed to compile or apply.\")\n    overall_patch_success:\
      \ bool = Field(..., description=\"True if all patches compiled successfully,\
      \ False otherwise.\")\n    patch_log_entries: List[str] = Field(..., description=\"\
      Log entries capturing the outcome of each patch application attempt.\")\n\n\n\
      class ApplyHardeningFlagsOutput(BaseModel):\n    \"\"\"Pydantic model for apply_hardening_flags\
      \ node outputs.\"\"\"\n    flags_applied: List[str] = Field(..., description=\"\
      List of compilation flags applied to enable security hardening.\")\n    flags_summary:\
      \ str = Field(..., description=\"Human-readable summary of the applied hardening\
      \ options.\")\n    success: bool = Field(..., description=\"Indicates whether\
      \ the flags were successfully integrated into the build configuration.\")\n\n\
      \ndef apply_hardening_flags(integrate_patch_input: IntegratePatchOutput, **kwargs)\
      \ -> ApplyHardeningFlagsOutput:\n    \"\"\"Set compilation flags to enhance\
      \ security.\n\n    Args:\n        integrate_patch_input: Input from the 'integrate_patch'\
      \ node.\n        **kwargs: Additional keyword arguments.\n\n    Returns:\n \
      \       ApplyHardeningFlagsOutput: Object containing outputs for this node.\n\
      \    \"\"\"\n    # Parse the patch log entries to locate the OpenSSL source\
      \ root directory\n    source_root: str = parse_source_root_from_patch_logs(patch_log_entries=integrate_patch_input.patch_log_entries)\n\
      \    \n    # Validate that the extracted source root exists\n    root_exists:\
      \ bool = validate_source_root_exists(source_root=source_root)\n    if not root_exists:\n\
      \        return ApplyHardeningFlagsOutput(\n            flags_applied=[],\n\
      \            flags_summary=\"Failed to locate valid OpenSSL source root directory\"\
      ,\n            success=False\n        )\n    \n    # Define the canonical hardening\
      \ flags\n    hardening_flags: List[str] = [\n        \"-DOPENSSL_NO_ASM\",\n\
      \        \"-DOPENSSL_NO_EC\", \n        \"-fstack-protector-strong\",\n    \
      \    \"-Wextra\",\n        \"-Werror\",\n        \"-fPIE\",\n        \"-pie\"\
      ,\n        \"-D_FORTIFY_SOURCE=2\"\n    ]\n    \n    # Export hardening flags\
      \ as environment variables\n    env_setup_success: bool = export_flags_to_environment(flags=hardening_flags)\n\
      \    if not env_setup_success:\n        return ApplyHardeningFlagsOutput(\n\
      \            flags_applied=hardening_flags,\n            flags_summary=\"Failed\
      \ to set environment variables for hardening flags\",\n            success=False\n\
      \        )\n    \n    # Run the OpenSSL configuration command\n    config_success:\
      \ bool = run_openssl_config_command(source_root=source_root)\n    if not config_success:\n\
      \        return ApplyHardeningFlagsOutput(\n            flags_applied=hardening_flags,\n\
      \            flags_summary=\"OpenSSL configuration command failed\",\n     \
      \       success=False\n        )\n    \n    # Validate that flags are present\
      \ in generated Makefile and config.h\n    validation_success: bool = validate_flags_in_build_files(source_root=source_root,\
      \ flags=hardening_flags)\n    \n    # Generate flags summary\n    flags_summary:\
      \ str = f\"Applied hardening flags: {', '.join(hardening_flags)}\"\n    \n \
      \   return ApplyHardeningFlagsOutput(\n        flags_applied=hardening_flags,\n\
      \        flags_summary=flags_summary,\n        success=validation_success\n\
      \    )"
    name: apply_hardening_flags
    nodes_depended_on:
    - integrate_patch
    nodes_dependent_on: []
    output_structure:
    - description: List of compilation flags applied to enable security hardening.
      key: flags_applied
      type: List[str]
    - description: Human-readable summary of the applied hardening options.
      key: flags_summary
      type: str
    - description: Indicates whether the flags were successfully integrated into the
        build configuration.
      key: success
      type: bool
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a regular‑expression parser in Python that scans each log
          entry for "Applied patch to" and captures the directory path. Validate the
          existence of the extracted path with os.path.isdir; if multiple paths are
          found, prioritize the one with the deepest directory depth.
        reason: The source tree must be identified before any build configuration
          can be modified. Parsing patch_log_entries ensures we are working on the
          exact codebase that received patches.
        text: Parse the output of integrate_patch to locate the root directory of
          the OpenSSL source tree. Search the patch_log_entries list for entries containing
          the pattern "Applied patch to" and extract the file path prefix; use this
          prefix as the source root for subsequent operations.
      - complexity: LOW
        impact: MEDIUM
        method: Hard‑code the list as a Python list of strings. Ensure each flag is
          correctly escaped for shell execution.
        reason: A consistent set of flags guarantees reproducible security postures
          across builds and simplifies downstream verification.
        text: Define a canonical list of hardening flags to be applied. Include -DOPENSSL_NO_ASM,
          -DOPENSSL_NO_EC, -fstack-protector-strong, -Wextra, -Werror, -fPIE, -pie,
          and -D_FORTIFY_SOURCE=2. Store this list in a variable named hardening_flags.
      - complexity: LOW
        impact: MEDIUM
        method: Use Python's os.environ to set the variables. Verify that the values
          are correctly set by printing os.environ['CFLAGS'] after assignment.
        reason: OpenSSL's ./config script inherits compiler flags from the environment,
          allowing us to inject hardening options without modifying the script itself.
        text: Export the hardening flags as environment variables CFLAGS and CXXFLAGS
          before invoking the OpenSSL configuration script. Concatenate the flags
          into a single string separated by spaces, then set os.environ['CFLAGS']
          = os.environ['CXXFLAGS'] = ' '.join(hardening_flags).
      - complexity: MEDIUM
        impact: HIGH
        method: Execute the command using subprocess.run with capture_output=True,
          check=True. If a CalledProcessError is raised, log the error and set success
          to False.
        reason: The configuration step generates Makefiles that incorporate the environment‑supplied
          flags. Failure to configure indicates a problem with the flag syntax or
          environment setup.
        text: Run the OpenSSL configuration command (./config --prefix=/opt/openssl
          --openssldir=/opt/openssl) within the source root directory, capturing its
          stdout and stderr. Ensure the command completes successfully before proceeding.
      - complexity: MEDIUM
        impact: HIGH
        method: Read the Makefile (e.g., Makefile) and config.h into memory. For each
          flag in hardening_flags, use the in operator to check presence. Record any
          missing flags in a list.
        reason: Ensures that the build system actually received the hardening options;
          missing flags could undermine security objectives.
        text: Validate that the flags are present in the generated Makefile or config.h
          by grepping for each flag string. If any flag is missing, log a warning
          and set success to False.
      - complexity: LOW
        impact: MEDIUM
        method: 'Construct flags_summary as "Applied hardening flags: {}".format('',
          ''.join(hardening_flags)). Return the three fields as a JSON object.'
        reason: These outputs feed downstream nodes (build_openssl) and provide a
          clear audit trail for the hardening process.
        text: 'Populate the output fields: flags_applied = hardening_flags, flags_summary
          = a concatenated sentence describing the applied flags, and success = True
          if all validation steps passed, otherwise False.'
    prompt: Configure the OpenSSL build with security hardening options (e.g., -DOPENSSL_NO_ASM,
      -DOPENSSL_NO_EC, -fstack-protector-strong).
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Extract the OpenSSL source root directory path from a list of patch
        application log entries.
      implementation: "def parse_source_root_from_patch_logs(patch_log_entries: str)\
        \ -> str:\n    \"\"\"\n    Extract the OpenSSL source root directory path\
        \ from a list of patch application log entries.\n\n    Args:\n        patch_log_entries:\
        \ Input parameter of type str\n\n    Returns:\n        str: Output of type\
        \ str\n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub\
        \ node that needs to be implemented\")\n"
      name: parse_source_root_from_patch_logs
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: patch_log_entries
        type: str
      prd:
        bullets:
        - complexity: MEDIUM
          impact: Correct source root extraction is critical for subsequent build
            configuration steps; failure here causes all downstream operations to
            fail.
          method: Use regular expressions or parsing heuristics focused on known markers
            within log lines (e.g., directory paths mentioned with 'Entering directory'
            or specific keywords) to extract the root path.
          reason: Patch logs may contain varied and inconsistent formatting, so accurately
            extracting the source root requires flexible yet precise pattern recognition.
          text: Develop robust parsing logic to scan through patch log entries and
            reliably identify the source root directory path.
        - complexity: MEDIUM
          impact: Improves reliability and prevents false positives that could cause
            invalid directory assumptions and build failures.
          method: Apply filtering rules to ignore unrelated lines, validate each candidate
            path for plausible structure (e.g., presence of expected subdirectories),
            and return the most likely valid source root.
          reason: Patch logs may contain multiple directory paths, errors, or extraneous
            information, so filtering and validating candidate paths ensures the extracted
            root is valid and relevant.
          text: Handle diverse log formats and potential noise within patch logs by
            implementing sanitization and validation steps.
        - complexity: LOW
          impact: Ensures compatibility and correctness for environment setup and
            build operations that rely on this path.
          method: Normalize the extracted directory path using standard path manipulation
            utilities (e.g., os.path.normpath) before returning it.
          reason: The downstream nodes expect a clean and consistent directory path
            string to use in validation and configuration stages.
          text: Return the extracted source root path as a normalized string suitable
            for subsequent filesystem and build system interactions.
      prompt: 'Description: Typed node for shim parse_source_root_from_patch_logs'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Checks whether the provided OpenSSL source root directory path
        exists in the filesystem and returns a boolean indicating its presence.
      implementation: "def validate_source_root_exists(source_root: str) -> bool:\n\
        \    \"\"\"\n    Checks whether the provided OpenSSL source root directory\
        \ path exists in the filesystem and returns a boolean indicating its presence.\n\
        \n    Args:\n        source_root: Input parameter of type str\n\n    Returns:\n\
        \        bool: Output of type bool\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")\n"
      name: validate_source_root_exists
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type bool
        key: output
        type: bool
      - description: Input parameter of type str
        key: source_root
        type: str
      prd:
        bullets:
        - complexity: LOW
          impact: Avoids configuration and build failures caused by referencing a
            non-existent source directory, improving system robustness.
          method: Use standard filesystem API calls (e.g., os.path.exists in Python)
            to check the existence and accessibility of the directory path.
          reason: To ensure that subsequent operations like setting compilation flags
            or running configuration commands are performed on a valid OpenSSL source
            directory, preventing runtime errors.
          text: Verify existence of the filesystem path given as source_root.
      prompt: 'Description: Typed node for shim validate_source_root_exists

        Agent: False'
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Exports a list of compilation flags to environment variables and
        returns success status.
      implementation: "def export_flags_to_environment(flags: str) -> bool:\n    \"\
        \"\"\n    Exports a list of compilation flags to environment variables and\
        \ returns success status.\n\n    Args:\n        flags: Input parameter of\
        \ type str\n\n    Returns:\n        bool: Output of type bool\n    \"\"\"\n\
        \    raise NotImplementedError(\"This is a virtual stub node that needs to\
        \ be implemented\")\n"
      name: export_flags_to_environment
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type bool
        key: output
        type: bool
      - description: Input parameter of type str
        key: flags
        type: str
      prd:
        bullets:
        - complexity: LOW
          impact: Ensures that each flag is processed correctly, preventing malformed
            environment variable assignments.
          method: Use a regular expression or split on whitespace/comma to produce
            a list of flag strings.
          reason: The shim receives flags as a single string; tokenization is required
            to handle each flag separately.
          text: Parse the input flags string into a list of individual flag tokens.
        - complexity: MEDIUM
          impact: Makes the flags available system‑wide for the current process and
            any child processes, enabling consistent build configuration.
          method: Iterate over the flag list, construct appropriate variable names
            (e.g., prepend 'CFLAGS_' or use a generic key), and assign them via os.environ;
            optionally prepend to subprocess environment if needed.
          reason: Subsequent build processes rely on environment variables to apply
            the hardening flags.
          text: Export each flag as an environment variable (e.g., set CFLAGS and
            similar variables).
        - complexity: LOW
          impact: Provides clear feedback, allowing error handling or fallback logic
            in the pipeline.
          method: Check os.environ for each expected key; if all are present, return
            True; otherwise return False.
          reason: Downstream nodes need to know whether the export succeeded before
            proceeding.
          text: Validate that all environment variables were set and return a boolean
            success indicator.
      prompt: Export the provided compilation flags to environment variables and report
        whether the operation succeeded.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Executes the OpenSSL ./config command on the specified source root
        directory and returns whether it succeeded.
      implementation: "def run_openssl_config_command(source_root: str) -> bool:\n\
        \    \"\"\"\n    Executes the OpenSSL ./config command on the specified source\
        \ root directory and returns whether it succeeded.\n\n    Args:\n        source_root:\
        \ Input parameter of type str\n\n    Returns:\n        bool: Output of type\
        \ bool\n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub\
        \ node that needs to be implemented\")\n"
      name: run_openssl_config_command
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type bool
        key: output
        type: bool
      - description: Input parameter of type str
        key: source_root
        type: str
      prd:
        bullets:
        - complexity: LOW
          impact: Ensures the shim only proceeds when the environment is correctly
            set up, improving reliability.
          method: Use os.path.isdir(source_root) to check existence and directory
            status.
          reason: Prevents runtime errors caused by non-existent or invalid paths.
          text: Validate that source_root exists and is a directory before attempting
            to run the configuration command.
        - complexity: MEDIUM
          impact: Directly determines the output boolean and influences downstream
            hardening flag application.
          method: Use subprocess.run(['./config'], cwd=source_root, capture_output=True,
            text=True) and interpret result.returncode.
          reason: Core functionality of the shim – the success flag depends on this
            execution.
          text: Execute the OpenSSL configuration command (e.g., ./config) in the
            source_root directory and capture its exit status.
        - complexity: LOW
          impact: Enables operators to trace issues without modifying the shim codebase.
          method: Write result.stdout and result.stderr to a log file or console after
            subprocess.run.
          reason: Provides visibility into failures and assists in troubleshooting.
          text: Log the stdout and stderr of the configuration command for debugging
            and audit purposes.
      prompt: Run the OpenSSL configuration command on the provided source_root directory
        and return a boolean indicating success or failure.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Validates that a list of hardening flags are correctly applied
        in the OpenSSL build files located at the given source root.
      implementation: "def validate_flags_in_build_files(source_root: str, flags:\
        \ str) -> bool:\n    \"\"\"\n    Validates that a list of hardening flags\
        \ are correctly applied in the OpenSSL build files located at the given source\
        \ root.\n\n    Args:\n        source_root: Input parameter of type str\nflags:\
        \ Input parameter of type str\n\n    Returns:\n        bool: Output of type\
        \ bool\n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub\
        \ node that needs to be implemented\")\n"
      name: validate_flags_in_build_files
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type bool
        key: output
        type: bool
      - description: Input parameter of type str
        key: source_root
        type: str
      - description: Input parameter of type str
        key: flags
        type: str
      prd:
        bullets:
        - complexity: MEDIUM
          impact: Ensures that the shim operates on the correct file set, preventing
            false negatives.
          method: Use Python's pathlib to locate Makefile and config.h, then read
            their contents into memory.
          reason: The validation requires access to the actual files where flags are
            defined.
          text: Parse the OpenSSL build files (Makefile, config.h) from the provided
            source_root directory to extract their content.
        - complexity: LOW
          impact: Provides the core validation logic that determines the boolean output.
          method: Iterate over the split `flags` string, applying a regex pattern
            that matches the flag as a whole word in the file texts.
          reason: To determine whether each hardening flag has been correctly applied.
          text: Search the extracted file contents for each flag in the provided list
            using regular expressions or substring matching.
        - complexity: LOW
          impact: Enables conditional execution of subsequent steps (e.g., applying
            hardening flags).
          method: Collect the results of the flag checks into a list, then return
            `all(results)`.
          reason: The downstream node requires a simple success/failure signal.
          text: Return a boolean result indicating whether all flags were found in
            the build files.
      prompt: '# Validation Prompt

        Given the source root directory `source_root` and a comma-separated list of
        flags `flags`, check the OpenSSL build files (Makefile, config.h) to confirm
        that each flag is present. Output `True` if all flags are found, otherwise
        `False`.'
      shims: []
  build_openssl:
    agent: false
    code_node_type: shim
    description: Build the OpenSSL binaries from the source code that has been patched
      for known vulnerabilities and configured with security hardening flags. The
      build should generate the standard OpenSSL libraries and binaries, capture detailed
      logs, and record build metrics.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ApplyHardeningFlagsOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ apply_hardening_flags node outputs.\"\"\"\n    flags_applied: List[str] =\
      \ Field(..., description=\"List of compilation flags applied to enable security\
      \ hardening.\")\n    flags_summary: str = Field(..., description=\"Human-readable\
      \ summary of the applied hardening options.\")\n    success: bool = Field(...,\
      \ description=\"Indicates whether the flags were successfully integrated into\
      \ the build configuration.\")\n\n\nclass BuildOpensslOutput(BaseModel):\n  \
      \  \"\"\"Pydantic model for build_openssl node outputs.\"\"\"\n    binary_artifacts_path:\
      \ str = Field(..., description=\"Filesystem path to the directory containing\
      \ compiled OpenSSL binaries.\")\n    build_success: bool = Field(..., description=\"\
      Indicates whether the build completed without errors.\")\n    build_log: str\
      \ = Field(..., description=\"Textual log of the build process.\")\n    artifact_names:\
      \ str = Field(..., description=\"List of names of generated binary artifacts\
      \ (e.g., libssl.so, libcrypto.so).\")\n    build_duration_seconds: int = Field(...,\
      \ description=\"Total time taken for the build in seconds.\")\n\n\ndef build_openssl(apply_hardening_flags_input:\
      \ ApplyHardeningFlagsOutput, **kwargs) -> BuildOpensslOutput:\n    \"\"\"Build\
      \ the OpenSSL binaries from the source code that has been patched for known\
      \ vulnerabilities and configured with security hardening flags. The build should\
      \ generate the standard OpenSSL libraries and binaries, capture detailed logs,\
      \ and record build metrics.\n\n    Args:\n        apply_hardening_flags_input:\
      \ Input from the 'apply_hardening_flags' node.\n        **kwargs: Additional\
      \ keyword arguments.\n\n    Returns:\n        BuildOpensslOutput: Object containing\
      \ outputs for this node.\n    \"\"\"\n    # Create clean build environment\n\
      \    build_directory: str = create_clean_build_environment()\n    copy_patched_source_code(destination=build_directory)\n\
      \    \n    # Prepare hardening flags for build configuration\n    formatted_flags:\
      \ str = format_hardening_flags(flags=apply_hardening_flags_input.flags_applied)\n\
      \    \n    # Configure OpenSSL with hardening flags\n    config_command: str\
      \ = construct_config_command(flags=formatted_flags)\n    config_success: bool\
      \ = execute_config_command(command=config_command, build_dir=build_directory)\n\
      \    \n    if not config_success:\n        error_log: str = get_config_error_log()\n\
      \        return BuildOpensslOutput(\n            binary_artifacts_path=build_directory,\n\
      \            build_success=False,\n            build_log=error_log,\n      \
      \      artifact_names=\"\",\n            build_duration_seconds=0\n        )\n\
      \    \n    # Execute parallel build process\n    start_timestamp: int = get_current_timestamp()\n\
      \    make_command: str = construct_parallel_make_command()\n    build_exit_code:\
      \ int = execute_build_command(command=make_command, build_dir=build_directory)\n\
      \    end_timestamp: int = get_current_timestamp()\n    \n    # Calculate build\
      \ duration\n    duration: int = end_timestamp - start_timestamp\n    \n    #\
      \ Capture build logs\n    full_build_log: str = read_build_log_file(build_dir=build_directory)\n\
      \    \n    # Determine build success\n    has_critical_errors: bool = check_for_critical_errors(log_content=full_build_log)\n\
      \    build_succeeded: bool = (build_exit_code == 0) and not has_critical_errors\n\
      \    \n    if build_succeeded:\n        # Execute make install\n        install_success:\
      \ bool = execute_make_install(build_dir=build_directory)\n        if not install_success:\n\
      \            build_succeeded = False\n    \n    # Collect artifact information\n\
      \    artifacts_path: str = get_install_prefix_path()\n    artifact_list: str\
      \ = collect_binary_artifacts(install_prefix=artifacts_path) if build_succeeded\
      \ else \"\"\n    \n    # Write metadata file\n    write_build_metadata(build_dir=build_directory,\
      \ success=build_succeeded, duration=duration, artifacts=artifact_list)\n   \
      \ \n    return BuildOpensslOutput(\n        binary_artifacts_path=artifacts_path,\n\
      \        build_success=build_succeeded,\n        build_log=full_build_log,\n\
      \        artifact_names=artifact_list,\n        build_duration_seconds=duration\n\
      \    )"
    name: build_openssl
    nodes_depended_on:
    - apply_hardening_flags
    nodes_dependent_on: []
    output_structure:
    - description: Filesystem path to the directory containing compiled OpenSSL binaries.
      key: binary_artifacts_path
      type: str
    - description: Indicates whether the build completed without errors.
      key: build_success
      type: bool
    - description: Textual log of the build process.
      key: build_log
      type: str
    - description: List of names of generated binary artifacts (e.g., libssl.so, libcrypto.so).
      key: artifact_names
      type: str
    - description: Total time taken for the build in seconds.
      key: build_duration_seconds
      type: int
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Parse the flags_applied list, iterate over each entry, concatenate
          them into a single string, and invoke `./config $FLAGS` followed by `make`
          and `make install`. Capture stdout/stderr to a log file.
        reason: Integrating the exact hardening flags ensures reproducibility and
          that the compiled binaries reflect the security posture defined by the parent
          node.
        text: 1. Retrieve the hardened configuration flags from the parent node's
          output (flags_applied) and merge them into the OpenSSL build command line
          using the `./config` script with `--enable-optimizations` and `--with-ssl-module`
          options. Ensure that each flag is prefixed with `-D` or `-f` as appropriate,
          and that the command line is constructed in a portable shell script that
          expands environment variables for the build host.
      - complexity: LOW
        impact: MEDIUM
        method: Use `mkdir -p` to create the directory, then `rsync -a` or `cp -r`
          to copy the source. Record the path in `build_artifacts_path`.
        reason: A clean environment eliminates hidden dependencies and ensures that
          the build results are deterministic.
        text: 2. Set up a clean build environment by creating a temporary directory
          (e.g., `/tmp/openssl_build_${TIMESTAMP}`) and copying the patched source
          code into it. This isolates the build from any pre‑existing artifacts and
          prevents side effects on the source tree.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Record `start_time=$(date +%s)` before invoking `make`, then `end_time=$(date
          +%s)` after completion. Compute duration as `build_duration_seconds=$((end_time
          - start_time))`.
        reason: Parallel compilation maximizes performance while the log file provides
          a source of truth for debugging and audit.
        text: 3. Execute the build process using `make -j$(nproc)` to parallelize
          compilation across all CPU cores. Redirect both stdout and stderr to a log
          file (`build.log`) and capture the start and end timestamps to compute `build_duration_seconds`.
      - complexity: LOW
        impact: MEDIUM
        method: Use `ls -1 $PREFIX/lib` and filter for files matching `libssl.*` and
          `libcrypto.*`. Strip any version suffixes if required by downstream consumers.
        reason: Explicitly enumerating artifacts enables downstream nodes to reference
          them without hard‑coding paths.
