      A concise narrative linking the chosen data sources with the analysis techniques,\
      \ emphasizing data fidelity, licensing considerations, and estimated computational\
      \ resource requirements.\")\n\n\nclass SelectTradingStrategyTypeOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for select_trading_strategy_type node outputs.\"\"\
      \"\n    strategy_type: str = Field(..., description=\"The chosen primary trading\
      \ strategy type (e.g., \"momentum\", \"mean reversion\").\")\n    rationale:\
      \ str = Field(..., description=\"A concise one\\u2011sentence explanation of\
      \ why this strategy type best fits the market analysis.\")\n\n\ndef select_trading_strategy_type(define_market_analysis_input:\
      \ DefineMarketAnalysisOutput, **kwargs) -> SelectTradingStrategyTypeOutput:\n\
      \    \"\"\"Determines the optimal primary trading strategy category based on\
      \ the market analysis.\n\n    Args:\n        define_market_analysis_input: Input\
      \ from the 'define_market_analysis' node.\n        **kwargs: Additional keyword\
      \ arguments.\n\n    Returns:\n        SelectTradingStrategyTypeOutput: Object\
      \ containing outputs for this node.\n    \"\"\"\n    # Extract inputs\n    market_data_sources:\
      \ List[str] = define_market_analysis_input.market_data_sources\n    analysis_techniques:\
      \ List[str] = define_market_analysis_input.analysis_techniques\n    summary_note:\
      \ str = define_market_analysis_input.summary_note\n    \n    # Classify data\
      \ sources by latency, granularity, and asset class coverage\n    data_classification:\
      \ dict = classify_market_data_sources(sources=market_data_sources)\n    \n \
      \   # Map analysis techniques to strategy archetypes\n    technique_mapping:\
      \ dict = map_techniques_to_archetypes(techniques=analysis_techniques)\n    \n\
      \    # Build weighted scoring model for candidate strategies\n    strategy_scores:\
      \ dict = compute_strategy_scores(\n        data_classification=data_classification,\n\
      \        technique_mapping=technique_mapping,\n        summary_note=summary_note\n\
      \    )\n    \n    # Select strategy with highest score, applying tie-breaker\
      \ if needed\n    selected_strategy: str = select_top_strategy_with_tiebreaker(scores=strategy_scores)\n\
      \    \n    # Generate rationale based on dominant factors\n    rationale_text:\
      \ str = generate_strategy_rationale(\n        selected_strategy=selected_strategy,\n\
      \        data_classification=data_classification,\n        technique_mapping=technique_mapping\n\
      \    )\n    \n    # Validate output against schema requirements\n    validate_output_payload(strategy_type=selected_strategy,\
      \ rationale=rationale_text)\n    \n    return SelectTradingStrategyTypeOutput(\n\
      \        strategy_type=selected_strategy,\n        rationale=rationale_text\n\
      \    )"
