      \ description=\"Total number of warnings detected by the static analysis tools.\"\
      )\n    total_errors: int = Field(..., description=\"Total number of errors detected\
      \ by the static analysis tools.\")\n    total_security_issues: int = Field(...,\
      \ description=\"Total number of potential security issues identified.\")\n \
      \   warnings_list: str = Field(..., description=\"List of warning messages with\
      \ file names and line numbers.\")\n    errors_list: str = Field(..., description=\"\
