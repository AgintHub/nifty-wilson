dag_type: plain_text
description: A workflow for writing a historical fiction book about serving under
  George Washington in the Revolutionary War
name: write_historical_fiction_book
nodes:
  create_story_outline:
    agent: false
    description: Develop a detailed outline for the historical fiction book
    name: create_story_outline
    nodes_depended_on:
    - research_revolutionary_war
    nodes_dependent_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    prompt: Using the research on the Revolutionary War, create a detailed outline
      for the historical fiction book, including character arcs, plot twists, and
      key events.
  develop_character_profiles:
    agent: false
    description: Create detailed profiles for the main characters in the book
    name: develop_character_profiles
    nodes_depended_on:
    - research_revolutionary_war
    nodes_dependent_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    prompt: Develop detailed profiles for the main characters in the book, including
      their backgrounds, motivations, and roles in the story.
  edit_and_revise:
    agent: false
    description: Edit and revise the written chapters to ensure coherence and historical
      accuracy
    name: edit_and_revise
    nodes_depended_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    nodes_dependent_on: []
    prompt: Review the written chapters, making revisions to ensure coherence, historical
      accuracy, and engaging storytelling.
  fact_check:
    agent: false
    description: Verify historical facts and accuracy in the manuscript
    name: fact_check
    nodes_depended_on:
    - write_chapter_3
    nodes_dependent_on:
    - edit_and_revise
    prompt: Check the manuscript for historical accuracy, verifying facts and events
      against historical records.
  research_revolutionary_war:
    agent: false
    description: Conduct research on the Revolutionary War, including key events,
      battles, and figures
    name: research_revolutionary_war
    nodes_depended_on: []
    nodes_dependent_on:
    - create_story_outline
    - develop_character_profiles
    prompt: Research the Revolutionary War, focusing on key events, battles, and notable
      figures. Take detailed notes on the historical context and significant occurrences.
  write_chapter_1:
    agent: false
    description: Write the first chapter of the historical fiction book
    name: write_chapter_1
    nodes_depended_on:
    - create_story_outline
    - develop_character_profiles
    nodes_dependent_on:
    - write_chapter_2
    prompt: Write the first chapter of the historical fiction book, introducing the
      main characters and setting the stage for the story.
  write_chapter_2:
    agent: false
    description: Write the second chapter of the historical fiction book
    name: write_chapter_2
    nodes_depended_on:
    - create_story_outline
    - develop_character_profiles
    - write_chapter_1
    nodes_dependent_on:
    - write_chapter_3
    prompt: Write the second chapter of the historical fiction book, continuing the
      story and developing the characters and plot.
  write_chapter_3:
    agent: false
    description: Write the third chapter of the historical fiction book
    name: write_chapter_3
    nodes_depended_on:
    - create_story_outline
    - develop_character_profiles
    - write_chapter_2
    nodes_dependent_on: []
    prompt: Write the third chapter of the historical fiction book, advancing the
      plot and deepening the characters' experiences.
