dag_type: spec
description: This workflow modifies the stock data fetching nodes to explicitly fetch
  stock data from Yahoo Finance.
name: fetch_stock_data_yahoo_finance
nodes:
  fetch_google_stock_data_yahoo:
    agent: false
    description: Fetches Google (GOOGL) stock data for the last 90 days from Yahoo
      Finance and formats it as lists.
    name: fetch_google_stock_data_yahoo
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of dates in ISO format, sorted ascending.
      key: dates
      type: str
    - description: List of daily opening prices corresponding to each date.
      key: open_prices
      type: float
    - description: List of daily high prices corresponding to each date.
      key: high_prices
      type: float
    - description: List of daily low prices corresponding to each date.
      key: low_prices
      type: float
    - description: List of daily closing prices corresponding to each date.
      key: close_prices
      type: float
    - description: List of daily traded volumes corresponding to each date.
      key: volumes
      type: int
    prd:
      bullets:
      - complexity: LOW
        impact: LOW
        method: Use `import yfinance as yf`, `import pandas as pd`, and `from datetime
          import datetime, timedelta`.
        reason: Setting up the environment is essential before any data fetching can
          occur.
        text: Import the yfinance library and other standard modules (datetime, pandas).
      - complexity: LOW
        impact: LOW
        method: Use `ticker = 'GOOGL'` and `start_date = (datetime.utcnow() - timedelta(days=90)).strftime('%Y-%m-%d')`.
        reason: Ensures we fetch the exact 90‑day window required by the specification.
        text: Define the ticker symbol 'GOOGL' and compute the start date as 90 days
          before today.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Call `data = yf.Ticker(ticker).history(start=start_date, end=datetime.utcnow().strftime('%Y-%m-%d'),
          auto_adjust=False)` and select columns via `data = data[['Open', 'High',
          'Low', 'Close', 'Volume']]`.
        reason: The yfinance `history` call returns a DataFrame with all requested
          OHLCV data.
        text: Retrieve historical data using `yf.Ticker(ticker).history(period='90d',
          auto_adjust=False)`, keeping the 'Open', 'High', 'Low', 'Close', and 'Volume'
          columns.
      - complexity: LOW
        impact: MEDIUM
        method: Apply `data.dropna(inplace=True)`.
        reason: Missing values could break downstream consumers expecting complete
          numeric lists.
        text: Drop any rows with missing or NaN values to ensure data integrity.
      - complexity: LOW
        impact: MEDIUM
        method: Use `data.reset_index(inplace=True)` and `data.sort_values('Date',
          inplace=True)`.
        reason: The index may be unsorted or timezone‑aware; normalizing ensures consistent
          ordering.
        text: Reset the index so that dates become a column and sort the DataFrame
          ascending by date.
      - complexity: LOW
        impact: LOW
        method: Apply `data['Date'] = data['Date'].dt.strftime('%Y-%m-%d')`.
        reason: The output specification requires dates in ISO string format.
        text: Convert each datetime index to ISO 8601 string format (`YYYY-MM-DD`).
      - complexity: MEDIUM
        impact: HIGH
        method: Use `dates = data['Date'].tolist()`, `open_prices = data['Open'].astype(float).tolist()`,
          `high_prices = data['High'].astype(float).tolist()`, `low_prices = data['Low'].astype(float).tolist()`,
          `close_prices = data['Close'].astype(float).tolist()`, `volumes = data['Volume'].astype(int).tolist()`.
        reason: The output structure expects primitive list types, not pandas Series.
        text: 'Extract each column into a Python list of the correct type: `dates`
          as list of strings, `open_prices`, `high_prices`, `low_prices`, `close_prices`
          as list of floats, and `volumes` as list of ints.'
      - complexity: LOW
        impact: HIGH
        method: 'Construct a dictionary `{ ''dates'': dates, ''open_prices'': open_prices,
          ''high_prices'': high_prices, ''low_prices'': low_prices, ''close_prices'':
          close_prices, ''volumes'': volumes }` and output it as JSON or pass directly
          to the next node.'
        reason: Ensures the consumer receives data in the exact sequence and format
          expected.
        text: Return the six lists in the order defined by the output structure.
    prompt: 'Retrieve the last 90 days of daily OHLCV data for Google (ticker: GOOGL)
      from Yahoo Finance using the yfinance Python library. Ensure the data is cleaned,
      sorted, and formatted correctly. Return lists with the following fields: Date
      (ISO format), Open, High, Low, Close, and Volume.'
  fetch_meta_stock_data_yahoo:
    agent: false
    description: Fetches Meta (META) stock data for the last 90 days from Yahoo Finance
      and formats it as lists.
    name: fetch_meta_stock_data_yahoo
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of dates in ISO format, sorted ascending.
      key: dates
      type: str
    - description: List of daily opening prices corresponding to each date.
      key: open_prices
      type: float
    - description: List of daily high prices corresponding to each date.
      key: high_prices
      type: float
    - description: List of daily low prices corresponding to each date.
      key: low_prices
      type: float
    - description: List of daily closing prices corresponding to each date.
      key: close_prices
      type: float
    - description: List of daily traded volumes corresponding to each date.
      key: volumes
      type: int
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: 'Python: `import yfinance as yf; ticker = yf.Ticker(''META''); df
          = ticker.history(period=''90d'', auto_adjust=True)`'
        reason: Using `auto_adjust=True` ensures that any splits or dividends are
          accounted for, giving accurate OHLCV data for analysis.
        text: Import the `yfinance` library and instantiate a `Ticker` object for
          'META'. Set the period to '90d' and retrieve historical data using `history(period='90d',
          auto_adjust=True)`.
      - complexity: LOW
        impact: MEDIUM
        method: 'Python: `df.reset_index(inplace=True)`; `df.dropna(inplace=True)`'
        reason: Missing data can arise on holidays or if data is incomplete; dropping
          ensures clean lists without gaps.
        text: Drop any rows with missing data (`df.dropna(inplace=True)`) and reset
          the index to expose the date column as a regular column.
      - complexity: LOW
        impact: HIGH
        method: 'Python: `df[''Date''] = df[''Date''].dt.strftime(''%Y-%m-%d'')`;
          `df.sort_values(''Date'', inplace=True)`'
        reason: ISO format guarantees consistency across downstream systems and sorting
          ensures chronological order.
        text: Convert the `Date` column to ISO 8601 string format (`df['Date'] = df['Date'].dt.strftime('%Y-%m-%d')`)
          and sort the dataframe ascending by this column.
      - complexity: LOW
        impact: HIGH
        method: 'Python: `dates = df[''Date''].tolist()`; `open_prices = df[''Open''].astype(float).tolist()`,
          etc.'
        reason: Explicit casting prevents type mismatch errors when the output is
          consumed by other nodes expecting `PrimitiveType.LIST_FLOAT` or `PrimitiveType.LIST_INT`.
        text: 'Extract each required column into separate lists: `dates`, `open_prices`,
          `high_prices`, `low_prices`, `close_prices`, and `volumes` (`volumes = df[''Volume''].astype(int).tolist()`).
          Ensure numeric columns are cast to `float` before list conversion.'
      - complexity: MEDIUM
        impact: MEDIUM
        method: 'Python: `try: ... except Exception as e: raise RuntimeError(''Meta
          data fetch failed: '' + str(e))`'
        reason: Ensures the workflow fails gracefully and provides actionable diagnostics
          to downstream nodes.
        text: 'Implement robust error handling: wrap the entire retrieval and processing
          logic in a `try/except` block that catches `yfinance` connection errors,
          data‑unavailable errors, or unexpected schema changes, and re‑raise a descriptive
          `RuntimeError` with the original exception message.'
      - complexity: LOW
        impact: MEDIUM
        method: 'Python: `assert len(dates) == len(open_prices) == len(high_prices)
          == len(low_prices) == len(close_prices) == len(volumes)`'
        reason: Consistency across parallel lists is critical for downstream merging
          or visualization steps.
        text: 'Validate output list lengths: assert that all lists share the same
          length; if not, raise a `ValueError` with details of mismatched indices.'
    prompt: 'Retrieve the last 90 days of daily OHLCV data for Meta (ticker: META)
      from Yahoo Finance using the yfinance Python library. Ensure the data is cleaned,
      sorted, and formatted correctly. Return lists with the following fields: Date
      (ISO format), Open, High, Low, Close, and Volume.'
  fetch_nvidia_stock_data_yahoo:
    agent: false
    description: Fetches Nvidia (NVDA) stock data for the last 90 days from Yahoo
      Finance and formats it as lists.
    name: fetch_nvidia_stock_data_yahoo
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of dates in ISO format, sorted ascending.
      key: dates
      type: str
    - description: List of daily opening prices corresponding to each date.
      key: open_prices
      type: float
    - description: List of daily high prices corresponding to each date.
      key: high_prices
      type: float
    - description: List of daily low prices corresponding to each date.
      key: low_prices
      type: float
    - description: List of daily closing prices corresponding to each date.
      key: close_prices
      type: float
    - description: List of daily traded volumes corresponding to each date.
      key: volumes
      type: int
    prd:
      bullets:
      - complexity: LOW
        impact: LOW
        method: Use 'import yfinance as yf' and 'from datetime import datetime' in
          the script.
        reason: yfinance is the sole data source required; datetime is needed to format
          dates into ISO strings.
        text: Import the yfinance library and the datetime module to fetch and process
          dates.
      - complexity: LOW
        impact: LOW
        method: 'ticker = yf.Ticker(''NVDA'')

          period = ''90d''

          interval = ''1d'''
        reason: Specifying the exact ticker and period ensures the correct data range
          is retrieved from Yahoo Finance.
        text: Define the ticker symbol 'NVDA' and set the data period to 90 days with
          daily interval.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Implement a try-except block that retries up to 3 times with a 5-second
          delay between attempts; set a reasonable timeout parameter.
        reason: Network reliability can vary; a retry loop ensures data retrieval
          success without manual intervention.
        text: Use the ticker.history() method to pull OHLCV data, handling potential
          network failures with a retry loop and timeout.
      - complexity: LOW
        impact: MEDIUM
        method: Check DataFrame columns against the expected list; raise a descriptive
          error if any are missing.
        reason: Ensures downstream steps have the expected schema; missing columns
          can break the pipeline.
        text: 'Verify the returned DataFrame contains all required columns: Date,
          Open, High, Low, Close, Volume.'
      - complexity: LOW
        impact: LOW
        method: Use df.index.strftime('%Y-%m-%d').tolist() to produce the date list.
        reason: Uniform date format facilitates sorting and compatibility with downstream
          JSON serialization.
        text: Convert the DataFrame index (dates) to ISO 8601 formatted strings (YYYY-MM-DD).
      - complexity: LOW
        impact: LOW
        method: Apply df.sort_index(ascending=True) before extracting columns.
        reason: Some data sources may return unsorted data; sorting guarantees chronological
          order.
        text: Sort the DataFrame by the Date index in ascending order to match the
          output specification.
      - complexity: LOW
        impact: LOW
        method: 'open_prices = df[''Open''].astype(float).tolist()

          high_prices = df[''High''].astype(float).tolist()

          low_prices = df[''Low''].astype(float).tolist()

          close_prices = df[''Close''].astype(float).tolist()

          volumes = df[''Volume''].astype(int).tolist()'
        reason: The output structure requires specific primitive types; casting prevents
          type mismatches.
        text: 'Extract each OHLCV column into separate Python lists, casting to the
          correct primitive types: float for prices and int for volume.'
      - complexity: LOW
        impact: MEDIUM
        method: Use df.dropna(subset=['Open', 'High', 'Low', 'Close', 'Volume']) before
          extraction.
        reason: Missing values can corrupt the resulting lists and violate the assumption
          that each list has the same length.
        text: Perform data cleaning by removing rows with NaN values in any of the
          OHLCV fields.
      - complexity: LOW
        impact: LOW
        method: len(dates) == len(open_prices) == ...; else raise ValueError('Output
          list length mismatch').
        reason: Ensures data consistency; a mismatch indicates a problem in the cleaning
          or extraction steps.
        text: Validate that all six output lists have equal lengths, raising an informative
          exception if not.
      - complexity: LOW
        impact: LOW
        method: 'Construct {''dates'': dates, ''open_prices'': open_prices, ...} and
          return.'
        reason: The node's consumer expects a JSON-serializable payload with the specified
          fields.
        text: Return a dictionary containing the six lists, ready for serialization
          to JSON.
      - complexity: LOW
        impact: LOW
        method: Use Python's logging module; log INFO messages after each major operation.
        reason: Logging provides visibility into the node's operations without altering
          the functional output.
        text: Add comprehensive logging at each critical step (fetch, cleaning, conversion)
          to aid debugging and traceability.
    prompt: 'Retrieve the last 90 days of daily OHLCV data for Nvidia (ticker: NVDA)
      from Yahoo Finance using the yfinance Python library. Ensure the data is cleaned,
      sorted, and formatted correctly. Return lists with the following fields: Date
      (ISO format), Open, High, Low, Close, and Volume.'
