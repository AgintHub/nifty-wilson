dag_type: plain_text
description: Generated workflow from UI.
name: construct_pathophysiology_framework
nodes:
  analyze_cardiopulmonary_hemodynamics:
    agent: false
    description: Define heart-lung circulatory interactions
    name: analyze_cardiopulmonary_hemodynamics
    nodes_depended_on:
    - integrate_cardiovascular_pathophysiology
    - integrate_respiratory_pathophysiology
    - integrate_system_interaction_framework
    nodes_dependent_on: []
    prompt: Analyze cardiopulmonary hemodynamic interactions including right heart-lung
      coupling and systemic-pulmonary circulation relationships.
  analyze_diabetes_multisystem_effects:
    agent: false
    description: Model diabetes effects across multiple organ systems
    name: analyze_diabetes_multisystem_effects
    nodes_depended_on:
    - integrate_cardiopulmonary_interactions
    - integrate_neuroendocrine_interactions
    - integrate_immunorenal_interactions
    nodes_dependent_on: []
    prompt: Analyze how diabetes affects cardiovascular, renal, neurological, and
      immune systems simultaneously.
  analyze_glomerular_immune_mechanisms:
    agent: false
    description: Define immune-mediated kidney injury pathways
    name: analyze_glomerular_immune_mechanisms
    nodes_depended_on:
    - integrate_immune_pathophysiology
    - integrate_renal_pathophysiology
    - integrate_system_interaction_framework
    nodes_dependent_on: []
    prompt: Analyze immune mechanisms in glomerular disease including immune complex
      deposition, complement activation, and inflammatory responses.
  analyze_heart_failure_systemic_effects:
    agent: false
    description: Model heart failure effects on multiple organ systems
    name: analyze_heart_failure_systemic_effects
    nodes_depended_on:
    - integrate_cardiopulmonary_interactions
    - integrate_neuroendocrine_interactions
    - integrate_immunorenal_interactions
    nodes_dependent_on: []
