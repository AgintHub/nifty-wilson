dag_type: plain_text
description: A highly concurrent, fully connected DAG that acquires raw data, performs
  profiling, cleaning, feature engineering, modeling, results generation, and assembles
  a publication‑quality LaTeX report.
name: end_to_end_data_science_etl_to_latex_report
nodes:
  acquire_data_source_1:
    agent: false
    description: Download or extract the first raw data set.
    name: acquire_data_source_1
    nodes_depended_on:
    - list_data_sources
    nodes_dependent_on: []
    prompt: Retrieve the first data source as described in the list, saving it to
      a temporary location without modification.
  acquire_data_source_2:
    agent: false
    description: Download or extract the second raw data set.
    name: acquire_data_source_2
    nodes_depended_on:
    - list_data_sources
    nodes_dependent_on: []
    prompt: Retrieve the second data source as described in the list, saving it to
      a temporary location without modification.
  aggregate_profile:
    agent: false
    description: Combine profiling results into a single meta‑report.
    name: aggregate_profile
    nodes_depended_on:
    - profile_data_1
    - profile_data_2
    nodes_dependent_on: []
    prompt: Merge the two profiling tables into one markdown document, adding a brief
      interpretation of notable missingness or outliers.
  assemble_latex_document:
    agent: false
    description: Combine template, body, and figures into a single .tex file.
    name: assemble_latex_document
    nodes_depended_on:
    - create_latex_template
    - convert_narrative_to_latex
    - prepare_figures_for_latex
    nodes_dependent_on: []
    prompt: Create "latex/main.tex" that \input{template.tex} then \input{body.tex}.
      Ensure the document compiles.
  clean_data_1:
    agent: false
    description: Apply cleaning rules to the first raw data set.
    name: clean_data_1
    nodes_depended_on:
    - store_raw_data_1
    - define_cleaning_rules
    nodes_dependent_on: []
    prompt: Using the rules defined, read the first raw CSV, apply transformations,
      and output a cleaned version to "staging/clean/data1_clean.csv".
  clean_data_2:
    agent: false
    description: Apply cleaning rules to the second raw data set.
    name: clean_data_2
    nodes_depended_on:
    - store_raw_data_2
    - define_cleaning_rules
    nodes_dependent_on: []
    prompt: Using the rules defined, read the second raw CSV, apply transformations,
      and output a cleaned version to "staging/clean/data2_clean.csv".
  compile_latex_to_pdf:
    agent: false
    description: Produce the final PDF report from the assembled LaTeX source.
    name: compile_latex_to_pdf
    nodes_depended_on:
    - assemble_latex_document
    nodes_dependent_on: []
    prompt: Run pdflatex (or equivalent) on "latex/main.tex" twice to resolve references,
      producing "report.pdf" in the project root.
  convert_narrative_to_latex:
    agent: false
    description: Transform the Markdown narrative into LaTeX syntax.
    name: convert_narrative_to_latex
    nodes_depended_on:
    - write_analysis_narrative
    - create_latex_template
    nodes_dependent_on: []
    prompt: Convert the Markdown file into LaTeX code, inserting \input{results/performance.tex}
      and \includegraphics for each figure, and save as "latex/body.tex".
  create_latex_template:
    agent: false
    description: Provide a basic LaTeX document class and packages for a publication‑ready
      article.
    name: create_latex_template
    nodes_depended_on:
    - define_project_scope
    nodes_dependent_on: []
    prompt: Create a LaTeX template (preamble) including documentclass{article}, geometry,
      amsmath, graphicx, booktabs, and a bibliography style. Save as "latex/template.tex".
  define_cleaning_rules:
    agent: false
    description: Specify concrete cleaning and transformation rules based on profiling.
    name: define_cleaning_rules
    nodes_depended_on:
    - aggregate_profile
    nodes_dependent_on: []
    prompt: List, in bullet form, each cleaning action (e.g., remove duplicates, impute
      median, trim whitespace) with the column it applies to and the rationale.
  define_project_scope:
    agent: false
    description: State the scientific question, objectives, and desired deliverables
      for the analysis.
    name: define_project_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Write a concise bullet list describing the research question, analysis
      objectives, and the required sections of the final LaTeX report (e.g., introduction,
      methods, results, discussion).
  evaluate_model_linear:
    agent: false
    description: Compute performance metrics for the linear model.
    name: evaluate_model_linear
    nodes_depended_on:
    - train_model_linear
    nodes_dependent_on: []
    prompt: Calculate RMSE, MAE, and R² on the validation predictions of the linear
      model and output results as a JSON file "metrics/linear.json".
  evaluate_model_random_forest:
    agent: false
    description: Compute performance metrics for the Random Forest model.
    name: evaluate_model_random_forest
    nodes_depended_on:
    - train_model_random_forest
    nodes_dependent_on: []
    prompt: Calculate RMSE, MAE, and R² on the validation predictions of the Random
      Forest model and output results as "metrics/random_forest.json".
  evaluate_model_xgboost:
    agent: false
    description: Compute performance metrics for the XGBoost model.
    name: evaluate_model_xgboost
    nodes_depended_on:
    - train_model_xgboost
    nodes_dependent_on: []
    prompt: Calculate RMSE, MAE, and R² on the validation predictions of the XGBoost
      model and output results as "metrics/xgboost.json".
  feature_engineering:
    agent: false
    description: Create derived features required for modeling.
    name: feature_engineering
    nodes_depended_on:
    - merge_cleaned_data
    nodes_dependent_on: []
    prompt: Add at least three engineered columns (e.g., log‑transform, interaction
      term, categorical encoding) to the merged data and save as "staging/clean/feature_data.csv".
  final_model_training:
    agent: false
    description: Retrain the tuned model on the combined train + validation data.
    name: final_model_training
    nodes_depended_on:
    - hyperparameter_tuning
    nodes_dependent_on: []
    prompt: Combine training and validation CSVs, retrain the best tuned model on
      this full set, and overwrite "models/final.pkl" with the final model object.
  generate_data_catalog:
    agent: false
    description: Create a machine‑readable catalog describing all raw assets.
    name: generate_data_catalog
    nodes_depended_on:
    - store_raw_data_1
    - store_raw_data_2
    nodes_dependent_on: []
    prompt: 'Produce a JSON file listing each raw asset with fields: filename, size
      (bytes), checksum, source description, and timestamp of acquisition.'
  generate_reproducibility_checklist:
    agent: false
    description: Create a checklist documenting all steps, versions, and random seeds
      used.
    name: generate_reproducibility_checklist
    nodes_depended_on:
    - compile_latex_to_pdf
    - final_model_training
    - hyperparameter_tuning
    - feature_engineering
    nodes_dependent_on: []
    prompt: List in markdown all software packages with versions, data source URLs,
      random seeds, and any non‑deterministic settings. Save as "REPRODUCIBILITY.md".
  generate_results_figures:
    agent: false
    description: Create publication‑quality plots (e.g., residuals, feature importance).
    name: generate_results_figures
    nodes_depended_on:
    - final_model_training
    nodes_dependent_on: []
    prompt: Generate a residual plot and a feature‑importance bar chart for the final
      model, export both as PDF files in "figures/".
  generate_results_tables:
    agent: false
    description: Produce LaTeX‑compatible tables summarizing model performance on
      the test set.
    name: generate_results_tables
    nodes_depended_on:
    - final_model_training
    - split_dataset
    nodes_dependent_on: []
    prompt: Evaluate the final model on the test CSV, compute RMSE, MAE, R², and format
      these results as a LaTeX table saved as "results/performance.tex".
  hyperparameter_tuning:
    agent: false
    description: Run a grid search on the selected model to improve performance.
    name: hyperparameter_tuning
    nodes_depended_on:
    - select_best_model
    - split_dataset
    nodes_dependent_on: []
    prompt: Perform a 5‑point grid search over relevant hyperparameters for the chosen
      model using the validation set, record the best hyperparameter set, and save
      the tuned model as "models/best_tuned.pkl".
  list_data_sources:
    agent: false
    description: Enumerate all external data sources required for the project.
    name: list_data_sources
    nodes_depended_on:
    - define_project_scope
    nodes_dependent_on: []
    prompt: Based on the project scope, list each data source (e.g., API, CSV file,
      database) with its URL or connection string, format, and expected size.
  list_model_candidates:
    agent: false
    description: Enumerate machine‑learning algorithms to be tried.
    name: list_model_candidates
    nodes_depended_on:
    - define_project_scope
    nodes_dependent_on: []
    prompt: Provide a bullet list of at least four candidate models (e.g., Linear
      Regression, Random Forest, XGBoost, Neural Network) with a one‑sentence rationale
      for each.
  merge_cleaned_data:
    agent: false
    description: Merge the two cleaned tables into a single dataset.
    name: merge_cleaned_data
    nodes_depended_on:
    - clean_data_1
    - clean_data_2
    nodes_dependent_on: []
    prompt: Join the two cleaned CSV files on their common key(s) using an inner join,
      and save the result as "staging/clean/merged_clean.csv".
  package_final_report:
    agent: false
    description: Bundle the PDF, source code, data descriptors, and reproducibility
      docs into a zip archive.
    name: package_final_report
    nodes_depended_on:
    - compile_latex_to_pdf
    - generate_reproducibility_checklist
    - generate_data_catalog
    nodes_dependent_on: []
    prompt: Create a zip file named "final_report_package.zip" containing "report.pdf",
      the "latex/" directory, "models/", "figures/", "data/", "REPRODUCIBILITY.md",
      and the data catalog JSON.
  prepare_figures_for_latex:
    agent: false
    description: Ensure figure files are in a LaTeX‑compatible format and placed correctly.
    name: prepare_figures_for_latex
    nodes_depended_on:
    - generate_results_figures
    nodes_dependent_on: []
    prompt: Move all PDF figure files into "latex/figures/" and verify they are named
      exactly as referenced in the LaTeX body.
  profile_data_1:
    agent: false
    description: Compute descriptive statistics for the first raw data set.
    name: profile_data_1
    nodes_depended_on:
    - store_raw_data_1
    nodes_dependent_on: []
    prompt: Generate a table of column‑wise statistics (count, distinct, missing %,
      mean, std, min, max) for the first raw CSV.
  profile_data_2:
    agent: false
    description: Compute descriptive statistics for the second raw data set.
    name: profile_data_2
    nodes_depended_on:
    - store_raw_data_2
    nodes_dependent_on: []
    prompt: Generate a table of column‑wise statistics (count, distinct, missing %,
      mean, std, min, max) for the second raw CSV.
  select_best_model:
    agent: false
    description: Choose the model with the best validation performance.
    name: select_best_model
    nodes_depended_on:
    - evaluate_model_linear
    - evaluate_model_random_forest
    - evaluate_model_xgboost
    nodes_dependent_on: []
    prompt: Compare the three JSON metric files and identify the model with the lowest
      RMSE. Output the model name and path to its .pkl file in a markdown file "model_selection.md".
  split_dataset:
    agent: false
    description: Create training, validation, and test splits.
    name: split_dataset
    nodes_depended_on:
    - store_clean_data
    nodes_dependent_on: []
    prompt: Randomly split "analysis_ready.csv" into 70% train, 15% validation, 15%
      test CSV files saved under "data/" with appropriate naming.
  store_clean_data:
    agent: false
    description: Commit the final analysis‑ready dataset to the repository.
    name: store_clean_data
    nodes_depended_on:
    - validate_clean_data
    nodes_dependent_on: []
    prompt: Copy "feature_data.csv" to "data/analysis_ready.csv" and record its SHA256
      checksum in a log file.
  store_raw_data_1:
    agent: false
    description: Move the first verified raw file to the staging area.
    name: store_raw_data_1
    nodes_depended_on:
    - verify_data_source_1
    nodes_dependent_on: []
    prompt: Copy the first raw data file into the project’s "staging/raw" directory,
      preserving the original filename.
  store_raw_data_2:
    agent: false
    description: Move the second verified raw file to the staging area.
    name: store_raw_data_2
    nodes_depended_on:
    - verify_data_source_2
    nodes_dependent_on: []
    prompt: Copy the second raw data file into the project’s "staging/raw" directory,
      preserving the original filename.
  train_model_linear:
    agent: false
    description: Train a linear regression model on the training set.
    name: train_model_linear
    nodes_depended_on:
    - split_dataset
    - list_model_candidates
    nodes_dependent_on: []
    prompt: Fit a linear regression using the training CSV, predict on the validation
      set, and save the trained model object as "models/linear.pkl".
  train_model_random_forest:
    agent: false
    description: Train a Random Forest model on the training set.
    name: train_model_random_forest
    nodes_depended_on:
    - split_dataset
    - list_model_candidates
    nodes_dependent_on: []
    prompt: Fit a Random Forest (use 200 trees) on the training CSV, predict on the
      validation set, and save the model as "models/random_forest.pkl".
  train_model_xgboost:
    agent: false
    description: Train an XGBoost model on the training set.
    name: train_model_xgboost
    nodes_depended_on:
    - split_dataset
    - list_model_candidates
    nodes_dependent_on: []
    prompt: Fit an XGBoost classifier/regressor (as appropriate) on the training CSV,
      predict on the validation set, and save the model as "models/xgboost.pkl".
  validate_clean_data:
    agent: false
    description: Perform post‑engineering validation checks.
    name: validate_clean_data
    nodes_depended_on:
    - feature_engineering
    nodes_dependent_on: []
    prompt: Verify that no columns contain NaN values, that all numeric features are
      within expected ranges, and output a brief validation summary.
  verify_data_source_1:
    agent: false
    description: Validate integrity of the first raw data file (e.g., checksum, schema).
    name: verify_data_source_1
    nodes_depended_on:
    - acquire_data_source_1
    nodes_dependent_on: []
    prompt: Compute and report an MD5/SHA256 checksum for the first data file and
      confirm that required columns are present.
  verify_data_source_2:
    agent: false
    description: Validate integrity of the second raw data file.
    name: verify_data_source_2
    nodes_depended_on:
    - acquire_data_source_2
    nodes_dependent_on: []
    prompt: Compute and report an MD5/SHA256 checksum for the second data file and
      confirm that required columns are present.
  write_analysis_narrative:
    agent: false
    description: Draft the main sections of the report in Markdown.
    name: write_analysis_narrative
    nodes_depended_on:
    - generate_results_tables
    - generate_results_figures
    - define_project_scope
    nodes_dependent_on: []
    prompt: Write Introduction, Methods, Results, and Discussion sections in Markdown,
      referencing the tables and figures generated earlier. Keep each section under
      500 words.
