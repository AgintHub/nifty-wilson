dag_type: plain_text
description: Generated workflow with explicit self-attention decomposition into linear
  projections, score computation, softmax, and multi-head attention
name: layer_norm_and_decomposed_self_attention
nodes:
  attention_score_computation:
    agent: false
    description: Calculate self-attention scores between tokens
    name: attention_score_computation
    nodes_depended_on:
    - linear_projections
    nodes_dependent_on:
    - softmax_weighted_sum
    prompt: 'For each pair of tokens in the input JSON array:


      - Compute dot product between `q_proj` and `k_proj` of token pairs


      - Scale scores by sqrt(dimension of projections)


      - Add new field `attn_scores` with attention score matrix


      Preserve all existing fields. Output updated JSON array.'
  layernorm_pre_normalization:
    agent: false
    description: Apply layer normalization across blocks 1-5
    name: layernorm_pre_normalization
    nodes_depended_on:
    - token_positional_info
    - transformer_block_5
    nodes_dependent_on:
    - linear_projections
    prompt: 'For each token in the JSON array from prior blocks:


      For fields `block1` to `block5`:


      - Map string values to numeric: 1 for processed/true/validated/finalized/complete,
      0 otherwise


      - Normalize numeric values across fields using layer normalization


      - Add new field `layernorm` with normalized value


      Output updated JSON array.'
  linear_projections:
    agent: false
    description: Generate Q/K/V vectors through linear projection
    name: linear_projections
    nodes_depended_on:
    - layernorm_pre_normalization
    nodes_dependent_on:
    - attention_score_computation
    prompt: 'For each token in the input JSON array:


      - Compute separate linear projections for queries, keys, and values from the
      `layernorm` field


      - Add new fields: `q_proj`, `k_proj`, `v_proj` with corresponding vectors


      Preserve all existing fields. Output updated JSON array.'
  multi_head_attention:
    agent: false
    description: Combine outputs from multiple attention heads
    name: multi_head_attention
    nodes_depended_on:
    - softmax_weighted_sum
    nodes_dependent_on: []
    prompt: 'For each token in the input JSON array:


      - Concatenate results from parallel attention heads (assume 8 heads by default)


      - Apply final linear projection on the concatenated result


      - Add new field `block6` with attention-aggregated numeric value


      - Preserve all existing fields. Output final JSON array with `block6` indicating
      1.0 for prioritized tokens or 0.5 for others.'
  softmax_weighted_sum:
    agent: false
    description: Apply softmax to attention scores and compute weighted values
    name: softmax_weighted_sum
    nodes_depended_on:
    - attention_score_computation
    nodes_dependent_on:
    - multi_head_attention
    prompt: 'For each token in the input JSON array:


      - Apply softmax to `attn_scores` dimension for normalization


      - Multiply resulting attention weights with `v_proj` vectors


      - Add new field `weighted_vals` with resulting vectors


      Preserve all existing fields. Output updated JSON array.'
  token_positional_info:
    agent: false
    description: Generate token objects with positional information for both prompt
      and output
    name: token_positional_info
    nodes_depended_on:
    - tokenizer_customization
    nodes_dependent_on:
    - transformer_block_1
    - transformer_block_2
    - transformer_block_3
    - transformer_block_4
    - transformer_block_5
    - layernorm_pre_normalization
    prompt: Using the tokenizer configuration code, apply tokenizer to 'Hello world!'
      and 'Hello world'. For each token, provide start and end character positions.
      Return JSON array with 'token', 'start', 'end', and 'context' ("prompt" or "output").
  tokenizer_customization:
    agent: false
    description: Produce final tokenizer configuration code for single letters/words
    name: tokenizer_customization
    nodes_depended_on: []
    nodes_dependent_on:
    - token_positional_info
    prompt: Customize tokenizer to recognize single alphabetic letters (a-z, case-insensitive)
      or full English words. Provide final configuration code/regex.
  transformer_block_1:
    agent: false
    description: Add transformer block 1 completion status flag
    name: transformer_block_1
    nodes_depended_on:
    - token_positional_info
    nodes_dependent_on:
    - transformer_block_2
    prompt: Add 'block1' field set to 'processed' to each token in JSON array.
  transformer_block_2:
    agent: false
    description: Add transformer block 2 true processing status flag
    name: transformer_block_2
    nodes_depended_on:
    - token_positional_info
    - transformer_block_1
    nodes_dependent_on:
    - transformer_block_3
    prompt: Add 'block2' field set to 'true' to each token in JSON array.
  transformer_block_3:
    agent: false
    description: Add transformer block 3 validation status flag
    name: transformer_block_3
    nodes_depended_on:
    - token_positional_info
    - transformer_block_1
    - transformer_block_2
    nodes_dependent_on:
    - transformer_block_4
    prompt: Add 'block3' field set to 'validated' to each token in JSON array.
  transformer_block_4:
    agent: false
    description: Add transformer block 4 finalization status flag
    name: transformer_block_4
    nodes_depended_on:
    - token_positional_info
    - transformer_block_1
    - transformer_block_2
    - transformer_block_3
    nodes_dependent_on:
    - transformer_block_5
    prompt: Add 'block4' field set to 'finalized' to each token in JSON array.
  transformer_block_5:
    agent: false
    description: Add transformer block 5 completion status flag
    name: transformer_block_5
    nodes_depended_on:
    - token_positional_info
    - transformer_block_1
    - transformer_block_2
    - transformer_block_3
    - transformer_block_4
    nodes_dependent_on:
    - layernorm_pre_normalization
    prompt: Add 'block5' field set to 'complete' to each token in JSON array.
