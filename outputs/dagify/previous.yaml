      Path to the configuration file generated for testing.\")\n    test_binary_path:\
      \ str = Field(..., description=\"Path to the compiled test binaries.\")\n  \
      \  environment_variables: str = Field(..., description=\"List of environment\
      \ variable assignments used during testing.\")\n\n\nclass RunDynamicTestsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for run_dynamic_tests node outputs.\"\"\"\n    total_tests_run:\
      \ int = Field(..., description=\"Total number of tests executed.\")\n    tests_passed:\
