dag_type: plain_text
description: Transformer blocks with attention heads, layer normalization, and feedforward
  networks in residual connections
name: parallel_self_attention_heads_with_feedforward_blocks
nodes:
  feedforward_network_block1:
    agent: false
    description: Apply feedforward neural network transformation for block1
    name: feedforward_network_block1
    nodes_depended_on: []
    nodes_dependent_on:
    - residual_connection_feedforward_block1
    prompt: Implement feedforward network using two linear projections with GeLU activation
      in between
  feedforward_network_block2:
    agent: false
    description: Apply feedforward neural network transformation for block2
    name: feedforward_network_block2
    nodes_depended_on: []
    nodes_dependent_on:
    - residual_connection_feedforward_block2
    prompt: Implement feedforward network using two linear projections with GeLU activation
      in between
  feedforward_network_block3:
    agent: false
    description: Apply feedforward neural network transformation for block3
    name: feedforward_network_block3
    nodes_depended_on: []
    nodes_dependent_on:
    - residual_connection_feedforward_block3
    prompt: Implement feedforward network using two linear projections with GeLU activation
      in between
  feedforward_network_block4:
    agent: false
    description: Apply feedforward neural network transformation for block4
    name: feedforward_network_block4
    nodes_depended_on: []
    nodes_dependent_on:
    - residual_connection_feedforward_block4
    prompt: Implement feedforward network using two linear projections with GeLU activation
      in between
  feedforward_network_block5:
    agent: false
    description: Apply feedforward neural network transformation for block5
    name: feedforward_network_block5
    nodes_depended_on: []
    nodes_dependent_on:
    - residual_connection_feedforward_block5
    prompt: Implement feedforward network using two linear projections with GeLU activation
      in between
  lm_head_projection:
    agent: false
    description: Generate final language modeling output vectors
    name: lm_head_projection
    nodes_depended_on:
    - residual_connection_feedforward_block5
    nodes_dependent_on:
    - final_softmax
    prompt: Project final normalized vectors to vocabulary space
  residual_connection_feedforward_block1:
    agent: false
    description: Combine feedforward output with normalized value in block1
    name: residual_connection_feedforward_block1
    nodes_depended_on:
    - feedforward_network_block1
    nodes_dependent_on:
    - layernorm_pre_normalization_block2
    prompt: Add feedforward results to normalized residual values from attention block
  residual_connection_feedforward_block2:
    agent: false
    description: Combine feedforward output with normalized value in block2
    name: residual_connection_feedforward_block2
    nodes_depended_on:
    - feedforward_network_block2
    nodes_dependent_on:
    - layernorm_pre_normalization_block3
    prompt: Add feedforward results to normalized residual values from attention block
  residual_connection_feedforward_block3:
    agent: false
    description: Combine feedforward output with normalized value in block3
    name: residual_connection_feedforward_block3
    nodes_depended_on:
    - feedforward_network_block3
    nodes_dependent_on:
    - layernorm_pre_normalization_block4
    prompt: Add feedforward results to normalized residual values from attention block
  residual_connection_feedforward_block4:
    agent: false
    description: Combine feedforward output with normalized value in block4
    name: residual_connection_feedforward_block4
    nodes_depended_on:
    - feedforward_network_block4
    nodes_dependent_on:
    - layernorm_pre_normalization_block5
    prompt: Add feedforward results to normalized residual values from attention block
  residual_connection_feedforward_block5:
    agent: false
    description: Combine feedforward output with normalized value in block5
    name: residual_connection_feedforward_block5
    nodes_depended_on:
    - feedforward_network_block5
    nodes_dependent_on:
    - lm_head_projection
    prompt: Add feedforward results to normalized residual values from attention block
