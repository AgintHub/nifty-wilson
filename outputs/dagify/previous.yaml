    name: analyze_hypothalamic_pituitary_axes
    nodes_depended_on:
    - integrate_neurological_pathophysiology
    - integrate_endocrine_pathophysiology
    - integrate_system_interaction_framework
    nodes_dependent_on: []
    prompt: Analyze hypothalamic-pituitary axes including HPA, HPT, and HPG axes and
      their regulatory mechanisms.
  categorize_organ_system_functions:
    agent: false
    description: Define primary functional categories for each organ system
    name: categorize_organ_system_functions
    nodes_depended_on:
    - enumerate_anatomical_organ_systems
    nodes_dependent_on: []
    prompt: For each anatomical system identified, categorize its primary functional
      roles (regulatory, metabolic, transport, protective, etc.).
  classify_autoimmune_disorders:
    agent: false
    description: Define autoimmune and inflammatory disease categories
    name: classify_autoimmune_disorders
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Classify autoimmune disorders by target tissues, immune mechanisms involved,
