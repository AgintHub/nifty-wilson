    agent: false
    description: Analyze gas exchange interactions between heart and lungs
    name: analyze_cardiopulmonary_gas_exchange
    nodes_depended_on:
    - detail_cardiovascular_pathophysiology
    - detail_respiratory_pathophysiology
    nodes_dependent_on: []
    prompt: Analyze the gas exchange interactions between cardiovascular and respiratory
      systems, focusing on oxygen delivery and carbon dioxide removal.
  analyze_cardiopulmonary_hemodynamics:
    agent: false
    description: Analyze hemodynamic interactions between heart and lungs
    name: analyze_cardiopulmonary_hemodynamics
    nodes_depended_on:
