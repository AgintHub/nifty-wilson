    - detail_respiratory_pathophysiology
    nodes_dependent_on: []
    prompt: Analyze the hemodynamic interactions between cardiovascular and respiratory
      systems, focusing on pulmonary circulation and venous return.
  analyze_immunorenal_glomerular_function:
