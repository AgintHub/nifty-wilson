    prompt: Edit the text of Chapter 4 for clarity, consistency, grammar, and flow.
      Preserve the quantum explanation. Return a revised version.
  edit_chapter_5:
    agent: false
    description: Revise Chapter 5.
    name: edit_chapter_5
    nodes_depended_on:
    - write_chapter_5
    nodes_dependent_on:
    - compile_chapters
    prompt: Edit the text of Chapter 5 for clarity, consistency, grammar, and flow.
      Preserve the quantum explanation. Return a revised version.
  edit_chapter_6:
    agent: false
    description: Revise Chapter 6.
    name: edit_chapter_6
    nodes_depended_on:
    - write_chapter_6
    nodes_dependent_on:
    - compile_chapters
    prompt: Edit the text of Chapter 6 for clarity, consistency, grammar, and flow.
      Preserve the quantum explanation. Return a revised version.
  edit_chapter_7:
    agent: false
    description: Revise Chapter 7.
    name: edit_chapter_7
    nodes_depended_on:
    - write_chapter_7
    nodes_dependent_on:
    - compile_chapters
    prompt: Edit the text of Chapter 7 for clarity, consistency, grammar, and flow.
