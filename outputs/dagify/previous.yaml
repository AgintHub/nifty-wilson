dag_type: plain_text
description: A workflow to solve a quadratic equation of the form ax^2 + bx + c =
  0
name: solve_quadratic_equation
nodes:
  calculate_discriminant:
    agent: false
    description: Calculate the discriminant (b^2 - 4ac) of the quadratic equation
    name: calculate_discriminant
    nodes_depended_on:
    - get_coefficients
    nodes_dependent_on: []
    prompt: Using the coefficients a, b, and c, calculate the discriminant as b^2
      - 4ac
  calculate_roots:
    agent: false
    description: Calculate the roots of the quadratic equation
    name: calculate_roots
    nodes_depended_on:
    - get_coefficients
    - calculate_discriminant
    nodes_dependent_on: []
    prompt: Using the coefficients a, b, and the discriminant, calculate the roots
      of the quadratic equation
  determine_nature_of_roots:
    agent: false
    description: Determine the nature of the roots based on the discriminant
    name: determine_nature_of_roots
    nodes_depended_on:
    - calculate_discriminant
    nodes_dependent_on: []
    prompt: Based on the discriminant, determine if the roots are real and distinct,
      real and equal, or complex
  format_roots:
    agent: false
    description: Format the roots for presentation
    name: format_roots
    nodes_depended_on:
    - calculate_roots
    - determine_nature_of_roots
    nodes_dependent_on: []
    prompt: Format the calculated roots according to their nature (real or complex)
  get_coefficients:
    agent: false
    description: Obtain the coefficients a, b, and c of the quadratic equation
    name: get_coefficients
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Enter the coefficients a, b, and c of the quadratic equation ax^2 + bx
      + c = 0
  present_solution:
    agent: false
    description: Present the final solution
    name: present_solution
    nodes_depended_on:
    - format_roots
    nodes_dependent_on: []
    prompt: Present the final roots of the quadratic equation in a clear format
