dag_type: plain_text
description: A simple workflow to test the system
name: test_workflow
nodes:
  concurrent_test_step_1:
    agent: false
    description: Run a concurrent test step 1
    name: concurrent_test_step_1
    nodes_depended_on:
    - initial_test_step
    nodes_dependent_on: []
    prompt: Perform a concurrent test operation 1.
  concurrent_test_step_2:
    agent: false
    description: Run a concurrent test step 2
    name: concurrent_test_step_2
    nodes_depended_on:
    - initial_test_step
    nodes_dependent_on: []
    prompt: Perform a concurrent test operation 2.
  final_test_step:
    agent: false
    description: Perform a final test step
    name: final_test_step
    nodes_depended_on:
    - concurrent_test_step_1
    - concurrent_test_step_2
    nodes_dependent_on: []
    prompt: Execute a final test operation based on the results of the concurrent
      steps.
  initial_test_step:
    agent: false
    description: Perform an initial test
    name: initial_test_step
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Execute a basic test operation.
