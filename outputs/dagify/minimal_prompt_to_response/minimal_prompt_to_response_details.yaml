dag_type: plain_text
description: Minimal workflow to validate a prompt, execute LLM inference, and process/validate
  the response.
name: minimal_prompt_to_response
nodes:
  process_and_validate_response:
    agent: false
    description: Decode LLM output, post-process it, validate safety/coherence, and
      format for delivery.
    name: process_and_validate_response
    nodes_depended_on:
    - run_llm_inference
    nodes_dependent_on: []
    prompt: Decode raw tokens to text, correct formatting/trivial errors, validate
      response for safety/coherence, and prepare final output with status markers.
  run_llm_inference:
    agent: false
    description: Execute the language model on the processed prompt to generate raw
      output.
    name: run_llm_inference
    nodes_depended_on:
    - validate_and_enrich_prompt
    nodes_dependent_on:
    - process_and_validate_response
    prompt: 'Run LLM inference on the validated/enriched prompt using settings: temperature=0.7,
      max_tokens=1000. Output raw token IDs.'
  validate_and_enrich_prompt:
    agent: false
    description: Check if the input prompt is valid and enrich it with contextual
      metadata.
    name: validate_and_enrich_prompt
    nodes_depended_on: []
    nodes_dependent_on:
    - run_llm_inference
    prompt: Validate the prompt for correctness and completeness. If valid, enrich
      it with contextual metadata such as current date/time and user history.
