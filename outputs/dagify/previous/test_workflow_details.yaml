dag_type: plain_text
description: A simple workflow to test the system
name: test_workflow
nodes:
  generate_test_report:
    agent: false
    description: Generate a report based on the test results
    name: generate_test_report
    nodes_depended_on:
    - validate_test_result
    nodes_dependent_on: []
    prompt: Create a summary report of the test outcome.
  initial_test_step:
    agent: false
    description: Perform an initial test operation
    name: initial_test_step
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Execute a basic test to verify system functionality.
  validate_test_result:
    agent: false
    description: Validate the result of the initial test
    name: validate_test_result
    nodes_depended_on:
    - initial_test_step
    nodes_dependent_on: []
    prompt: Check if the initial test step completed successfully.
