dag_type: spec
description: Generated workflow from UI.
name: analyze_thermal_conductivity
nodes:
  analyze_sensor_data:
    agent: false
    description: Analyze the collected sensor data to understand environmental conditions
      in the mine shaft
    name: analyze_sensor_data
    nodes_depended_on:
    - collect_sensor_data
    - extract_relevant_data_from_article
    nodes_dependent_on: []
    output_structure:
    - description: Average temperature (°C) over the measurement period
      key: avg_temperature
      type: float
    - description: Maximum recorded temperature (°C)
      key: max_temperature
      type: float
    - description: Minimum recorded temperature (°C)
      key: min_temperature
      type: float
    - description: Range of temperature (max - min) in °C
      key: temperature_range
      type: float
    - description: Variance of temperature measurements
      key: temperature_variance
      type: float
    - description: Overall temperature trend during the period (e.g., 'rising', 'stable',
        'falling')
      key: temperature_trend
      type: str
    - description: Average relative humidity (%)
      key: avg_humidity
      type: float
    - description: Maximum recorded humidity (%)
      key: max_humidity
      type: float
    - description: Minimum recorded humidity (%)
      key: min_humidity
      type: float
    - description: Range of humidity (max - min) in %
      key: humidity_range
      type: float
    - description: Variance of humidity measurements
      key: humidity_variance
      type: float
    - description: Overall humidity trend during the period
      key: humidity_trend
      type: str
    - description: Indicates whether the sensor data passed quality checks
      key: is_data_valid
      type: bool
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use Python's `len()` and `all()` functions to check list lengths and
          `None`/`NaN` presence; flag `is_data_valid` as False if any check fails.
        reason: Ensures consistency across data streams and prevents downstream calculation
          errors.
        text: Validate that `temperature_readings`, `humidity_readings`, and `timestamp_readings`
          from the `collect_sensor_data` output are non-empty lists of equal length
          and contain no nulls.
      - complexity: LOW
        impact: MEDIUM
        method: Import `numpy as np` and cast `np.array(temperature_readings, dtype=float)`
          and `np.array(humidity_readings, dtype=float)`.
        reason: NumPy provides fast arithmetic and statistical functions needed for
          large datasets.
        text: Convert the numeric lists into NumPy arrays for efficient vectorized
          operations.
      - complexity: LOW
        impact: HIGH
        method: Apply `np.mean`, `np.max`, `np.min`, `np.ptp` (peak‑to‑peak), and
          `np.var` to the temperature array.
        reason: Direct use of optimized NumPy functions guarantees accurate, performant
          calculations.
        text: 'Compute temperature statistics: average, maximum, minimum, range, and
          variance using NumPy.'
      - complexity: LOW
        impact: HIGH
        method: Apply `np.mean`, `np.max`, `np.min`, `np.ptp`, and `np.var` to the
          humidity array.
        reason: Uniform methodology across metrics simplifies validation and comparison.
        text: Compute humidity statistics analogously to temperature statistics.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Convert ISO timestamps to ordinal numbers with `pd.to_datetime`, compute
          slope with `np.polyfit(timestamps, temperatures, 1)[0]`; use thresholds
          (e.g., |slope| < 0.01 → stable).
        reason: Linear trend provides a concise, interpretable indicator of overall
          change direction.
        text: Determine temperature trend by fitting a simple linear regression to
          the timestamp vs temperature series and inspecting the slope sign; classify
          as 'rising', 'stable', or 'falling' based on absolute slope thresholds.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Apply `np.polyfit` to timestamps and humidity values; classify trend
          similarly.
        reason: Maintains consistency in trend analysis methodology.
        text: Determine humidity trend using the same linear regression approach as
          temperature, with independent slope thresholds.
      - complexity: MEDIUM
        impact: HIGH
        method: After computing stats, check for outliers with `np.abs(series - mean)
          > 5 * std`; if any exist, set `is_data_valid` to False.
        reason: Consolidates all validation checks into a single quality indicator
          for downstream nodes.
        text: Set the `is_data_valid` flag to True only if all statistical checks
          pass and no outlier detection (e.g., > 5×σ from mean) flags invalid data.
      - complexity: LOW
        impact: HIGH
        method: Construct a dict with keys matching the output structure and cast
          numeric values to Python `float`.
        reason: Ensures downstream nodes receive data in expected format without ambiguity.
        text: Return a dictionary containing all computed metrics and the validity
          flag, strictly matching the defined output structure.
    prompt: Analyze the sensor data to determine temperature fluctuations, humidity
      levels, and other relevant factors in the mine shaft during winter. Use this
      information to understand the environmental conditions.
  collect_sensor_data:
    agent: false
    description: Collect sensor data from the mine shaft in winter
    name: collect_sensor_data
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of temperature readings collected from the mine shaft
      key: temperature_readings
      type: float
    - description: List of humidity readings collected from the mine shaft
      key: humidity_readings
      type: float
    - description: List of timestamps corresponding to each data point collected
      key: timestamp_readings
      type: str
    - description: Indicates whether the collected data is valid for analysis
      key: is_data_valid
      type: bool
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use the official SDK documentation, perform unit tests on each sensor
          endpoint, and capture any initialization errors in a structured log.
        reason: Proper driver instantiation guarantees that sensor registers can be
          accessed reliably and that low‑level I/O is abstracted.
        text: Instantiate the sensor driver(s) for temperature and humidity using
          the manufacturer's SDK or open‑source library, ensuring drivers are compatible
          with the embedded platform (e.g., Raspberry Pi, PLC).
      - complexity: LOW
        impact: MEDIUM
        method: Call the driver’s configuration API with validated constants; verify
          configuration via a quick readback.
        reason: Defining bounds early prevents sensor saturation and ensures the collected
          data falls within physically plausible limits.
        text: 'Configure data acquisition parameters: set sampling period to 5 s,
          define acceptable temperature range (−30 °C to 10 °C) and humidity range
          (0 % to 100 %) to capture winter extremes.'
      - complexity: MEDIUM
        impact: HIGH
        method: Implement using a high‑resolution timer (e.g., `time.monotonic_ns()`),
          guard against drift by recalculating sleep duration, and log any missed
          reads.
        reason: A deterministic schedule ensures synchronous data streams, simplifying
          downstream analysis.
        text: 'Start a timed loop that triggers every 5 s: read temperature, read
          humidity, capture UTC ISO 8601 timestamp, and append each value to the respective
          list.'
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a validation function that returns a boolean and optional
          corrected value using a simple median filter if consecutive readings are
          flagged.
        reason: Early detection of corrupted samples prevents propagation of bad data
          into analysis steps.
        text: 'During each iteration, perform real‑time validation: check for NaN,
          sensor error codes, and out‑of‑range values; if any anomaly is detected,
          flag the reading as invalid and store a sentinel value (e.g., None).'
      - complexity: LOW
        impact: MEDIUM
        method: Use Python’s `all()` function or a vectorized NumPy operation for
          speed.
        reason: The downstream `analyze_sensor_data` node requires a single boolean
          to gate analysis; computing it here centralizes the logic.
        text: 'After the acquisition window (e.g., 2 h), compute a global validity
          flag: `is_data_valid = all(valid_readings)` where `valid_readings` is a
          boolean list corresponding to each timestamp.'
      - complexity: LOW
        impact: MEDIUM
        method: Apply a list comprehension to replace None with `float('nan')`; ensure
          output types match the defined schema.
        reason: Consistent numeric representations avoid type errors in subsequent
          statistical calculations.
        text: Package the collected lists and validity flag into the node’s output
          dictionary, converting any `None` values to `float('nan')` for consistency
          with downstream numeric operations.
      - complexity: LOW
        impact: MEDIUM
        method: Use `json.dump()` with indentation for readability and include a metadata
          header (timestamp, sensor IDs).
        reason: Long‑term storage enables reproducibility, debugging, and historical
          trend analysis.
        text: Persist the raw data locally as a JSON file named `winter_shaft_readings.json`
          and optionally upload it to a central data lake for auditability.
      - complexity: MEDIUM
        impact: HIGH
        method: Spawn a separate thread or use async callbacks to monitor elapsed
          time; handle exceptions and trigger a restart sequence defined in the driver
          API.
        reason: Fault tolerance is critical in harsh mine environments where power
          interruptions may occur.
        text: Implement a lightweight watchdog that monitors the acquisition loop;
          if the loop stalls beyond 10 s, log an error, attempt a graceful restart,
          and set `is_data_valid` to False.
    prompt: Gather sensor data related to temperature, humidity, and other relevant
      parameters from the mine shaft during winter. Ensure data is in a suitable format
      for analysis.
  compare_sensor_data_with_article_findings:
    agent: false
    description: This node compares the statistical and trend information extracted
      from the mine shaft sensor data with the thermal conductivity data reported
      in the Springer article. It calculates quantitative similarity measures, identifies
      differences, and produces a concise textual summary of the comparison.
    name: compare_sensor_data_with_article_findings
    nodes_depended_on:
    - analyze_sensor_data
    - extract_relevant_data_from_article
    nodes_dependent_on: []
    output_structure:
    - description: Correlation coefficient between sensor-derived temperature trend
        and article's thermal conductivity trend.
      key: correlation_coefficient
      type: float
    - description: Average temperature difference between sensor data and article
        reference.
      key: avg_temp_difference
      type: float
    - description: Average difference in reported thermal conductivity of boron compared
        to sensor-derived estimate.
      key: thermal_conductivity_difference
      type: float
    - description: Textual summary of key discrepancies identified.
      key: discrepancy_summary
      type: str
    - description: True if overall findings are consistent; False otherwise.
      key: findings_match
      type: bool
    - description: List of notable observations from comparison.
      key: significant_observations
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Simple null checks and boolean flags on `is_data_valid` from both
          parents.
        reason: Ensures data integrity and prevents downstream failures due to missing
          inputs.
        text: Validate that all parent node outputs are available and non‑null before
          proceeding. If any required field is missing or indicates invalid data,
          raise an error and terminate with a clear message.
      - complexity: LOW
        impact: MEDIUM
        method: Apply formula `C = K - 273.15`. Use Python float arithmetic.
        reason: Standardizes temperature units for a meaningful comparison.
        text: Convert the article’s measurement temperature from Kelvin to Celsius
          (if necessary) and compute the absolute difference with the sensor’s `avg_temperature`.
          Store this value as `avg_temp_difference`.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Keyword search in `key_findings`; regex to detect 'increase', 'decrease',
          or 'constant'; mapping to integers.
        reason: Provides a quantifiable representation of the article’s thermal conductivity
          trend for correlation analysis.
        text: Extract the numerical trend descriptor from the article’s `key_findings`.
          If the article states, for example, "conductivity increases with temperature",
          map this to a numeric trend value of +1; if it says "decreases", map to
          -1; if it is ambiguous, assign 0.
      - complexity: LOW
        impact: MEDIUM
        method: Simple conditional mapping on the string value.
        reason: Aligns sensor trend representation with article trend for a consistent
          correlation metric.
        text: Map the sensor temperature trend (from `temperature_trend` in `analyze_sensor_data`)
          to a numeric value using the same +1 / 0 / -1 scheme.
      - complexity: LOW
        impact: LOW
        method: 'Implement logic: `corr = trend_sensor * trend_article` with saturation
          to [-1,1].'
        reason: Provides a simplistic yet interpretable correlation measure given
          limited data.
        text: Compute the Pearson correlation coefficient between the two numeric
          trend values. Since we only have one value per dataset, treat the coefficient
          as the absolute product of the two trend numbers normalized to [-1, 1];
          if both trends are zero, set coefficient to 0.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Parse the methodology text with NLP to find phrases like 'k =', 'slope
          =', 'intercept ='; fallback to default values if absent.
        reason: Creates a comparable numeric value to assess conductivity differences.
        text: Estimate a sensor-derived thermal conductivity value using the sensor’s
          `avg_temperature` and the linear relation reported in the article’s `methodology_description`
          (if a slope `k` and intercept `c` are provided). If the article only gives
          a single conductivity point, assume a slope of 0 and use the provided conductivity
          as the estimate.
      - complexity: LOW
        impact: MEDIUM
        method: Simple subtraction and `abs()`.
        reason: Quantifies discrepancy in thermal conductivity between sources.
        text: Compute `thermal_conductivity_difference` as the absolute difference
          between the article’s `conductivity_value_wmK` and the sensor-derived estimate.
      - complexity: MEDIUM
        impact: HIGH
        method: String templating with placeholders replaced by computed values.
        reason: Provides a human‑readable explanation of differences for downstream
          reporting.
        text: Generate `discrepancy_summary` by concatenating key numerical differences
          and any textual mismatches (e.g., trend direction differences). Use templated
          sentences for readability.
      - complexity: LOW
        impact: HIGH
        method: Boolean logic with threshold constants.
        reason: Provides a binary flag indicating overall consistency.
        text: 'Determine `findings_match` by evaluating two conditions: (1) correlation
          coefficient magnitude ≥ 0.5 and (2) both `avg_temp_difference` and `thermal_conductivity_difference`
          below pre‑defined thresholds (e.g., 5 °C and 10 W/mK). If both hold, set
          `findings_match` to true; otherwise false.'
      - complexity: LOW
        impact: MEDIUM
        method: Create list of formatted strings.
        reason: Captures essential insights for later synthesis.
        text: 'Populate `significant_observations` with a list that includes at least:
          trend agreement/disagreement, magnitude of temperature difference, magnitude
          of conductivity difference, and any data quality notes from the parent nodes.'
    prompt: Compare the insights gained from the sensor data analysis with the results
      and conclusions from the article about the thermal conductivity of boron. Identify
      any correlations or discrepancies.
  extract_relevant_data_from_article:
    agent: false
    description: Extract relevant data related to thermal conductivity of boron from
      the article retrieved using the DOI
    name: extract_relevant_data_from_article
    nodes_depended_on:
    - retrieve_doi_metadata
    nodes_dependent_on: []
    output_structure:
    - description: Text describing the experimental or computational methodology used
        to determine thermal conductivity.
      key: methodology_description
      type: str
    - description: Measured or calculated thermal conductivity value of boron in watts
        per meter-kelvin.
      key: conductivity_value_wmK
      type: float
    - description: Temperature (in kelvin) at which the conductivity was measured
        or calculated.
      key: measurement_temperature
      type: float
    - description: Brief description of the environmental or sample conditions during
        measurement (e.g., pressure, sample purity).
      key: measurement_conditions
      type: str
    - description: List of concise findings or observations reported in the article
        regarding boron’s thermal conductivity.
      key: key_findings
      type: str
    - description: Summary of the authors’ conclusions about boron’s thermal conductivity.
      key: conclusion_summary
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use requests.get with timeout and retries; for PDF, stream binary
          content and write to temporary file; for HTML, use BeautifulSoup to capture
          article body.
        reason: Ensures we have the exact document referenced in the metadata before
          proceeding with extraction.
        text: Validate DOI input and retrieve full article text (PDF or HTML) using
          the DOI provided by the parent node. Use the Crossref or SpringerLink API
          to obtain a direct download link, then download the PDF with requests and
          handle HTTP status codes and retry logic.
      - complexity: MEDIUM
        impact: HIGH
        method: Open PDF with fitz.open, iterate pages, use page.get_text('text');
          post‑process with regex to collapse multiple newlines; filter out lines
          containing page numbers or headers.
        reason: Accurate text extraction is critical for downstream pattern matching
          and NLP parsing.
        text: Extract raw text from the downloaded PDF using a robust extraction library
          such as PyMuPDF (fitz) or PDFminer.six, preserving paragraph structure.
          Clean the extracted text by normalizing whitespace, removing footnotes and
          figure captions that are irrelevant to methodology or results.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use spaCy English model to split text into sentences; apply a regex
          to detect sentences containing all required keywords; return the first matching
          block as the ‘results block’.
        reason: Targeted extraction reduces noise and ensures the subsequent numeric
          extraction focuses on the correct data.
        text: Identify the section(s) pertaining to thermal conductivity of boron
          by searching for key phrases such as "thermal conductivity", "boron", "κ",
          "kappa", and combining them with proximity constraints (within 5–10 words).
          Use a simple keyword search first, then refine with spaCy’s sentence boundary
          detection to isolate the relevant paragraph(s).
      - complexity: MEDIUM
        impact: MEDIUM
        method: Back‑track from the results block index; collect contiguous sentences
          until a heading or blank line; join with spaces; apply a length cutoff to
          avoid overly verbose text.
        reason: Captures the experimental/computational setup directly from the authors,
          which is needed for later comparison.
        text: Parse the methodology description by extracting the paragraph(s) immediately
          preceding the results block. Look for cues such as "Experimental method",
          "Measurement procedure", or "Computational model". Concatenate these sentences
          into a single paragraph for the output field "methodology_description".
      - complexity: LOW
        impact: HIGH
        method: Python regex, int()/float() conversion, handle ValueError.
        reason: Provides a reliable numeric value while handling scientific notation.
        text: Extract the thermal conductivity value by searching the results block
          for numeric patterns followed by units "W/mK" or "W/(m·K)". Use a regex
          such as `([-+]?[0-9]*\.?[0-9]+(?:[eE][-+]?[0-9]+)?)\s*W/mK` and cast the
          captured string to float. If multiple values appear, prioritize the first
          numeric value that also appears with a temperature context.
      - complexity: LOW
        impact: MEDIUM
        method: Regex `([0-9]+(?:\.[0-9]+)?)\s*(K|°C)`; conditional conversion.
        reason: Temperature context is required for comparison with sensor data.
        text: Determine the measurement temperature by locating numeric values adjacent
          to units "K" or "°C" near the conductivity value. If the unit is °C, convert
          to Kelvin by adding 273.15. If no explicit temperature is mentioned, default
          to 298 K and flag the assumption in the output for traceability.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use spaCy NER to detect entities like Quantity and Unit; apply keyword
          search for conditions; join into single string.
        reason: Conditions influence the validity of the conductivity value.
        text: Extract measurement conditions by scanning the methodology block for
          phrases that include "pressure", "purity", "sample”, or “environment”. Concatenate
          the first three identified clauses into a concise string for the "measurement_conditions"
          output field.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Iterate over sentences in results block; filter using a verb keyword
          list; append to list.
        reason: Provides a quick summary of the article’s observations for downstream
          comparison.
        text: Compile key findings by extracting sentences in the results block that
          contain verbs like "indicates", "shows", "reveals", or “demonstrates” and
          are not part of tables or figure captions. Store each sentence in the "key_findings"
          list.
      - complexity: LOW
        impact: LOW
        method: Search for heading "Conclusion"; if absent, take last paragraph; limit
          length with string slicing.
        reason: A short, clear conclusion is needed for synthesis nodes.
        text: Summarize the authors’ conclusion by locating the section titled "Conclusion"
          or the final paragraph of the article. Extract the first two sentences,
          or up to 200 characters, as a concise summary for the "conclusion_summary"
          output field.
      - complexity: LOW
        impact: HIGH
        method: Compare float to expected min/max; if out of bounds, assign null and
          log via standard logger.
        reason: Prevents downstream propagation of erroneous data.
        text: Validate all extracted numeric values against reasonable physical ranges
          (e.g., thermal conductivity of boron typically 200–400 W/mK). If a value
          falls outside, log a warning and set the output field to null for that field.
      - complexity: LOW
        impact: HIGH
        method: Build a Python dict; cast floats; use json.dumps with ensure_ascii=False.
        reason: Strict adherence to output schema is required for DAG execution.
        text: Return a dictionary matching the defined output structure, ensuring
          data types match (e.g., lists for "key_findings", floats for numeric fields,
          strings otherwise). Serialize the result as JSON for downstream nodes.
    prompt: Analyze the article retrieved using the DOI and extract data related to
      the thermal conductivity of boron. Focus on methodologies, results, and conclusions.
  retrieve_doi_metadata:
    agent: false
    description: Retrieve metadata associated with the given DOI from the Springer
      article library
    name: retrieve_doi_metadata
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The title of the Springer article
      key: title
      type: str
    - description: List of authors of the article
      key: authors
      type: str
    - description: Publication date of the article in ISO 8601 format (YYYY-MM-DD)
      key: publication_date
      type: str
    - description: List of keywords associated with the article
      key: keywords
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: MEDIUM
        method: Use a compiled regular expression in Python; if match fails, log and
          return empty output.
        reason: Ensures that only syntactically correct DOIs are sent to the API,
          reducing unnecessary calls and potential errors.
        text: Validate the DOI string against the standard DOI regex pattern (10.\d{4,9}/[-._;()/:A-Z0-9]+)
          and return an error if it does not match.
      - complexity: LOW
        impact: HIGH
        method: Use os.getenv('SPRINGER_API_KEY') in the runtime environment; validate
          that the string is non‑empty.
        reason: Springer’s metadata endpoint requires authenticated requests; missing
          the key would cause the request to fail.
        text: Retrieve the Springer API key from the environment variable SPRINGER_API_KEY;
          if missing, raise a configuration error.
      - complexity: LOW
        impact: MEDIUM
        method: 'Use the requests library; set a timeout (e.g., 10s) and include headers
          ''Accept: application/json''.'
        reason: This URL is the official metadata service endpoint for Springer's
          REST API and returns JSON which is easy to parse.
        text: Construct an HTTPS GET request to https://api.springer.com/metadata/01
          with query parameters doi={doi}&format=json&api_key={api_key}.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a retry loop; use time.sleep with back‑off; raise custom
          exception on final failure.
        reason: Robustness to network or API limits ensures the workflow does not
          fail abruptly.
        text: 'Handle HTTP errors: for status codes 4xx/5xx, log the error code and
          response body; for 429 (rate limit), retry with exponential back‑off up
          to 3 attempts.'
      - complexity: LOW
        impact: MEDIUM
        method: Iterate over JSON dict; handle optional fields with defaults; use
          list comprehensions.
        reason: Direct mapping from Springer's schema to the required output types
          preserves data integrity.
        text: Parse the JSON payload to extract the title (field 'title' or 'title[0]'),
          authors (field 'author' array; concatenate givenName and surname for each),
          publication date (combine 'publicationDate' components into YYYY-MM-DD,
          default missing month/day to '01'), and keywords (array of 'keyword' objects).
      - complexity: LOW
        impact: LOW
        method: Apply str.title() and a set to remove duplicates.
        reason: Springer may provide duplicate or differently formatted author entries;
          deduplication prevents redundancy.
        text: Normalize author names to title‑case full names and deduplicate entries
          before returning the authors list.
      - complexity: LOW
        impact: LOW
        method: Construct a dict with keys 'title', 'authors', 'publication_date',
          'keywords'; use json.dumps for serialization if needed.
        reason: Maintains contract with downstream nodes, avoiding schema violations.
        text: Return a JSON object conforming to the defined output structure; if
          any field is missing, populate with an empty string or empty list.
    prompt: Use the provided DOI to fetch metadata from the Springer article library.
      Extract title, authors, publication date, and keywords.
  synthesize_comparison_results:
    agent: false
    description: Generate a comprehensive analysis that consolidates the comparison
      outcomes between sensor-derived environmental data and the Springer article
      findings on boron thermal conductivity, producing structured outputs such as
      summaries, observations, correlation scores, discrepancies, implications, and
      recommendations.
    name: synthesize_comparison_results
    nodes_depended_on:
    - compare_sensor_data_with_article_findings
    nodes_dependent_on: []
    output_structure:
    - description: A concise paragraph summarizing the key outcomes of the comparison.
      key: overall_summary
      type: str
    - description: List of important observations identified during the comparison.
      key: key_observations
      type: str
    - description: A numeric value (0 to 1) indicating the strength of correlation
        between sensor data trends and the article’s reported thermal conductivity
        values.
      key: correlation_score
      type: float
    - description: List of notable discrepancies or conflicting data points between
        the sensor analysis and the article.
      key: discrepancies
      type: str
    - description: Explanation of how the comparison results affect understanding
        of boron thermal conductivity under winter mine conditions.
      key: implications
      type: str
    - description: Practical recommendations or next steps derived from the analysis.
      key: recommendations
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Use a lightweight data‑extract function that pulls named attributes
          from the parent JSON; cast numeric types to float; store them in local variables
          for subsequent synthesis.
        reason: Direct mapping preserves the integrity of quantitative evidence while
          conforming to the expected output schema.
        text: Extract and map the core numerical fields from the parent output—specifically
          correlation_coefficient, avg_temp_difference, and thermal_conductivity_difference—to
          the new output fields correlation_score, overall_summary, and key_observations,
          ensuring type consistency.
      - complexity: LOW
        impact: MEDIUM
        method: If correlation_coefficient > 1 or < -1, clip to [-1,1] then take absolute
          value; if negative, interpret magnitude as strength; optionally round to
          two decimal places.
        reason: The specification explicitly requires a correlation_score between
          0 and 1; parent output may use Pearson r or other coefficients that need
          adjustment.
        text: Normalize correlation_coefficient to a 0‑to‑1 scale if it is not already
          within that range (e.g., by applying min‑max scaling or clipping), then
          assign it to correlation_score.
      - complexity: MEDIUM
        impact: HIGH
        method: Define a string template with placeholders; format numeric values
          to one decimal place; use conditional logic to adjust wording based on findings_match
          (e.g., 'consistent' vs 'inconsistent').
        reason: A structured summary provides a quick, human‑readable snapshot that
          aligns with the output format while embedding all key metrics.
        text: 'Compose overall_summary using template-driven natural language generation:
