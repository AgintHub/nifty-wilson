dag_type: plain_text
description: A workflow to find the nearest restaurants to a given location
name: find_nearest_restaurants
nodes:
  filter_restaurants_by_distance:
    agent: false
    description: Filter the list of restaurants to find the nearest ones
    name: filter_restaurants_by_distance
    nodes_depended_on:
    - search_restaurants
    nodes_dependent_on:
    - sort_restaurants
    prompt: From the list of restaurants, filter out those that are beyond a reasonable
      distance (e.g., 5 km). Provide the filtered list.
  get_user_location:
    agent: false
    description: Obtain the user's current location
    name: get_user_location
    nodes_depended_on: []
    nodes_dependent_on:
    - search_restaurants
    prompt: Get the user's current location. Provide the latitude and longitude.
  return_nearest_restaurants:
    agent: false
    description: Return the nearest restaurants to the user's location
    name: return_nearest_restaurants
    nodes_depended_on:
    - sort_restaurants
    nodes_dependent_on: []
    prompt: From the sorted list, return the top N nearest restaurants (e.g., top
      5). Provide their names, distances, and any other relevant details.
  search_restaurants:
    agent: false
    description: Search for restaurants near the user's location
    name: search_restaurants
    nodes_depended_on:
    - get_user_location
    nodes_dependent_on:
    - filter_restaurants_by_distance
    prompt: Using the user's location, search for nearby restaurants. Provide a list
      of restaurant names, their distances, and coordinates.
  sort_restaurants:
    agent: false
    description: Sort the filtered restaurants by distance
    name: sort_restaurants
    nodes_depended_on:
    - filter_restaurants_by_distance
    nodes_dependent_on:
    - return_nearest_restaurants
    prompt: Sort the filtered list of restaurants by their distance from the user's
      location. Provide the sorted list.
