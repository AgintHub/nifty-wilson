dag_type: plain_text
description: A workflow for writing a storybook about going to Mars and then going
  to Neptune for an 8-year-old.
name: write_storybook_for_8_year_old
nodes:
  define_storybook_characters:
    agent: false
    description: Define the main characters in the storybook.
    name: define_storybook_characters
    nodes_depended_on: []
    nodes_dependent_on:
    - define_storybook_settings
    - define_storybook_plot
    prompt: What characters should be in the storybook, and what should they look
      like? List at least 2 main characters, 1 antagonist, and 1 sidekick.
  define_storybook_plot:
    agent: false
    description: Define the plot of the storybook.
    name: define_storybook_plot
    nodes_depended_on: []
    nodes_dependent_on:
    - define_storybook_characters
    - define_storybook_settings
    prompt: What is the main plot of the storybook? Describe the beginning, middle,
      and end. Make sure it includes the characters and setting defined earlier.
  define_storybook_settings:
    agent: false
    description: Define the setting of the storybook.
    name: define_storybook_settings
    nodes_depended_on: []
    nodes_dependent_on:
    - define_storybook_characters
    - define_storybook_plot
    prompt: What kind of setting should the storybook take place in? Should it be
      on Mars or Neptune? Describe the environment and any notable features.
  edit_storybook:
    agent: false
    description: Edit the storybook to make sure it is error-free and engaging.
    name: edit_storybook
    nodes_depended_on:
    - write_storybook_opening_scene
    - write_storybook_middle_scene
    - write_storybook_climax_scene
    - write_storybook_conclusion_scene
    nodes_dependent_on: []
    prompt: Go over the entire storybook and make any necessary edits. Make sure the
      story flows well and is engaging.
  finalize_storybook:
    agent: false
    description: Finalize the storybook.
    name: finalize_storybook
    nodes_depended_on:
    - edit_storybook
    - illustrate_storybook
    nodes_dependent_on: []
    prompt: Review the final storybook and make sure everything is complete and correct.
      Make any final edits as needed.
  illustrate_storybook:
    agent: false
    description: Add illustrations to the storybook.
    name: illustrate_storybook
    nodes_depended_on:
    - edit_storybook
    nodes_dependent_on: []
    prompt: Add illustrations to the storybook to make it more visually appealing.
      Make sure the illustrations fit with the rest of the story.
  write_storybook_climax_scene:
    agent: false
    description: Write the climax scene of the storybook.
    name: write_storybook_climax_scene
    nodes_depended_on:
    - define_storybook_characters
    - define_storybook_settings
    nodes_dependent_on:
    - write_storybook_opening_scene
    - write_storybook_middle_scene
    prompt: Write the climax scene of the storybook. Describe the main character(s)
      overcoming obstacles and learning a valuable lesson.
  write_storybook_conclusion_scene:
    agent: false
    description: Write the conclusion scene of the storybook.
    name: write_storybook_conclusion_scene
    nodes_depended_on:
    - define_storybook_characters
    - define_storybook_settings
    nodes_dependent_on:
    - write_storybook_opening_scene
    - write_storybook_middle_scene
    - write_storybook_climax_scene
    prompt: Write the conclusion scene of the storybook. Describe the main character(s)
      reflecting on their experience and the lessons they learned.
  write_storybook_middle_scene:
    agent: false
    description: Write the middle scene of the storybook.
    name: write_storybook_middle_scene
    nodes_depended_on:
    - define_storybook_characters
    - define_storybook_settings
    nodes_dependent_on:
    - write_storybook_opening_scene
    prompt: Write the middle scene of the storybook. Describe the main character(s)
      experiencing the setting and facing obstacles.
  write_storybook_opening_scene:
    agent: false
    description: Write the opening scene of the storybook.
    name: write_storybook_opening_scene
    nodes_depended_on:
    - define_storybook_characters
    - define_storybook_settings
    nodes_dependent_on: []
    prompt: Write the opening scene of the storybook. Introduce the main character(s)
      and setting.
