dag_type: plain_text
description: Generated workflow from UI with LLM inference split into transformer
  component stages.
name: minimal_prompt_to_response_transformer_split
nodes:
  feed_forward:
    agent: false
    description: Apply position-wise feed-forward neural networks to the attention
      outputs.
    name: feed_forward
    nodes_depended_on:
    - self_attention
    nodes_dependent_on:
    - output_logits
    prompt: Pass the attention output through a position-wise feed-forward network
      consisting of two linear transformations with ReLU activation.
  output_logits:
    agent: false
    description: Generate raw prediction logits from the final decoder block output.
    name: output_logits
    nodes_depended_on:
    - feed_forward
    nodes_dependent_on:
    - process_and_validate_response
    prompt: Convert the final decoder output to raw prediction logits using the model's
      output linear layer.
  positional_encoding:
    agent: false
    description: Add positional vectors to token embeddings to preserve sequence information.
    name: positional_encoding
    nodes_depended_on:
    - token_embedding
    nodes_dependent_on:
    - self_attention
    prompt: Add sinusoidal positional vectors to the embedded token vectors based
      on the transformer's positional encoding scheme.
  process_and_validate_response:
    agent: false
    description: Decode LLM output, post-process it, validate safety/coherence, and
      format for delivery.
    name: process_and_validate_response
    nodes_depended_on:
    - output_logits
    nodes_dependent_on: []
    prompt: Decode raw token logits to text, correct formatting/trivial errors, validate
      response for safety/coherence, and prepare final output with status markers.
  self_attention:
    agent: false
    description: Compute self-attention weights and context vectors for the positionally
      encoded embeddings.
    name: self_attention
    nodes_depended_on:
    - positional_encoding
    nodes_dependent_on:
    - feed_forward
    prompt: Compute Q, K, V projections and self-attention weights for the current
      sequence. Output the resulting context vectors for further processing.
  token_embedding:
    agent: false
    description: Convert input tokens to dense vector embeddings based on the model's
      learned parameters.
    name: token_embedding
    nodes_depended_on:
    - validate_and_enrich_prompt
    nodes_dependent_on:
    - positional_encoding
    prompt: Convert input tokens to dense vector embeddings based on the model's learned
      parameters. Output the embedded vectors ready for positional encoding.
  validate_and_enrich_prompt:
    agent: false
    description: Check if the input prompt is valid and enrich it with contextual
      metadata.
    name: validate_and_enrich_prompt
    nodes_depended_on: []
    nodes_dependent_on:
    - token_embedding
    prompt: Validate the prompt for correctness and completeness. If valid, enrich
      it with contextual metadata such as current date/time and user history.
