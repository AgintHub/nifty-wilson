dag_type: typed
description: Generated workflow from UI.
name: meta_google_nvidia_trading_strategy
nodes:
  backtest_strategy:
    agent: false
    description: Runs a backtest of the strategy.
    name: backtest_strategy
    nodes_depended_on:
    - design_trading_strategy
    - compute_daily_returns
    nodes_dependent_on: []
    output_structure:
    - description: List of trade execution dates in ISO format
      key: trade_dates
      type: List[str]
    - description: 'List of trade actions taken: ''Buy'', ''Sell'', or ''Exit'''
      key: trade_actions
      type: List[str]
    - description: List of number of shares traded on each trade
      key: trade_shares
      type: List[int]
    - description: List of trade execution prices per share
      key: trade_prices
      type: List[float]
    - description: List of available capital after each trade execution
      key: trade_capital_after
      type: List[float]
    prompt: 'Simulate the strategy over the three‑month period using the daily returns
      data. Assume a starting capital of $100,000, no transaction costs, and position
      sizing per the PositionSizeRule. Produce a CSV of backtest trades with columns:
      Date, Action (Buy/Sell/Exit), Shares, Price, CapitalAfterTrade.'
  calculate_performance_metrics:
    agent: false
    description: Evaluates backtest results.
    name: calculate_performance_metrics
    nodes_depended_on:
    - backtest_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Cumulative return of the strategy over the backtest period.
      key: cumulative_return
      type: float
    - description: Annualized Sharpe ratio assuming risk‑free rate 0.
      key: annualized_sharpe_ratio
      type: float
    - description: Maximum drawdown observed during the backtest.
      key: maximum_drawdown
      type: float
    - description: Percentage of trades that were profitable.
      key: win_rate
      type: float
    - description: Average duration of a trade in days.
      key: average_trade_duration
      type: float
    prompt: 'From the backtest trade log, compute performance metrics: cumulative
      return, annualized Sharpe ratio (risk‑free rate 0), maximum drawdown, win rate,
      and average trade duration. Return a JSON with these metrics.'
  compute_daily_returns:
    agent: false
    description: Calculates daily log returns for Meta, Google, and Nvidia and adds
      the columns to the dataset.
    name: compute_daily_returns
    nodes_depended_on:
    - preprocess_data
    nodes_dependent_on: []
    output_structure:
    - description: File path to the CSV file containing the dataset with the added
        return columns.
      key: csv_file_path
      type: str
    - description: Number of rows in the output dataset.
      key: row_count
      type: int
    prompt: 'Add three new columns to the preprocessed dataset: META_Return, GOOGL_Return,
      NVDA_Return, calculated as the daily log‑return of each stock''s Close price.
      Return the dataset with the new columns.'
  compute_statistics:
    agent: false
    description: Generates summary statistics of the daily log returns for Meta, Google,
      and Nvidia, including mean, standard deviation, pairwise correlations, and skewness.
    name: compute_statistics
    nodes_depended_on:
    - compute_daily_returns
    nodes_dependent_on: []
    output_structure:
    - description: Mean of META_Return values
      key: meta_return_mean
      type: float
    - description: Standard deviation of META_Return values
      key: meta_return_std
      type: float
    - description: Skewness of META_Return values
      key: meta_return_skew
      type: float
    - description: Mean of GOOGL_Return values
      key: googl_return_mean
      type: float
    - description: Standard deviation of GOOGL_Return values
      key: googl_return_std
      type: float
    - description: Skewness of GOOGL_Return values
      key: googl_return_skew
      type: float
    - description: Mean of NVDA_Return values
      key: nvda_return_mean
      type: float
    - description: Standard deviation of NVDA_Return values
      key: nvda_return_std
      type: float
    - description: Skewness of NVDA_Return values
      key: nvda_return_skew
      type: float
    - description: Pearson correlation between META_Return and GOOGL_Return
      key: corr_meta_googl
      type: float
    - description: Pearson correlation between META_Return and NVDA_Return
      key: corr_meta_nvda
      type: float
    - description: Pearson correlation between GOOGL_Return and NVDA_Return
      key: corr_googl_nvda
      type: float
    prompt: 'For META_Return, GOOGL_Return, and NVDA_Return, compute the following
      statistics: mean, standard deviation, correlation with each other, and skewness.
      Return a JSON object with these metrics.'
  design_trading_strategy:
    agent: false
    description: Formulates the trading strategy logic.
    name: design_trading_strategy
    nodes_depended_on:
    - compute_statistics
    - generate_features
    - perform_pairwise_correlation
    nodes_dependent_on: []
    output_structure:
    - description: The name of the trading strategy
      key: StrategyName
      type: str
    - description: Textual description of the entry rule for the strategy
      key: EntryRule
      type: str
    - description: Textual description of the exit rule for the strategy
      key: ExitRule
      type: str
    - description: Textual description of how positions are sized for the strategy
      key: PositionSizeRule
      type: str
    prompt: 'Based on the computed statistics and engineered features, propose a simple
      statistical arbitrage strategy that trades the pair Meta and Google. The strategy
      should specify entry and exit rules using the rolling correlation and moving
      averages. Return a JSON object with fields: StrategyName, EntryRule, ExitRule,
      PositionSizeRule.'
  fetch_google_stock_data:
    agent: false
    description: Collects Google stock price data for the last 90 days.
    name: fetch_google_stock_data
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of dates in ISO format (YYYY-MM-DD) sorted ascending.
      key: dates
      type: List[str]
    - description: List of daily opening prices corresponding to each date.
      key: open_prices
      type: List[float]
    - description: List of daily high prices corresponding to each date.
      key: high_prices
      type: List[float]
    - description: List of daily low prices corresponding to each date.
      key: low_prices
      type: List[float]
    - description: List of daily closing prices corresponding to each date.
      key: close_prices
      type: List[float]
    - description: List of daily traded volumes corresponding to each date.
      key: volumes
      type: List[int]
    prompt: 'Retrieve the last 90 days of daily OHLCV data for Google (ticker: GOOGL)
      from a reliable public source. Return a CSV with columns: Date, Open, High,
      Low, Close, Volume, sorted ascending by Date.'
  fetch_meta_stock_data:
    agent: false
    description: Collects Meta stock price data for the last 90 days.
    name: fetch_meta_stock_data
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of dates in ISO format
      key: dates
      type: List[str]
    - description: List of opening prices
      key: opens
      type: List[float]
    - description: List of high prices
      key: highs
      type: List[float]
    - description: List of low prices
      key: lows
      type: List[float]
    - description: List of closing prices
      key: closes
      type: List[float]
    - description: List of traded volumes
      key: volumes
      type: List[int]
    prompt: 'Retrieve the last 90 days of daily OHLCV data for Meta (ticker: META)
      from a reliable public source. Return a CSV with columns: Date, Open, High,
      Low, Close, Volume, sorted ascending by Date.'
  fetch_nvidia_stock_data:
    agent: false
    description: Collects Nvidia stock price data for the last 90 days.
    name: fetch_nvidia_stock_data
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of dates in ISO format, sorted ascending
      key: dates
      type: List[str]
    - description: List of opening prices corresponding to each date
      key: open_prices
      type: List[float]
    - description: List of highest prices corresponding to each date
      key: high_prices
      type: List[float]
    - description: List of lowest prices corresponding to each date
      key: low_prices
      type: List[float]
    - description: List of closing prices corresponding to each date
      key: close_prices
      type: List[float]
    - description: List of traded volumes corresponding to each date
      key: volumes
      type: List[int]
    prompt: 'Retrieve the last 90 days of daily OHLCV data for Nvidia (ticker: NVDA)
      from a reliable public source. Return a CSV with columns: Date, Open, High,
      Low, Close, Volume, sorted ascending by Date.'
  generate_features:
    agent: false
    description: Adds moving averages and rolling volatility features.
    name: generate_features
    nodes_depended_on:
    - preprocess_data
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of dates corresponding to each feature value.
      key: date_list
      type: List[str]
    - description: 10‑day simple moving average of Meta Close for each date.
      key: META_MovingAvg_10
      type: List[float]
    - description: 10‑day simple moving average of Google Close for each date.
      key: GOOGL_MovingAvg_10
      type: List[float]
    - description: 5‑day rolling standard deviation of Meta Close for each date.
      key: META_Std_5
      type: List[float]
    - description: 5‑day rolling standard deviation of Google Close for each date.
      key: GOOGL_Std_5
      type: List[float]
    prompt: 'From the cleaned dataset, create the following feature columns:


      - META_MovingAvg_10: 10‑day simple moving average of Meta Close.

      - GOOGL_MovingAvg_10: 10‑day simple moving average of Google Close.

      - META_Std_5: 5‑day rolling standard deviation of Meta Close.

      - GOOGL_Std_5: 5‑day rolling standard deviation of Google Close.


      Return the dataset with the new feature columns added.'
  generate_strategy_report:
    agent: false
    description: Creates the final written report of the strategy.
    name: generate_strategy_report
    nodes_depended_on:
    - design_trading_strategy
    - calculate_performance_metrics
    nodes_dependent_on: []
    output_structure:
    - description: Markdown text containing the complete strategy report.
      key: report_markdown
      type: str
    prompt: 'Compose a concise strategy report summarizing:


      1. Strategy description.

      2. Key statistical insights used.

      3. Backtest performance metrics.

      4. Recommendations for next steps.

      Present the report as markdown text.'
  merge_stock_datasets:
    agent: false
    description: Creates a unified dataset containing Meta and Google OHLCV data.
    name: merge_stock_datasets
    nodes_depended_on:
    - fetch_meta_stock_data
    - fetch_google_stock_data
    nodes_dependent_on: []
    output_structure:
    - description: CSV rows of the merged Meta and Google OHLCV data sorted by Date.
        The first element contains the header line with all prefixed column names
        (e.g., Date, META_Open, GOOGL_Open, META_High, GOOGL_High, etc.). Each subsequent
        element is a data row in the same order.
      key: merged_csv
      type: List[str]
    prompt: Merge the two CSV datasets from Meta and Google on the Date column. Keep
      rows that have dates present in both datasets. Prefix columns with META_ or
      GOOGL_ as appropriate. Return a single CSV with all columns sorted by Date.
  merge_stock_datasets_nvidia:
    agent: false
    description: Extends the merged dataset to include Nvidia OHLCV data.
    name: merge_stock_datasets_nvidia
    nodes_depended_on:
    - merge_stock_datasets
    - fetch_nvidia_stock_data
    nodes_dependent_on: []
    output_structure:
    - description: CSV formatted string containing the merged data from Meta, Google,
        and Nvidia with columns prefixed as META_, GOOGL_, NVDA_, sorted by Date.
      key: csv_data
      type: str
    prompt: Take the CSV output from merge_stock_datasets and the CSV from fetch_nvidia_stock_data.
      Merge them on the Date column, keeping only rows with dates present in all three
      datasets. Prefix Nvidia columns with NVDA_. Return a single CSV with all columns
      sorted by Date.
  perform_pairwise_correlation:
    agent: false
    description: Generates a rolling correlation feature between Meta and Google returns.
    name: perform_pairwise_correlation
    nodes_depended_on:
    - compute_daily_returns
    nodes_dependent_on: []
    output_structure:
    - description: The updated dataset in CSV format, including the new column META_GOOGL_RollingCorr_20.
      key: csv_data
      type: str
    prompt: Compute the rolling 20‑day correlation between META_Return and GOOGL_Return.
      Add a column META_GOOGL_RollingCorr_20 to the dataset. Return the updated dataset.
  preprocess_data:
    agent: false
    description: Cleans and normalizes the merged dataset.
    name: preprocess_data
    nodes_depended_on:
    - merge_stock_datasets_nvidia
    nodes_dependent_on: []
    output_structure:
    - description: The cleaned dataset in CSV format, sorted by Date.
      key: cleaned_csv
      type: str
    - description: Number of rows in the cleaned dataset.
      key: row_count
      type: int
    prompt: 'For the merged dataset, perform the following preprocessing steps:


      1. Convert Date column to ISO format.

      2. Fill any missing numeric values using forward‑fill.

      3. Remove rows where both Meta and Google have missing Close values.


      Return the cleaned dataset as a CSV.'
