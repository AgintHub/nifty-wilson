dag_type: spec
description: Generated workflow from UI.
name: meta_google_nvidia_trading_strategy
nodes:
  backtest_strategy:
    agent: false
    description: Runs a backtest of the trading strategy defined in the Design Trading
      Strategy node over the dataset produced by Compute Daily Returns. The backtest
      simulates daily trading decisions, records every executed trade, and outputs
      the trade log as lists of dates, actions, shares, prices, and capital after
      each trade.
    name: backtest_strategy
    nodes_depended_on:
    - design_trading_strategy
    - compute_daily_returns
    nodes_dependent_on: []
    output_structure:
    - description: List of trade execution dates in ISO format
      key: trade_dates
      type: List[str]
    - description: 'List of trade actions taken: ''Buy'', ''Sell'', or ''Exit'''
      key: trade_actions
      type: List[str]
    - description: List of number of shares traded on each trade
      key: trade_shares
      type: List[int]
    - description: List of trade execution prices per share
      key: trade_prices
      type: List[float]
    - description: List of available capital after each trade execution
      key: trade_capital_after
      type: List[float]
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use pd.read_csv(csv_file_path, parse_dates=['Date']) followed by df.sort_values('Date').reset_index(drop=True).
        reason: The backtest must process data in date order; parsing dates correctly
          guarantees accurate rolling calculations.
        text: Load the CSV produced by Compute Daily Returns and parse it into a Pandas
          DataFrame, ensuring the 'Date' column is parsed as a datetime object and
          sorted chronologically.
      - complexity: LOW
        impact: MEDIUM
        method: Deserialize the JSON using json.loads and assign each key to a variable.
        reason: The strategy logic is provided as human‑readable text; we need to
          capture it for subsequent parsing.
        text: 'Read the JSON output from Design Trading Strategy into a dictionary
          and extract the four rule strings: StrategyName, EntryRule, ExitRule, PositionSizeRule.'
      - complexity: HIGH
        impact: HIGH
        method: 'Use regular expressions to extract operands and operators, construct
          a dictionary of allowed variables, and compile a lambda via eval in a restricted
          namespace. Example: lambda df, row: row[''META_Close''] > row[''GOOGL_Close''].'
        reason: Directly evaluating the raw text is error‑prone; a parser ensures
          deterministic and safe rule evaluation.
        text: Implement a lightweight rule‑parser that transforms the EntryRule and
          ExitRule strings into executable Python lambda functions. The parser should
          handle simple boolean expressions such as 'META_Close > GOOGL_Close', 'rolling_corr
          < 0.5', and moving average crossovers.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Regex search for patterns like r'(?P<percent>\d+)%', then set position_fraction
          = int(percent)/100.0.
        reason: Accurate position sizing is critical for realistic backtesting outcomes.
        text: Parse the PositionSizeRule string to determine the fraction of available
          capital to allocate per trade (e.g., 'Allocate 10% of capital'). Extract
          the numeric percentage using regex and convert it to a decimal.
      - complexity: MEDIUM
        impact: MEDIUM
        method: 'For a 20‑day rolling correlation: df[''rolling_corr''] = df[''META_Close''].rolling(20).corr(df[''GOOGL_Close'']);
          for a 10‑day SMA: df[''META_SMA_10''] = df[''META_Close''].rolling(10).mean().'
        reason: The strategy may rely on these indicators; missing values would cause
          rule evaluation failures.
        text: Enrich the DataFrame with any rolling indicators referenced in the rules
          but not present in the CSV (e.g., 20‑day rolling correlation, 10‑day moving
          averages). Compute these using pandas’ rolling methods and merge the results
          into the DataFrame.
      - complexity: LOW
        impact: LOW
        method: Set capital = 100000.0; position_shares = 0; trade_dates = []; trade_actions
          = []; trade_shares = []; trade_prices = []; trade_capital_after = [].
        reason: State variables are required to track capital, holdings, and trade
          history across the simulation loop.
        text: 'Initialize the backtest state: starting capital = 100,000, no open
          position, and empty lists for trade_dates, trade_actions, trade_shares,
          trade_prices, trade_capital_after.'
      - complexity: MEDIUM
        impact: HIGH
        method: 'Use the compiled lambda: if entry_rule(df, row): shares_to_buy =
          floor((capital * position_fraction) / row[''META_Close'']); update capital
          and position_shares; record trade.'
        reason: Entry decisions are contingent on the current market state and capital
          allocation.
        text: Iterate over the DataFrame row by row. At each date, first evaluate
          the EntryRule if no position is currently held. If the rule evaluates to
          True, compute the number of shares to purchase using the position fraction
          and the current closing price of the target asset.
      - complexity: MEDIUM
        impact: HIGH
        method: 'If exit_rule(df, row): proceeds = position_shares * row[''META_Close''];
          capital += proceeds; record trade with action ''Sell''; set position_shares
          = 0.'
        reason: Exit logic closes trades and locks in profits or losses.
        text: After processing an entry, evaluate the ExitRule on each subsequent
          date if a position is open. If the rule evaluates to True, sell all shares
          at the current closing price, update capital, close the position, and record
          the exit trade.
      - complexity: LOW
        impact: LOW
        method: Append to lists using list.append() after each trade event.
        reason: Ordered logs are required by the output schema and for downstream
          performance calculation.
        text: After each trade (Buy or Sell), append the execution date (ISO string),
          action, shares, price, and updated capital to their respective output lists.
          Ensure that the lists maintain the chronological order of trades.
      - complexity: LOW
        impact: LOW
        method: 'Return a dictionary mapping each key to its list, e.g., {''trade_dates'':
          trade_dates, ...}.'
        reason: These are the primitive type lists expected by downstream nodes.
        text: At the end of the loop, return the five lists (trade_dates, trade_actions,
          trade_shares, trade_prices, trade_capital_after) as the node’s output.
      - complexity: LOW
        impact: LOW
        method: Create a Pandas DataFrame from the output lists and use df.to_csv('backtest_trades.csv',
          index=False).
        reason: Provides a human‑readable record of the backtest which can aid in
          verification and reporting.
        text: 'Optionally generate a CSV file of the trade log for debugging or archival
          purposes. The CSV should have columns: Date, Action, Shares, Price, CapitalAfterTrade.'
    prompt: 'Simulate the strategy over the three‑month period using the daily returns
      data. Assume a starting capital of $100,000, no transaction costs, and position
      sizing per the PositionSizeRule. Produce a CSV of backtest trades with columns:
      Date, Action (Buy/Sell/Exit), Shares, Price, CapitalAfterTrade.'
  calculate_performance_metrics:
    agent: false
    description: Evaluates backtest results.
    name: calculate_performance_metrics
    nodes_depended_on:
    - backtest_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Cumulative return of the strategy over the backtest period.
      key: cumulative_return
      type: float
    - description: Annualized Sharpe ratio assuming risk‑free rate 0.
      key: annualized_sharpe_ratio
      type: float
    - description: Maximum drawdown observed during the backtest.
      key: maximum_drawdown
      type: float
    - description: Percentage of trades that were profitable.
      key: win_rate
      type: float
    - description: Average duration of a trade in days.
      key: average_trade_duration
      type: float
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Iterate over the length of any array and compare lengths; raise informative
          exception if discrepancy is detected.
        reason: Consistent array lengths are critical for positional alignment during
          downstream calculations; mismatches would lead to index errors or mis‑aligned
          data.
        text: Validate the integrity of the trade log by ensuring that all five input
          arrays – trade_dates, trade_actions, trade_shares, trade_prices, trade_capital_after
          – have identical lengths and contain non‑empty entries.
      - complexity: LOW
        impact: MEDIUM
        method: Use datetime.strptime for each string, store tuples (date, index),
          then sort by date; re‑index arrays accordingly.
        reason: Chronological ordering is necessary for correct computation of drawdowns,
          trade durations, and for aligning capital values with dates.
        text: Parse ISO date strings into Python datetime objects and sort the trades
          chronologically to guarantee temporal consistency.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Create a list of all dates from the earliest to the latest trade date;
          for each date, assign the capital value of the most recent trade before
          or on that date; forward‑fill missing dates.
        reason: Many performance metrics (e.g., drawdown, Sharpe) require a continuous
          daily equity curve rather than sparse trade points.
        text: Construct a daily portfolio value series for the entire backtest window
          by interpolating capital after each trade to every trading day.
      - complexity: LOW
        impact: LOW
        method: final_equity = last value in the daily equity series; initial_equity
          = trade_capital_after[0]; cumulative_return = (final_equity / initial_equity)
          - 1.
        reason: This metric directly measures overall profitability relative to the
          starting capital.
        text: Compute cumulative return as (final equity / initial equity) - 1.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use np.diff(np.log(equity_series)) to get log‑returns; compute mean
          and std dev with numpy; handle any NaNs by dropping.
        reason: Log‑returns provide a time‑additive, normally distributed basis for
          Sharpe computation, which is the industry standard.
        text: Calculate daily log‑returns of the equity curve and derive mean and
          standard deviation for the Sharpe ratio calculation.
      - complexity: LOW
        impact: MEDIUM
        method: sharpe_daily = mean_return / std_return; annual_factor = sqrt(252
          / num_trading_days); annualized_sharpe_ratio = sharpe_daily * annual_factor.
        reason: Annualization allows comparison across strategies with different backtest
          horizons.
        text: Annualize the Sharpe ratio using the square‑root of the ratio between
          the number of trading days in a year (252) and the backtest trading days.
      - complexity: MEDIUM
        impact: HIGH
        method: Maintain running maximum of equity; compute drawdown = (peak - equity)
          / peak; keep the maximum of these values.
        reason: Drawdown is a critical risk metric indicating potential capital erosion.
        text: Determine maximum drawdown by scanning the equity curve for the deepest
          decline from a historical peak to a subsequent trough.
      - complexity: LOW
        impact: LOW
        method: Iterate through indices i=1..n, count wins where trade_capital_after[i]
          > trade_capital_after[i-1]; win_rate = wins / (n-1).
        reason: Win rate quantifies the strategy’s profitability at the trade level.
        text: Identify winning trades by comparing consecutive entries in trade_capital_after;
          a trade is considered winning if the capital after the trade exceeds the
          capital before it.
      - complexity: HIGH
        impact: MEDIUM
        method: Maintain a stack of open trade dates; on 'Buy', push date; on 'Exit',
          pop date, compute duration in days, store; after processing all trades,
          average durations of completed trades.
        reason: Duration reflects strategy’s holding period characteristics, which
          influence capital allocation and risk.
        text: Calculate average trade duration by matching each 'Buy' action with
          its corresponding 'Exit' action and computing the date difference.
      - complexity: LOW
        impact: LOW
        method: Use round(value, 8) or format with f"{value:.8f}".
        reason: Consistent formatting ensures deterministic JSON outputs, simplifying
          unit tests and downstream parsing.
        text: Round all floating‑point outputs to eight decimal places to maintain
          consistency and avoid floating‑point noise in downstream reporting.
      - complexity: LOW
        impact: LOW
        method: 'Construct a dict with keys: cumulative_return, annualized_sharpe_ratio,
          maximum_drawdown, win_rate, average_trade_duration, then serialize with
          json.dumps.'
        reason: The downstream generate_strategy_report node expects this exact JSON
          schema.
        text: Return the metrics in a JSON dictionary matching the specified output
          structure.
    prompt: 'From the backtest trade log, compute performance metrics: cumulative
      return, annualized Sharpe ratio (risk‑free rate 0), maximum drawdown, win rate,
      and average trade duration. Return a JSON with these metrics.'
  compute_daily_returns:
    agent: false
    description: Calculates daily log returns for Meta, Google, and Nvidia and adds
      the columns to the dataset.
    name: compute_daily_returns
    nodes_depended_on:
    - preprocess_data
    nodes_dependent_on: []
    output_structure:
    - description: File path to the CSV file containing the dataset with the added
        return columns.
      key: csv_file_path
      type: str
    - description: Number of rows in the output dataset.
      key: row_count
      type: int
    prd:
      bullets:
      - complexity: LOW
        impact: MEDIUM
        method: Use `pd.read_csv(cleaned_csv, parse_dates=['Date'])`.
        reason: Pandas offers robust CSV parsing and datetime handling, which is essential
          for accurate return calculations.
        text: Load the cleaned dataset from the `preprocess_data` node's `cleaned_csv`
          output into a Pandas DataFrame, ensuring that the Date column is parsed
          as datetime.
      - complexity: LOW
        impact: MEDIUM
        method: Check DataFrame columns with `df.columns` and validate dtype with
          `pd.api.types.is_numeric_dtype`.
        reason: Ensures that the dataset has all necessary inputs before proceeding,
          preventing downstream failures.
        text: Verify that the required Close price columns (META_Close, GOOGL_Close,
          NVDA_Close) exist and contain numeric values; if missing, raise a clear
          error indicating which column is absent.
      - complexity: LOW
        impact: HIGH
        method: 'Use vectorized operations: `df[''META_Return''] = np.log(df[''META_Close'']
          / df[''META_Close''].shift(1))`, similarly for GOOGL and NVDA.'
        reason: Log returns provide additive properties and are standard in backtesting
          and statistical analysis.
        text: Compute the daily log return for each stock using the formula `return
          = np.log(Close_today / Close_yesterday)`, aligning with financial convention
          for continuously compounded returns.
      - complexity: LOW
        impact: MEDIUM
        method: Use `df.dropna(subset=['META_Return', 'GOOGL_Return', 'NVDA_Return'],
          inplace=True)` or `df.fillna(0, inplace=True)` based on design choice.
        reason: The first day lacks a prior price; deciding how to treat this missing
          value affects downstream metrics.
        text: Handle the first row where the shift operation produces NaN by filling
          it with 0 or dropping the row; document the chosen approach.
      - complexity: LOW
        impact: LOW
        method: 'Confirm with `df.dtypes` and convert if necessary using `df.astype({''META_Return'':
          ''float64'', ...})`.'
        reason: Ensures consistency of output types for downstream nodes.
        text: Add the three new return columns to the DataFrame and verify their data
          types are float64.
      - complexity: LOW
        impact: MEDIUM
        method: Use `df.to_csv(output_path, index=False)`.
        reason: Providing a stable file path enables other nodes to reference the
          dataset reliably.
        text: Write the augmented DataFrame to a new CSV file in a designated temporary
          or output directory, preserving the original column order with the new columns
          appended at the end.
      - complexity: LOW
        impact: LOW
        method: 'Return a dictionary: `{''csv_file_path'': output_path, ''row_count'':
          len(df)}`.'
        reason: Matches the defined output structure, allowing downstream nodes to
          access the results.
        text: Return the path of the newly created CSV as `csv_file_path` and the
          number of rows in the DataFrame as `row_count`.
    prompt: 'Add three new columns to the preprocessed dataset: META_Return, GOOGL_Return,
      NVDA_Return, calculated as the daily log‑return of each stock''s Close price.
      Return the dataset with the new columns.'
  compute_statistics:
    agent: false
    description: Generates summary statistics of the daily log returns for Meta, Google,
      and Nvidia, including mean, standard deviation, pairwise correlations, and skewness.
    name: compute_statistics
    nodes_depended_on:
    - compute_daily_returns
    nodes_dependent_on: []
    output_structure:
    - description: Mean of META_Return values
      key: meta_return_mean
      type: float
    - description: Standard deviation of META_Return values
      key: meta_return_std
      type: float
    - description: Skewness of META_Return values
      key: meta_return_skew
      type: float
    - description: Mean of GOOGL_Return values
      key: googl_return_mean
      type: float
    - description: Standard deviation of GOOGL_Return values
      key: googl_return_std
      type: float
    - description: Skewness of GOOGL_Return values
      key: googl_return_skew
      type: float
    - description: Mean of NVDA_Return values
      key: nvda_return_mean
      type: float
    - description: Standard deviation of NVDA_Return values
      key: nvda_return_std
      type: float
    - description: Skewness of NVDA_Return values
      key: nvda_return_skew
      type: float
    - description: Pearson correlation between META_Return and GOOGL_Return
      key: corr_meta_googl
      type: float
    - description: Pearson correlation between META_Return and NVDA_Return
      key: corr_meta_nvda
      type: float
    - description: Pearson correlation between GOOGL_Return and NVDA_Return
      key: corr_googl_nvda
      type: float
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: 'Use `pd.read_csv(csv_file_path)` with `dtype={''META_Return'': float,
          ''GOOGL_Return'': float, ''NVDA_Return'': float}` and `parse_dates` if needed.'
        reason: The downstream statistics calculation requires numeric types; reading
          via Pandas provides robust handling of CSV parsing and missing values.
        text: Read the CSV file produced by the compute_daily_returns node into a
          Pandas DataFrame, ensuring that the META_Return, GOOGL_Return, and NVDA_Return
          columns are parsed as float.
      - complexity: LOW
        impact: MEDIUM
        method: Apply `df.dropna(subset=['META_Return','GOOGL_Return','NVDA_Return'])`.
        reason: Statistical functions in Pandas ignore NaNs by default but pairwise
          correlation requires aligned rows; explicit drop ensures consistent dataset.
        text: Drop any rows where any of the return columns contain NaN to avoid distortion
          of mean, std, skewness, and correlation calculations.
      - complexity: LOW
        impact: LOW
        method: Store in variables `meta_mean = df['META_Return'].mean().round(8)`
          etc.
        reason: Mean is a simple aggregate; rounding reduces floating point noise
          in the JSON output.
        text: Compute the mean of each return series using `Series.mean()` and round
          the result to 8 decimal places for consistency.
      - complexity: LOW
        impact: LOW
        method: Use `df['META_Return'].std(ddof=1).round(8)`.
        reason: Using sample standard deviation aligns with typical financial analysis;
          rounding maintains readability.
        text: Compute the standard deviation of each return series using `Series.std(ddof=1)`
          to reflect sample std, and round to 8 decimal places.
      - complexity: LOW
        impact: LOW
        method: If Pandas does not provide skewness, use `from scipy.stats import
          skew; skew(df['META_Return']).round(8)`.
        reason: Skewness provides insight into return distribution asymmetry; rounding
          keeps output concise.
        text: Compute the skewness of each return series using `Series.skew()` from
          SciPy or Pandas, rounding to 8 decimal places.
      - complexity: LOW
        impact: LOW
        method: Create `corr_matrix = df[['META_Return','GOOGL_Return','NVDA_Return']].corr()`
          then extract `corr_meta_googl = corr_matrix.loc['META_Return','GOOGL_Return'].round(8)`
          and similarly for other pairs.
        reason: Pearson correlation captures linear dependence; rounding ensures JSON
          numerical precision.
        text: Compute Pearson correlations for each unique pair of return series using
          `DataFrame.corr(method='pearson')`, selecting the corresponding matrix entries
          and rounding to 8 decimal places.
      - complexity: LOW
        impact: LOW
        method: 'Use `output_dict = {''meta_return_mean'': meta_mean, ''meta_return_std'':
          meta_std, ...}`.'
        reason: The node contract requires a JSON object with specific keys; assembling
          in a dict guarantees correct key order and type.
        text: Assemble all computed metrics into a dictionary matching the defined
          output fields.
      - complexity: LOW
        impact: LOW
        method: Use `json.dumps(output_dict)` after converting values with `float()`
          if necessary.
        reason: JSON expects standard Python types; converting avoids serialization
          errors.
        text: Serialize the dictionary to JSON and return it as the node's output,
          ensuring that numerical values are cast to float types (not numpy floats).
    prompt: 'For META_Return, GOOGL_Return, and NVDA_Return, compute the following
      statistics: mean, standard deviation, correlation with each other, and skewness.
      Return a JSON object with these metrics.'
  design_trading_strategy:
    agent: false
    description: Formulates the trading strategy logic.
    name: design_trading_strategy
    nodes_depended_on:
    - compute_statistics
    - generate_features
    - perform_pairwise_correlation
    nodes_dependent_on: []
    output_structure:
    - description: The name of the trading strategy
      key: StrategyName
      type: str
    - description: Textual description of the entry rule for the strategy
      key: EntryRule
      type: str
    - description: Textual description of the exit rule for the strategy
      key: ExitRule
      type: str
    - description: Textual description of how positions are sized for the strategy
      key: PositionSizeRule
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use `json.load` for statistics; `pandas.read_csv` for CSVs; ensure
          date columns are parsed as datetime objects.
        reason: All strategy logic depends on the statistical summaries, moving averages,
          and rolling correlation values.
        text: '1️⃣ Load parent outputs: parse `compute_statistics` JSON, `generate_features`
          CSV, and `perform_pairwise_correlation` CSV into in‑memory data structures
          (e.g., Python dictionaries and Pandas DataFrames).'
      - complexity: LOW
        impact: HIGH
        method: Add a new column `Spread = META_Close - GOOGL_Close` in the merged
          DataFrame.
        reason: Statistical arbitrage often relies on mean‑reverting spreads; the
          spread informs entry/exit thresholds.
        text: 2️⃣ Compute the spread series as the difference between META_Close and
          GOOGL_Close, aligning on dates and dropping any NaNs resulting from feature
          lagging.
      - complexity: MEDIUM
        impact: HIGH
        method: Apply `df['Spread_SMA_10'] = df['Spread'].rolling(window=10).mean()`
          and `df['Spread_Std_5'] = df['Spread'].rolling(window=5).std()`.
        reason: Using spread‑based moving averages allows the strategy to adapt to
          changing volatility.
        text: 3️⃣ Calculate the 10‑day SMA of the spread (`Spread_SMA_10`) and its
          5‑day standard deviation (`Spread_Std_5`) to establish a dynamic mean‑reversion
          band.
      - complexity: LOW
        impact: HIGH
        method: 'Use boolean masks: `(df[''Spread''] < df[''Spread_SMA_10''] - 2*df[''Spread_Std_5''])
          & (df[''META_GOOGL_RollingCorr_20''] > 0.7)`.'
        reason: A deep negative deviation indicates a potential over‑short Google
          relative to Meta; a high correlation ensures the pair moves together.
        text: '4️⃣ Define entry conditions: go long Meta and short Google when the
          spread falls below `Spread_SMA_10 - 2 * Spread_Std_5` **and** the 20‑day
          rolling correlation `META_GOOGL_RollingCorr_20` is above 0.7.'
      - complexity: LOW
        impact: HIGH
        method: 'Create an exit mask: `(df[''Spread''] > df[''Spread_SMA_10'']) |
          (df[''META_GOOGL_RollingCorr_20''] < 0.5)`.'
        reason: Crossing the moving average signals a return to normal levels; a falling
          correlation suggests the pair may diverge.
        text: '5️⃣ Define exit conditions: close positions when the spread crosses
          the `Spread_SMA_10` line (i.e., becomes greater than `Spread_SMA_10`) or
          when the correlation drops below 0.5, whichever occurs first.'
      - complexity: LOW
        impact: MEDIUM
        method: Define `PositionSizeRule = '10% of capital per trade, split equally
          between long Meta and short Google; ensure dollar neutrality.'`
        reason: Risk‑controlled sizing limits exposure while preserving the arbitrage
          trade’s hedge.
        text: '6️⃣ Specify a conservative position‑sizing rule: allocate 10% of available
          capital per trade, divided equally between Meta and Google (long/short),
          ensuring the notional values match to maintain a market‑neutral hedge.'
      - complexity: LOW
        impact: HIGH
        method: 'Use `json.dumps` with sorted keys: `{"StrategyName":..., "EntryRule":...,
          "ExitRule":..., "PositionSizeRule":...}`.'
        reason: The backtest node expects a JSON with these exact keys; clarity reduces
          downstream errors.
        text: 7️⃣ Construct the final JSON object with four fields (`StrategyName`,
          `EntryRule`, `ExitRule`, `PositionSizeRule`) using descriptive yet concise
          language suitable for downstream backtesting.
      - complexity: LOW
        impact: MEDIUM
        method: 'Perform a schema check: assert `isinstance(value, str)` for each
          field and that length > 0.'
        reason: Ensures downstream nodes receive correctly typed data and prevents
          runtime failures.
        text: '8️⃣ Validate the JSON against the expected schema: confirm string types,
          non‑empty descriptions, and that no mandatory fields are omitted.'
      - complexity: LOW
        impact: LOW
        method: 'Print or write to a file: `logging.info(f''Strategy {strategy_name}
          with {num_trades} expected trades/month'')`.'
        reason: Facilitates debugging if backtest results are unexpected; provides
          context for performance metrics.
        text: 9️⃣ Log the generated strategy parameters and a brief summary (e.g.,
          number of expected trades per month) to a debug log for traceability.
    prompt: '# Prompt


      Based on the computed statistics and engineered features, propose a simple statistical
      arbitrage strategy that trades the pair Meta and Google. The strategy should
      specify entry and exit rules using the rolling correlation and moving averages.
      Return a JSON object with fields: StrategyName, EntryRule, ExitRule, PositionSizeRule.'
  fetch_google_stock_data:
    agent: false
    description: Collects Google (GOOGL) stock price data for the most recent 90 calendar
      days, ensuring the data is cleaned, sorted, and converted into the specified
      list outputs.
    name: fetch_google_stock_data
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of dates in ISO format (YYYY-MM-DD) sorted ascending.
      key: dates
      type: str
    - description: List of daily opening prices corresponding to each date.
      key: open_prices
      type: float
    - description: List of daily high prices corresponding to each date.
      key: high_prices
      type: float
    - description: List of daily low prices corresponding to each date.
      key: low_prices
      type: float
    - description: List of daily closing prices corresponding to each date.
