dag_type: plain_text
description: A technology‑centric build plan for a music management system, detailing
  database design, backend API, frontend UI, search integration, testing, and documentation
  without any human interaction steps.
name: music_management_system_tech_flow
nodes:
  define_requirements:
    agent: false
    description: Specify the core technology stack and components needed to build
      the system.
    name: define_requirements
    nodes_depended_on: []
    nodes_dependent_on:
    - design_database_schema
    - develop_user_interface
    prompt: "# Define technical requirements\n\nUsing your preferred tech stack, produce\
      \ a concise JSON list of the required technical components:\n- Database type\
      \ (e.g., PostgreSQL, MongoDB)\n- Backend language/framework (e.g., Node.js/Express)\n\
      - Frontend framework (e.g., React, Vue)\n- Authentication strategy (e.g., JWT,\
      \ OAuth2)\n- Deployment platform (e.g., Docker, Kubernetes)\n- Third‑party services\
      \ (e.g., S3, Redis)\n\nOutput only the JSON object.\n\n```json\n{\n  \"database\"\
      : \"...\",\n  \"backend\": \"...\",\n  \"frontend\": \"...\",\n  \"auth\": \"\
      ...\",\n  \"deployment\": \"...\",\n  \"third_party\": [\"...\"]\n}\n```\n"
  design_database_schema:
    agent: false
    description: Create SQL schema for storing music data.
    name: design_database_schema
    nodes_depended_on:
    - define_requirements
    nodes_dependent_on:
    - implement_album_api
    - implement_artist_api
    - implement_playlist_api
    - implement_track_api
    prompt: '# Design database schema


      Create SQL `CREATE TABLE` statements for the following entities, including appropriate
      primary keys, foreign keys, indexes, and constraints:

      - `artists` (id, name, bio)

      - `albums` (id, artist_id, title, release_date)

      - `tracks` (id, album_id, title, duration)

      - `playlists` (id, name, description)

      - `playlist_tracks` (playlist_id, track_id, position)


      Include sample `INSERT` statements for each table.


      Output the SQL script.

      '
  develop_user_interface:
    agent: false
    description: Create frontend component stubs for managing music entities.
    name: develop_user_interface
    nodes_depended_on:
    - define_requirements
    nodes_dependent_on:
    - implement_album_api
    - implement_artist_api
    - implement_playlist_api
    - implement_track_api
    prompt: '# Build UI skeleton


      Generate React component skeletons for the following managers, using hooks and
      React Router:

      - `ArtistManager` (list, create, update, delete)

      - `AlbumManager` (list, create, update, delete)

      - `TrackManager` (list, create, update, delete)

      - `PlaylistManager` (list, create, update, delete, reorder)


      Provide minimal JSX, state hooks, and placeholder API calls.

      '
  generate_api_documentation:
    agent: false
    description: Create machine‑readable API documentation.
    name: generate_api_documentation
    nodes_depended_on:
    - run_automated_tests
    nodes_dependent_on: []
    prompt: '# Generate API documentation


      Produce an OpenAPI 3.0 YAML file that documents all API endpoints created above,
      including request/response schemas and example payloads.

      Also include a brief README snippet describing how to run the server.

      '
  implement_album_api:
    agent: false
    description: Create backend CRUD endpoints for albums.
    name: implement_album_api
    nodes_depended_on:
    - design_database_schema
    - develop_user_interface
    nodes_dependent_on:
    - implement_search_api
    - run_automated_tests
    prompt: '# Album API implementation


      Write Express.js route handlers for `/albums`:

      - `GET /albums` – list albums

      - `POST /albums` – create album

      - `PUT /albums/:id` – update album

      - `DELETE /albums/:id` – delete album


      Use Sequelize models, validate input, and return JSON responses with appropriate
      status codes.

      '
  implement_artist_api:
    agent: false
    description: Create backend CRUD endpoints for artists.
    name: implement_artist_api
    nodes_depended_on:
    - design_database_schema
    - develop_user_interface
    nodes_dependent_on:
    - implement_search_api
    - run_automated_tests
    prompt: '# Artist API implementation


      Write Express.js route handlers for `/artists`:

      - `GET /artists`

      - `POST /artists`

      - `PUT /artists/:id`

      - `DELETE /artists/:id`


      Use Sequelize, validate input, handle errors, and return JSON.

      '
  implement_playlist_api:
    agent: false
    description: Create backend CRUD endpoints for playlists.
    name: implement_playlist_api
    nodes_depended_on:
    - design_database_schema
    - develop_user_interface
    nodes_dependent_on:
    - implement_search_api
    - run_automated_tests
    prompt: '# Playlist API implementation


      Write Express.js route handlers for `/playlists` and `/playlists/:id/tracks`:

      - CRUD for playlists

      - Add/remove/reorder tracks within a playlist


      Use Sequelize models, validate input, and respond with JSON.

      '
  implement_search_api:
    agent: false
    description: Provide search functionality across all music entities.
    name: implement_search_api
    nodes_depended_on:
    - implement_album_api
    - implement_artist_api
    - implement_playlist_api
    - implement_track_api
    nodes_dependent_on:
    - run_automated_tests
    prompt: '# Search API implementation


      Add `/search` endpoint that accepts query parameters `title`, `artist`, `album`,
      `playlist`.

      Implement full‑text search or filtered queries using Sequelize.

      Return a JSON object containing matching records for each entity type.

      '
  implement_track_api:
    agent: false
    description: Create backend CRUD endpoints for tracks.
    name: implement_track_api
    nodes_depended_on:
    - design_database_schema
    - develop_user_interface
    nodes_dependent_on:
    - implement_search_api
    - run_automated_tests
    prompt: '# Track API implementation


      Write Express.js route handlers for `/tracks`:

      - `GET /tracks`

      - `POST /tracks`

      - `PUT /tracks/:id`

      - `DELETE /tracks/:id`


      Use Sequelize, validate input, handle errors, and return JSON.

      '
  run_automated_tests:
    agent: false
    description: Execute unit and integration tests for the system.
    name: run_automated_tests
    nodes_depended_on:
    - implement_album_api
    - implement_artist_api
    - implement_playlist_api
    - implement_track_api
    - implement_search_api
    nodes_dependent_on:
    - generate_api_documentation
    prompt: '# Automated testing


      Write Jest tests for all API routes and React components:

      - Test success and error scenarios.

      - Use `supertest` for API endpoints.

      - Use `@testing-library/react` for UI components.


      Provide test files for each module.

      '
