dag_type: spec
description: Generated workflow from UI.
name: hedge_fund_trading_strategy_workflow_with_yahoo_finance_parallel_fetch
nodes:
  backtest_trading_strategy:
    agent: false
    description: Performs a rigorous, production‑grade backtest of the fully specified
      trading strategy using the fetched Yahoo Finance data, the asset universe, and
      the signal generation logic.
    name: backtest_trading_strategy
    nodes_depended_on:
    - develop_trading_signal_logic
    - specify_asset_universe
    - fetch_stock_data_yahoo_data
    - fetch_stock_data_yahoo_status
    nodes_dependent_on: []
    output_structure:
    - description: Cumulative return of the strategy over the backtest period, expressed
        as a decimal (e.g., 0.12 for 12%).
      key: total_return
      type: float
    - description: Annualized Sharpe ratio of the strategy, assuming a risk‑free rate
        of 0%.
      key: annualized_sharpe_ratio
      type: float
    - description: Maximum drawdown observed during the backtest, expressed as a decimal.
      key: max_drawdown
      type: float
    - description: Total count of executed trades (both entries and exits) throughout
        the backtest.
      key: number_of_trades
      type: int
    - description: ISO‑format start date of the backtest period (YYYY‑MM‑DD).
      key: backtest_period_start
      type: str
    - description: ISO‑format end date of the backtest period (YYYY‑MM‑DD).
      key: backtest_period_end
      type: str
    - description: True if the backtest completed without errors; false otherwise.
      key: success
      type: bool
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use pandas.read_csv with StringIO, set parse_dates=True, date_parser=pd.to_datetime,
          tz='UTC'; validate column order with assert statements.
        reason: Standardizing data format guarantees downstream calculations operate
          on a consistent schema and eliminates hidden timezone bugs.
        text: Parse the CSV strings from **fetch_stock_data_yahoo_data** into pandas
          DataFrames, enforce UTC DatetimeIndex, and ensure columns are exactly ['Open','High','Low','Close','Adj
          Close','Volume'].
      - complexity: MEDIUM
        impact: HIGH
        method: Determine min(max_start_date) and max(min_end_date) across tickers;
          generate pandas.bdate_range; for each DataFrame, df.reindex(master_index,
          method='ffill'); drop rows where any ticker still has NaN using df.dropna(how='any').
        reason: Aligning on a common index is essential for accurate signal evaluation
          and portfolio aggregation across assets.
        text: Create a master business‑day calendar covering the intersection of all
          ticker date ranges; reindex each ticker DataFrame onto this calendar, forward‑fill
          missing values, and drop leading rows with any NaN after alignment.
      - complexity: HIGH
        impact: HIGH
        method: Parse the list of textual rules (e.g., "If SMA_20 > SMA_50 then BUY")
          into pandas boolean masks; combine masks per ticker; store results in a
          DataFrame called `signals` with same index as price data.
        reason: A deterministic, vectorised signal function enables fast daily evaluation
          and facilitates later backtesting loops.
        text: Translate **develop_trading_signal_logic.signal_logic_steps** into an
          executable Python function that takes a unified DataFrame (rows=dates, columns=multi‑index
          ticker/field) and returns a DataFrame of position intents (+1 for long,
          -1 for short, 0 for flat) per ticker per day.
      - complexity: HIGH
        impact: HIGH
        method: 'Maintain variables: cash, holdings dict, portfolio_value series;
          for each date: identify changed signals, compute trade size = (available_capital
          * allocation_per_asset) / price; subtract commission = trade_size * commission_rate;
          adjust fill price = price * (1 + slippage * sign); update holdings and cash.'
        reason: Simulating realistic trading costs and order execution is crucial
          for credible performance metrics.
        text: Implement an execution engine that iterates over the chronologically
          ordered dates, compares current positions to previous day's signals, generates
          trade orders, applies configurable commission (default 0.001 per trade)
          and slippage (default 0.0005 price offset), and updates cash and holdings
          accordingly.
      - complexity: LOW
        impact: MEDIUM
        method: equity_curve[date] = cash + sum(holdings[ticker] * close_price[ticker]
          for each ticker).
        reason: The equity curve is the basis for all downstream performance statistics.
        text: Construct the daily equity curve by summing cash plus market value of
          all holdings (position * close price) after each day's execution; store
          results in a pandas Series `equity_curve` indexed by date.
      - complexity: MEDIUM
        impact: MEDIUM
        method: 'Use numpy and pandas functions: np.sqrt(252), equity_curve.cummax()
          for drawdown calculation, and simple integer counter for trades.'
        reason: These metrics provide a standardized quantification of risk‑adjusted
          returns and trade activity.
        text: 'Calculate performance metrics: total_return = (final_equity / initial_capital)
          - 1; daily_returns = equity_curve.pct_change().dropna(); annualized_sharpe
          = sqrt(252) * mean(daily_returns) / std(daily_returns); max_drawdown = max(
          (peak - trough)/peak ) using a rolling max; number_of_trades = count of
          executed orders; backtest_period_start/end = first/last date of equity_curve.'
      - complexity: LOW
        impact: HIGH
        method: 'Use Python''s try: ... except Exception as e: success=False; log_message=str(e);
          assign default values; finally return the output dictionary.'
        reason: Robust error handling ensures the node returns a well‑defined output
          even when upstream data is malformed.
        text: Wrap the entire pipeline in a try/except block; on any exception set
          `success=False`, log the exception message to a dedicated log string, and
          populate output fields with NaN/zero defaults; otherwise set `success=True`.
    prompt: 'Using the historical price DataFrames (or CSV strings) produced by **fetch_stock_data_yahoo_data**,
      the status flags from **fetch_stock_data_yahoo_status**, the asset universe
      defined by **specify_asset_universe**, and the signal generation steps from
      **develop_trading_signal_logic**, execute a full backtest with the following
      requirements:


      1. **Data Preparation**: Align all ticker time‑series on a common business‑day
      index, forward‑fill missing values, and trim to the overlapping date range.

      2. **Signal Application**: Apply the buy/sell signal logic to generate daily
      position intents for each asset.

      3. **Execution Model**: Simulate trade execution with configurable commission,
      slippage, and capital allocation.

      4. **Equity Curve Construction**: Compute daily portfolio equity.

      5. **Metric Calculation**: Return total return, annualized Sharpe, max drawdown,
      trade count, period start/end, and a success flag.


      If any step fails, set `success` to false and provide a concise error description
      in the logs (outside the defined output fields).'
  compile_final_strategy_blueprint:
    agent: false
    description: Synthesizes the refined trading logic, rigorously defined risk‑management
      policies, and the designated asset universe into a single, end‑to‑end blueprint
      ready for implementation, back‑testing, and deployment.
    name: compile_final_strategy_blueprint
    nodes_depended_on:
    - refine_trading_strategy
    - define_risk_management_rules
    nodes_dependent_on: []
    output_structure:
    - description: High‑level narrative summarizing the strategy’s purpose, market
        thesis, target return‑to‑risk ratio, and operational cadence.
      key: blueprint_summary
      type: str
    - description: Technical description of the final entry/exit rules, indicator
        settings, parameter values, and any conditional logic after back‑testing refinement.
      key: refined_strategy_details
      type: str
    - description: Bullet‑point list (3‑5 items) of risk controls such as position
        sizing formulas, stop‑loss/take‑profit levels, max draw‑down limits, and portfolio
        exposure caps.
      key: risk_management_rules
      type: List[str]
    - description: Complete list of tradable symbols, ticker codes, or asset‑class
        identifiers that constitute the strategy’s trading scope.
      key: asset_universe
      type: List[str]
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Parse each string field, strip any leading/trailing whitespace, and
          join sections using clear headings (e.g., "## Parameter Adjustments"). Ensure
          bullet‑point consistency by prefixing each adjustment with a dash. Preserve
          original numeric precision.
        reason: The refined strategy details must capture all final rule‑level changes
          (parameters, indicators, risk tweaks) in an easily readable format for developers
          and reviewers.
        text: Extract the full refined‑strategy payload from the **refine_trading_strategy**
          node – specifically the fields `refined_strategy_summary`, `parameter_adjustments`,
          `indicator_adjustments`, and `risk_rule_adjustments` – and concatenate them
          into a single, coherent technical description for `refined_strategy_details`.
      - complexity: LOW
        impact: HIGH
        method: Iterate over the list, count elements, and perform a case‑insensitive
          search for the substring "stop‑loss". Raise a clear error message if constraints
          are violated.
        reason: Compliance with the specification guarantees a disciplined risk‑control
          framework and satisfies downstream validation checks.
        text: Read the `risk_management_rules` list from the **define_risk_management_rules**
          node and verify that the list length is between 3 and 5 items and that at
          least one rule contains the keyword "stop‑loss" (ensuring `has_stop_loss`
          is true).
      - complexity: LOW
        impact: MEDIUM
        method: Reference the global execution context to read `asset_tickers`. Validate
          that each ticker is a non‑empty string and deduplicate any accidental repeats.
        reason: Although not a direct dependency in the DAG, the blueprint must expose
          the exact symbols that will be traded; pulling them from the asset‑universe
          node ensures source‑of‑truth consistency.
        text: Obtain the asset‑universe ticker list from the **specify_asset_universe**
          node – field `asset_tickers` – and assign it to the output field `asset_universe`.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Use a template:

          ```

          [Strategy Name] – [Market Thesis]

          Target Return‑to‑Risk: [target ratio]

          Operational Cadence: [frequency]

          ```

          Populate placeholders from the refined summary and, when necessary, from
          back‑test metrics (available upstream).'
        reason: Stakeholders need a concise executive overview that communicates why
          the strategy is pursued and what performance benchmarks are expected.
        text: Craft the `blueprint_summary` string by merging (a) the strategic intent
          described in `refined_strategy_summary`, (b) the market thesis inferred
          from the chosen strategy type, and (c) quantitative targets (e.g., target
          annualized Sharpe > 1.5, max drawdown < 10%). Include a one‑sentence operational
          cadence (e.g., "Daily end‑of‑day signal generation and execution").
      - complexity: LOW
        impact: MEDIUM
        method: Create a static list of 7‑8 items, each prefixed with "- ". Store
          it as an internal variable that can be optionally appended to the `blueprint_summary`
          if desired.
        reason: A checklist ensures that every component required for production deployment
          is accounted for and can be handed off to engineering teams.
        text: 'Generate an `Implementation Checklist` as a plain‑text bullet list
          (not part of the explicit output fields but useful for internal documentation)
          covering: data ingestion, signal computation, risk‑rule enforcement, order
          routing, position monitoring, logging, and periodic performance review.'
      - complexity: LOW
        impact: HIGH
        method: Perform isinstance checks; for list elements, iterate and assert isinstance(item,
          str).
        reason: Strict type compliance prevents downstream runtime errors and aligns
          with the platform's schema enforcement.
        text: 'Validate final output types: ensure `blueprint_summary` and `refined_strategy_details`
          are strings, `risk_management_rules` is a list of strings, and `asset_universe`
          is a list of strings. Throw descriptive exceptions for any mismatch.'
      - complexity: LOW
        impact: HIGH
        method: Construct a Python dict with keys matching the field names and feed
          it to the platform's `return` routine.
        reason: Correct serialization is required for the orchestration engine to
          route the data to subsequent nodes.
        text: Serialize the four output fields into the node's response JSON adhering
          exactly to the defined `output_structure` order.
    prompt: 'Integrate the outputs from **refine_trading_strategy** (the fully‑validated
      trading logic) and **define_risk_management_rules** (the disciplined risk‑control
      framework) together with the selected **asset_universe** to construct a production‑grade
      trading‑strategy blueprint.


      Your deliverable must include:

      1. Blueprint Summary

      2. Refined Strategy Details

      3. Risk‑Management Rules

      4. Asset Universe

      5. Implementation Checklist


      Present the information in plain‑text sections matching the output fields below.'
  define_market_analysis:
    agent: false
    description: Develops a detailed blueprint of all external market data feeds and
      internal analytical methods that will be leveraged by the trading strategy.
    name: define_market_analysis
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Primary market data providers or platforms to be consumed (e.g.,
        Bloomberg, Refinitiv, Quandl, Yahoo Finance, ICE Data Services).
      key: market_data_sources
      type: List[str]
    - description: Selected analytical methods, ranging from classic technical indicators
        to advanced sentiment and macro‑factor models.
      key: analysis_techniques
      type: List[str]
    - description: A concise narrative linking the chosen data sources with the analysis
        techniques, emphasizing data fidelity, licensing considerations, and estimated
        computational resource requirements.
      key: summary_note
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Conduct desk research using vendor documentation, industry surveys,
          and existing internal data catalogs; record provider name, URL, and contact
          details in a spreadsheet.
        reason: A complete provider list ensures no critical data source is overlooked,
          which could impair signal generation or risk assessment.
        text: Create an exhaustive inventory of all potential market data providers
          relevant to the intended asset classes (equities, futures, FX, macro‑economic
          indicators, alternative data).
      - complexity: MEDIUM
        impact: HIGH
        method: Create a matrix with rows = providers, columns = data categories;
          fill cells with yes/no and short notes on coverage.
        reason: Categorization allows downstream mapping of technique inputs to the
          correct data stream.
        text: For each provider, classify the available data products into categories
          (e.g., real‑time quotes, end‑of‑day bars, fundamentals, news, sentiment,
          macro‑economics).
      - complexity: HIGH
        impact: HIGH
        method: Extract specifications from provider datasheets or API reference docs;
          store in a structured JSON schema for automated consumption.
        reason: These attributes directly affect feasibility, compliance, and budget
          planning.
        text: 'Capture technical attributes for every data product: granularity (tick,
          1‑min, daily), update latency (ms, seconds, minutes), delivery method (API,
          streaming, FTP), licensing model (subscription, per‑call, open‑source),
          and cost (USD per month or per request).'
      - complexity: MEDIUM
        impact: HIGH
        method: Apply filter criteria (e.g., latency < 500 ms for high‑frequency,
          cost < $5000/month) on the attribute matrix; output provider names as a
          plain‑text list.
        reason: Only the chosen sources will be integrated into the pipeline; a curated
          list prevents scope creep.
        text: Select the subset of providers and data products that satisfy the strategy’s
          requirements for coverage, latency, and budget, and document them as the
          final `market_data_sources` list.
      - complexity: MEDIUM
        impact: HIGH
        method: Review academic literature, industry white‑papers, and internal expertise;
          list each technique with a short definition.
        reason: A taxonomy of techniques guides the development of the signal logic
          and ensures coverage of all information dimensions.
        text: 'Identify analytical techniques needed to transform the selected data
          into actionable signals, spanning four families: statistical & technical
          indicators, machine‑learning models, sentiment & news analytics, and macro‑factor
          regressions.'
      - complexity: HIGH
        impact: HIGH
        method: 'Create a per‑technique specification table: Technique | Inputs |
          Complexity | Dependencies; use Big‑O notation and tag required Python packages.'
        reason: Explicit input‑dependency mapping prevents runtime failures and clarifies
          resource budgeting.
        text: For every technique, enumerate required inputs (specific data fields,
          look‑back windows, transformation steps), estimate computational complexity
          (O(N), O(N log N), or O(N^2)), and list software/library dependencies (e.g.,
          NumPy, pandas‑ta, TensorFlow, spaCy).
      - complexity: LOW
        impact: MEDIUM
        method: Extract the ‘Technique’ column from the specification table and output
          as a List[str].
        reason: A clean, ordered list is required by downstream nodes (identify_trading_indicators).
        text: Consolidate the technique names into the `analysis_techniques` output
          list, preserving the same order as the specification table.
      - complexity: MEDIUM
        impact: MEDIUM
        method: 'Use a templated paragraph: "Data source X provides Y (granularity
          Z) which feeds into technique A and B; licensing is …; anticipated compute
          per day is …"; ensure length < 500 words.'
        reason: The summary serves as a quick reference for architects and compliance
          officers and satisfies the node’s output requirement.
        text: Draft a concise `summary_note` that links each selected data source
          to the techniques that consume it, highlights any licensing constraints
          (e.g., redistribution limits), and provides an estimate of CPU/GPU resources
          needed for the full pipeline (e.g., 4‑core CPU, 16 GB RAM, optional GPU
          for deep‑learning models).
      - complexity: LOW
        impact: MEDIUM
        method: 'Run a Python validation script: assert isinstance(market_data_sources,
          list) and all(isinstance(s, str) for s in market_data_sources), similarly
          for analysis_techniques; ensure summary_note is a str.'
        reason: Strict type compliance avoids downstream schema violations and simplifies
          integration testing.
        text: Validate that all three output fields conform to their declared PrimitiveTypes
          and that no duplicate entries exist in the lists.
      - complexity: LOW
        impact: HIGH
        method: Construct a dictionary with keys 'market_data_sources', 'analysis_techniques',
          'summary_note' and serialize with json.dumps() (if required by the platform).
        reason: Proper packaging completes the node’s contract with the workflow engine.
        text: Package the three outputs into the final JSON payload as defined in
          `output_structure` and return it to the orchestrator.
    prompt: Compose a comprehensive catalogue of the market data ecosystem and analytical
      toolkit that will underpin the trading strategy. Enumerate data providers, data
      types, granularity, latency, licensing, and cost; list analysis techniques with
      required inputs, computational complexity, and dependencies; synthesize a summary
      linking data sources to techniques.
  define_risk_management_rules:
    agent: false
    description: Establishes a rigorous, quantitative risk‑management framework that
      translates the chosen trading strategy into actionable safeguards.
    name: define_risk_management_rules
    nodes_depended_on:
    - select_trading_strategy_type
    nodes_dependent_on: []
    output_structure:
    - description: Bullet‑point list (3‑5 items) detailing the concrete risk‑management
        rules such as position sizing, stop‑loss, max drawdown, etc.
      key: risk_management_rules
      type: List[str]
    - description: The total number of risk‑management rules provided (must be between
        3 and 5).
      key: rule_count
      type: int
    - description: True if the list includes an explicit stop‑loss rule; otherwise
        false.
      key: has_stop_loss
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Read the JSON field `strategy_type`, apply `.strip().lower()`; store
          the result in a variable `strategy`. Raise a clear error if the field is
          missing or empty.
        reason: A normalized strategy identifier eliminates case‑sensitivity bugs
          and enables reliable rule‑selection logic.
        text: Extract the `strategy_type` string from the output of the parent node
          **select_trading_strategy_type** and normalize it to lower‑case for deterministic
          matching.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Define a Python dict `RULE_TEMPLATES = { ''momentum'': [ ''Limit
          position size to X% of portfolio equity per ticker.'', ''Set a trailing
          stop‑loss at Y% below entry price.'', ''Cap daily portfolio turnover at
          Z% of total equity.'', ''Restrict maximum drawdown to D% of peak equity.'',
          ''Allocate no more than N% of capital to any single sector.'' ], ... }`.
          Ensure each list contains between 3 and 5 items and includes at least one
          stop‑loss rule.'
        reason: A deterministic mapping guarantees reproducible rule generation and
          aligns risk controls with the underlying tactical logic of each strategy.
        text: Create a static mapping dictionary where each possible `strategy_type`
          (e.g., "momentum", "mean reversion", "statistical arbitrage", "trend following")
          maps to a pre‑validated list of 3‑5 risk‑management rule templates.
      - complexity: LOW
        impact: MEDIUM
        method: Use `rules = RULE_TEMPLATES.get(strategy, RULE_TEMPLATES['generic'])`.
          Store the selected list in `selected_rules`.
        reason: Fallback handling prevents the workflow from failing for unexpected
          strategy strings while still providing sensible risk controls.
        text: Select the appropriate rule list from `RULE_TEMPLATES` using the normalized
          `strategy` key; if the key is absent, fall back to a generic baseline rule
          set and log a warning.
      - complexity: MEDIUM
        impact: MEDIUM
        method: 'Define a constants dict `DEFAULTS = { ''X'': ''2%'', ''Y'': ''5%'',
          ''Z'': ''15%'', ''D'': ''10%'', ''N'': ''20%'' }`. For each rule string,
          replace each placeholder token using regex `re.sub(r''\bX\b'', DEFAULTS[''X''],
          rule)` etc.'
        reason: Dynamic substitution turns abstract templates into actionable, concrete
          rules ready for downstream consumption.
        text: Iterate over `selected_rules` and perform placeholder substitution for
          any strategy‑specific parameters (e.g., replace X, Y, Z, D, N with concrete
          numeric values derived from typical industry standards or configurable constants).
      - complexity: LOW
        impact: HIGH
        method: 'If `rule_count < 3 or rule_count > 5`: `raise ValueError(''Risk‑management
          rule count must be between 3 and 5.'')`.'
        reason: Enforcing the rule‑count constraint ensures compliance with the node's
          output contract and downstream expectations.
        text: Compute `rule_count` as `len(selected_rules)` and verify that it lies
          within the required range [3,5]; raise a validation exception if not.
      - complexity: LOW
        impact: MEDIUM
        method: '`has_stop_loss = any(''stop-loss'' in rule.lower() for rule in selected_rules)`.'
        reason: Explicit detection of a stop‑loss rule is required for the `has_stop_loss`
          output field.
        text: Determine `has_stop_loss` by scanning the finalized rule strings for
          the substring "stop‑loss" (case‑insensitive). Set the boolean accordingly.
      - complexity: LOW
        impact: HIGH
        method: 'Create a dict `{ ''risk_management_rules'': selected_rules, ''rule_count'':
          rule_count, ''has_stop_loss'': has_stop_loss }` and return it as the node''s
          response.'
        reason: A single, well‑structured payload enables downstream nodes (e.g.,
          **compile_final_strategy_blueprint**) to consume the data without additional
          transformation.
        text: 'Assemble the final output payload: `risk_management_rules` = `selected_rules`
          (preserve order), `rule_count` = computed integer, `has_stop_loss` = boolean
          flag; serialize to the expected JSON schema.'
      - complexity: LOW
        impact: LOW
        method: 'Use the platform logger: `logger.info(f"Strategy: {strategy}; Rules:
          {selected_rules}; Count: {rule_count}; Stop‑Loss present: {has_stop_loss}")`.'
        reason: Transparent logging aids debugging and provides traceability for compliance
          reviews.
        text: Log a concise human‑readable summary containing the selected strategy,
          the generated rules, `rule_count`, and `has_stop_loss` for auditability.
    prompt: 'Draft a concise set of 3–5 concrete risk‑management rules tailored to
      the trading strategy selected in the previous step. After the bullet list, explicitly
      provide `rule_count` and `has_stop_loss` values.


      Present the bullet points in plain text (no markdown).'
  develop_trading_signal_logic:
    agent: false
    description: Transforms the set of technical indicators identified for the chosen
      strategy into a deterministic, production‑grade algorithm that emits precise
      buy and sell signals.
    name: develop_trading_signal_logic
    nodes_depended_on:
    - identify_trading_indicators
    nodes_dependent_on: []
    output_structure:
    - description: Step‑by‑step outline of the logical rules that convert indicator
        readings into concrete BUY or SELL signals.
      key: signal_logic_steps
      type: List[str]
    - description: Explicit list of technical indicator names (as provided by the
        parent node) that are employed in the signal generation algorithm.
      key: used_indicators
      type: List[str]
    - description: A concise executive summary describing the overall methodology,
        key decision pathways, and any risk‑management overlays.
      key: summary
      type: str
    - description: Flag indicating whether the signal logic accounts for all identified
        indicators and fully defines buy, sell, and neutral decision branches.
      key: is_logic_complete
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Execute a JSON read of the parent node's output; assert the field
          exists and is a non‑empty List[str]; raise a meaningful error if missing.
        reason: Provides the authoritative source of which technical measures the
          strategy is allowed to use.
        text: Fetch the `indicators` list from the output of the `identify_trading_indicators`
          node and store it in a local variable `parent_indicators`.
      - complexity: LOW
        impact: MEDIUM
        method: Iterate through `parent_indicators`, add each unique entry to a new
          list; use a set for O(1) membership checks.
        reason: Ensures deterministic behaviour and matches the required output field
          exactly.
        text: Deduplicate `parent_indicators` while preserving order and assign the
          result to `used_indicators`.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Populate the dictionary manually for common indicators (e.g., SMA,
          EMA, RSI, MACD, Bollinger Bands). Include keys: `calc_expression`, `lookback`,
          `upper_thresh`, `lower_thresh`, `type` (trend/momentum/volatility).'
        reason: Encapsulates domain expertise for each technical indicator, making
          later rule composition straightforward and auditable.
        text: Create a registry (dictionary) named `indicator_definitions` that maps
          each indicator name to a pre‑defined calculation template, default parameters,
          and signal direction (e.g., bullish when value > threshold).
      - complexity: LOW
        impact: HIGH
        method: Loop over `used_indicators`; raise Exception if `indicator not in
          indicator_definitions`.
        reason: Prevents runtime failures during back‑test when an undefined indicator
          would be referenced.
        text: Validate that every entry in `used_indicators` exists in `indicator_definitions`;
          if any are missing, abort with a clear message listing unsupported indicators.
      - complexity: MEDIUM
        impact: HIGH
        method: For each indicator, substitute its `calc_expression` into a templated
          condition string; concatenate conditions with `and`/`or` based on a configurable
          `combination_map` (hard‑coded for this PRD).
        reason: Establishes the core entry logic which must be explicit and deterministic.
        text: 'Define the primary BUY rule: combine one or more bullish conditions
          using logical AND/OR as dictated by typical strategy patterns (e.g., SMA_fast
          > SMA_slow AND RSI < 30).'
      - complexity: MEDIUM
        impact: HIGH
        method: Reuse `indicator_definitions` with opposite threshold values; generate
          condition strings analogous to BUY rule.
        reason: Provides an equally clear exit logic, ensuring symmetric treatment
          of opposite market signals.
        text: 'Define the primary SELL rule: mirror the BUY rule but with opposite
          (bearish) thresholds (e.g., SMA_fast < SMA_slow OR RSI > 70).'
