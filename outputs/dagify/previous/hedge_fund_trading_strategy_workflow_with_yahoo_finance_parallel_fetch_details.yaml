          change in Sharpe ratio multiplied by a weighting factor for drawdown and
          return (e.g., `score = |ΔSharpe| * 0.5 + |ΔReturn| * 0.3 + |ΔDrawdown| *
          0.2`). Select the top‑3 factors where the metric gap is `FAIL` or `MARGINAL`.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Extract the optimum value from the sensitivity DataFrame per factor;
          format as bullet strings: `- Parameter XYZ: 0.05 → 0.08`.'
        reason: Provides data‑driven, actionable changes rather than heuristic guesses.
        text: 'Generate concrete adjustment proposals for the selected factors: for
          parameters, propose the value that yielded the best Sharpe in the sensitivity
          sweep; for indicators, adjust period lengths or thresholds to the optimal
          values; for risk rules, tighten stop‑loss or modify position‑size scaling
          factor as indicated by the analysis.'
      - complexity: LOW
        impact: LOW
        method: Join bullet list with newline characters; prepend a short header if
          desired (e.g., "Adjusted Parameters:").
        reason: Ensures the output fields match the required schema and are human‑readable.
        text: 'Compose `parameter_adjustments`, `indicator_adjustments`, and `risk_rule_adjustments`
          strings by concatenating the bullet points generated in the previous step,
          preserving the order: parameters → indicators → risk rules.'
      - complexity: MEDIUM
        impact: MEDIUM
        method: Iterate over adjustment bullets, retrieve corresponding gap and score
          from earlier dictionaries, concatenate explanatory sentences.
        reason: Provides transparency and auditability for downstream stakeholders
          and for the next refinement iteration.
        text: 'Draft `reasoning_for_adjustments` by linking each bullet to the specific
          metric gap it addresses and citing the sensitivity score that motivated
          the change. Use a structured paragraph format: "The Sharpe ratio fell short
          of the 1.2 target (observed 0.95). Sensitivity analysis showed that increasing
          the EMA period from 20 to 30 improved Sharpe by +0.18, therefore the period
          was adjusted...".'
      - complexity: LOW
        impact: HIGH
        method: Summarize metric changes (e.g., "Sharpe improved from 0.95 to 1.14"),
          list the three key adjustments, and note any residual issues.
        reason: Serves as the executive‑level narrative for the downstream `compile_final_strategy_blueprint`
          node.
        text: 'Assemble `refined_strategy_summary` that encapsulates the overall direction
          of the refinement: mention which metric gaps were closed, any remaining
          gaps, and a high‑level view of the new parameter/indicator/risk configuration.'
      - complexity: LOW
        impact: MEDIUM
        method: 'Simple `if not field.strip(): raise ValueError` checks; unit‑test
          each output field.'
        reason: Guarantees downstream nodes receive well‑formed data and prevents
          silent failures.
        text: Validate that all output strings are non‑empty and conform to the expected
          primitive types; if any field is empty, raise a validation error before
          returning to enforce contract compliance.
    prompt: Ingest the full backtest report generated by **backtest_trading_strategy**,
      compare metrics against targets, conduct sensitivity analysis, adjust parameters/indicators/risk
      rules, and summarize the refined strategy.
  select_trading_strategy_type:
    agent: false
    description: Determines the optimal primary trading strategy category based on
      the market analysis.
    name: select_trading_strategy_type
    nodes_depended_on:
    - define_market_analysis
    nodes_dependent_on: []
    output_structure:
    - description: The chosen primary trading strategy type (e.g., "momentum", "mean
        reversion").
      key: strategy_type
      type: str
    - description: A concise one‑sentence explanation of why this strategy type best
        fits the market analysis.
      key: rationale
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Invoke the DAG runtime API to fetch the parent node's output JSON;
          deserialize into native Python structures (list of strings for sources and
          techniques, string for summary).
        reason: All subsequent decision logic relies on an accurate, unaltered view
          of the data ecosystem and analytical toolkit defined upstream.
        text: 'Retrieve the complete output payload from the parent node **define_market_analysis**,
          specifically the three fields: `market_data_sources`, `analysis_techniques`,
          and `summary_note`.'
      - complexity: MEDIUM
        impact: HIGH
        method: Define a static taxonomy dictionary mapping known providers (e.g.,
          Bloomberg, Yahoo Finance) to their latency/granularity attributes; iterate
          over the list and build a structured summary dictionary.
        reason: Strategy feasibility is heavily driven by the timeliness and granularity
          of the underlying data; e.g., high‑frequency momentum requires sub‑second
          latency.
        text: Classify each entry in `market_data_sources` by data latency (real‑time
          vs end‑of‑day), granularity (tick, minute, daily), and asset class coverage
          (equities, futures, FX, commodities).
      - complexity: MEDIUM
        impact: HIGH
        method: Maintain a JSON‑encoded mapping table; for each technique, lookup
          corresponding archetype(s) and increment a counter in a `strategy_score`
          dict.
        reason: Creating an explicit link between techniques and strategy families
          enables systematic scoring rather than ad‑hoc intuition.
        text: Map each technique listed in `analysis_techniques` to one or more canonical
          strategy archetypes using a pre‑defined mapping matrix (e.g., "Moving Average
          Crossover" → Momentum, "Bollinger Bands" → Mean Reversion, "Factor Model"
          → Statistical Arbitrage).
      - complexity: HIGH
        impact: HIGH
        method: 'Assign axis weights (e.g., 0.4, 0.4, 0.2). For each candidate, compute:
          data_score = sum(latency_match*weight_lat + granularity_match*weight_gran),
          technique_score = technique_counter * weight_tech, cost_score = 1 if summary_note
          contains low‑cost indicator else 0. Multiply by axis weights and sum to
          produce a final score.'
        reason: A quantitative score reduces bias and provides a reproducible basis
          for selection.
        text: 'Construct a weighted scoring model that evaluates candidate strategy
          types (`momentum`, `mean_reversion`, `stat_arbitrage`, `sentiment_driven`,
          etc.) on three axes: (1) Data Suitability (latency & granularity match),
          (2) Technique Alignment (count of mapped techniques), (3) Cost/Licensing
          Feasibility (derived from `summary_note` keywords such as "low cost" or
          "premium").'
      - complexity: LOW
        impact: MEDIUM
        method: Sort the `strategy_score` dictionary by value descending; if multiple
          entries share the top score, order them by a predefined precedence list
          ["momentum", "mean_reversion", "stat_arbitrage", "sentiment_driven"].
        reason: Ensures a single, repeatable output even when multiple strategies
          appear equally viable.
        text: Select the strategy type with the highest aggregated score; in case
          of a tie, apply a deterministic tie‑breaker that prefers lower‑frequency
          strategies (to honor typical end‑of‑day data availability from Yahoo Finance).
      - complexity: LOW
        impact: MEDIUM
        method: Identify the top‑scoring data source category and the highest‑frequency
          technique from the mapping; interpolate into a template string.
        reason: The rationale must be concise yet traceable to the underlying analysis,
          satisfying the output specification.
        text: Compose a one‑sentence `rationale` that references the most influential
          data source and the dominant analysis technique driving the decision (e.g.,
          "Momentum is selected because the high‑frequency daily price feed from Bloomberg
          aligns with our Moving‑Average‑Crossover indicator set.")
      - complexity: LOW
        impact: HIGH
        method: Implement a lightweight schema validator (e.g., jsonschema) using
          the `output_structure` definition; assert string types and non‑emptiness;
          log descriptive error messages.
        reason: Guarantees downstream nodes receive well‑formed inputs and prevents
          silent propagation of errors.
        text: 'Validate the final output payload against the declared `output_structure`:
          ensure `strategy_type` is a non‑empty string drawn from the allowed enumeration
          and `rationale` is a single‑sentence string (max 200 characters). Raise
          an error if validation fails.'
    prompt: Based on the market data sources and analysis techniques defined in the
      previous step, select the single primary trading strategy type and provide a
      one‑sentence justification.
  specify_asset_universe:
    agent: false
    description: Defines the full investable universe that aligns with the selected
      trading strategy.
    name: specify_asset_universe
    nodes_depended_on:
    - select_trading_strategy_type
    nodes_dependent_on: []
    output_structure:
    - description: High‑level asset classes or instrument families to be traded (e.g.,
        US equities, futures, commodities).
      key: asset_classes
      type: List[str]
    - description: Specific ticker symbols or contract identifiers selected from each
        asset class (e.g., AAPL, MSFT, ESZ2025).
      key: asset_tickers
      type: List[str]
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Parse the parent node JSON, read `strategy_type`, and validate that
          it is a non‑empty string.
        reason: The chosen strategy type is the sole deterministic input that drives
          the asset‑class mapping logic.
        text: Extract the `strategy_type` string from the output of `select_trading_strategy_type`
          and store it in a local variable.
      - complexity: MEDIUM
        impact: HIGH
        method: Create a Python dict or JSON object; include comments citing sources
          such as academic papers or Bloomberg research for each mapping.
        reason: A deterministic mapping ensures reproducibility and removes ambiguity
          when selecting asset classes.
        text: Define a static mapping table that links each supported `strategy_type`
          to a prioritized list of compatible asset classes, based on quantitative
          finance literature and industry best‑practice (e.g., "momentum" → ["US equities",
          "ETF futures"], "mean reversion" → ["US equities", "FX spot"], "stat‑arb"
          → ["US equities", "ETFs", "Options"]).
      - complexity: LOW
        impact: HIGH
        method: Use a try/except block; error message should include the invalid `strategy_type`
          and list of supported keys.
        reason: Fail‑fast validation prevents downstream errors in back‑testing caused
          by mismatched asset universes.
        text: Lookup the extracted `strategy_type` in the mapping table; if not found,
          raise a clear validation error indicating an unsupported strategy.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement helper functions that query a static whitelist (hard‑coded
          lists) or, if allowed, pull the latest constituents from a public API (e.g.,
          Wikipedia S&P 500 table). Ensure each list is de‑duplicated and sorted alphabetically.
        reason: Rule‑based selection guarantees that the tickers are both tradable
          and representative of the underlying asset class, aligning with the strategy’s
          signal generation requirements.
        text: "For each selected asset class, apply a rule‑based ticker selection\
          \ algorithm: \n- US equities → top 100 liquid stocks by average daily dollar\
          \ volume from the last 6 months (e.g., S&P 500 constituents + high‑cap mid‑caps).\
          \ \n- Futures → front‑month continuous contracts for major indices, commodities,\
          \ and FX (e.g., ES, CL, GC, EUR=, JPY=). \n- ETFs → sector‑specific ETFs\
          \ that best capture the factor exposure (e.g., XLK for tech momentum). \n\
          - Commodities → physically deliverable contracts with sufficient liquidity\
          \ (e.g., WTI, Gold)."
      - complexity: MEDIUM
        impact: MEDIUM
        method: Iterate over the candidate list, perform a try/except around `ticker.info['regularMarketPrice']`;
          keep only successful symbols. Log any excluded tickers for audit.
        reason: Early validation avoids runtime failures in downstream data‑fetch
          nodes (`fetch_stock_data_yahoo_data`).
        text: Validate each candidate ticker symbol for syntactic correctness (uppercase,
          alphanumeric, optional suffix for futures contracts) and verify that it
          exists on Yahoo Finance via a lightweight `yfinance.Ticker(ticker).info`
          call; filter out any symbols that raise an exception or return empty info.
      - complexity: LOW
        impact: MEDIUM
        method: Create two Python lists; use `sorted()` for tickers; concatenate class‑specific
          ticker sub‑lists if needed.
        reason: Consistent ordering simplifies downstream indexing and debugging,
          especially when aligning tickers with fetched data frames.
        text: 'Assemble the final `asset_classes` list (derived from the mapping step)
          and the `asset_tickers` list (the validated, de‑duplicated ticker symbols).
          Preserve the order: asset classes first as they appear in the mapping, tickers
          sorted alphabetically within each class.'
      - complexity: LOW
        impact: HIGH
        method: Serialize the two lists using `json.dumps` ensuring no extra fields
          are present; raise an exception only if serialization fails.
        reason: Strict adherence to the schema guarantees compatibility with downstream
          nodes that consume these fields.
        text: 'Return a JSON object conforming exactly to the defined `output_structure`:
          `asset_classes` as a List[str] and `asset_tickers` as a List[str]. Include
          a top‑level `success` flag in logs (not part of the schema) to indicate
          whether the universe generation completed without errors.'
    prompt: Based on the chosen trading strategy, delineate the complete investable
      universe, including asset classes and concrete ticker symbols.
