dag_type: plain_text
description: A detailed workflow for an investor relations associate's daily tasks,
  including responding to emails, preparing for calls, and updating records.
name: investor_relations_associate_daily_workflow
nodes:
  check_subscription_status:
    agent: false
    description: Check the subscription status of another prospective LP
    name: check_subscription_status
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Inquire about the status of the prospective LP's subscription.
  join_lp_call:
    agent: false
    description: Join the LP call and address questions
    name: join_lp_call
    nodes_depended_on:
    - prepare_for_lp_call
    nodes_dependent_on:
    - respond_to_distribution_query
    prompt: Take notes during the call, especially on questions asked, and respond
      accordingly.
  prepare_for_lp_call:
    agent: false
    description: Prepare for the LP call by reviewing the deck
    name: prepare_for_lp_call
    nodes_depended_on: []
    nodes_dependent_on:
    - join_lp_call
    prompt: Review the LP deck and make notes on key points, especially regarding
      fund-level tax treatment.
  receive_portco_commentary:
    agent: false
    description: Receive portco commentary
    name: receive_portco_commentary
    nodes_depended_on:
    - request_portco_commentary
    nodes_dependent_on:
    - rewrite_portco_commentary
    prompt: Collect the received commentary from portcos.
  request_portco_commentary:
    agent: false
    description: Request updated portco commentary for the quarterly letter
    name: request_portco_commentary
    nodes_depended_on: []
    nodes_dependent_on:
    - rewrite_portco_commentary
    prompt: Send a request to portcos for updated commentary.
  respond_to_distribution_query:
    agent: false
    description: Respond to an email asking about distributions
    name: respond_to_distribution_query
    nodes_depended_on:
    - join_lp_call
    nodes_dependent_on: []
    prompt: Draft a response to the distribution query, explaining that it's a VC
      fund and the first distribution is expected in 10 years.
  respond_to_prospective_lp_query:
    agent: false
    description: Respond to a prospective LP's question about competitive differentiation
    name: respond_to_prospective_lp_query
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Draft a response highlighting the fund's unique aspects without directly
      comparing to others.
  respond_to_quarterly_report_requests:
    agent: false
    description: Respond to emails requesting the quarterly report
    name: respond_to_quarterly_report_requests
    nodes_depended_on:
    - wake_up_and_check_emails
    nodes_dependent_on: []
    prompt: Draft a response to the quarterly report requests with a link or attachment
      to the report.
  rewrite_portco_commentary:
    agent: false
    description: Rewrite the portco commentary into a full narrative
    name: rewrite_portco_commentary
    nodes_depended_on:
    - receive_portco_commentary
    nodes_dependent_on: []
    prompt: Transform the received bullet points into a polished, cautious, and optimistic
      narrative.
  send_monthly_update:
    agent: false
    description: Send the monthly update to LPs
    name: send_monthly_update
    nodes_depended_on:
    - rewrite_portco_commentary
    nodes_dependent_on: []
    prompt: Prepare the monthly update with a focus on portfolio performance, using
      the rewritten portco commentary.
  update_crm:
    agent: false
    description: Update the CRM with the latest interactions
    name: update_crm
    nodes_depended_on:
    - respond_to_prospective_lp_query
    - check_subscription_status
    nodes_dependent_on: []
    prompt: Log the interactions with prospective LPs and update their status in the
      CRM.
  wake_up_and_check_emails:
    agent: false
    description: Check emails for quarterly report requests
    name: wake_up_and_check_emails
    nodes_depended_on: []
    nodes_dependent_on:
    - respond_to_quarterly_report_requests
    prompt: List the number of emails requesting the quarterly report and the senders'
      names.
