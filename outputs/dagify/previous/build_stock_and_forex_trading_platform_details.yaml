  perform_security_auditing:
    agent: false
    description: Perform security auditing for the trading platform.
    name: perform_security_auditing
    nodes_depended_on:
    - implement_user_interface
    - implement_trading_api
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the entire audit process has been finished.
      key: audit_completed
      type: bool
    - description: Total count of distinct vulnerabilities identified during the audit.
      key: vulnerabilities_found
      type: int
    - description: Short textual descriptions of each identified vulnerability.
      key: vulnerability_descriptions
      type: str
    - description: Severity score for each vulnerability (e.g., 1-10, higher is more
        critical).
      key: risk_scores
      type: int
    - description: List of security compliance standards that were not met during
        the audit.
      key: compliance_gaps
      type: str
    - description: Whether all identified vulnerabilities and compliance gaps have
        been remediated.
      key: remediation_complete
      type: bool
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use CI/CD pipeline hooks to export the built artifacts and Git history;
          ensure all environment variables and secrets are captured in a secure vault
          for review.
        reason: A comprehensive audit requires access to all layers of the application
          to detect hidden or indirect vulnerabilities.
        text: Collect the latest deployment artifacts and source code repositories
          for both the frontend and backend services.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Configure the tool with language‑specific rulesets; set severity thresholds;
          generate a SARIF report for downstream processing.
        reason: Static analysis provides early detection of vulnerabilities that are
          hard to find through dynamic tests.
        text: Run automated static analysis tools (e.g., SonarQube, Checkmarx, Fortify)
          on the backend codebase to surface common code‑level issues such as injection
          points, insecure deserialization, and hard‑coded credentials.
      - complexity: MEDIUM
        impact: HIGH
        method: Automate a headless browser session with API authentication tokens;
          enable session handling; export findings in JSON for parsing.
        reason: DAST uncovers runtime vulnerabilities such as XSS, CSRF, and authentication
          bypass that static tools may miss.
        text: Perform a dynamic application security testing (DAST) scan using OWASP
          ZAP or Burp Suite against the deployed staging environment, simulating authenticated
          user actions.
      - complexity: HIGH
        impact: HIGH
        method: Engage a certified ethical hacker; follow OWASP Testing Guide; document
          each exploit with step‑by‑step proof‑of‑concept code.
        reason: Manual testing can expose subtle issues that automated tools overlook,
          especially in complex trading workflows.
        text: Conduct manual penetration testing focusing on business logic flaws,
          privilege escalation, and API rate‑limit circumvention.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use tools like kube-hunter, Trivy, or Cloud Custodian; parse YAML
          manifests; check for open ports and overly permissive IAM roles.
        reason: Security extends beyond application code; misconfigurations can lead
          to privilege escalation or data leakage.
        text: Audit infrastructure configuration (Dockerfiles, Kubernetes manifests,
          IAM policies, firewall rules) for misconfigurations that could expose the
          system to unauthorized access.
      - complexity: MEDIUM
        impact: HIGH
        method: Create a mapping matrix; cross‑reference each discovered issue to
          the corresponding control; flag any unmet controls.
        reason: Compliance gaps can trigger regulatory penalties and impact market
          confidence.
        text: Verify compliance with industry standards (e.g., ISO 27001, PCI DSS,
          SOC 2) by mapping audit findings to the relevant control baselines.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Parse tool reports (JSON, SARIF) using a custom Python script; calculate
          CVSS scores; output a CSV/JSON table.
        reason: A standardized inventory facilitates tracking, reporting, and remediation
          management.
        text: Aggregate all findings into a structured vulnerability inventory, assigning
          each vulnerability a unique identifier, description, risk score (CVSS v3.1),
          and remediation priority.
      - complexity: MEDIUM
        impact: HIGH
        method: Use a ticketing system (Jira/ServiceNow); assign fixes; perform regression
          DAST scan; update the vulnerability inventory.
        reason: Remediation is a critical part of the audit lifecycle; verification
          ensures no residual risks.
        text: Coordinate with the development and operations teams to implement remediation
          fixes, retest, and verify that each vulnerability has been mitigated.
      - complexity: LOW
        impact: MEDIUM
        method: Template a Markdown report; auto‑populate fields from the inventory;
          include visual risk heatmaps; export to PDF for executive sign‑off.
        reason: Stakeholders need a clear, executive‑level overview to make informed
          decisions about deployment.
        text: Generate a concise audit report summarizing audit scope, methodologies,
          findings, risk scores, compliance gaps, remediation status, and final audit
          completion flag.
      - complexity: LOW
        impact: MEDIUM
        method: Implement a status flag in the audit tracking database; trigger flag
          updates via CI/CD pipeline after final report generation.
        reason: Ensures a formal closure of the audit cycle before proceeding to production.
        text: Set `audit_completed` to true only after the audit report is signed
          off by security lead and `remediation_complete` is true for all vulnerabilities.
    prompt: '# Prompt


      Conduct a thorough security audit to identify vulnerabilities in the trading
      platform. Consider penetration testing, code review, and compliance with security
      standards.'
