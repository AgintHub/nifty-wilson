dag_type: shim
description: Generated workflow from UI.
name: train_large_language_model
nodes:
  allocate_resources:
    agent: false
    code_node_type: stub
    description: Reserve the necessary hardware resources.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass LoadConfigurationOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for load_configuration node outputs.\"\"\"\n    config_valid:\
      \ bool = Field(..., description=\"Whether the configuration passed validation\
      \ checks\")\n    error_messages: str = Field(..., description=\"List of validation\
      \ error messages, empty if config_valid is true\")\n    max_epochs: int = Field(...,\
      \ description=\"Number of training epochs specified in the configuration\")\n\
      \    batch_size: int = Field(..., description=\"Batch size for training specified\
      \ in the configuration\")\n    learning_rate: float = Field(..., description=\"\
      Learning rate for optimizer as specified in the configuration\")\n    data_path:\
      \ str = Field(..., description=\"File system path to the training data\")\n\
      \    model_output_path: str = Field(..., description=\"File system path where\
      \ the trained model checkpoints will be stored\")\n    config_version: str =\
      \ Field(..., description=\"Version identifier for the configuration file\")\n\
      \    project_name: str = Field(..., description=\"Name of the project as defined\
      \ in the configuration\")\n\n\nclass AllocateResourcesOutput(BaseModel):\n \
      \   \"\"\"Pydantic model for allocate_resources node outputs.\"\"\"\n    gpu_count:\
      \ int = Field(..., description=\"Number of GPUs allocated for training.\")\n\
      \    gpu_type: str = Field(..., description=\"Model or type of GPU allocated\
      \ (e.g., V100, A100).\")\n    memory_gb: float = Field(..., description=\"Total\
      \ GPU memory in gigabytes allocated.\")\n    allocation_success: bool = Field(...,\
      \ description=\"Indicates whether the resource allocation was successful.\"\
      )\n\n\ndef allocate_resources(load_configuration_input: LoadConfigurationOutput,\
      \ **kwargs) -> AllocateResourcesOutput:\n    \"\"\"Reserve the necessary hardware\
      \ resources.\n\n    Args:\n        load_configuration_input: Input from the\
      \ 'load_configuration' node.\n        **kwargs: Additional keyword arguments.\n\
      \n    Returns:\n        AllocateResourcesOutput: Object containing outputs for\
      \ this node.\n    \"\"\"\n    # TODO: Implement this function\n\n    # Return\
      \ stub output with placeholder values\n    return AllocateResourcesOutput(\n\
      \        gpu_count=0,\n        gpu_type=\"\",\n        memory_gb=0.0,\n    \
      \    allocation_success=False,\n    )"
    name: allocate_resources
    nodes_depended_on:
    - load_configuration
    nodes_dependent_on: []
    output_structure:
    - description: Number of GPUs allocated for training.
      key: gpu_count
      type: int
    - description: Model or type of GPU allocated (e.g., V100, A100).
      key: gpu_type
      type: str
    - description: Total GPU memory in gigabytes allocated.
      key: memory_gb
      type: float
    - description: Indicates whether the resource allocation was successful.
      key: allocation_success
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Parse the load_configuration output dictionary; use dict.get with
          default values; perform type validation and conversion to int/float.
        reason: Explicitly capturing the user’s GPU preferences ensures deterministic
          allocation and avoids hard‑coded assumptions.
        text: Extract GPU requirement parameters from the configuration returned by
          load_configuration, using keys such as requested_gpu_count, requested_gpu_type,
          and memory_per_gpu. If any key is missing, fall back to sensible defaults
          (e.g., 1 V100, 16 GB).
      - complexity: MEDIUM
        impact: HIGH
        method: Execute the appropriate inventory command via subprocess, or call
          the scheduler’s REST endpoint; parse the output to count free GPUs of the
          requested type; handle exceptions and timeouts.
        reason: Pre‑emptively detecting insufficiencies prevents runtime failures
          and resource contention.
        text: Validate that the requested number of GPUs is available on the target
          compute node or cluster by querying the system’s GPU inventory (e.g., `nvidia-smi
          --list-gpus` for local nodes, or the cluster scheduler API for cloud environments).
      - complexity: MEDIUM
        impact: HIGH
        method: For cloud environments, construct the job submission JSON and POST
          to the cluster’s API; for local nodes, invoke CUDA driver calls (cuDeviceGetCount,
          cuCtxCreate) to lock GPUs; verify allocation status via API responses or
          CUDA error codes.
        reason: Actual resource reservation is required before model initialization
          to avoid oversubscription and to lock the GPUs for the training job.
        text: If the inventory check passes, request allocation of the specified GPUs
          using the platform’s resource allocation interface (e.g., Slurm `srun --gres=gpu:count`,
          Kubernetes GPU requests in Pod spec, or a direct CUDA context allocation
          for local runs).
      - complexity: LOW
        impact: LOW
        method: 'Use a simple arithmetic operation: memory_gb = gpu_count * memory_per_gpu;
          ensure result is float and round to two decimal places.'
        reason: Providing an aggregate memory figure simplifies downstream budgeting
          and monitoring.
        text: Compute the total memory to be reported as `memory_gb` by multiplying
          the allocated GPU count by the per‑GPU memory (converted to gigabytes).
      - complexity: LOW
        impact: HIGH
        method: Create a dict with the four fields; if any step fails, set allocation_success
          to false and assign zeroes or empty strings for other fields; otherwise
          set true and the actual values.
        reason: Accurately conveying allocation status is critical for error propagation
          to downstream nodes.
        text: 'Populate the output structure: set `gpu_count`, `gpu_type`, `memory_gb`,
          and determine `allocation_success` based on the success flags returned by
          the allocation API and any exceptions caught during the process.'
      - complexity: LOW
        impact: MEDIUM
        method: Format a JSON or plain‑text log entry; write to a file in /tmp or
          append to an in‑memory list; expose via an optional `allocation_log` output
          if the node interface allows.
        reason: Traceability aids debugging and compliance with resource usage policies.
        text: Log the allocation attempt with details such as timestamp, requested
          parameters, actual allocated GPUs, and any error messages, storing the log
          in a temporary file or returning it in a hidden side channel for auditing
          purposes.
    prompt: Allocate computing resources such as GPUs and memory required for training
      the model.
    shims: []
  create_vocabulary:
    agent: false
    code_node_type: stub
    description: Creates a unique token list (vocabulary) from the tokenized training
      data, records token frequencies, and validates the result.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass TokenizeDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for tokenize_data node outputs.\"\"\"\n    tokenized_texts:\
      \ str = Field(..., description=\"Tokenized representation of each training sentence\
      \ or document.\")\n    vocabulary: str = Field(..., description=\"Unique tokens\
      \ extracted from the tokenized data.\")\n    vocab_size: int = Field(..., description=\"\
      Total number of unique tokens in the vocabulary.\")\n\n\nclass CreateVocabularyOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for create_vocabulary node outputs.\"\"\"\n    vocabulary:\
      \ str = Field(..., description=\"List of unique tokens constituting the vocabulary.\"\
      )\n    token_frequencies: int = Field(..., description=\"Frequency count for\
      \ each corresponding token in the vocabulary list.\")\n    vocab_size: int =\
      \ Field(..., description=\"Total number of unique tokens in the vocabulary.\"\
      )\n    is_valid: bool = Field(..., description=\"Whether the vocabulary creation\
      \ was successful.\")\n\n\ndef create_vocabulary(tokenize_data_input: TokenizeDataOutput,\
      \ **kwargs) -> CreateVocabularyOutput:\n    \"\"\"Creates a unique token list\
      \ (vocabulary) from the tokenized training data, records token frequencies,\
      \ and validates the result.\n\n    Args:\n        tokenize_data_input: Input\
      \ from the 'tokenize_data' node.\n        **kwargs: Additional keyword arguments.\n\
      \n    Returns:\n        CreateVocabularyOutput: Object containing outputs for\
      \ this node.\n    \"\"\"\n    # TODO: Implement this function\n\n    # Return\
      \ stub output with placeholder values\n    return CreateVocabularyOutput(\n\
      \        vocabulary=\"\",\n        token_frequencies=0,\n        vocab_size=0,\n\
      \        is_valid=False,\n    )"
    name: create_vocabulary
    nodes_depended_on:
    - tokenize_data
    nodes_dependent_on: []
    output_structure:
    - description: List of unique tokens constituting the vocabulary.
      key: vocabulary
      type: str
    - description: Frequency count for each corresponding token in the vocabulary
        list.
      key: token_frequencies
      type: int
    - description: Total number of unique tokens in the vocabulary.
      key: vocab_size
      type: int
    - description: Whether the vocabulary creation was successful.
      key: is_valid
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: 'Use a list comprehension: `[token for sentence in tokenized_texts
          for token in sentence.split()]` or equivalent depending on token format.'
        reason: A flat list enables efficient frequency counting and eliminates per-sentence
          overhead.
        text: Aggregate all tokenized sentences into a single flat list of tokens.
      - complexity: LOW
        impact: HIGH
        method: Instantiate `freq_counter = Counter(all_tokens)`; this yields a dict-like
          mapping token -> count.
        reason: Counter provides a fast, memory‑efficient frequency map directly from
          the token stream.
        text: Count the occurrence of each token using a collections.Counter.
      - complexity: LOW
        impact: MEDIUM
        method: 'Construct a filtered dict: `{t: c for t, c in freq_counter.items()
          if c >= min_freq}`; expose `min_freq` as a configurable parameter.'
        reason: Low‑frequency tokens inflate vocab size without contributing much
          learning signal and may cause OOV issues.
        text: Apply a minimum frequency threshold (e.g., 2 or 5) to filter out extremely
          rare tokens.
      - complexity: MEDIUM
        impact: LOW
        method: 'Use `sorted_tokens = sorted(filtered_tokens.keys(), key=lambda t:
          filtered_tokens[t], reverse=True)`.'
        reason: Ordering by frequency allows optional truncation for sub‑vocabularies
          and facilitates reproducibility.
        text: Sort the remaining tokens by descending frequency to produce the final
          vocabulary list.
      - complexity: LOW
        impact: LOW
        method: 'List comprehension: `token_frequencies = [filtered_tokens[token]
          for token in sorted_tokens]`.'
        reason: Outputs must maintain index alignment for downstream consumption.
        text: 'Create two aligned lists: `vocabulary` (sorted token list) and `token_frequencies`
          (corresponding counts).'
      - complexity: LOW
        impact: LOW
        method: Set `vocab_size = len(vocabulary)`.
        reason: Provides an easily consumable metric for architecture definition.
        text: Compute `vocab_size` as the length of the vocabulary list.
      - complexity: LOW
        impact: HIGH
        method: 'Use a simple conditional: `is_valid = vocab_size > 0`.'
        reason: Ensures downstream nodes do not operate on an empty or corrupted vocabulary.
        text: 'Validate the result: `is_valid` should be True if `vocab_size` > 0;
          otherwise False.'
      - complexity: LOW
        impact: MEDIUM
        method: 'Create a dict: `output = { ''vocabulary'': vocabulary, ''token_frequencies'':
          token_frequencies, ''vocab_size'': vocab_size, ''is_valid'': is_valid }`;
          optionally log `f"vocab_size={vocab_size}, unique_tokens={len(filtered_tokens)}"`.'
        reason: Debug logs aid reproducibility and quick fault isolation.
        text: Package all four outputs into the specified data structure and log metadata
          for debugging.
      - complexity: LOW
        impact: MEDIUM
        method: Use type annotations or runtime checks (e.g., `assert isinstance(vocabulary,
          list)`), then return the dict.
        reason: Strict type adherence prevents downstream type errors.
        text: Return the output structure exactly as defined, ensuring type consistency.
    prompt: Compile a vocabulary of unique tokens from the tokenized data, considering
      frequency and relevance for the language model.
    shims: []
  define_model_architecture:
    agent: false
    code_node_type: shim
    description: Define the architecture and configuration of the large language model.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass CreateVocabularyOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for create_vocabulary node outputs.\"\"\"\n    vocabulary:\
      \ str = Field(..., description=\"List of unique tokens constituting the vocabulary.\"\
      )\n    token_frequencies: int = Field(..., description=\"Frequency count for\
      \ each corresponding token in the vocabulary list.\")\n    vocab_size: int =\
      \ Field(..., description=\"Total number of unique tokens in the vocabulary.\"\
      )\n    is_valid: bool = Field(..., description=\"Whether the vocabulary creation\
      \ was successful.\")\n\n\nclass AllocateResourcesOutput(BaseModel):\n    \"\"\
      \"Pydantic model for allocate_resources node outputs.\"\"\"\n    gpu_count:\
      \ int = Field(..., description=\"Number of GPUs allocated for training.\")\n\
      \    gpu_type: str = Field(..., description=\"Model or type of GPU allocated\
      \ (e.g., V100, A100).\")\n    memory_gb: float = Field(..., description=\"Total\
      \ GPU memory in gigabytes allocated.\")\n    allocation_success: bool = Field(...,\
      \ description=\"Indicates whether the resource allocation was successful.\"\
      )\n\n\nclass DefineModelArchitectureOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for define_model_architecture node outputs.\"\"\"\n    model_type: str = Field(...,\
      \ description=\"Name or type of the model architecture (e.g., 'Transformer').\"\
      )\n    number_of_layers: int = Field(..., description=\"Total number of transformer\
      \ layers in the model.\")\n    hidden_size: int = Field(..., description=\"\
      Dimensionality of each transformer hidden layer.\")\n    attention_heads: int\
      \ = Field(..., description=\"Number of attention heads per transformer layer.\"\
      )\n    vocab_size: int = Field(..., description=\"Size of the vocabulary derived\
      \ from the tokenized data.\")\n    max_sequence_length: int = Field(..., description=\"\
      Maximum token sequence length supported by the model.\")\n    total_parameters:\
      \ int = Field(..., description=\"Estimated total number of trainable parameters\
      \ in the model.\")\n\n\ndef define_model_architecture(create_vocabulary_input:\
      \ CreateVocabularyOutput, allocate_resources_input: AllocateResourcesOutput,\
      \ **kwargs) -> DefineModelArchitectureOutput:\n    \"\"\"Define the architecture\
      \ and configuration of the large language model.\n\n    Args:\n        create_vocabulary_input:\
      \ Input from the 'create_vocabulary' node.\n        allocate_resources_input:\
      \ Input from the 'allocate_resources' node.\n        **kwargs: Additional keyword\
      \ arguments.\n\n    Returns:\n        DefineModelArchitectureOutput: Object\
      \ containing outputs for this node.\n    \"\"\"\n    # Extract vocabulary size\
      \ and GPU allocation metrics\n    vocab_size: int = create_vocabulary_input.vocab_size\n\
      \    gpu_count: int = allocate_resources_input.gpu_count\n    gpu_type: str\
      \ = allocate_resources_input.gpu_type\n    memory_gb: float = allocate_resources_input.memory_gb\n\
      \    \n    # Determine optimal number of layers within memory constraints\n\
      \    optimal_layers: int = determine_optimal_layers(\n        gpu_count=gpu_count,\
      \ \n        memory_gb=memory_gb, \n        vocab_size=vocab_size\n    )\n  \
      \  \n    # Calculate hidden size that fits memory and divisibility constraints\n\
      \    optimal_hidden_size: int = calculate_optimal_hidden_size(\n        number_of_layers=optimal_layers,\n\
      \        vocab_size=vocab_size,\n        memory_gb=memory_gb,\n        gpu_count=gpu_count\n\
      \    )\n    \n    # Set attention heads based on hidden size and standard configurations\n\
      \    attention_heads: int = determine_attention_heads(hidden_size=optimal_hidden_size)\n\
      \    \n    # Determine max sequence length from training config or defaults\n\
      \    max_sequence_length: int = determine_max_sequence_length(\n        training_config=kwargs.get('training_config',\
      \ {}),\n        memory_gb=memory_gb\n    )\n    \n    # Compute final parameter\
      \ count estimate\n    total_parameters: int = compute_transformer_parameters(\n\
      \        vocab_size=vocab_size,\n        hidden_size=optimal_hidden_size,\n\
      \        number_of_layers=optimal_layers,\n        attention_heads=attention_heads\n\
      \    )\n    \n    # Assemble final output\n    return DefineModelArchitectureOutput(\n\
      \        model_type=\"Transformer\",\n        number_of_layers=optimal_layers,\n\
      \        hidden_size=optimal_hidden_size,\n        attention_heads=attention_heads,\n\
      \        vocab_size=vocab_size,\n        max_sequence_length=max_sequence_length,\n\
      \        total_parameters=total_parameters\n    )"
    name: define_model_architecture
    nodes_depended_on:
    - create_vocabulary
    - allocate_resources
    nodes_dependent_on: []
    output_structure:
    - description: Name or type of the model architecture (e.g., 'Transformer').
      key: model_type
      type: str
    - description: Total number of transformer layers in the model.
      key: number_of_layers
      type: int
    - description: Dimensionality of each transformer hidden layer.
      key: hidden_size
      type: int
    - description: Number of attention heads per transformer layer.
      key: attention_heads
      type: int
    - description: Size of the vocabulary derived from the tokenized data.
      key: vocab_size
      type: int
    - description: Maximum token sequence length supported by the model.
      key: max_sequence_length
      type: int
    - description: Estimated total number of trainable parameters in the model.
      key: total_parameters
      type: int
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Read 'vocab_size' from create_vocabulary output; read 'gpu_count',
          'gpu_type', and 'memory_gb' from allocate_resources output; store them in
          local variables for later calculations.
        reason: The vocab_size dictates the size of the embedding matrix, while GPU
          memory limits constrain hidden layer dimensionality and overall parameter
          count.
        text: Extract the vocabulary size and GPU allocation metrics from the outputs
          of create_vocabulary and allocate_resources to serve as constraints for
          architecture sizing.
      - complexity: LOW
        impact: MEDIUM
        method: Implement a helper function that accepts vocab_size, hidden_size,
          number_of_layers, attention_heads and returns an integer estimate; use the
          standard transformer parameter count formula including embedding, layer
          norm, feed‑forward, and attention projection terms.
        reason: Having a parameter budget early helps validate that the chosen hyper‑parameters
          fit within hardware constraints and guides subsequent decisions.
        text: 'Compute an initial estimate of total trainable parameters using the
          closed‑form formula for a transformer: params ≈ vocab_size * hidden_size
          + 12 * number_of_layers * hidden_size^2 + ... and round to nearest integer.'
      - complexity: MEDIUM
        impact: HIGH
        method: Iteratively loop over candidate layer counts (e.g., 6, 12, 24, 36);
          for each, compute total_parameters (from bullet 2) and compare against memory_gb
          * gpu_count * 0.9 * 1024 (bytes). Select the largest count that satisfies
          the constraint.
        reason: Layer depth is a primary driver of model capacity; staying within
          memory limits prevents out‑of‑memory failures during training.
        text: 'Determine number_of_layers by balancing desired performance, convergence
          speed, and available GPU memory: start from a baseline (e.g., 12 layers)
          and increase until the estimated parameter count approaches but does not
          exceed 90% of the GPU memory capacity per GPU.'
      - complexity: MEDIUM
        impact: HIGH
        method: Compute the available memory per GPU in bytes; subtract memory needed
          for embedding (vocab_size * hidden_size * 4 bytes) and optimizer buffers
          (≈ 2 * hidden_size * number_of_layers * hidden_size). Solve for hidden_size
          iteratively, checking divisibility by candidate attention_heads (typically
          8, 12, 16). Choose the largest hidden_size that satisfies both constraints.
        reason: Hidden size directly scales the memory footprint of activations and
          gradients; ensuring divisibility by attention_heads preserves efficient
          attention implementation.
        text: Select hidden_size such that the product hidden_size * number_of_layers
          * hidden_size fits within the remaining memory after accounting for embeddings
          and optimizer states; also enforce that hidden_size % attention_heads ==
          0.
      - complexity: LOW
        impact: MEDIUM
        method: If hidden_size >= 1024 use 16 heads; else if hidden_size >= 768 use
          12 heads; otherwise use 8 heads; ensure hidden_size % attention_heads ==
          0.
        reason: Standard head counts provide well‑tested scaling behavior and efficient
          GPU utilization.
        text: Set attention_heads by choosing a value that evenly divides hidden_size
          and aligns with common transformer configurations (e.g., 8, 12, 16); default
          to 12 if hidden_size >= 768 and <= 1024.
      - complexity: LOW
        impact: LOW
        method: If the training configuration (from load_configuration) includes a
          'max_sequence_length', use it; otherwise compute the maximum token count
          across a sample of training examples; if that exceeds 512 set to 1024, else
          set to 512.
        reason: Sequence length impacts memory linearly; setting a conservative default
          avoids OOM during training while allowing longer inputs if resources permit.
        text: Define max_sequence_length based on the training data's longest sequence
          and the memory budget; if unspecified, default to 512 or 1024 for larger
          models.
      - complexity: LOW
        impact: LOW
        method: 'Create a JSON object containing keys: model_type=''Transformer'',
          number_of_layers, hidden_size, attention_heads, vocab_size, max_sequence_length,
          total_parameters; cast all numeric values to int where appropriate.'
        reason: Providing a consistent, typed output is required for downstream nodes
          such as initialize_model_weights.
        text: Assemble the final output dictionary with all computed fields, ensuring
          that total_parameters matches the estimate from bullet 2.
    prompt: Specify the architecture of the language model, including the number of
      layers, hidden size, and attention heads, based on the created vocabulary and
      desired model capabilities.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Determines the maximum number of transformer layers that can be
        accommodated on the specified GPUs without exceeding memory limits.
      implementation: "def determine_optimal_layers(gpu_count: str, memory_gb: str,\
        \ vocab_size: str) -> int:\n    \"\"\"\n    Determines the maximum number\
        \ of transformer layers that can be accommodated on the specified GPUs without\
        \ exceeding memory limits.\n\n    Args:\n        gpu_count: Input parameter\
        \ of type str\nmemory_gb: Input parameter of type str\nvocab_size: Input parameter\
        \ of type str\n\n    Returns:\n        int: Output of type int\n    \"\"\"\
        \n    raise NotImplementedError(\"This is a virtual stub node that needs to\
        \ be implemented\")\n"
      name: determine_optimal_layers
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type int
        key: output
        type: int
      - description: Input parameter of type str
        key: gpu_count
        type: str
      - description: Input parameter of type str
        key: memory_gb
        type: str
      - description: Input parameter of type str
        key: vocab_size
        type: str
      prd:
        bullets:
        - complexity: MEDIUM
          impact: Ensures that the model architecture can be trained on the allocated
            hardware without runtime failures.
          method: 'Implement a Python routine that calculates memory per layer using
            the formula: layer_mem = (hidden_size * vocab_size * 4 + hidden_size *
            hidden_size * 4 * 2) bytes, multiply by number_of_layers, divide by (gpu_count
            * memory_gb * 1e9 / 4) to check fit; iterate from 1 up to a sensible maximum
            (e.g., 96) to find the largest layer count that satisfies the constraint.'
          reason: Accurate memory estimation is essential to prevent out‑of‑memory
            errors during training.
          text: Compute per-layer memory requirement based on a standard transformer
            architecture assumption (e.g., hidden_size=768, float32 weights) and sum
            across all layers and GPUs to find the maximum layer count that fits within
            the provided memory budget.
        - complexity: LOW
          impact: Guarantees that the function always returns a viable configuration
            for the model.
          method: 'After calculation, apply: if computed_layers < 1: set to 1; if
            computed_layers > MAX_LAYERS: set to MAX_LAYERS.'
          reason: A model with zero layers is invalid and would break downstream logic.
          text: Validate that the computed layer count is at least one and optionally
            cap it at a predefined maximum (e.g., 96) to avoid creating an unusable
            architecture.
        - complexity: LOW
          impact: Provides a clean, predictable output that integrates seamlessly
            with the rest of the pipeline.
          method: Use Python's int() conversion and include try/except around parsing
            of inputs to default to safe values when inputs are malformed.
          reason: Downstream nodes expect an integer output; robust error handling
            prevents crashes.
          text: Return the resulting integer layer count as the function output, ensuring
            it is cast to int and handling any exceptional inputs gracefully.
      prompt: Given gpu_count={{gpu_count}}, memory_gb={{memory_gb}}, and vocab_size={{vocab_size}},
        calculate the optimal number of transformer layers that will fit within the
        available GPU memory. Return the integer number of layers as the output.
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Computes the transformer hidden size that best fits GPU memory
        constraints and is divisible by the desired attention head count.
      implementation: "def calculate_optimal_hidden_size(number_of_layers: str, vocab_size:\
        \ str, memory_gb: str, gpu_count: str) -> int:\n    \"\"\"\n    Computes the\
        \ transformer hidden size that best fits GPU memory constraints and is divisible\
        \ by the desired attention head count.\n\n    Args:\n        number_of_layers:\
        \ Input parameter of type str\nvocab_size: Input parameter of type str\nmemory_gb:\
        \ Input parameter of type str\ngpu_count: Input parameter of type str\n\n\
        \    Returns:\n        int: Output of type int\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")\n"
      name: calculate_optimal_hidden_size
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type int
        key: output
        type: int
      - description: Input parameter of type str
        key: number_of_layers
        type: str
      - description: Input parameter of type str
        key: vocab_size
        type: str
      - description: Input parameter of type str
        key: memory_gb
        type: str
      - description: Input parameter of type str
        key: gpu_count
        type: str
      prd:
        bullets:
        - complexity: LOW
          impact: Prevents out‑of‑memory failures during training.
          method: Implement a helper function that takes memory_gb and gpu_count,
            subtracts overhead, and returns available_memory_per_gpu in bytes.
          reason: Ensures the hidden size calculation does not exceed available memory.
          text: Derive a per‑GPU memory budget that subtracts a fixed overhead (e.g.,
            2 GB) and accounts for activation and optimizer buffers.
