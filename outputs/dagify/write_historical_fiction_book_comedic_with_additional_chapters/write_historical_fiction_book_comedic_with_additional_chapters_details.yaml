dag_type: typed
description: Generated workflow from UI.
name: write_historical_fiction_book_comedic_with_additional_chapters
nodes:
  create_story_outline:
    agent: false
    description: Generates a witty, historically grounded outline for a Civil‑War
      period novel featuring a North‑bound protagonist and the mischievous ghost of
      George Washington. The outline balances sharp humor, detailed character arcs,
      and key Civil‑War battles while maintaining narrative cohesion.
    name: create_story_outline
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The title of each chapter in order.
      key: chapter_titles
      type: List[str]
    - description: A brief description of the main event or plot point in each chapter.
      key: chapter_descriptions
      type: List[str]
    - description: The Civil War battle referenced or featured in each chapter, if
        any.
      key: chapter_battles
      type: List[str]
    - description: The punchline or comedic twist that will appear in each chapter.
      key: chapter_jokes
      type: List[str]
    - description: A short overview of each main character’s arc and comedic flaw.
      key: character_overview
      type: List[str]
    prompt: 'Using your comedic research and deep knowledge of Civil‑War history,
      craft a chapter‑by‑chapter outline for a satirical historical‑fiction novel.
      The story centers on a North‑bound Union soldier guided by the mischievous,
      sarcastic ghost of George Washington. For each chapter, provide:


      1. **chapter_titles** – a witty title that hints at the chapter’s event.

      2. **chapter_descriptions** – a concise narrative of the main plot point.

      3. **chapter_battles** – the Civil‑War battle referenced (if any).

      4. **chapter_jokes** – a punchline or twist that will make readers snort.

      5. **character_overview** – a short arc and comedic flaw for each key character.


      **Special emphasis**: Chapter 3 must be an exceptionally detailed exploration
      of character development. Include exhaustive motivations, back‑stories, and
      evolving relationships for the protagonist, the Union scout, the time‑confused
      sidekick, and Washington’s spectral pop‑ups. Ensure the outline remains cohesive,
      historically respectful, and escalates humor through the narrative arc. Do not
      alter any other instructions or fields.'
  develop_character_profiles:
    agent: false
    description: Generates richly detailed, whimsical, historically flavored character
      profiles for Chapter 3 of a comedic Civil War narrative, emphasizing deep character
      development while preserving humor and historical ties.
    name: develop_character_profiles
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of character names.
      key: character_names
      type: List[str]
    - description: Detailed background narrative for each character.
      key: character_backgrounds
      type: List[str]
    - description: Internal motivation driving each character’s actions.
      key: character_motivations
      type: List[str]
    - description: Humorous flaw or quirk for each character.
      key: character_comedic_flaws
      type: List[str]
    - description: One‑line joke that encapsulates each character’s humor.
      key: character_jokes
      type: List[str]
    prompt: 'You are creating an exceptionally detailed, whimsical, historically flavored
      character profile sheet for Chapter 3 of a comedic Civil War narrative. Using
      the humorous Revolutionary‑War facts supplied earlier, write richly textured
      profiles for each main character. Each profile must include:


      1. **Background** – a vivid history that ties the character to both the Civil
      War era and the earlier Revolutionary‑War humor, with specific formative events,
      quirks, and historical nods.

      2. **Motivation** – a deeply personal drive that fuels the character’s actions
      in this chapter, hinting at internal conflict or a comic twist.

      3. **Comedic flaw** – a humorous quirk or idiosyncrasy that generates situational
      comedy.

      4. **One‑line joke** – a punchy line that encapsulates the character’s humor.


      The protagonist must be a Northern soldier whose arc centers on redemption and
      comic misadventures. George Washington must appear as a spectral advisor, offering
      sage yet sarcastic counsel. Each profile should be a short paragraph that follows
      the structure above, maintaining the comedic twist while providing exhaustive
      depth. Format each profile exactly as:


      "**Name**: [Name]

      **Background**: ...

      **Motivation**: ...

      **Comedic flaw**: ...

      **Joke**: ..."


      Return the results in the output format below.'
  edit_and_revise:
    agent: false
    description: Deepen relationships and escalation with comedic stakes, while providing
      an intensive focus on character development. This node builds nuanced, detailed
      character arcs and interpersonal dynamics, ensuring each character is richly
      portrayed and evolves throughout the chapter.
    name: edit_and_revise
    nodes_depended_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    - write_chapter_4
    - write_chapter_5
    - write_chapter_6
    - write_chapter_7
    nodes_dependent_on: []
    output_structure:
    - description: The sequential number of the chapter.
      key: chapter_number
      type: int
    - description: A short, descriptive title for the chapter.
      key: chapter_title
      type: str
    - description: The full narrative text of the chapter.
      key: chapter_text
      type: str
    - description: A brief description of the joke from Chapter 1 that is referenced
        or twisted in this chapter.
      key: joke_reference
      type: str
    - description: List of one‑liner sarcastic remarks delivered by the ghost of George
        Washington in this chapter.
      key: ghost_sarcasm_lines
      type: List[str]
    prompt: Compose the third chapter of our Civil War‑era historical comedy. Show
      how the protagonist’s interactions with his squad evolve, with a particular
      emphasis on rich, character‑driven storytelling. Include detailed internal monologues,
      backstories, and interpersonal dynamics that illustrate growth and change. Introduce
      a battlefield mishap that turns absurdly humorous, referencing a joke from Chapter 1
      and twisting it. Include the ghost of George Washington offering sarcastic wisdom
      and a one‑liner that ties into the story’s humor. Maintain continuity, keep
      the tone consistent, and end with a punchline that circles back to the opening
      gag.
  fact_check:
    agent: false
    description: Performs a comprehensive fact‑checking of Chapter 3, ensuring historical
      accuracy of all Civil War‑era details, verifying the depth of character development,
      and maintaining comedic integrity.
    name: fact_check
    nodes_depended_on:
    - write_chapter_3
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether Chapter 3 adheres to Civil War historical facts.
      key: is_historically_accurate
      type: bool
    - description: Overall percentage of historical accuracy (0‑100).
      key: accuracy_percentage
      type: int
    - description: List of identified inaccuracies with brief details.
      key: inaccuracies
      type: List[str]
    - description: A light, historically‑inspired joke woven into the fact‑check report.
      key: subtle_joke
      type: str
    prompt: Fact‑check Chapter 3 for strict adherence to Civil War history while preserving
      its comedic heart, and verify that the chapter delivers deeply detailed character
      development as demanded by the narrative. Verify dates, locations, units, the
      protagonist’s Union identity, and the evolution of squad relationships. Ensure
      the ghostly cameo is historically plausible as a playful anachronism. Sprinkle
      a subtle joke that history loves to surprise even the dead. Keep the tone light
      and witty.
  write_chapter_1:
    agent: false
    description: Compose a witty, historically grounded opening chapter.
    name: write_chapter_1
    nodes_depended_on:
    - create_story_outline
    - develop_character_profiles
    nodes_dependent_on: []
    output_structure:
    - description: The numerical order of the chapter within the book (e.g., 1 for
        the first chapter).
      key: chapter_number
      type: int
    - description: A concise, descriptive title for the chapter.
      key: chapter_title
      type: str
    - description: The full text of the chapter, written in a witty, historically
        accurate style with the required comedic elements.
      key: content
      type: str
    prompt: Write the first chapter of the book. Set the scene during the American
      Civil War, with a spirited Northern soldier protagonist navigating the chaos
      of camp life. Introduce the main characters through quick‑fire, witty dialogue,
      and bring in the ghost of George Washington as a sardonic mentor who offers
      absurd advice. Sprinkle playful, historically accurate details—such as a misprinted
      army order or a Confederate horse named "Sour Grapes"—to ground the comedy.
      Plant a joke that will echo throughout the story, and ensure the tone remains
      light‑hearted and punchy.
  write_chapter_2:
    agent: false
    description: Continue the story with a comedic crescendo, building on the tone
      of chapter one, deepening the bond between the spirited Union soldier and the
      sardonic ghost of George Washington. Weave absurd military wisdom, escalating
      humor, and deliver a satisfying payoff to the joke planted earlier. The chapter
      should further develop character dynamics while maintaining the light‑hearted,
      punchy style.
    name: write_chapter_2
    nodes_depended_on:
    - create_story_outline
    - develop_character_profiles
    - write_chapter_1
    nodes_dependent_on: []
    output_structure:
    - description: The numerical order of the chapter.
      key: chapter_number
      type: int
    - description: The title of the chapter, if any.
      key: chapter_title
      type: str
    - description: The complete prose of chapter two, including dialogue, descriptions,
        and comedic beats.
      key: chapter_text
      type: str
    prompt: Write Chapter Two of the novel, advancing the plot with escalating comedy.
      Keep the setting at the American Civil War. The protagonist, a spirited Union
      soldier, encounters the ghost of George Washington who offers absurd yet oddly
      wise military advice. Ensure the ghost's commentary pokes fun at period tropes
      and plays off the joke that was planted in Chapter One. Twist that joke in a
      clever, punchy way that culminates in a comedic payoff. Include lively dialogue,
      vivid battlefield descriptions, and comedic beats that maintain the light‑hearted,
      punchy style of the opening chapter. Expand on character dynamics, show the
      soldier's reactions to Washington’s advice, and deepen the comedic relationship
      between them.
  write_chapter_3:
    agent: false
    description: Deepen and intricately develop character relationships and comedic
      escalation, focusing on detailed evolution of personalities and interactions
      within the squad.
    name: write_chapter_3
    nodes_depended_on:
    - create_story_outline
    - develop_character_profiles
    - write_chapter_2
    nodes_dependent_on: []
    output_structure:
    - description: The sequential number of the chapter.
      key: chapter_number
      type: int
    - description: A short, descriptive title for the chapter.
      key: chapter_title
      type: str
    - description: The full narrative text of the chapter.
      key: chapter_text
      type: str
    - description: A brief description of the joke from Chapter 1 that is referenced
        or twisted in this chapter.
      key: joke_reference
      type: str
    - description: List of one‑liner sarcastic remarks delivered by the ghost of George
        Washington in this chapter.
      key: ghost_sarcasm_lines
      type: List[str]
    prompt: Write chapter 3 of our Civil War‑era historical comedy. Focus on detailed,
      nuanced development of the protagonist’s relationships with his squad, highlighting
      each character’s quirks, motivations, and evolving comedic flaws. Show how the
      protagonist’s interactions with his fellow soldiers deepen and change in response
      to shared mishaps, camaraderie, and conflict, providing vivid inner monologue
      and dialogue. Introduce a battlefield mishap that escalates into an absurdly
      humorous spectacle, cleverly referencing and twisting the joke planted in Chapter 1.
      Include the ghost of George Washington offering sarcastic, sage military advice
      and deliver one‑liners that weave seamlessly into the comedic fabric. Maintain
      continuity, a consistent comedic tone, and conclude with a punchline that circles
      back to the opening gag, tying the chapter together with a satisfying callback.
  write_chapter_4:
    agent: false
    description: Introduce a new comedic scenario building on previous jokes.
    name: write_chapter_4
    nodes_depended_on:
    - create_story_outline
    - develop_character_profiles
    - write_chapter_3
    nodes_dependent_on: []
    output_structure:
    - description: The numeric identifier of the chapter.
      key: chapter_number
      type: int
    - description: The title or subtitle of the chapter.
      key: chapter_title
      type: str
    - description: Full narrative text of chapter 4.
      key: chapter_text
      type: str
    - description: A concise summary of the chapter’s key events and comedic beats.
      key: chapter_summary
      type: str
    prompt: Write chapter 4 of the book. The protagonist faces a new Civil War skirmish
      where a Union supply convoy is hijacked by a band of sarcastic Confederate spies.
      The ghost of George Washington offers a surprisingly modern piece of military
      advice, sparking a clash of eras. Tie in a callback to the joke from chapter 2,
      but twist it so the punchline lands even stronger. Maintain the humor, historical
      accuracy, and character dynamics.
  write_chapter_5:
    agent: false
    description: Elevate the narrative stakes by positioning the protagonist as a
      newly minted temporary lieutenant thrust into the chaos of a disorganized Union
      regiment. Through the spectral guidance of George Washington, who offers humorously
      anachronistic wisdom, the story explores leadership under pressure while maintaining
      a sharp comedic edge. The chapter weaves in a persistent bureaucratic gag that
      builds on earlier jokes, culminating in a punchline that resurrects the recurring
      comedic motif introduced in Chapter 3.
    name: write_chapter_5
    nodes_depended_on:
    - create_story_outline
    - develop_character_profiles
    - write_chapter_4
    nodes_dependent_on: []
    output_structure:
    - description: The full, formatted text of Chapter 5, including narrative, dialogue,
        jokes, and any necessary chapter metadata.
      key: chapter_text
      type: str
    prompt: Write Chapter 5 in full. The protagonist is now a temporary lieutenant
      tasked with restoring order to a chaotic Union regiment. He must learn how to
      command, inspire, and keep the soldiers from mutiny, all while juggling the
      absurdities of 19th‑century military bureaucracy. A ghostly apparition of George
      Washington appears as a comedic mentor, dispensing modern, sarcastic advice
      that clashes with Civil‑War norms and offers unexpected tactical insight. Include
      a running joke about bureaucratic paperwork—such as endless forms for a simple
      parade—that references the jokes introduced in earlier chapters. The chapter
      must develop the protagonist’s character arc, reinforce the comedic tone, and
      deliver a punchline that resurrects the recurring comedic motif from Chapter 3
      (e.g., the soldier’s inexplicable fascination with pocket calculators). Format
      the entire chapter—including title, narrative, dialogue, jokes, and the final
      punchline—as a single string.
  write_chapter_6:
    agent: false
    description: Build tension with a comedic battlefield miscommunication.
    name: write_chapter_6
    nodes_depended_on:
    - create_story_outline
    - develop_character_profiles
    - write_chapter_5
    nodes_dependent_on: []
    output_structure:
    - description: Title of chapter 6
      key: chapter_title
      type: str
    - description: Full narrative text of chapter 6
      key: chapter_text
      type: str
    prompt: Write chapter 6. During a crucial night assault, a misread signal results
      in the Union troops marching into an abandoned Confederate fort. The ghost of
      George Washington offers a sarcastic commentary on the blunder. Use the joke
      from chapter 4 as a set‑up and twist it in a way that heightens the humor while
      maintaining historical detail.
  write_chapter_7:
    agent: false
    description: Conclude the series with a comedic resolution.
    name: write_chapter_7
    nodes_depended_on:
    - create_story_outline
    - develop_character_profiles
    - write_chapter_6
    nodes_dependent_on: []
    output_structure:
    - description: The complete text of Chapter 7, formatted as a single string.
      key: chapter_text
      type: str
    prompt: Write chapter 7 to bring the story to a satisfying comedic close. The
      protagonist faces a final, absurd showdown with the ghost of George Washington
      on the battlefield, culminating in a witty resolution that ties together all
      recurring jokes from the earlier chapters. Ensure the ending delivers a final
      punchline that echoes the opening gag, providing a circular, humorous payoff.
