dag_type: plain_text
description: A workflow for creating a daily fitness plan using AI
name: workout_planner
nodes:
  assess_user_fitness_level:
    agent: false
    description: Evaluate the user's current fitness level
    name: assess_user_fitness_level
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: What is the user's current fitness level? (e.g., beginner, intermediate,
      advanced)
  compile_workout_and_nutrition_plan:
    agent: false
    description: Combine the daily workout plan and nutrition recommendations into
      a comprehensive plan
    name: compile_workout_and_nutrition_plan
    nodes_depended_on:
    - create_daily_workout_plan
    - provide_exercise_instructions
    - recommend_nutrition_plan
    nodes_dependent_on: []
    prompt: Compile the daily workout plan, exercise instructions, and nutrition recommendations
      into a single, cohesive plan
  create_daily_workout_plan:
    agent: false
    description: Generate a daily workout plan tailored to the user's goals and fitness
      level
    name: create_daily_workout_plan
    nodes_depended_on:
    - select_workout_type
    - determine_available_workout_time
    nodes_dependent_on: []
    prompt: Create a daily workout plan that includes specific exercises, sets, reps,
      and duration
  define_user_fitness_goals:
    agent: false
    description: Identify the user's fitness objectives
    name: define_user_fitness_goals
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: What are the user's primary fitness goals? (e.g., weight loss, muscle
      gain, endurance)
  determine_available_workout_time:
    agent: false
    description: Determine the user's available workout time per day
    name: determine_available_workout_time
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: How many minutes per day can the user dedicate to working out?
  provide_exercise_instructions:
    agent: false
    description: Provide detailed instructions for each exercise in the workout plan
    name: provide_exercise_instructions
    nodes_depended_on:
    - create_daily_workout_plan
    nodes_dependent_on: []
    prompt: For each exercise in the daily workout plan, provide step-by-step instructions
      and any necessary safety precautions
  recommend_nutrition_plan:
    agent: false
    description: Suggest a nutrition plan to support the user's fitness goals
    name: recommend_nutrition_plan
    nodes_depended_on:
    - define_user_fitness_goals
    nodes_dependent_on: []
    prompt: What nutrition plan would best support the user's fitness objectives?
      (e.g., macronutrient balance, meal frequency)
  select_workout_type:
    agent: false
    description: Choose the type of workout based on user goals and fitness level
    name: select_workout_type
    nodes_depended_on:
    - define_user_fitness_goals
    - assess_user_fitness_level
    nodes_dependent_on: []
    prompt: What type of workout is most suitable for the user? (e.g., cardio, strength
      training, yoga)
