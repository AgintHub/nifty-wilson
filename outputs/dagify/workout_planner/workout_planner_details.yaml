dag_type: plain_text
description: A workflow for creating a daily fitness plan using AI, focusing on educational
  aspects only.
name: workout_planner
nodes:
  assess_user_fitness_level:
    agent: false
    description: Evaluate the user's current fitness level.
    name: assess_user_fitness_level
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Assess the user's current fitness level by considering their exercise
      history, current activity level, and any physical limitations.
  compile_educational_content:
    agent: false
    description: Prepare educational materials on fitness and nutrition.
    name: compile_educational_content
    nodes_depended_on:
    - generate_exercise_plan
    - create_nutritional_guidelines
    nodes_dependent_on: []
    prompt: Compile educational content explaining the benefits and proper execution
      of the exercises in the plan, as well as the nutritional guidelines provided.
  create_nutritional_guidelines:
    agent: false
    description: Provide nutritional advice to support the fitness plan.
    name: create_nutritional_guidelines
    nodes_depended_on:
    - define_user_fitness_goals
    nodes_dependent_on: []
    prompt: Offer nutritional guidelines that align with the user's fitness goals,
      including recommendations on macronutrient intake and meal timing.
  define_user_fitness_goals:
    agent: false
    description: Identify the user's fitness objectives and preferences.
    name: define_user_fitness_goals
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the primary fitness goals for the user (e.g., weight loss, muscle
      gain, endurance). Consider their preferences and limitations.
  finalize_workout_plan:
    agent: false
    description: Combine the exercise plan and educational content into a final workout
      plan.
    name: finalize_workout_plan
    nodes_depended_on:
    - generate_exercise_plan
    - compile_educational_content
    nodes_dependent_on: []
    prompt: Integrate the daily exercise plan with the educational content to create
      a comprehensive workout plan for the user.
  generate_exercise_plan:
    agent: false
    description: Create a detailed daily exercise plan.
    name: generate_exercise_plan
    nodes_depended_on:
    - select_exercise_type
    nodes_dependent_on: []
    prompt: Generate a daily exercise plan including specific exercises, sets, reps,
      and rest periods based on the selected exercise type.
  select_exercise_type:
    agent: false
    description: Choose the type of exercises suitable for the user.
    name: select_exercise_type
    nodes_depended_on:
    - define_user_fitness_goals
    - assess_user_fitness_level
    nodes_dependent_on: []
    prompt: Based on the user's goals and fitness level, select the appropriate type
      of exercises (e.g., cardio, strength training, flexibility).
