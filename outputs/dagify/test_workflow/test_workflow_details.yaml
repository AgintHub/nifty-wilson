dag_type: plain_text
description: A workflow to test the system with a simple task
name: test_workflow
nodes:
  evaluate_test_result:
    agent: false
    description: Evaluate the result of the test
    name: evaluate_test_result
    nodes_depended_on:
    - perform_test
    nodes_dependent_on: []
    prompt: Assess the outcome of the test
  initiate_test:
    agent: false
    description: Initialize the test workflow
    name: initiate_test
    nodes_depended_on: []
    nodes_dependent_on:
    - evaluate_test_result
    prompt: Start the test process
  perform_test:
    agent: false
    description: Perform the actual test
    name: perform_test
    nodes_depended_on:
    - initiate_test
    nodes_dependent_on:
    - evaluate_test_result
    prompt: Execute the test task
