dag_type: plain_text
description: Creates a tokenizer that recognizes single letters or full English words,
  then applies it to sample prompt and output to generate token positional information.
name: tokenizer_with_positioning_workflow
nodes:
  token_positional_info:
    agent: false
    description: Generates positional information for each token in a sample prompt
      and output using the customized tokenizer.
    name: token_positional_info
    nodes_depended_on:
    - tokenizer_customization
    nodes_dependent_on: []
    prompt: "Using the tokenizer configuration code produced by the previous step,\
      \ apply the tokenizer to the following example prompt and example output:\n\n\
      **Example Prompt:** \"Hello world!\"\n\n**Example Output:** \"Hello world\"\n\
      \nTokenize both the prompt and the output, and for each token provide its start\
      \ and end character positions (0-indexed) in the original string. Return a JSON\
      \ array of objects with fields:\n- `token` (the token string)\n- `start` (start\
      \ index in the source string)\n- `end` (end index, exclusive)\n- `context` (either\
      \ \"prompt\" or \"output\" to indicate which string the token came from).\n\n\
      Only output the JSON array.\n\nExample output format:\n```json\n[{\n  \"token\"\
      : \"Hello\",\n  \"start\": 0,\n  \"end\": 5,\n  \"context\": \"prompt\"\n},\
      \ {\n  \"token\": \"world\",\n  \"start\": 6,\n  \"end\": 11,\n  \"context\"\
      : \"prompt\"\n}, ...]\n```\n"
  tokenizer_customization:
    agent: false
    description: Outputs the final tokenizer configuration code or regex pattern.
    name: tokenizer_customization
    nodes_depended_on: []
    nodes_dependent_on:
    - token_positional_info
    prompt: You are tasked with customizing an existing tokenizer so that it only
      recognizes single alphabetic letters (a–z, case‑insensitive) or full English
      words (sequences of letters). Provide the exact configuration steps or code
      snippet required to enforce this rule. Assume the tokenizer is implemented in
      Python and uses a simple regex‑based split. Output only the final configuration
      code or regex pattern that achieves this behavior.
