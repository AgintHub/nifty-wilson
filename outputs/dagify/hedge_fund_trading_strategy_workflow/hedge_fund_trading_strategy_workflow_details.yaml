dag_type: typed
description: A workflow to develop, refine, backtest, and compile a trading strategy,
  now with the ability to fetch stock data from Yahoo Finance.
name: hedge_fund_trading_strategy_workflow
nodes:
  fetch_stock_data:
    agent: false
    description: Fetch stock data from Yahoo Finance, providing historical stock data
      for analysis.
    name: fetch_stock_data
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of stock ticker symbols for which data is fetched.
      key: ticker_symbols
      type: List[str]
    - description: Date range for fetching historical stock data, in the format [start_date,
        end_date] (e.g., ['2020-01-01', '2023-01-01']).
      key: date_range
      type: List[str]
    - description: The frequency of the stock data (e.g., daily, weekly, monthly).
      key: frequency
      type: str
    - description: List of historical stock prices corresponding to the specified
        ticker symbols and date range.
      key: historical_data
      type: List[float]
    prompt: Fetch historical stock data based on user-specified parameters such as
      ticker symbols, date range, and frequency from Yahoo Finance.
