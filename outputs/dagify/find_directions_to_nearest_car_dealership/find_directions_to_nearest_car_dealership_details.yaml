dag_type: plain_text
description: A workflow to find directions to the nearest car dealership
name: find_directions_to_nearest_car_dealership
nodes:
  get_current_location:
    agent: false
    description: Retrieve the current geographical location
    name: get_current_location
    nodes_depended_on: []
    nodes_dependent_on:
    - search_nearest_car_dealership
    prompt: Determine the current geographical coordinates (latitude and longitude)
      using available location services.
  get_dealership_details:
    agent: false
    description: Retrieve additional details about the nearest car dealership
    name: get_dealership_details
    nodes_depended_on:
    - search_nearest_car_dealership
    nodes_dependent_on: []
    prompt: Using the name and address of the nearest car dealership, retrieve additional
      details such as phone number, hours of operation, and available services.
  get_directions_to_dealership:
    agent: false
    description: Get directions from the current location to the nearest car dealership
    name: get_directions_to_dealership
    nodes_depended_on:
    - search_nearest_car_dealership
    - get_current_location
    nodes_dependent_on: []
    prompt: Using the current location and the geographical coordinates of the nearest
      car dealership, generate step-by-step directions to the dealership.
  search_nearest_car_dealership:
    agent: false
    description: Search for the nearest car dealership using the current location
    name: search_nearest_car_dealership
    nodes_depended_on:
    - get_current_location
    nodes_dependent_on:
    - get_dealership_details
    - get_directions_to_dealership
    prompt: Using the current location, search for the nearest car dealership. Provide
      the name, address, and geographical coordinates of the dealership.
