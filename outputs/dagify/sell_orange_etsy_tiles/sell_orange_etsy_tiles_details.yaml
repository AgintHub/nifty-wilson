dag_type: plain_text
description: A workflow to help sell orange Etsy tiles for $1 each
name: sell_orange_etsy_tiles
nodes:
  create_tile_listing:
    agent: false
    description: Create a listing for the orange Etsy tiles
    name: create_tile_listing
    nodes_depended_on:
    - take_high_quality_tile_photos
    - write_tile_description
    nodes_dependent_on: []
    prompt: Create an Etsy listing for the orange tiles, including title, price, and
      description. Ensure the listing is accurate and visually appealing.
  optimize_tile_listing_for_search:
    agent: false
    description: Optimize the tile listing for Etsy search
    name: optimize_tile_listing_for_search
    nodes_depended_on:
    - create_tile_listing
    nodes_dependent_on: []
    prompt: Optimize the tile listing for Etsy search by including relevant keywords,
      such as 'orange tile' and 'decorative tile'.
  process_tile_orders:
    agent: false
    description: Process orders for the orange tiles
    name: process_tile_orders
    nodes_depended_on:
    - respond_to_customer_inquiries
    nodes_dependent_on: []
    prompt: Process orders for the orange tiles efficiently and accurately, ensuring
      timely shipping and communication with customers.
  promote_tile_listing_on_social_media:
    agent: false
    description: Promote the tile listing on social media platforms
    name: promote_tile_listing_on_social_media
    nodes_depended_on:
    - create_tile_listing
    nodes_dependent_on: []
    prompt: Share the tile listing on social media platforms, such as Facebook, Twitter,
      and Instagram, to increase visibility and attract potential buyers.
  respond_to_customer_inquiries:
    agent: false
    description: Respond to customer inquiries about the orange tiles
    name: respond_to_customer_inquiries
    nodes_depended_on:
    - create_tile_listing
    nodes_dependent_on: []
    prompt: Respond promptly and accurately to customer inquiries about the orange
      tiles, answering questions and addressing concerns.
  set_tile_price:
    agent: false
    description: Set the price for the orange tiles
    name: set_tile_price
    nodes_depended_on: []
    nodes_dependent_on:
    - create_tile_listing
    prompt: Set the price for the orange tiles at $1 each.
  take_high_quality_tile_photos:
    agent: false
    description: Take high-quality photos of the orange tiles
    name: take_high_quality_tile_photos
    nodes_depended_on: []
    nodes_dependent_on:
    - create_tile_listing
    prompt: Take clear, well-lit photos of the orange tiles from multiple angles.
      Ensure the photos are visually appealing and showcase the tiles' features.
  write_tile_description:
    agent: false
    description: Write a detailed description of the orange tiles
    name: write_tile_description
    nodes_depended_on: []
    nodes_dependent_on:
    - create_tile_listing
    prompt: Write a detailed and accurate description of the orange tiles, including
      their material, size, and condition.
