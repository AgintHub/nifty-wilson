        reason: Provides a quick pass/fail indicator for schedule feasibility.
        text: Compute `overall_status` by verifying that every milestone month value
          is less than or equal to `final_go_live_month`. Return True if all are satisfied,
          otherwise False.
      - complexity: LOW
        impact: LOW
        method: Construct a dictionary with keys in the specified order and serialize
          to JSON.
        reason: Matches the output schema expected by downstream nodes and prevents
          re‑ordering errors.
        text: 'Return the outputs in the defined order: `monthly_milestones`, `final_go_live_month`,
          `overall_status`. Ensure that the list of strings is sorted chronologically.'
    prompt: Prepare a launch timeline with monthly milestones over the next 12 months.
      Include regulatory filing, service provider onboarding, capital raise, tech
      deployment, and go-live.
  draft_fee_structure:
    agent: false
    description: Set management and performance fee levels.
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    - estimate_setup_and_operating_costs
    nodes_dependent_on: []
    output_structure:
    - description: Annual management fee expressed as a percentage of assets under
        management.
      key: management_fee_percentage
      type: float
    - description: Annual performance fee expressed as a percentage of profits above
        the hurdle rate.
      key: performance_fee_percentage
      type: float
    - description: Minimum annual return threshold that must be exceeded before performance
        fees are charged.
      key: hurdle_rate_percentage
      type: float
    - description: Concise description of the fee structure in one or two sentences.
      key: summary_sentence
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Parse JSON, cast strings to float, apply `>= 0` checks, and log any
          anomalies.
        reason: Ensures data integrity before any calculations; prevents type‑mismatch
          errors that would cascade to the final fee percentages.
        text: Extract and validate all numeric inputs from the two dependency outputs,
          converting them to floats and ensuring they are non‑negative.
      - complexity: LOW
        impact: HIGH
        method: 'Apply formula: `hurdle = min(8.0, max(5.0, gross_return * 0.5))`
          where `gross_return` is from `set_performance_and_risk_targets`.'
        reason: Balances incentive alignment with risk‑adjusted return expectations
          while keeping the hurdle realistic for the chosen strategy.
        text: Calculate `hurdle_rate_percentage` by setting a base hurdle of 5 % absolute
          return, but increase it to 5 % of the target gross return when the gross
          target is below 10 %. Cap the hurdle at 8 % to keep the structure attractive.
      - complexity: MEDIUM
        impact: HIGH
        method: Compute `cost_ratio = total_estimated_annual_cost / 100_000_000 *
          100`; then apply conditional assignment.
        reason: Guarantees that management fees will cover operating expenses while
          remaining competitive relative to industry averages.
        text: Determine `management_fee_percentage` by first normalizing the total
          annual cost against a reference AUM of 100 M USD. If the cost ratio exceeds
          3 % of AUM, set the fee to 2 %; otherwise set it to 1.5 %.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement nested conditional logic using the Sharpe ratio and maximum
          drawdown values from `set_performance_and_risk_targets`.
        reason: 'Aligns performance incentives with the risk‑return profile: lower
          risk yields a more attractive fee, whereas higher risk commands a premium.'
        text: Set `performance_fee_percentage` to 20 % if the target Sharpe ratio
          is ≥ 1.0, otherwise 25 %. If the target maximum drawdown exceeds 25 %, increase
          the fee to 30 %.
      - complexity: LOW
        impact: MEDIUM
        method: 'Template string interpolation: "Our fund charges a {m_fee:.1f}% management
          fee, {p_fee:.1f}% performance fee above a {hurdle:.1f}% hurdle."'
        reason: Directly satisfies the prompt’s requirement for a concise summary.
        text: Construct a `summary_sentence` that succinctly states the management
          fee, performance fee, and hurdle rate, limiting the output to no more than
          two sentences.
    prompt: Propose management and performance fee percentages that balance cost recovery
      and competitiveness. Include incentive hurdle if relevant. Summarize in ≤3 sentences.
  draft_operations_workflow:
