      type: List[str]
    - description: List of governing body names associated with each filing or registration.
      key: governing_bodies
      type: List[str]
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a helper function that trims whitespace, converts to lowercase,
          and applies a predefined mapping dictionary for known jurisdiction names
          and entity type synonyms. Log any unknown values for audit.
        reason: Accurate key extraction ensures that subsequent lookup operations
          target the correct regulatory mapping table, preventing misspellings and
