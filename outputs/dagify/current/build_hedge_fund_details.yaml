dag_type: typed
description: Generated workflow from UI.
name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    description: Identify the high-level investment strategy category.
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: Primary hedge fund strategy category selected (e.g., Long/Short
        Equity, Global Macro).
      key: strategy_category
      type: str
    - description: One-sentence rationale explaining why this strategy best serves
        the fund objectives.
      key: rationale
      type: str
    prompt: Select one primary hedge fund strategy category that best serves the fund
      objectives (e.g., long/short equity, global macro). Provide a one-sentence rationale.
  choose_legal_entity_type:
    agent: false
    description: Identify legal structure for the fund vehicle.
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    output_structure:
    - description: The legal entity structure chosen for the hedge fund (e.g., LP,
        LLC, SICAV).
      key: entity_type
      type: str
    - description: The jurisdiction where the fund vehicle is established.
      key: jurisdiction
      type: str
    - description: A concise, one-sentence rationale for selecting this entity structure
        in the chosen jurisdiction.
      key: explanation
      type: str
    prompt: Specify the legal entity structure (e.g., LP, LLC, SICAV) appropriate
      for the chosen jurisdiction. Give a one-sentence explanation.
  clarify_fund_objectives:
    agent: false
    description: Produce a bullet list of the hedge fund's core objectives.
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Bullet list of the fund's core objectives, each item a concise
        statement.
      key: objectives
      type: List[str]
    - description: Number of objective bullets provided.
      key: objective_count
      type: int
    prompt: State the primary business objectives for launching the hedge fund. Produce
      a concise bullet list covering investment purpose, competitive edge, and long-term
      vision (max 8 bullets). Focus only on objectives, do not include strategy details.
  compile_pitch_deck_outline:
    agent: false
    description: Framework for fundraising presentation.
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: An ordered list of 10 slide titles, each representing a key component
        of the pitch deck such as objectives, strategy, team, edge, risk controls,
        fees, and expected returns.
      key: slide_titles
      type: List[str]
    prompt: Create a 10-slide outline (slide titles only) for an investor pitch deck
      incorporating objectives, strategy, team, edge, risk controls, fees, and expected
      returns.
  create_hiring_plan:
    agent: false
    description: Determine initial staffing requirements.
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: List of full-time positions required for launch (maximum 8).
      key: position_titles
      type: List[str]
    - description: One-line responsibility for each position, aligned with workflow
        gaps.
      key: responsibility_descriptions
      type: List[str]
    - description: Name of the workflow gap each position addresses.
      key: gap_alignment
      type: List[str]
    - description: Total number of positions listed.
      key: total_positions
      type: int
    prompt: List essential full-time positions for launch (max 8), with one-line responsibility
      each. Align roles with operations workflow gaps.
  define_asset_universe:
    agent: false
    description: Enumerate tradable assets and instruments.
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: List of asset classes and specific instruments that the strategy
        will trade
      key: assets
      type: List[str]
    - description: Number of items included in the assets list (should be ≤10)
      key: asset_count
      type: int
    prompt: List the specific asset classes and instruments the chosen strategy will
      trade (e.g., US large-cap equities, S&P futures). Keep list ≤10 items.
  define_investor_profile:
    agent: false
    description: Describe the target investor segment for the fund.
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: Primary type of investor (e.g., family office, pension, high‑net‑worth
        individual)
      key: target_investor_segment
      type: str
    - description: Minimum typical investment amount in USD
      key: typical_ticket_size_min
      type: float
    - description: Maximum typical investment amount in USD
      key: typical_ticket_size_max
      type: float
    - description: General risk tolerance level of target investors (e.g., high, moderate,
        low)
      key: risk_tolerance
      type: str
    - description: Preferred liquidity horizon (e.g., short‑term, medium‑term, long‑term)
      key: liquidity_preference
      type: str
    - description: List of preferred geographic regions or markets for the investors
      key: geographic_focus
      type: List[str]
    prompt: 'Based on the stated fund objectives, specify the ideal target investor
      profile (e.g., family offices, pensions). List key characteristics: typical
      ticket size, risk tolerance, liquidity preference, and geographic focus.'
  define_technology_stack:
    agent: false
    description: Specify technology tools supporting operations.
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: List of operational steps in the trade lifecycle (e.g., idea generation,
        order entry, execution, confirmation, settlement, reconciliation).
      key: ops_steps
      type: List[str]
    - description: Corresponding technology component for each operational step (e.g.,
        OMS, EMS, risk management system). The order aligns with ops_steps.
      key: tech_components
      type: List[str]
    prompt: 'Identify required software and infrastructure components for each operations
      step (e.g., OMS, EMS, risk system). Present as 2-column table: Ops Step | Tech
      Component.'
  design_compliance_program:
    agent: false
    description: Create compliance policies aligned with regulations and risk.
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: List of regulatory requirements extracted from the regulatory checklist.
      key: compliance_requirements
      type: List[str]
    - description: List of internal policy or procedure references that correspond
        to each regulatory requirement.
      key: policy_references
      type: List[str]
    - description: Number of requirement–policy pairs generated.
      key: mapping_count
      type: int
    - description: Indicates whether the number of policy references matches the number
        of regulatory requirements.
      key: is_consistent
      type: bool
    prompt: 'Generate a compliance checklist mapping each regulatory requirement to
      a specific internal policy or procedure. Table with columns: Requirement | Policy
      Reference.'
  design_risk_management_framework:
    agent: false
    description: Outline quantitative and qualitative risk controls.
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on: []
    output_structure:
    - description: List of core risk control statements aligned with the target metrics.
      key: risk_controls
      type: List[str]
    prompt: 'List core risk controls aligned with the target metrics: position limits,
      VaR limits, stop-loss rules, liquidity thresholds. Provide 4–6 bullet points.'
  develop_timeline_and_milestones:
    agent: false
    description: Create phased schedule leading to fund launch.
    name: develop_timeline_and_milestones
    nodes_depended_on:
    - draft_operations_workflow
    - define_technology_stack
    - create_hiring_plan
    - compile_pitch_deck_outline
    nodes_dependent_on: []
    output_structure:
    - description: 'List of milestone descriptions for each month in the 12-month
        launch timeline. Each entry should be formatted as "Month X: description".'
      key: monthly_milestones
      type: List[str]
    - description: Month number (1-12) when the fund is scheduled to go live.
      key: final_go_live_month
      type: int
    - description: True if all planned milestones are scheduled to be completed by
        the go-live month; otherwise False.
      key: overall_status
      type: bool
    prompt: Prepare a launch timeline with monthly milestones over the next 12 months.
      Include regulatory filing, service provider onboarding, capital raise, tech
      deployment, and go-live.
  draft_fee_structure:
    agent: false
    description: Set management and performance fee levels.
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    - estimate_setup_and_operating_costs
    nodes_dependent_on: []
    output_structure:
    - description: Annual management fee expressed as a percentage of assets under
        management.
      key: management_fee_percentage
      type: float
    - description: Annual performance fee expressed as a percentage of profits above
        the hurdle rate.
      key: performance_fee_percentage
      type: float
    - description: Minimum annual return threshold that must be exceeded before performance
        fees are charged.
      key: hurdle_rate_percentage
      type: float
    - description: Concise description of the fee structure in one or two sentences.
      key: summary_sentence
      type: str
    prompt: Propose management and performance fee percentages that balance cost recovery
      and competitiveness. Include incentive hurdle if relevant. Summarize in ≤3 sentences.
  draft_operations_workflow:
    agent: false
    description: Map core trade and post-trade operational steps.
    name: draft_operations_workflow
    nodes_depended_on:
    - define_asset_universe
    - list_service_providers
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: 'Ordered list of trade lifecycle steps: idea generation, order
        entry, execution, confirmation, settlement, reconciliation.'
      key: trade_lifecycle_steps
      type: List[str]
    - description: Primary responsible party for each step, aligned with trade_lifecycle_steps.
        Use values like 'GP', 'Prime Broker', 'Fund Administrator', 'Internal Ops'.
      key: responsible_parties
      type: List[str]
    prompt: 'Sketch the daily trade lifecycle: idea generation → order entry → execution
      → confirmation → settlement → reconciliation. List each step with primary responsible
      party (internal or provider).'
  estimate_setup_and_operating_costs:
    agent: false
    description: Rough cost model for fund setup and operations.
    name: estimate_setup_and_operating_costs
    nodes_depended_on:
    - list_service_providers
    nodes_dependent_on: []
    output_structure:
    - description: List of cost item names, including each service provider and overhead
        categories.
      key: cost_items
      type: List[str]
    - description: Corresponding estimated annual cost in USD for each item in cost_items.
      key: estimated_usd
      type: List[float]
    - description: Sum of all estimated USD values, representing the total annual
        cost.
      key: total_estimated_annual_cost
      type: float
    prompt: 'Provide a simple annual cost estimate (in USD) for each listed service
      provider plus overhead (office, tech). Present as two columns: Cost Item | Estimated
      USD.'
  identify_regulatory_requirements:
    agent: false
    description: Outline key regulatory filings and registrations.
    name: identify_regulatory_requirements
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    output_structure:
    - description: List of required filings or registrations for the selected legal
        entity and jurisdiction.
      key: filing_names
      type: List[str]
    - description: List of governing body names associated with each filing or registration.
      key: governing_bodies
      type: List[str]
    prompt: List the primary registrations or filings required for the selected entity
      and jurisdiction (e.g., SEC Form ADV). Provide citation to governing body names
      only.
  list_service_providers:
    agent: false
    description: Enumerate required third-party service provider categories.
    name: list_service_providers
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    output_structure:
    - description: Checklist of mandatory third-party service provider categories.
      key: service_providers
      type: List[str]
    prompt: 'Generate a checklist of mandatory external service providers: prime broker,
      fund administrator, auditor, legal counsel, compliance consultant, and custodian.
      No descriptive text—just provider types.'
  outline_governance_structure:
    agent: false
    description: Define internal governance roles and duties.
    name: outline_governance_structure
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    output_structure:
    - description: Names of governance roles (e.g., GP, investment manager, board)
        up to five.
      key: role_names
      type: List[str]
    - description: One-line duties for each role, corresponding to role_names in order.
      key: role_duties
      type: List[str]
    prompt: 'Draft a simple governance chart: roles of GP, investment manager, board
      (if any). Limit to 5 roles with one-line duties each.'
  produce_final_fund_plan_summary:
    agent: false
    description: Generate an all-in summary of the hedge fund plan.
    name: produce_final_fund_plan_summary
    nodes_depended_on:
    - design_compliance_program
    - compile_pitch_deck_outline
    - develop_timeline_and_milestones
    nodes_dependent_on: []
    output_structure:
    - description: Concise executive summary of the hedge fund plan, limited to 400
        words.
      key: executive_summary
      type: str
    - description: Number of words in the executive summary.
      key: word_count
      type: int
    prompt: Synthesize prior outputs into a concise executive summary (≤400 words)
      covering strategy, structure, risk, ops, fees, timeline. Bullet or short paragraphs
      allowed.
  select_jurisdiction:
    agent: false
    description: Pick fund domicile and note rationale.
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The selected fund domicile jurisdiction (e.g., Cayman, Delaware,
        Luxembourg).
      key: jurisdiction
      type: str
    - description: A list of two key advantages of the selected jurisdiction.
      key: pros
      type: List[str]
    - description: A list of two key disadvantages of the selected jurisdiction.
      key: cons
      type: List[str]
    - description: A concise one‑sentence explanation of why this jurisdiction was
        chosen.
      key: rationale
      type: str
    prompt: Choose the optimal fund domicile (e.g., Cayman, Delaware, Luxembourg)
      considering objectives. Provide 2 pros and 2 cons for the selected jurisdiction
      only.
  set_performance_and_risk_targets:
    agent: false
    description: Quantify return and risk goals.
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Target annual gross return expressed as a percentage (e.g., 15.0
        for 15%).
      key: gross_return
      type: float
    - description: Target annual volatility (standard deviation) expressed as a percentage.
      key: volatility
      type: float
    - description: Target annual Sharpe ratio.
      key: sharpe_ratio
      type: float
    - description: Target maximum annual drawdown expressed as a percentage.
      key: max_drawdown
      type: float
    prompt: Define numerical annual targets for gross return, volatility (standard
      deviation), Sharpe ratio, and maximum drawdown consistent with the chosen strategy.
      Present as a 4-row table.
