      - complexity: MEDIUM
        impact: HIGH
        method: 'Create a nested dictionary such as `REG_REQUIREMENTS[jurisdiction][entity_type]
          = {''filing'': ''SEC Form ADV'', ''body'': ''SEC''}`. Populate this dictionary
          with at least 8–10 jurisdiction–entity combinations. Include a default fallback
          that returns empty lists with a warning if the combination is not found.'
        reason: Centralizing regulatory requirements in a lookup table allows for
          deterministic and repeatable outputs, making the PRD easier to maintain
          and extend when new jurisdictions or entity types are added.
        text: Use a pre‑defined lookup table that maps each combination of jurisdiction
          and entity type to a tuple of (filing_name, governing_body). The table should
          cover the most common structures (LP, LLC, SICAV, partnership) and jurisdictions
          (US, UK, Cayman, Luxembourg, Delaware). For example, in the US an LLC or
          LP is required to register with the SEC via Form ADV; in the UK a UK‑based
          LP must register with the FCA; in Cayman a fund must register with the Cayman
          Islands Monetary Authority and may need to file with the Cayman Islands
          Securities Investment Business Licensing Authority if trading securities;
          in Luxembourg a SICAV must register with the CSSF.
      - complexity: LOW
        impact: MEDIUM
        method: 'Use a simple list comprehension: `filings = [entry[''filing''] for
          entry in results]` and `bodies = [entry[''body''] for entry in results]`.
          Wrap in a try/except block to capture and log any unexpected key errors.'
        reason: Aligning the two output arrays ensures downstream nodes (e.g., design_compliance_program)
          can map each filing to a compliance requirement without ambiguity.
        text: 'Generate the final output lists by iterating over the lookup result
          for the identified combination. Return two aligned lists: `filing_names`
          containing the filing titles and `governing_bodies` containing the corresponding
          regulatory authority names. If the lookup returns no data, emit empty lists
          and optionally log an error to alert the user of missing regulatory information.'
    prompt: List the primary registrations or filings required for the selected entity
      and jurisdiction (e.g., SEC Form ADV). Provide citation to governing body names
      only.
