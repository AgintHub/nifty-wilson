dag_type: spec
description: Generated workflow from UI.
name: build_hedge_fund
nodes:
  choose_investment_strategy:
    agent: false
    description: Identify the high-level investment strategy category.
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: Primary hedge fund strategy category selected (e.g., Long/Short
        Equity, Global Macro).
      key: strategy_category
      type: str
    - description: One-sentence rationale explaining why this strategy best serves
        the fund objectives.
      key: rationale
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: MEDIUM
        method: Parse the JSON output, access the `objectives` array, and assert its
          length > 0; if empty, raise a validation error.
        reason: The strategy choice must be grounded in the fund’s stated objectives;
          an empty list would invalidate further logic.
        text: Retrieve the list of core objectives from the output of `clarify_fund_objectives`
          and confirm the list is non-empty.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use a lightweight NLP library (e.g., spaCy or NLTK) to perform part-of-speech
          tagging and extract nouns/adjectives; optionally employ TF‑IDF scoring to
          weight unique terms.
        reason: Keywords provide a structured representation of objectives that can
          be matched against strategy descriptors.
        text: Apply keyword extraction to each objective to capture thematic words
          (e.g., 'growth', 'liquidity', 'global markets').
      - complexity: LOW
        impact: LOW
        method: 'Create a JSON object where keys are strategy names and values are
          arrays of associated keywords, e.g., {''Long/Short Equity'': [''equity'',
          ''beta'', ''alpha''], ''Global Macro'': [''macro'', ''interest'', ''currency'']}'
        reason: A formal mapping enables objective‑to‑strategy translation via keyword
          overlap.
        text: Define a mapping table of candidate strategy categories to characteristic
          keyword sets.
      - complexity: MEDIUM
        impact: HIGH
        method: For each strategy, iterate over its keyword set, increment a counter
          when the keyword appears in the objective keyword list; normalize by total
          number of keywords to produce a score.
        reason: A quantitative score provides an objective basis for selecting the
          best fit strategy.
        text: Score each strategy by counting keyword matches between the aggregated
          objective keywords and each strategy’s keyword set, optionally weighting
          by keyword frequency.
      - complexity: LOW
        impact: MEDIUM
        method: Use a max‑function on the score dictionary; if multiple keys share
          the maximum, sort keys alphabetically and pick the first.
        reason: Ensures a single, reproducible output strategy.
        text: Identify the strategy with the highest score; in case of a tie, apply
          a deterministic tie‑breaker such as alphabetical order or a predefined priority
          hierarchy.
      - complexity: MEDIUM
        impact: HIGH
        method: Select the two highest‑frequency objective themes, insert them into
          a template such as "We choose {strategy} because it targets {theme1} and
          {theme2} objectives."
        reason: The rationale must explain the alignment in a digestible format for
          stakeholders.
        text: Construct a concise, single‑sentence rationale that links the top strategy’s
          key characteristics to the most salient objective themes.
      - complexity: LOW
        impact: LOW
        method: Split the string on period characters; assert length == 1; if more,
          collapse into a single sentence using a summarization or string truncation
          technique.
        reason: Keeps the output concise and readable, matching the specification.
        text: Validate that the rationale contains only one sentence and no excessive
          technical jargon, truncating if necessary.
      - complexity: LOW
        impact: LOW
        method: Serialize the two strings into a JSON object matching the `output_structure`
          schema.
        reason: Completes the node by producing the required fields for downstream
          nodes.
        text: Return the final `strategy_category` and `rationale` values as specified
          in the output structure.
    prompt: Select one primary hedge fund strategy category that best serves the fund
      objectives (e.g., long/short equity, global macro). Provide a one-sentence rationale.
  choose_legal_entity_type:
    agent: false
    description: Identify legal structure for the hedge fund vehicle based on the
      chosen domicile, balancing regulatory fit, tax efficiency, and operational simplicity.
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    output_structure:
    - description: The legal entity structure chosen for the hedge fund (e.g., LP,
        LLC, SICAV).
      key: entity_type
      type: str
    - description: The jurisdiction where the fund vehicle is established.
      key: jurisdiction
      type: str
    - description: A concise, one‑sentence rationale for selecting this entity structure
        in the chosen jurisdiction.
      key: explanation
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: LOW
        method: 'Use a simple JSON path extraction: jurisdiction = parent_outputs[''select_jurisdiction''][''jurisdiction''].'
        reason: The jurisdiction drives the available legal entity options; retrieving
          it ensures the node works with the most current choice.
        text: Retrieve the jurisdiction value from the output of the parent node 'select_jurisdiction'
          and store it as a string variable.
      - complexity: MEDIUM
        impact: MEDIUM
        method: 'Define a static dictionary in the node’s code: compat = { ''Cayman'':
          [''LP'', ''LLC''], ''Delaware'': [''LP''], ''Luxembourg'': [''SICAV''] }.'
        reason: Hard‑coding a small, curated table avoids expensive API calls and
          ensures quick, deterministic decision‑making.
        text: Create a jurisdiction‑entity compatibility lookup table that maps each
          jurisdiction to its commonly used hedge‑fund structures (e.g., Cayman →
          LP/LLC; Delaware → LP; Luxembourg → SICAV).
      - complexity: MEDIUM
        impact: MEDIUM
        method: Assign a scoring matrix (e.g., regulatory=3, tax=2, investor=1) and
          compute a weighted sum for each candidate; choose the one with the highest
          score.
        reason: A deterministic ranking ensures consistent outputs across runs and
          aligns with industry best practices.
        text: Apply a priority ordering rule within each jurisdiction that ranks entities
          by regulatory simplicity, tax efficiency, and investor familiarity.
      - complexity: LOW
        impact: LOW
        method: entity_type = sorted_entities[0]['type'].
        reason: Directly mapping the highest score to output guarantees that the chosen
          structure is objectively justified.
        text: Select the top‑scoring entity type from the sorted list and assign it
          to the 'entity_type' output field.
      - complexity: LOW
        impact: LOW
        method: 'Use string interpolation: explanation = f''{jurisdiction} offers
          a {entity_type} structure that combines {primary_reason} for hedge‑fund
          operations.'''
        reason: A concise justification satisfies the prompt requirement and aids
          downstream nodes that rely on narrative context.
        text: Construct a one‑sentence explanation that references the jurisdiction,
          chosen entity, and the primary justification (e.g., regulatory simplicity).
      - complexity: MEDIUM
        impact: MEDIUM
        method: Implement a validation function that checks isinstance(field, str)
          and len(explanation.split('.')) == 1; log errors via a custom exception
          handler.
        reason: Robust type validation prevents downstream failures and maintains
          data integrity throughout the DAG.
        text: 'Validate that all output fields meet the defined data types: entity_type
          and jurisdiction as strings; explanation as a single‑sentence string; enforce
          type checks and raise descriptive errors if mismatched.'
      - complexity: LOW
        impact: LOW
        method: 'Wrap outputs in an OrderedDict: {''entity_type'': entity_type, ''jurisdiction'':
          jurisdiction, ''explanation'': explanation}.'
        reason: Maintaining consistent output ordering simplifies integration with
          downstream logic and reduces debugging effort.
        text: Return the outputs in the exact order and structure specified by the
          output_schema to ensure compatibility with child nodes.
    prompt: Specify the legal entity structure (e.g., LP, LLC, SICAV) appropriate
      for the chosen jurisdiction. Give a one-sentence explanation.
  clarify_fund_objectives:
    agent: false
    description: Produce a bullet list of the hedge fund's core objectives.
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Bullet list of the fund's core objectives, each item a concise
        statement.
      key: objectives
      type: str
    - description: Number of objective bullets provided.
      key: objective_count
      type: int
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Use a simple regex or string split to detect the keyword "max 8 bullets"
          and set a variable max_bullets = 8.
        reason: Ensures compliance with the explicit format constraints given in the
          prompt.
        text: Parse the prompt to identify the instruction that the output must be
          a concise bullet list limited to no more than eight items.
      - complexity: LOW
        impact: HIGH
        method: Tokenise the prompt, identify noun phrases, and map them to the three
          themes.
        reason: These are the only domains the objective bullets may reference; omitting
          them guarantees focus.
        text: 'Extract the key thematic areas from the prompt: investment purpose,
          competitive edge, and long‑term vision.'
      - complexity: MEDIUM
        impact: HIGH
        method: Define template patterns such as "Achieve a net annual return of X%
          through disciplined risk management." and iterate over themes to produce
          up to max_bullets.
        reason: Keeps the content objective‑only while ensuring clarity and brevity.
        text: Generate objective statements using a template engine that inserts a
          short clause for each theme, ensuring each statement is self‑contained and
          does not mention strategy details.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Implement a loop that checks list length and applies merge rules (e.g.,
          combine related clauses) or appends a predefined filler objective.
        reason: Guarantees compliance with the maximum bullet count while covering
          all required domains.
        text: 'Trim or expand the list to exactly the number of bullets desired: if
          more than 8 statements are generated, merge or prune the least essential
          ones; if fewer than 8, add a generic objective about scalability or stakeholder
          engagement.'
      - complexity: LOW
        impact: LOW
        method: Use len(objectives) in the target language.
        reason: The output schema requires a numeric count for downstream nodes.
        text: Count the final number of bullets and store in `objective_count`.
      - complexity: LOW
        impact: HIGH
        method: Serialize the data using a standard JSON encoder.
        reason: Ensures the node's output can be consumed by dependent nodes such
          as `choose_investment_strategy`.
        text: Return the `objectives` list and `objective_count` as a JSON object
          matching the specified output structure.
    prompt: State the primary business objectives for launching the hedge fund. Produce
      a concise bullet list covering investment purpose, competitive edge, and long‑term
      vision (max 8 bullets). Focus only on objectives, do not include strategy details.
  compile_pitch_deck_outline:
    agent: false
    description: Framework for fundraising presentation.
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: An ordered list of 10 slide titles, each representing a key component
        of the pitch deck such as objectives, strategy, team, edge, risk controls,
        fees, and expected returns.
      key: slide_titles
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Programmatically check that `clarify_fund_objectives.objectives`,
          `define_investor_profile.target_investor_segment`, `choose_investment_strategy.strategy_category`,
          `set_performance_and_risk_targets.gross_return`, `draft_fee_structure.management_fee_percentage`,
          and `design_risk_management_framework.risk_controls` exist and are of the
          expected type.
        reason: Ensures that the downstream logic has the necessary data to construct
          meaningful slide titles.
        text: Verify that all required parent outputs are present and non‑empty before
          proceeding.
      - complexity: MEDIUM
        impact: HIGH
        method: Parse the list of objectives to select the top 3 most impactful bullets;
          capture the strategy category and rationale; pull target gross return, volatility,
          Sharpe ratio, and max drawdown; record the fee structure summary; and compile
          the first 4 risk control statements.
        reason: These themes directly inform the slide titles and ensure each title
          aligns with the fund’s unique selling propositions.
        text: Extract high‑level messaging elements from each parent output to identify
          core narrative themes.
      - complexity: LOW
        impact: HIGH
        method: Use a hard‑coded list of 10 titles as a template, with placeholders
          for dynamic terms.
        reason: A consistent sequence improves narrative flow and meets investor expectations.
        text: 'Define a canonical slide order based on investor deck best practices:
          Introduction, Overview, Objectives, Strategy, Team, Edge, Performance, Risk,
          Fees, Expected Returns.'
      - complexity: LOW
        impact: MEDIUM
        method: 'String interpolation: replace `{strategy}` with the chosen strategy,
          `{return}` with the gross return percentage, and `{risk}` with the key risk
          control phrase.'
        reason: Personalized titles increase engagement and signal that the deck is
          tailored to the fund’s specifics.
        text: Generate each slide title, inserting dynamic terms from parent data
          where relevant (e.g., strategy category, target gross return, risk limit
          keywords).
      - complexity: LOW
        impact: MEDIUM
        method: Token count per title, regex trimming of punctuation, title‑case conversion.
        reason: Short, punchy titles are easier to read and more visually appealing.
        text: Enforce title length constraints (≤ 7 words) and grammatical consistency
          (no trailing punctuation, proper capitalization).
      - complexity: LOW
        impact: HIGH
        method: Count list length and check for duplicates via set comparison.
        reason: Matches the specified output structure and prevents accidental duplication.
        text: Validate that the final list contains exactly ten unique titles.
      - complexity: LOW
        impact: HIGH
        method: Construct a dict with the key `slide_titles` mapping to the ordered
          list, then use a JSON library to output.
        reason: Ensures the node’s contract is fulfilled and downstream nodes can
          consume the data.
        text: Package the validated list into the `slide_titles` output field and
          serialize to JSON.
    prompt: Create a 10-slide outline (slide titles only) for an investor pitch deck
      incorporating objectives, strategy, team, edge, risk controls, fees, and expected
      returns.
  create_hiring_plan:
    agent: false
    description: Determine initial staffing requirements for the hedge fund launch.
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: List of full-time positions required for launch (maximum 8).
      key: position_titles
      type: List[str]
    - description: One-line responsibility for each position, aligned with workflow
        gaps.
      key: responsibility_descriptions
      type: List[str]
    - description: Name of the workflow gap each position addresses.
      key: gap_alignment
      type: List[str]
    - description: Total number of positions listed.
      key: total_positions
      type: int
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Use a JSON parser to map each step to its responsible party; store
          in a dictionary step_to_party.
        reason: These arrays provide the foundation for identifying which operational
          stages lack sufficient internal coverage.
        text: 'Parse the input JSON from draft_operations_workflow to extract the
          two arrays: trade_lifecycle_steps and responsible_parties.'
      - complexity: MEDIUM
        impact: MEDIUM
        method: Consult industry best‑practice staffing matrices for hedge funds and
          encode the list in a static array.
        reason: Having a pool of role templates streamlines role selection and ensures
          coverage of all workflow gaps.
        text: Create a reference list of standard internal operational roles (e.g.,
          Portfolio Analyst, Execution Trader, Risk Manager, Operations Coordinator,
          Compliance Officer, Fund Administrator Liaison, IT Systems Specialist, Finance
          & Accounting Lead).
      - complexity: MEDIUM
        impact: HIGH
        method: Iterate over step_to_party; for each party that is not a core internal
          role, record the step as a gap in gap_list.
        reason: Gap identification directly informs which positions must be filled
          internally.
        text: Identify workflow gaps by comparing each responsible_party with the
          internal role pool; if a party is 'GP' or an external provider (Prime Broker,
          Fund Admin, etc.), flag that step as a gap.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Use a rule table: e.g., idea generation -> Portfolio Analyst, order
          entry -> Execution Trader, execution -> Execution Trader, confirmation ->
          Operations Coordinator, settlement -> Fund Administrator Liaison, reconciliation
          -> Risk Manager. Adjust for multiple gaps if necessary.'
        reason: Accurate mapping guarantees that responsibilities are neither duplicated
          nor omitted.
        text: Map each identified gap to the most appropriate internal role from the
          reference list, ensuring that the role’s core responsibility covers the
          step’s function.
      - complexity: HIGH
        impact: HIGH
        method: Score each role by the number of gaps it covers; select top N roles
          until reaching 8 or all gaps are addressed.
        reason: The node constraint of 8 positions requires efficient role consolidation
          without losing critical coverage.
        text: Limit the final list to a maximum of eight positions by prioritizing
          roles that cover multiple gaps or by consolidating closely related responsibilities
          (e.g., combining Compliance Officer with Operations Coordinator if resources
          are tight).
      - complexity: LOW
        impact: MEDIUM
        method: 'Template strings per role: ''{role}: {responsibility}'' where responsibility
          is a concatenation of step names covered.'
        reason: Clear, concise responsibilities aid in hiring, performance management,
          and stakeholder communication.
        text: Generate the one-line responsibility description for each selected position
          by summarizing the mapped step(s) and the core duties of the role, e.g.,
          "Lead execution of all equity orders, ensuring timely trade capture and
          reconciliation."
      - complexity: LOW
        impact: LOW
        method: Construct parallel arrays; verify lengths match; compute total_positions
          as array length.
        reason: Ensures compliance with the node’s specified output structure.
        text: 'Populate the output fields: position_titles (list of role names), responsibility_descriptions
          (aligned list of responsibility strings), gap_alignment (list of corresponding
          trade_lifecycle_step names), and total_positions (integer count).'
      - complexity: MEDIUM
        impact: HIGH
        method: Loop until len(position_titles) <= 8; use a priority threshold based
          on role seniority or gap coverage count.
        reason: Guarantees node constraint compliance and avoids downstream errors.
        text: Validate that total_positions does not exceed 8; if it does, revisit
          role consolidation step to remove the least critical role, re‑generate responsibilities,
          and update the arrays accordingly.
    prompt: List essential full-time positions for launch (max 8), with one-line responsibility
      each. Align roles with operations workflow gaps.
  define_asset_universe:
    agent: false
    description: Enumerate tradable assets and instruments for the selected hedge
      fund strategy.
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: List of asset classes and specific instruments that the strategy
        will trade
      key: assets
      type: List[str]
    - description: Number of items included in the assets list (should be ≤10)
      key: asset_count
      type: int
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Access the parent node’s output dictionary via the execution engine’s
          dependency graph API; store the string in a local variable called `strategy`.
        reason: The asset universe depends directly on the chosen strategy, so the
          first step is to acquire this value for subsequent lookup.
        text: Extract the `strategy_category` string from the output of the parent
          node `choose_investment_strategy`.
      - complexity: LOW
        impact: MEDIUM
        method: Maintain a constant `VALID_STRATEGIES` list; use a simple membership
          test (`strategy in VALID_STRATEGIES`).
        reason: Ensures downstream asset mapping is defined and prevents mis‑specification.
        text: Validate the extracted `strategy` against a predefined whitelist of
          accepted strategy categories (e.g., "Long/Short Equity", "Global Macro",
          "Event‑Driven", "Statistical Arbitrage", "Fixed Income Arbitrage"). Reject
          or raise an error if the strategy is not in the whitelist.
      - complexity: LOW
        impact: HIGH
        method: Implement the mapping as a Python dictionary (`STRATEGY_ASSET_MAP`)
          and retrieve with `STRATEGY_ASSET_MAP[strategy]`.
        reason: Provides a consistent, curated universe that aligns with industry
          best practices for each strategy type.
        text: 'Lookup the canonical asset list for the validated strategy from a static
          mapping dictionary where keys are strategy names and values are ordered
          lists of asset classes/instruments (e.g., {''Long/Short Equity'': [''US
          Large‑Cap Equities'', ''UK FTSE 100'', ''NASDAQ 100'', ''S&P 500 Futures''],
          ''Global Macro'': [''USD/EUR FX'', ''US Treasury 10‑yr Futures'', ''Gold
          Spot'', ''Crude Oil WTI Futures'']}).'
      - complexity: LOW
        impact: MEDIUM
        method: If `len(asset_list) > 10`, slice the first 10 elements (`asset_list
          = asset_list[:10]`). If custom priority is required, apply a weighted sorting
          function before slicing.
        reason: Complies with the specification that the list must not exceed 10 items
          while preserving the most relevant instruments.
        text: 'Enforce the maximum list size of 10 items: if the retrieved list has
          more than 10 elements, select the top‑10 based on a predetermined priority
          metric (e.g., liquidity volume, market capitalization, or default order
          defined in the mapping).'
      - complexity: LOW
        impact: LOW
        method: 'Return a dictionary: `{''assets'': asset_list, ''asset_count'': len(asset_list)}`.'
        reason: Provides the exact output format expected by downstream nodes.
        text: 'Construct the output structure: assign the finalized asset list to
          the `assets` field and set `asset_count` to the length of the list.'
    prompt: List the specific asset classes and instruments the chosen strategy will
      trade (e.g., US large-cap equities, S&P futures). Keep list ≤10 items.
  define_investor_profile:
    agent: false
    description: Describes the target investor segment for the hedge fund by extracting
      and synthesising investor characteristics from the fund’s strategic objectives.
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: Primary type of investor (e.g., family office, pension, high‑net‑worth
        individual)
      key: target_investor_segment
      type: str
    - description: Minimum typical investment amount in USD
      key: typical_ticket_size_min
      type: float
    - description: Maximum typical investment amount in USD
      key: typical_ticket_size_max
      type: float
    - description: General risk tolerance level of target investors (e.g., high, moderate,
        low)
      key: risk_tolerance
      type: str
    - description: Preferred liquidity horizon (e.g., short‑term, medium‑term, long‑term)
      key: liquidity_preference
      type: str
    - description: List of preferred geographic regions or markets for the investors
      key: geographic_focus
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use a rule‑based NLP extractor to identify keywords such as 'institutional',
          'family office', 'high‑return', 'long‑term', and map them to a predefined
          investor archetype table.
        reason: The investor segment must align with the fund’s stated purpose and
          return expectations.
        text: Parse the objectives list from clarify_fund_objectives to extract investment
          purpose and target return profile.
      - complexity: LOW
        impact: MEDIUM
        method: Maintain a JSON dictionary of archetypes → template values; perform
          a lookup by archetype name.
        reason: Standard templates provide consistent ranges that can be fine‑tuned
          against objectives.
        text: Match the extracted archetype to a base investor profile template that
          includes default ranges for ticket size, risk tolerance, liquidity, and
          geographic focus.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Apply formula: min_ticket = 0.05 * target_AUM, max_ticket = 0.20
          * target_AUM, clamp values to realistic market ranges ($1M‑$100M).'
        reason: Ticket sizes must be realistic given the fundraising window and target
          AUM.
        text: Refine ticket size bounds by quantifying the fund’s target AUM and expected
          capital raise timeline from clarify_fund_objectives.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Map volatility percentage ranges to risk labels: <10% → low, 10–20%
          → moderate, >20% → high.'
        reason: Risk tolerance must be compatible with strategy risk metrics.
        text: Determine risk tolerance level by evaluating the strategy’s volatility
          target from set_performance_and_risk_targets.
      - complexity: LOW
        impact: MEDIUM
        method: If strategy is long/short equity with 1‑2 year horizon → long‑term;
          if global macro with 3‑6 month horizon → medium‑term.
        reason: Liquidity preference must match the strategy’s holding period.
        text: Infer liquidity preference from the fund’s investment horizon specified
          in choose_investment_strategy and set_performance_and_risk_targets.
      - complexity: LOW
        impact: MEDIUM
        method: Create a list of regions present in asset_universe; prioritize regions
          that match jurisdiction tax advantages and regulatory familiarity.
        reason: Investors are more comfortable investing in familiar or aligned geographies.
        text: Select geographic focus by correlating the fund’s domicile (choose_legal_entity_type/jurisdiction)
          and the target markets identified in define_asset_universe.
      - complexity: LOW
        impact: MEDIUM
        method: Compare computed ranges to benchmark table; if outliers exist, adjust
          using a safety factor of 0.8–1.2.
        reason: Ensures the profile is credible and market‑consistent.
        text: Validate all numeric outputs against realistic industry benchmarks (e.g.,
          typical family office ticket size between $5M and $50M).
      - complexity: LOW
        impact: LOW
        method: Serialize values into JSON; cast numeric strings to float; ensure
          geographic_focus is an array of strings.
        reason: Conforms to downstream node expectations and prevents type errors.
        text: Compile the final profile record in the required output structure, ensuring
          type consistency (floats for ticket sizes, list of strings for geographic
          focus).
    prompt: 'Based on the stated fund objectives, specify the ideal target investor
      profile (e.g., family offices, pensions). List key characteristics: typical
      ticket size, risk tolerance, liquidity preference, and geographic focus.'
  define_technology_stack:
    agent: false
    description: Specify technology tools supporting operations.
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: List of operational steps in the trade lifecycle (e.g., idea generation,
        order entry, execution, confirmation, settlement, reconciliation).
      key: ops_steps
      type: List[str]
    - description: Corresponding technology component for each operational step (e.g.,
        OMS, EMS, risk management system). The order aligns with ops_steps.
      key: tech_components
      type: List[str]
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Use a simple list comprehension or copy operation; no transformation
          needed beyond preserving sequence.
        reason: The output must reflect the exact sequence defined in the operations
          workflow.
        text: Parse the parent node’s trade_lifecycle_steps into a local array, preserving
          order to maintain alignment with responsible parties.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Define a static map in code; validate against a reference guide such
          as the Hedge Fund Operations Playbook (HFOP) or proprietary firm templates.
        reason: Standardized pairings reduce ambiguity and ensure consistency with
          common hedge‑fund practice.
        text: Create a mapping dictionary that pairs each lifecycle step with its
          standard industry technology counterpart (e.g., Idea Generation → Strategy
          Analytics Platform, Order Entry → OMS, Execution → EMS, Confirmation → Confirmation
          System, Settlement → Custody & Clearing Platform, Reconciliation → Reconciliation
          Engine).
      - complexity: HIGH
        impact: HIGH
        method: Cross‑reference risk_controls list; flag any mismatch; adjust component
          selection to include risk‑monitoring modules (e.g., embed risk engine into
          OMS).
        reason: Technology must support the quantitative controls defined elsewhere
          to avoid compliance gaps.
        text: For each step, verify that the selected tech component satisfies the
          risk control requirements from the design_risk_management_framework node
          (e.g., risk limits, VaR calculations).
      - complexity: LOW
        impact: MEDIUM
        method: Append a string qualifier such as 'PrimeBroker EMS' to the component
          entry.
        reason: Clarifies ownership and integration points for later implementation.
        text: If the parent node’s responsible_party for a step is an external provider
          (e.g., Prime Broker for Execution), append a note in tech_components indicating
          that the component will be accessed via the provider’s interface rather
          than an internal installation.
      - complexity: LOW
        impact: HIGH
        method: After mapping, perform a length check; raise an exception or log error
          if lengths diverge.
        reason: The output schema demands parallel arrays; any mismatch triggers downstream
          errors.
        text: 'Generate two aligned lists: ops_steps (from the parsed workflow) and
          tech_components (from the mapping), ensuring array lengths match exactly.'
      - complexity: LOW
        impact: MEDIUM
        method: Apply a title‑case transformation; if vendor is unknown, use a placeholder
          like 'Custom OMS'.
        reason: Consistent naming avoids confusion during vendor selection and contract
          negotiations.
        text: Normalize component names to a consistent naming convention (e.g., Vendor‑Specific
          or Standardized Nomenclature) to aid in procurement and vendor management.
      - complexity: LOW
        impact: LOW
        method: Serialize using a JSON library; wrap lists under their respective
          keys.
        reason: Maintains compatibility with downstream nodes and allows easy integration
          with CI/CD pipelines.
        text: Output the final two lists in JSON format, matching the defined output
          structure, and include a brief comment or placeholder for future versioning.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Create a pytest function that asserts equality of ops_steps and tech_components
          to predetermined values.
        reason: Ensures correctness and guards against regressions in future edits.
        text: Validate the output against a unit test that compares it against an
          expected reference for a sample workflow (e.g., Idea Generation, Order Entry,
          Execution, Confirmation, Settlement, Reconciliation).
      - complexity: LOW
        impact: LOW
        method: Embed comments in the code or add metadata key in output JSON.
        reason: Transparency supports audit trails and future upgrades.
        text: Document any assumptions about vendor availability or proprietary solutions,
          noting them in a side comment block for future reference.
    prompt: 'Identify required software and infrastructure components for each operations
      step (e.g., OMS, EMS, risk system). Present as 2-column table: Ops Step | Tech
      Component.'
  design_compliance_program:
    agent: false
    description: Create compliance policies aligned with regulations and risk.
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: List of regulatory requirements extracted from the regulatory checklist.
      key: compliance_requirements
      type: str
    - description: List of internal policy or procedure references that correspond
        to each regulatory requirement.
      key: policy_references
      type: str
    - description: Number of requirement–policy pairs generated.
      key: mapping_count
      type: int
    - description: Indicates whether the number of policy references matches the number
        of regulatory requirements.
      key: is_consistent
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: MEDIUM
        method: Use Python list comprehensions with `.strip()` and `set()` to deduplicate,
          then convert back to list; raise a validation error if types are incorrect.
        reason: Ensures downstream mapping logic receives clean, deterministic inputs,
          reducing error risk in the mapping step.
        text: 'Validate and normalize the incoming lists: confirm that `compliance_requirements`
          is a list of strings and that `risk_controls` is a list of strings; strip
          whitespace, collapse duplicate entries, and ensure no empty strings are
          present.'
      - complexity: MEDIUM
        impact: HIGH
        method: Define a static dict in code; supplement with a lookup in `risk_controls`
          where applicable; for policies not in risk_controls, reference a compliance
          policy catalog file.
        reason: Provides a deterministic rule‑based foundation for the mapping, enabling
          consistent policy assignment across similar regulations.
        text: Create a keyword-to-policy dictionary that maps common regulatory requirement
          themes (e.g., "recordkeeping", "conflict of interest", "cybersecurity",
          "AML") to internal policy names, drawing from the existing `risk_controls`
          list and a predefined compliance policy catalog.
      - complexity: MEDIUM
        impact: HIGH
        method: Use Python's `difflib.get_close_matches` or `fuzzywuzzy` to compute
          similarity; threshold set to 0.8 for substring matches; fallback to generic
          policy.
        reason: Balances precision and flexibility, capturing variations in wording
          while ensuring every requirement gets a policy reference.
        text: For each requirement in `compliance_requirements`, perform a fuzzy keyword
          match against the dictionary keys using Levenshtein distance or a simple
          case‑insensitive substring check; if a match is found, assign the corresponding
          policy reference; otherwise, default to a generic "Compliance Procedure"
          policy.
      - complexity: LOW
        impact: MEDIUM
        method: Iterate through `policy_references`, check membership in `risk_controls`;
          if absent, write to a diagnostics log.
        reason: Guarantees alignment between compliance obligations and risk management
          controls, a key governance requirement.
        text: Cross‑reference the assigned policy references with the `risk_controls`
          list to ensure that each policy is supported by a corresponding risk control;
          if a policy is missing a risk control, log a warning and append the policy
          to the `policy_references` list for review.
      - complexity: LOW
        impact: LOW
        method: Python `len()` on each list; `is_consistent = len(compliance_requirements)
          == len(policy_references)`.
        reason: Provides a quick integrity check for downstream consumers of this
          node (e.g., the final summary).
        text: Count the number of mapped pairs, set `mapping_count` to that integer,
          and compare lengths of `compliance_requirements` and `policy_references`
          to compute `is_consistent` as a Boolean flag.
      - complexity: LOW
        impact: LOW
        method: Construct a dict with keys in order, serialize to JSON or return as
          a Python dict; no transformation needed beyond previous steps.
        reason: Preserves order so that downstream nodes can correlate requirements
          to policies by index, simplifying auditing.
        text: Return the structured output dictionary matching the specified `output_structure`
          order, ensuring the lists maintain original requirement order for traceability.
    prompt: 'Generate a compliance checklist mapping each regulatory requirement to
      a specific internal policy or procedure. Table with columns: Requirement | Policy
      Reference.'
  design_risk_management_framework:
    agent: false
    description: Outline quantitative and qualitative risk controls.
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on: []
    output_structure:
    - description: List of core risk control statements aligned with the target metrics.
      key: risk_controls
      type: List[str]
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: 'Parse JSON output of ''set_performance_and_risk_targets'', assign
          values to variables: gross_return, volatility, sharpe_ratio, max_drawdown.'
        reason: These metrics serve as the reference points for calibrating each risk
          control to the fund’s strategic objectives.
        text: Collect the numerical performance and risk targets from the parent node,
          specifically the annual gross return, volatility, Sharpe ratio, and maximum
          drawdown percentages, and store them in local variables.
      - complexity: MEDIUM
        impact: HIGH
        method: Compute limit = round((gross_return / sharpe_ratio) * 0.05, 2). Ensure
          the result is expressed as a percentage of AUM.
        reason: Position limits prevent over‑concentration and tie exposure to expected
          risk‑adjusted performance.
        text: Define a position limit rule that caps the total exposure per trade
          as a fixed percentage of the total AUM, calculated as 5% of the target gross
          return divided by the target Sharpe ratio, rounded to the nearest 0.5%.
      - complexity: MEDIUM
        impact: HIGH
        method: VaR_limit = 0.01 * sqrt(volatility) * portfolio_value. Format as a
          percentage of AUM.
        reason: VaR limits quantify potential loss within a confidence interval and
          are directly linked to volatility expectations.
        text: Set a VaR limit at the 95% confidence level equal to 1% of the portfolio
          value, scaled by the square root of the target volatility to reflect expected
          market swings.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use trade‑level volatility estimate to adjust the stop threshold;
          apply the higher of the two percentage triggers.
        reason: Stop‑losses protect against unexpected adverse moves and adapt to
          trade‑specific risk.
        text: Implement a stop‑loss rule that triggers an exit when a single trade’s
          unrealized loss exceeds 2% of its position size, or 1% of the total portfolio
          if the trade volatility exceeds the target volatility by more than 50%.
      - complexity: LOW
        impact: MEDIUM
        method: Maintain a separate liquid asset buffer; monitor daily liquidity ratio
          against the 20% benchmark.
        reason: Liquidity thresholds safeguard against forced sales during stressed
          market conditions.
        text: Establish a liquidity threshold requiring that at least 20% of the portfolio
          remain in highly liquid instruments, ensuring the fund can meet liquidity
          demands within the maximum drawdown window.
      - complexity: LOW
        impact: HIGH
        method: 'Concatenate formatted strings: e.g., "Position limit: ≤ X% of AUM",
          "VaR limit: 95% VaR ≤ 1% of portfolio", etc.; set risk_controls = [list
          of strings].'
        reason: The final output must adhere to the defined output structure and provide
          a consumable risk control summary for downstream nodes.
        text: Compile the formulated controls into a single list of string statements,
          each clearly referencing the associated metric and percentage, and assign
          this list to the 'risk_controls' output field.
    prompt: 'List core risk controls aligned with the target metrics: position limits,
      VaR limits, stop-loss rules, liquidity thresholds. Provide 4–6 bullet points.'
  develop_timeline_and_milestones:
    agent: false
    description: Create phased schedule leading to fund launch.
    name: develop_timeline_and_milestones
