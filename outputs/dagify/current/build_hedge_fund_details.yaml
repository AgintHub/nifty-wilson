  set_performance_and_risk_targets:
    agent: false
    description: Quantify return and risk goals.
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Target annual gross return expressed as a percentage (e.g., 15.0
        for 15%).
      key: gross_return
      type: float
    - description: Target annual volatility (standard deviation) expressed as a percentage.
      key: volatility
      type: float
    - description: Target annual Sharpe ratio.
      key: sharpe_ratio
      type: float
    - description: Target maximum annual drawdown expressed as a percentage.
      key: max_drawdown
      type: float
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Read the `strategy_category` field from the parent’s output; if the
          strategy includes a benchmark (e.g., S&P 500 for Long/Short Equity), retrieve
          its historical annualized return, volatility, and Sharpe ratio from a pre‑loaded
          database. Use these figures as a baseline for target setting.
        reason: The risk and return targets must be calibrated to the chosen strategy;
          hence we need the strategy name and any high‑level benchmark references.
        text: Parse the output of the parent node `choose_investment_strategy` to
          identify the selected strategy category and its qualitative performance
          benchmarks.
      - complexity: LOW
        impact: HIGH
        method: Calculate mean annual return (μ) from historical data; set `gross_return
          = min(μ + 5, 30.0)`.
        reason: Setting targets modestly higher than historical performance provides
          ambition without overpromising.
        text: Define a target gross return that is 5% above the strategy’s historical
          mean return, but capped at a realistic maximum of 30% to maintain credibility.
      - complexity: LOW
        impact: MEDIUM
        method: Compute historical σ; set `volatility = min(σ * 1.2, 25.0)`.
        reason: Risk targets should reflect a conservative margin over past volatility
          while ensuring the fund is not perceived as excessively risky.
        text: Set volatility to 20–30% higher than the strategy’s historical volatility
          to account for future uncertainty, with an upper bound of 25% to avoid extreme
          risk appetite.
      - complexity: LOW
        impact: MEDIUM
        method: Retrieve historical Sharpe S; set `sharpe_ratio = min(S + 0.1, 2.0)`.
        reason: Sharpe ratio is a key performance metric; a modest increase signals
          performance improvement without being overly optimistic.
        text: Derive the Sharpe ratio target as the historical Sharpe ratio plus 0.1,
          limited to a maximum of 2.0 to maintain realistic expectations.
      - complexity: LOW
        impact: MEDIUM
        method: Calculate historical D; set `max_drawdown = min(D * 0.5, 45.0)`.
        reason: Drawdown tolerance should be moderate; tying it to historical extremes
          ensures realism.
        text: Define maximum drawdown as 50% of the historical peak‑to‑trough drawdown,
          but not exceeding 45% to keep the target achievable.
      - complexity: MEDIUM
        impact: HIGH
        method: Perform the two checks; if either fails, adjust volatility downwards
          or gross_return upwards within the defined bounds until all conditions hold.
        reason: Consistency checks prevent contradictory metrics that could mislead
          stakeholders.
        text: 'Validate that the resulting target metrics are internally consistent:
          volatility should be >= target gross return divided by Sharpe ratio, and
          max_drawdown should be <= 3× volatility to avoid overly aggressive targets.'
      - complexity: LOW
        impact: LOW
        method: 'Generate a string: `| Metric | Target |

          |-------|--------|

          | Gross Return | X.X% |

          | Volatility | Y.Y% |

          | Sharpe Ratio | Z.Z |

          | Max Drawdown | W.W% |`.'
        reason: The prompt explicitly requests a table; formatting improves readability
          for downstream nodes.
        text: Format the four numerical outputs into a plain 4‑row table, rounding
          each value to one decimal place and appending a percentage sign for clarity.
      - complexity: LOW
        impact: MEDIUM
        method: Assign `gross_return`, `volatility`, `sharpe_ratio`, and `max_drawdown`
          to the JSON payload as floats.
        reason: While the table is for human consumption, the programmatic output
          must be in raw numeric form.
        text: Populate the JSON output structure with the computed float values (without
          percentage signs) to satisfy the downstream node type requirements.
    prompt: Define numerical annual targets for gross return, volatility (standard
      deviation), Sharpe ratio, and maximum drawdown consistent with the chosen strategy.
      Present as a 4-row table.
