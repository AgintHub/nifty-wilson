      - complexity: LOW
        impact: MEDIUM
        method: Identify the maximum month index used in the milestone dictionary.
        reason: Aligns go‑live month with the latest scheduled activity to avoid premature
          launch.
        text: Determine `final_go_live_month` by setting it to the last month with
          a non‑empty milestone. If all milestones complete by month 12, set to 12;
