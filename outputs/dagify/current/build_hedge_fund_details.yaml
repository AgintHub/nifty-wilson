      - complexity: LOW
        impact: MEDIUM
        method: 'Loop over months 1‑12, using `f"Month {i}: {description}"` and append
          to a list.'
        reason: Keeps the output format consistent and machine‑parseable for downstream
          nodes.
        text: 'Generate each monthly milestone description by concatenating the month
          number with a human‑readable action string. For example, "Month 2: File
