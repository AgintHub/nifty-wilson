      )\n    data_processing_pipelines: str = Field(..., description=\"Description\
      \ of the data processing pipelines\")\n    research_data_systems: str = Field(...,\
      \ description=\"Description of the research data systems\")\n    technology_requirements:\
      \ str = Field(..., description=\"List of technology requirements for the data\
      \ infrastructure\")\n\n\nclass CreateHiringStrategyOutput(BaseModel):\n    \"\
      \"\"Pydantic model for create_hiring_strategy node outputs.\"\"\"\n    role_requirements:\
      \ List[str] = Field(..., description=\"List of role requirements for quantitative\
      \ researchers, software engineers, and traders\")\n    compensation_structure:\
      \ str = Field(..., description=\"Description of compensation structure for key\
      \ roles\")\n    recruitment_approach: str = Field(..., description=\"Description\
      \ of recruitment approach for key roles\")\n    target_hiring_numbers: List[int]\
      \ = Field(..., description=\"List of target hiring numbers for key roles\")\n\
      \n\nclass BuildResearchCapabilitiesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for build_research_capabilities node outputs.\"\"\"\n    research_infrastructure:\
      \ str = Field(..., description=\"Description of the research infrastructure\"\
      )\n    research_tools: List[str] = Field(..., description=\"List of research\
      \ tools used\")\n    data_analysis_frameworks: List[str] = Field(..., description=\"\
      List of data analysis frameworks used\")\n    strategy_evaluation_criteria:\
      \ List[str] = Field(..., description=\"List of strategy evaluation criteria\"\
      )\n    research_capital_requirements: List[float] = Field(..., description=\"\
      List of research capital requirements\")\n\n\ndef build_research_capabilities(design_data_infrastructure_input:\
      \ DesignDataInfrastructureOutput, create_hiring_strategy_input: CreateHiringStrategyOutput,\
      \ **kwargs) -> BuildResearchCapabilitiesOutput:\n    \"\"\"Establish quantitative\
      \ research and strategy development processes\n\n    Args:\n        design_data_infrastructure_input:\
      \ Input from the 'design_data_infrastructure' node.\n        create_hiring_strategy_input:\
      \ Input from the 'create_hiring_strategy' node.\n        **kwargs: Additional\
      \ keyword arguments.\n\n    Returns:\n        BuildResearchCapabilitiesOutput:\
      \ Object containing outputs for this node.\n    \"\"\"\n    # Identify research\
      \ infrastructure requirements based on data infrastructure design\n    infrastructure_requirements:\
      \ List[str] = analyze_data_infrastructure_requirements(\n        data_infrastructure_design=design_data_infrastructure_input.data_infrastructure_design,\n\
      \        technology_requirements=design_data_infrastructure_input.technology_requirements,\n\
      \        research_data_systems=design_data_infrastructure_input.research_data_systems\n\
      \    )\n    \n    # Build research infrastructure description from requirements\n\
      \    research_infrastructure_desc: str = build_research_infrastructure_description(\n\
      \        requirements=infrastructure_requirements,\n        role_requirements=create_hiring_strategy_input.role_requirements\n\
      \    )\n    \n    # Develop list of research tools and data analysis frameworks\n\
      \    selected_research_tools: List[str] = select_research_tools(\n        infrastructure_requirements=infrastructure_requirements,\n\
      \        data_processing_pipelines=design_data_infrastructure_input.data_processing_pipelines\n\
      \    )\n    \n    selected_frameworks: List[str] = select_data_analysis_frameworks(\n\
      \        infrastructure_requirements=infrastructure_requirements,\n        alternative_data_sources=design_data_infrastructure_input.alternative_data_sources\n\
      \    )\n    \n    # Define strategy evaluation criteria based on research infrastructure\n\
      \    evaluation_criteria: List[str] = define_strategy_evaluation_criteria(\n\
      \        research_infrastructure=research_infrastructure_desc,\n        research_tools=selected_research_tools,\n\
      \        data_analysis_frameworks=selected_frameworks\n    )\n    \n    # Determine\
      \ research capital requirements\n    capital_requirements: List[float] = calculate_research_capital_requirements(\n\
      \        research_infrastructure=research_infrastructure_desc,\n        research_tools=selected_research_tools,\n\
      \        target_hiring_numbers=create_hiring_strategy_input.target_hiring_numbers,\n\
      \        compensation_structure=create_hiring_strategy_input.compensation_structure\n\
      \    )\n    \n    return BuildResearchCapabilitiesOutput(\n        research_infrastructure=research_infrastructure_desc,\n\
      \        research_tools=selected_research_tools,\n        data_analysis_frameworks=selected_frameworks,\n\
      \        strategy_evaluation_criteria=evaluation_criteria,\n        research_capital_requirements=capital_requirements\n\
      \    )"
