      \        markets=selected_markets_list\n    )\n    \n    # Map regulatory requirements\
      \ for the trading firm\n    mapped_requirements: dict = map_regulatory_requirements(\n\
      \        entity_type=entity_type,\n        markets=selected_markets_list,\n\
      \        regulatory_data=regulatory_data\n    )\n    \n    # Document the key\
