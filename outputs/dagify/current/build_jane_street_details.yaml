      Type of entity for the trading firm (LLC, Corporation, etc.)\")\n    selected_markets:\
      \ str = Field(..., description=\"List of selected primary markets\")\n\n\ndef\
      \ identify_regulatory_requirements(choose_legal_structure_input: ChooseLegalStructureOutput,\
      \ select_primary_markets_input: SelectPrimaryMarketsOutput, **kwargs) -> IdentifyRegulatoryRequirementsOutput:\n\
      \    \"\"\"Map out regulatory registrations and compliance obligations\n\n \
