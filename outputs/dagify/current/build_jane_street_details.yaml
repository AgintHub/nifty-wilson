      Rationale for selecting each primary market and exchange\")\n    liquidity_risk_assessment:\
      \ str = Field(..., description=\"Assessment of liquidity risk in each selected\
      \ market\")\n    regulatory_environment: str = Field(..., description=\"Overview\
      \ of regulatory requirements and implications for each selected market\")\n\
      \    competitive_landscape: str = Field(..., description=\"Analysis of competitive\
      \ landscape in each selected market\")\n\n\nclass IdentifyRegulatoryRequirementsOutput(BaseModel):\n\
