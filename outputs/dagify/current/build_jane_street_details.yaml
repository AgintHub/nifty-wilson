  choose_legal_structure:
    agent: false
    code_node_type: shim
    description: Determine optimal corporate structure for the trading firm
    implementation: "from pydantic import BaseModel, Field\n\n\nclass ChooseLegalStructureOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for choose_legal_structure node outputs.\"\"\"\n \
      \   legal_entity: str = Field(..., description=\"The chosen legal entity structure\
      \ (LLC, Corporation, Partnership)\")\n    tax_implications: str = Field(...,\
      \ description=\"Brief description of tax implications\")\n    liability_protection:\
      \ str = Field(..., description=\"Brief description of liability protection\"\
      )\n    operational_flexibility: str = Field(..., description=\"Brief description\
      \ of operational flexibility\")\n    rationale: str = Field(..., description=\"\
      Rationale for the chosen legal structure\")\n\n\ndef choose_legal_structure(general_input:\
      \ str, **kwargs) -> ChooseLegalStructureOutput:\n    \"\"\"Determine optimal\
      \ corporate structure for the trading firm\n\n    Args:\n        general_input:\
      \ General input string for the root node.\n        **kwargs: Additional keyword\
      \ arguments.\n\n    Returns:\n        ChooseLegalStructureOutput: Object containing\
      \ outputs for this node.\n    \"\"\"\n    # Parse and extract business requirements\
      \ from input\n    business_requirements: dict = parse_business_requirements(input_text=general_input,\
      \ **kwargs)\n    \n    # Analyze trading firm characteristics and needs\n  \
      \  firm_characteristics: dict = analyze_trading_firm_needs(requirements=business_requirements)\n\
      \    \n    # Evaluate legal structure options against requirements\n    structure_analysis:\
      \ dict = evaluate_legal_structures(\n        characteristics=firm_characteristics,\n\
      \        options=[\"LLC\", \"Corporation\", \"Partnership\"]\n    )\n    \n\
      \    # Select optimal legal entity based on analysis\n    optimal_entity: str\
      \ = select_optimal_entity(analysis=structure_analysis)\n    \n    # Generate\
      \ detailed implications for chosen structure\n    tax_details: str = generate_tax_implications(entity=optimal_entity,\
      \ characteristics=firm_characteristics)\n    liability_details: str = generate_liability_protection(entity=optimal_entity)\n\
      \    flexibility_details: str = generate_operational_flexibility(entity=optimal_entity)\n\
      \    \n    # Create rationale for the decision\n    decision_rationale: str\
      \ = generate_structure_rationale(\n        chosen_entity=optimal_entity,\n \
      \       analysis=structure_analysis,\n        requirements=business_requirements\n\
      \    )\n    \n    return ChooseLegalStructureOutput(\n        legal_entity=optimal_entity,\n\
      \        tax_implications=tax_details,\n        liability_protection=liability_details,\n\
      \        operational_flexibility=flexibility_details,\n        rationale=decision_rationale\n\
      \    )"
