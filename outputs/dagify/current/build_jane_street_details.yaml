    description: Select prime brokers and execution venues
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass SelectPrimaryMarketsOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ select_primary_markets node outputs.\"\"\"\n    primary_markets: List[str]\
      \ = Field(..., description=\"List of selected primary markets and exchanges\"\
      )\n    market_selection_reasoning: str = Field(..., description=\"Rationale\
      \ for selecting each primary market and exchange\")\n    liquidity_risk_assessment:\
      \ str = Field(..., description=\"Assessment of liquidity risk in each selected\
      \ market\")\n    regulatory_environment: str = Field(..., description=\"Overview\
      \ of regulatory requirements and implications for each selected market\")\n\
      \    competitive_landscape: str = Field(..., description=\"Analysis of competitive\
      \ landscape in each selected market\")\n\n\nclass DefineCapitalRequirementsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_capital_requirements node outputs.\"\"\"\
      \n    initial_capital_requirements: float = Field(..., description=\"Initial\
      \ capital requirements\")\n    ongoing_capital_needs: float = Field(..., description=\"\
      Ongoing capital needs\")\n    capital_breakdown: str = Field(..., description=\"\
      Breakdown of capital requirements by category\")\n\n\nclass IdentifyPrimeBrokeragePartnersOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_prime_brokerage_partners node outputs.\"\
      \"\"\n    prime_brokerage_partners: List[str] = Field(..., description=\"List\
      \ of potential prime brokerage partners\")\n    execution_venues: List[str]\
      \ = Field(..., description=\"List of potential execution venues\")\n\n\ndef\
      \ identify_prime_brokerage_partners(select_primary_markets_input: SelectPrimaryMarketsOutput,\
      \ define_capital_requirements_input: DefineCapitalRequirementsOutput, **kwargs)\
      \ -> IdentifyPrimeBrokeragePartnersOutput:\n    \"\"\"Select prime brokers and\
      \ execution venues\n\n    Args:\n        select_primary_markets_input: Input\
      \ from the 'select_primary_markets' node.\n        define_capital_requirements_input:\
      \ Input from the 'define_capital_requirements' node.\n        **kwargs: Additional\
      \ keyword arguments.\n\n    Returns:\n        IdentifyPrimeBrokeragePartnersOutput:\
      \ Object containing outputs for this node.\n    \"\"\"\n    # Define evaluation\
      \ criteria for prime brokerage partners and execution venues\n    evaluation_criteria:\
      \ dict = define_evaluation_criteria(\n        factors=[\"execution_quality\"\
      , \"technology_connectivity\", \"margin_rates\", \"counterparty_risk\"]\n  \
      \  )\n    \n    # Research and identify potential prime brokerage partners\n\
      \    potential_prime_brokers: List[str] = research_prime_brokerage_partners(\n\
      \        markets=select_primary_markets_input.primary_markets,\n        capital_requirements=define_capital_requirements_input.initial_capital_requirements\n\
      \    )\n    \n    # Research and identify potential execution venues\n    potential_execution_venues:\
      \ List[str] = research_execution_venues(\n        markets=select_primary_markets_input.primary_markets,\n\
      \        regulatory_environment=select_primary_markets_input.regulatory_environment\n\
      \    )\n    \n    # Assess prime brokerage partners using weighted scoring system\n\
      \    assessed_prime_brokers: dict = assess_prime_brokers(\n        candidates=potential_prime_brokers,\n\
      \        evaluation_criteria=evaluation_criteria,\n        capital_needs=define_capital_requirements_input.ongoing_capital_needs\n\
      \    )\n    \n    # Assess execution venues using weighted scoring system\n\
      \    assessed_execution_venues: dict = assess_execution_venues(\n        candidates=potential_execution_venues,\n\
      \        evaluation_criteria=evaluation_criteria,\n        liquidity_requirements=select_primary_markets_input.liquidity_risk_assessment\n\
      \    )\n    \n    # Select the highest scoring prime brokerage partners\n  \
      \  selected_prime_brokers: List[str] = select_top_candidates(\n        assessed_candidates=assessed_prime_brokers,\n\
      \        selection_threshold=0.7\n    )\n    \n    # Select the highest scoring\
      \ execution venues\n    selected_execution_venues: List[str] = select_top_candidates(\n\
      \        assessed_candidates=assessed_execution_venues,\n        selection_threshold=0.7\n\
      \    )\n    \n    return IdentifyPrimeBrokeragePartnersOutput(\n        prime_brokerage_partners=selected_prime_brokers,\n\
      \        execution_venues=selected_execution_venues,\n    )"
    name: identify_prime_brokerage_partners
    nodes_depended_on:
    - select_primary_markets
