dag_type: typed
description: Generated workflow from UI.
name: hedge_fund_trading_strategy_workflow
nodes:
  backtest_trading_strategy:
    agent: false
    description: Backtest the trading strategy on historical data.
    name: backtest_trading_strategy
    nodes_depended_on:
    - develop_trading_signal_logic
    - specify_asset_universe
    nodes_dependent_on: []
    output_structure:
    - description: Annualized return of the strategy expressed as a percentage.
      key: annual_return_percent
      type: float
    - description: Sharpe ratio of the strategy.
      key: sharpe_ratio
      type: float
    - description: Maximum drawdown of the strategy expressed as a percentage.
      key: max_drawdown_percent
      type: float
    prompt: 'Conduct a backtest of the trading strategy using historical data. Report
      key metrics: return, Sharpe ratio, drawdown.'
  compile_final_strategy_blueprint:
    agent: false
    description: Compile the final trading strategy blueprint.
    name: compile_final_strategy_blueprint
    nodes_depended_on:
    - refine_trading_strategy
    - define_risk_management_rules
    nodes_dependent_on: []
    output_structure:
    - description: The name or title assigned to the trading strategy.
      key: strategy_name
      type: str
    - description: The classification of the strategy (e.g., mean reversion, momentum).
      key: strategy_type
      type: str
    - description: List of asset classes or instruments selected for trading.
      key: asset_universe
      type: List[str]
    - description: Primary technical indicators or signals used in the strategy.
      key: key_indicators
      type: List[str]
    - description: Concise description of position sizing, stop‑loss, and other risk
        controls.
      key: risk_management_summary
      type: str
    - description: A comprehensive narrative summarizing the strategy logic, execution,
        and risk framework.
      key: blueprint_summary
      type: str
    prompt: Synthesize the refined strategy, risk management rules, and asset universe
      into a comprehensive trading strategy blueprint. Provide a detailed summary.
  define_market_analysis:
    agent: false
    description: Identify the market data sources and analysis techniques for the
      trading strategy.
    name: define_market_analysis
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of primary market data sources to be used in the trading strategy
      key: market_data_sources
      type: List[str]
    - description: List of analysis techniques (e.g., technical indicators, sentiment
        analysis) to be employed
      key: analysis_techniques
      type: List[str]
    prompt: List the primary market data sources (e.g., Bloomberg, Quandl) and analysis
      techniques (e.g., technical indicators, sentiment analysis) to be used in the
      trading strategy.
  define_risk_management_rules:
    agent: false
    description: Establish risk management rules for the trading strategy.
    name: define_risk_management_rules
    nodes_depended_on:
    - select_trading_strategy_type
    nodes_dependent_on: []
    output_structure:
    - description: List of risk management rules, each expressed as a concise bullet
        point.
      key: risk_management_rules
      type: List[str]
    - description: Number of risk management rules provided (should be between 3 and
        5).
      key: rule_count
      type: int
    prompt: Outline the risk management rules (e.g., position sizing, stop-loss levels)
      to be applied to the trading strategy. Provide 3–5 bullet points.
  develop_trading_signal_logic:
    agent: false
    description: Create the logic for generating trading signals.
    name: develop_trading_signal_logic
    nodes_depended_on:
    - identify_trading_indicators
    nodes_dependent_on: []
    output_structure:
    - description: Step-by-step outline of how buy/sell signals are generated using
        the identified indicators.
      key: signal_logic_steps
      type: List[str]
    - description: A concise summary of the overall signal generation logic.
      key: signal_logic_summary
      type: str
    prompt: Describe the logic for generating buy/sell signals based on the identified
      indicators. Provide a step-by-step outline.
  identify_trading_indicators:
    agent: false
    description: Determine the specific indicators or signals for the chosen strategy.
    name: identify_trading_indicators
    nodes_depended_on:
    - select_trading_strategy_type
    nodes_dependent_on: []
    output_structure:
    - description: List of technical indicators or trading signals selected for the
        strategy.
      key: indicator_list
      type: List[str]
    - description: Brief descriptions or rationale for each selected indicator.
      key: indicator_descriptions
      type: List[str]
    prompt: List the specific technical indicators or trading signals (e.g., RSI,
      MACD) that will be used in the selected strategy.
  refine_trading_strategy:
    agent: false
    description: Refine the trading strategy based on backtest results.
    name: refine_trading_strategy
    nodes_depended_on:
    - backtest_trading_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Name or brief title of the refined strategy.
      key: refined_strategy_name
      type: str
    - description: 'List of indicator parameter updates (e.g., ''RSI period: 14 ->
        21'').'
      key: updated_indicator_parameters
      type: List[str]
    - description: 'List of updated risk management rules (e.g., ''stop-loss: 2% ->
        1.5%'').'
      key: updated_risk_rules
      type: List[str]
    - description: Annualized return from the backtest.
      key: return_metric
      type: float
    - description: Sharpe ratio from the backtest.
      key: sharpe_ratio_metric
      type: float
    - description: Maximum drawdown from the backtest.
      key: max_drawdown_metric
      type: float
    - description: Brief summary of the refinements made.
      key: refinement_summary
      type: str
    prompt: Analyze the backtest results and refine the trading strategy as needed.
      Adjust parameters, indicators, or risk rules.
  select_trading_strategy_type:
    agent: false
    description: Choose the type of trading strategy (e.g., mean reversion, momentum).
    name: select_trading_strategy_type
    nodes_depended_on:
    - define_market_analysis
    nodes_dependent_on: []
    output_structure:
    - description: The selected trading strategy type (e.g., 'momentum', 'mean reversion').
      key: strategy_type
      type: str
    - description: A concise one‑sentence explanation supporting the chosen strategy.
      key: rationale
      type: str
    prompt: Select one primary trading strategy type that best aligns with the market
      analysis. Provide a one-sentence rationale.
  specify_asset_universe:
    agent: false
    description: Define the universe of assets to be traded.
    name: specify_asset_universe
    nodes_depended_on:
    - select_trading_strategy_type
    nodes_dependent_on: []
    output_structure:
    - description: List of asset classes or instruments (e.g., US equities, futures)
        that will be included in the trading strategy.
      key: asset_universe
      type: List[str]
    prompt: List the specific asset classes or instruments (e.g., US equities, futures)
      to be traded under the selected strategy.
