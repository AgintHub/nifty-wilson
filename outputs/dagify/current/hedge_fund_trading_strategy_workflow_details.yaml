dag_type: plain_text
description: A workflow for building a hedge fund trading strategy, from defining
  market analysis through compiling the final strategy blueprint.
name: hedge_fund_trading_strategy_workflow
nodes:
  backtest_trading_strategy:
    agent: false
    description: Backtest the trading strategy on historical data.
    name: backtest_trading_strategy
    nodes_depended_on:
    - develop_trading_signal_logic
    - specify_asset_universe
    nodes_dependent_on: []
    prompt: 'Conduct a backtest of the trading strategy using historical data. Report
      key metrics: return, Sharpe ratio, drawdown.'
  compile_final_strategy_blueprint:
    agent: false
    description: Compile the final trading strategy blueprint.
    name: compile_final_strategy_blueprint
    nodes_depended_on:
    - refine_trading_strategy
    - define_risk_management_rules
    nodes_dependent_on: []
    prompt: Synthesize the refined strategy, risk management rules, and asset universe
      into a comprehensive trading strategy blueprint. Provide a detailed summary.
  define_market_analysis:
    agent: false
    description: Identify the market data sources and analysis techniques for the
      trading strategy.
    name: define_market_analysis
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the primary market data sources (e.g., Bloomberg, Quandl) and analysis
      techniques (e.g., technical indicators, sentiment analysis) to be used in the
      trading strategy.
  define_risk_management_rules:
    agent: false
    description: Establish risk management rules for the trading strategy.
    name: define_risk_management_rules
    nodes_depended_on:
    - select_trading_strategy_type
    nodes_dependent_on: []
    prompt: Outline the risk management rules (e.g., position sizing, stop-loss levels)
      to be applied to the trading strategy. Provide 3–5 bullet points.
  develop_trading_signal_logic:
    agent: false
    description: Create the logic for generating trading signals.
    name: develop_trading_signal_logic
    nodes_depended_on:
    - identify_trading_indicators
    nodes_dependent_on: []
    prompt: Describe the logic for generating buy/sell signals based on the identified
      indicators. Provide a step-by-step outline.
  identify_trading_indicators:
    agent: false
    description: Determine the specific indicators or signals for the chosen strategy.
    name: identify_trading_indicators
    nodes_depended_on:
    - select_trading_strategy_type
    nodes_dependent_on: []
    prompt: List the specific technical indicators or trading signals (e.g., RSI,
      MACD) that will be used in the selected strategy.
  refine_trading_strategy:
    agent: false
    description: Refine the trading strategy based on backtest results.
    name: refine_trading_strategy
    nodes_depended_on:
    - backtest_trading_strategy
    nodes_dependent_on: []
    prompt: Analyze the backtest results and refine the trading strategy as needed.
      Adjust parameters, indicators, or risk rules.
  select_trading_strategy_type:
    agent: false
    description: Choose the type of trading strategy (e.g., mean reversion, momentum).
    name: select_trading_strategy_type
    nodes_depended_on:
    - define_market_analysis
    nodes_dependent_on: []
    prompt: Select one primary trading strategy type that best aligns with the market
      analysis. Provide a one-sentence rationale.
  specify_asset_universe:
    agent: false
    description: Define the universe of assets to be traded.
    name: specify_asset_universe
    nodes_depended_on:
    - select_trading_strategy_type
    nodes_dependent_on: []
    prompt: List the specific asset classes or instruments (e.g., US equities, futures)
      to be traded under the selected strategy.
