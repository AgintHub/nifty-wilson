dag_type: plain_text
description: Workflow to compute a route from Denver to Raleigh and compile a list
  of Indian restaurants near Raleigh, with each original step split into two concurrent
  parts whose outputs feed into the next steps.
name: road_trip_with_restaurant_search_concurrent_split
nodes:
  compile_restaurant_list_part1:
    agent: false
    description: Organize the filtered Indian restaurant listings into a structured
      list, including their names, addresses, and any relevant details.
    name: compile_restaurant_list_part1
    nodes_depended_on:
    - filter_restaurants_by_cuisine_part1
    - filter_restaurants_by_cuisine_part2
    nodes_dependent_on: []
    prompt: Organize the filtered Indian restaurant listings into a structured list,
      including their names, addresses, and any relevant details.
  compile_restaurant_list_part2:
    agent: false
    description: Organize the filtered Indian restaurant listings into a structured
      list, including their names, addresses, and any relevant details.
    name: compile_restaurant_list_part2
    nodes_depended_on:
    - filter_restaurants_by_cuisine_part1
    - filter_restaurants_by_cuisine_part2
    nodes_dependent_on: []
    prompt: Organize the filtered Indian restaurant listings into a structured list,
      including their names, addresses, and any relevant details.
  compute_route_denver_to_raleigh_part1:
    agent: false
    description: Using the geocoded coordinates of Denver, compute the best driving
      route between Denver and Raleigh, including distance and estimated travel time.
    name: compute_route_denver_to_raleigh_part1
    nodes_depended_on:
    - geocode_denver_part1
    nodes_dependent_on:
    - identify_stopover_points_part1
    - identify_stopover_points_part2
    prompt: Using the geocoded coordinates of Denver, compute the best driving route
      between Denver and Raleigh, including distance and estimated travel time.
  compute_route_denver_to_raleigh_part2:
    agent: false
    description: Using the geocoded coordinates of Denver, compute the best driving
      route between Denver and Raleigh, including distance and estimated travel time.
    name: compute_route_denver_to_raleigh_part2
    nodes_depended_on:
    - geocode_denver_part2
    nodes_dependent_on:
    - identify_stopover_points_part1
    - identify_stopover_points_part2
    prompt: Using the geocoded coordinates of Denver, compute the best driving route
      between Denver and Raleigh, including distance and estimated travel time.
  filter_restaurants_by_cuisine_part1:
    agent: false
    description: From the search results, filter the listings to include only those
      that are confirmed Indian restaurants.
    name: filter_restaurants_by_cuisine_part1
    nodes_depended_on:
    - search_indian_restaurants_part1
    - search_indian_restaurants_part2
    nodes_dependent_on:
    - compile_restaurant_list_part1
    - compile_restaurant_list_part2
    prompt: From the search results, filter the listings to include only those that
      are confirmed Indian restaurants.
  filter_restaurants_by_cuisine_part2:
    agent: false
    description: From the search results, filter the listings to include only those
      that are confirmed Indian restaurants.
    name: filter_restaurants_by_cuisine_part2
    nodes_depended_on:
    - search_indian_restaurants_part1
    - search_indian_restaurants_part2
    nodes_dependent_on:
    - compile_restaurant_list_part1
    - compile_restaurant_list_part2
    prompt: From the search results, filter the listings to include only those that
      are confirmed Indian restaurants.
  geocode_denver_part1:
    agent: false
    description: Geocode 'Denver' to obtain its latitude and longitude coordinates.
    name: geocode_denver_part1
    nodes_depended_on: []
    nodes_dependent_on:
    - compute_route_denver_to_raleigh_part1
    prompt: Geocode 'Denver' to obtain its latitude and longitude coordinates.
  geocode_denver_part2:
    agent: false
    description: Geocode 'Denver' to obtain its latitude and longitude coordinates.
    name: geocode_denver_part2
    nodes_depended_on: []
    nodes_dependent_on:
    - compute_route_denver_to_raleigh_part2
    prompt: Geocode 'Denver' to obtain its latitude and longitude coordinates.
  geocode_raleigh_part1:
    agent: false
    description: Geocode 'Raleigh' to obtain its latitude and longitude coordinates.
    name: geocode_raleigh_part1
    nodes_depended_on:
    - identify_stopover_points_part1
    - identify_stopover_points_part2
    nodes_dependent_on:
    - search_indian_restaurants_part1
    - search_indian_restaurants_part2
    prompt: Geocode 'Raleigh' to obtain its latitude and longitude coordinates.
  geocode_raleigh_part2:
    agent: false
    description: Geocode 'Raleigh' to obtain its latitude and longitude coordinates.
    name: geocode_raleigh_part2
    nodes_depended_on:
    - identify_stopover_points_part1
    - identify_stopover_points_part2
    nodes_dependent_on:
    - search_indian_restaurants_part1
    - search_indian_restaurants_part2
    prompt: Geocode 'Raleigh' to obtain its latitude and longitude coordinates.
  identify_stopover_points_part1:
    agent: false
    description: From the computed route, choose three cities or towns to stop at
      before reaching Raleigh. Provide each stop's name and coordinates.
    name: identify_stopover_points_part1
    nodes_depended_on:
    - compute_route_denver_to_raleigh_part1
    - compute_route_denver_to_raleigh_part2
    nodes_dependent_on:
    - geocode_raleigh_part1
    - geocode_raleigh_part2
    prompt: From the computed route, choose three cities or towns to stop at before
      reaching Raleigh. Provide each stop's name and coordinates.
  identify_stopover_points_part2:
    agent: false
    description: From the computed route, choose three cities or towns to stop at
      before reaching Raleigh. Provide each stop's name and coordinates.
    name: identify_stopover_points_part2
    nodes_depended_on:
    - compute_route_denver_to_raleigh_part1
    - compute_route_denver_to_raleigh_part2
    nodes_dependent_on:
    - geocode_raleigh_part1
    - geocode_raleigh_part2
    prompt: From the computed route, choose three cities or towns to stop at before
      reaching Raleigh. Provide each stop's name and coordinates.
  search_indian_restaurants_part1:
    agent: false
    description: Using the geocoded coordinates of Raleigh, search for nearby Indian
      restaurants within a 5‑mile radius.
    name: search_indian_restaurants_part1
    nodes_depended_on:
    - geocode_raleigh_part1
    - geocode_raleigh_part2
    nodes_dependent_on:
    - filter_restaurants_by_cuisine_part1
    - filter_restaurants_by_cuisine_part2
    prompt: Using the geocoded coordinates of Raleigh, search for nearby Indian restaurants
      within a 5‑mile radius.
  search_indian_restaurants_part2:
    agent: false
    description: Using the geocoded coordinates of Raleigh, search for nearby Indian
      restaurants within a 5‑mile radius.
    name: search_indian_restaurants_part2
    nodes_depended_on:
    - geocode_raleigh_part1
    - geocode_raleigh_part2
    nodes_dependent_on:
    - filter_restaurants_by_cuisine_part1
    - filter_restaurants_by_cuisine_part2
    prompt: Using the geocoded coordinates of Raleigh, search for nearby Indian restaurants
      within a 5‑mile radius.
