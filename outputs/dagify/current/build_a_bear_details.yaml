dag_type: plain_text
description: A workflow to create a teddy bear from selecting materials to final assembly
name: build_a_bear
nodes:
  assemble_body:
    agent: false
    description: Sew the bear's body components together
    name: assemble_body
    nodes_depended_on:
    - cut_out_body_components
    nodes_dependent_on: []
    prompt: Sew the teddy bear's body components together, leaving a small opening
      for turning and stuffing.
  assemble_ears:
    agent: false
    description: Sew the bear's ear components together
    name: assemble_ears
    nodes_depended_on:
    - cut_out_ear_components
    nodes_dependent_on: []
    prompt: Sew the teddy bear's ear components together, turning them right side
      out.
  assemble_paws:
    agent: false
    description: Sew the bear's paw components together
    name: assemble_paws
    nodes_depended_on:
    - cut_out_paw_components
    nodes_dependent_on: []
    prompt: Sew the teddy bear's paw components together, turning them right side
      out.
  attach_ears_and_paws:
    agent: false
    description: Attach the ears and paws to the bear's body
    name: attach_ears_and_paws
    nodes_depended_on:
    - assemble_ears
    - assemble_paws
    - stuff_bear
    nodes_dependent_on: []
    prompt: Attach the teddy bear's ears and paws to its body using a suitable method
      (e.g., sewing, gluing).
  create_pattern:
    agent: false
    description: Design a pattern for the bear's components
    name: create_pattern
    nodes_depended_on:
    - select_fabric
    nodes_dependent_on: []
    prompt: Create a pattern for the teddy bear's components, including the body,
      ears, and paws, using the selected fabric.
  cut_out_body_components:
    agent: false
    description: Cut out the bear's body components from the fabric
    name: cut_out_body_components
    nodes_depended_on:
    - create_pattern
    nodes_dependent_on: []
    prompt: Using the created pattern, cut out the teddy bear's body components from
      the selected fabric.
  cut_out_ear_components:
    agent: false
    description: Cut out the bear's ear components from the fabric
    name: cut_out_ear_components
    nodes_depended_on:
    - create_pattern
    nodes_dependent_on: []
    prompt: Using the created pattern, cut out the teddy bear's ear components from
      the selected fabric.
  cut_out_paw_components:
    agent: false
    description: Cut out the bear's paw components from the fabric
    name: cut_out_paw_components
    nodes_depended_on:
    - create_pattern
    nodes_dependent_on: []
    prompt: Using the created pattern, cut out the teddy bear's paw components from
      the selected fabric.
  final_assembly:
    agent: false
    description: Complete any final assembly tasks
    name: final_assembly
    nodes_depended_on:
    - attach_ears_and_paws
    nodes_dependent_on: []
    prompt: Complete any remaining tasks to finalize the teddy bear's assembly, such
      as closing the opening or adding embellishments.
  select_fabric:
    agent: false
    description: Choose the fabric for the bear's outer layer
    name: select_fabric
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Select a suitable fabric for the teddy bear's outer layer, considering
      factors like texture, color, and durability.
  select_stuffing:
    agent: false
    description: Choose the material for the bear's stuffing
    name: select_stuffing
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Select a suitable material for the teddy bear's stuffing, considering
      factors like loft, softness, and hypoallergenicity.
  stuff_bear:
    agent: false
    description: Fill the bear with the selected stuffing material
    name: stuff_bear
    nodes_depended_on:
    - assemble_body
    - select_stuffing
    nodes_dependent_on: []
    prompt: Fill the teddy bear's body with the selected stuffing material through
      the opening left during assembly.
