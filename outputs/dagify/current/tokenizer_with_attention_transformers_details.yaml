dag_type: plain_text
description: Generated workflow with self-attention block added to transformer stack.
name: tokenizer_with_attention_transformers
nodes:
  layernorm_pre_normalization:
    agent: false
    description: Apply per-token layer normalization after attention block.
    name: layernorm_pre_normalization
    nodes_depended_on:
    - transformer_block_attention
    nodes_dependent_on: []
    prompt: For each token in the JSON array produced by transformer_block_attention,
      compute a simple layer normalization by normalizing the numeric values of existing
      fields `block1` to `block5` (treat boolean or string values as numeric 1 for
      true/processed/validated/finalized/complete and 0 otherwise). Add a new field
      `layernorm` to each token containing the normalized value. Output the updated
      JSON array.
  token_positional_info:
    agent: false
    description: Generate token objects with positional information for both prompt
      and output.
    name: token_positional_info
    nodes_depended_on:
    - tokenizer_customization
    nodes_dependent_on:
    - transformer_block_1
    prompt: "Using the tokenizer configuration code produced by the previous step,\
      \ apply the tokenizer to the following example prompt and example output:\n\n\
      \      **Example Prompt:** \"Hello world!\"\n\n      **Example Output:** \"\
      Hello world\"\n\n      Tokenize both the prompt and the output, and for each\
      \ token provide its start and end character positions (0-indexed) in the original\
      \ string. Return a JSON array of objects with fields:\n\n      - `token` (the\
      \ token string)\n      - `start` (start index in the source string)\n      -\
      \ `end` (end index, exclusive)\n      - `context` (either \"prompt\" or \"output\"\
      \ to indicate which string the token came from).\n\n      Only output the JSON\
      \ array.\n\n      Example output format:\n\n      ```json\n      [{\n      \\\
      \  \"token\": \"Hello\",\n      \\  \"start\": 0,\n      \\  \"end\": 5,\n \
      \     \\  \"context\": \"prompt\"\n      }, {\n      \\  \"token\": \"world\"\
      ,\n      \\  \"start\": 6,\n      \\  \"end\": 11,\n      \\  \"context\": \"\
      prompt\"\n      }, ...]\n      ```"
  tokenizer_customization:
    agent: false
    description: Produce the final tokenizer configuration code or regex pattern.
    name: tokenizer_customization
    nodes_depended_on: []
    nodes_dependent_on:
    - token_positional_info
    prompt: You are tasked with customizing an existing tokenizer so that it only
      recognizes single alphabetic letters (a–z, case‑insensitive) or full English
      words (sequences of letters). Provide the exact configuration steps or code
      snippet required to enforce this rule. Assume the tokenizer is implemented in
      Python and uses a simple regex‑based split. Output only the final configuration
      code or regex pattern that achieves this behavior.
  transformer_block_1:
    agent: false
    description: Add a processed flag from transformer block 1.
    name: transformer_block_1
    nodes_depended_on:
    - token_positional_info
    nodes_dependent_on:
    - transformer_block_2
    prompt: Given the input JSON array of token objects, add a new field `block1`
      with the value `processed` to each token. Output the modified JSON array.
  transformer_block_2:
    agent: false
    description: Add a processed flag from transformer block 2.
    name: transformer_block_2
    nodes_depended_on:
    - transformer_block_1
    nodes_dependent_on:
    - transformer_block_3
    prompt: Given the input JSON array, add a new field `block2` set to `true` for
      each token. Output the modified JSON array.
  transformer_block_3:
    agent: false
    description: Add a validated flag from transformer block 3.
    name: transformer_block_3
    nodes_depended_on:
    - transformer_block_2
    nodes_dependent_on:
    - transformer_block_4
    prompt: Given the input JSON array, add a new field `block3` with the value `validated`.
      Output the modified JSON array.
  transformer_block_4:
    agent: false
    description: Add a finalized flag from transformer block 4.
    name: transformer_block_4
    nodes_depended_on:
    - transformer_block_3
    nodes_dependent_on:
    - transformer_block_5
    prompt: Given the input JSON array, add a new field `block4` set to `finalized`.
      Output the modified JSON array.
  transformer_block_5:
    agent: false
    description: Add a processed flag from transformer block 5.
    name: transformer_block_5
    nodes_depended_on:
    - transformer_block_4
    nodes_dependent_on:
    - transformer_block_attention
    prompt: Given the input JSON array, add a new field `block5` with the value `complete`.
      Output the modified JSON array.
  transformer_block_attention:
    agent: false
    description: Apply self-attention mechanism across token features.
    name: transformer_block_attention
    nodes_depended_on:
    - transformer_block_5
    nodes_dependent_on:
    - layernorm_pre_normalization
    prompt: Given the input JSON array of tokens with `block1` to `block5` fields,
      compute a self-attention matrix where each token attends to all others. For
      each token, calculate attention scores based on similarity between tokens' cumulative
      flag fields (interpreting numeric values as 1 for processed/validated/finalized/complete,
      0 otherwise). Store the final attention weights in a new `attention` field for
      each token as an array with normalized values summing to 1. Output the updated
      JSON array.
