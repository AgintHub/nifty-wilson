      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Parse the parent output `hypothesis_sentence`, trim whitespace, and
          store as `hypothesis`.
        reason: Ensures the hypothesis is directly inherited and not re-formulated,
          maintaining consistency across the workflow.
        text: 1️⃣ Extract the single-sentence hypothesis from the parent node *formulate_hypothesis*
          and assign it to the `hypothesis` field.
      - complexity: MEDIUM
        impact: HIGH
        method: Apply a knowledge‑base lookup of standard experimental variables for
          the domain; filter by relevance; ensure at least two distinct levels per
          variable to allow statistical analysis.
        reason: Independent variables are the key drivers that the experiment will
          test, directly affecting the outcome.
        text: 2️⃣ Identify all factors relevant to the research objective that can
          be intentionally manipulated by the experimenter; list them in the `independent_variables`
          field.
      - complexity: MEDIUM
        impact: HIGH
        method: Map each independent variable to its theoretical effect using causal
          diagrams; cross‑check with the hypothesis statement; avoid duplication.
        reason: Dependent variables represent the experiment’s outcomes, enabling
          quantitative evaluation of the hypothesis.
        text: 3️⃣ For each independent variable, determine the measurable outcome(s)
          it is expected to influence; compile these into the `dependent_variables`
          list.
