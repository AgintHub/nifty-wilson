      \ function\n\n    # Return stub output with placeholder values\n    return DesignExperimentOutput(\n\
      \        hypothesis=\"\",\n        independent_variables=\"\",\n        dependent_variables=\"\
      \",\n        control_variables=\"\",\n        measurement_methods=\"\",\n  \
      \      sample_size=0,\n        experimental_protocol=\"\",\n    )"
    name: design_experiment
    nodes_depended_on:
    - formulate_hypothesis
    nodes_dependent_on: []
    output_structure:
    - description: The testable hypothesis to be examined
      key: hypothesis
      type: str
    - description: List of variables that will be manipulated in the experiment
      key: independent_variables
      type: str
    - description: List of variables that will be measured as outcomes
      key: dependent_variables
      type: str
    - description: List of variables that will be held constant to avoid confounding
