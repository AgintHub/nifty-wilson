      key: control_variables
      type: str
    - description: Methods or instruments used to quantify each dependent variable
      key: measurement_methods
      type: str
    - description: Number of experimental units or trials to be performed
      key: sample_size
      type: int
    - description: Step‑by‑step description of how the experiment will be executed
