dag_type: stub
description: Generated workflow from UI.
name: test_science_experiment_workflow
nodes:
  analyze_data:
    agent: false
    code_node_type: stub
    description: This node consumes the raw data and metadata produced by the collect_data
      node, performs a rigorous statistical analysis, and outputs a structured summary
      of findings that will feed into downstream interpretation.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass CollectDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for collect_data node outputs.\"\"\"\n    observation_count:\
      \ int = Field(..., description=\"Number of observations recorded during the\
      \ experiment.\")\n    data_values: float = Field(..., description=\"Numeric\
      \ values collected during the experiment.\")\n    is_data_valid: bool = Field(...,\
      \ description=\"Whether the recorded data meets quality criteria.\")\n    observation_notes:\
      \ str = Field(..., description=\"Textual notes or comments associated with each\
      \ observation.\")\n\n\nclass AnalyzeDataOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for analyze_data node outputs.\"\"\"\n    analysis_summary: str = Field(...,\
      \ description=\"Concise written summary of the overall analysis, including key\
      \ findings and statistical significance.\")\n    trend_descriptions: str = Field(...,\
      \ description=\"List of individual trend observations identified in the data\
      \ (e.g., increasing temperature over time).\")\n    correlation_summary: str\
      \ = Field(..., description=\"Brief description of any significant correlations\
      \ discovered between variables, with correlation coefficient values.\")\n  \
      \  significant_factors: str = Field(..., description=\"List of variables or\
      \ factors that had statistically significant impact on the outcome.\")\n   \
      \ is_analysis_successful: bool = Field(..., description=\"True if the analysis\
      \ was completed without errors and the data met quality standards, otherwise\
      \ False.\")\n\n\ndef analyze_data(collect_data_input: CollectDataOutput, **kwargs)\
      \ -> AnalyzeDataOutput:\n    \"\"\"This node consumes the raw data and metadata\
      \ produced by the collect_data node, performs a rigorous statistical analysis,\
      \ and outputs a structured summary of findings that will feed into downstream\
      \ interpretation.\n\n    Args:\n        collect_data_input: Input from the 'collect_data'\
      \ node.\n        **kwargs: Additional keyword arguments.\n\n    Returns:\n \
      \       AnalyzeDataOutput: Object containing outputs for this node.\n    \"\"\
      \"\n    # TODO: Implement this function\n\n    # Return stub output with placeholder\
      \ values\n    return AnalyzeDataOutput(\n        analysis_summary=\"\",\n  \
      \      trend_descriptions=\"\",\n        correlation_summary=\"\",\n       \
      \ significant_factors=\"\",\n        is_analysis_successful=False,\n    )"
    name: analyze_data
    nodes_depended_on:
    - collect_data
    nodes_dependent_on: []
    output_structure:
    - description: Concise written summary of the overall analysis, including key
        findings and statistical significance.
      key: analysis_summary
      type: str
    - description: List of individual trend observations identified in the data (e.g.,
        increasing temperature over time).
      key: trend_descriptions
      type: str
    - description: Brief description of any significant correlations discovered between
        variables, with correlation coefficient values.
      key: correlation_summary
      type: str
    - description: List of variables or factors that had statistically significant
        impact on the outcome.
      key: significant_factors
      type: str
    - description: True if the analysis was completed without errors and the data
        met quality standards, otherwise False.
      key: is_analysis_successful
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Check boolean flag; log error message; return failure state.
        reason: Early validation prevents wasted computational effort and ensures
          downstream steps are based on trustworthy data.
        text: 'Validate incoming data: Verify that the ''is_data_valid'' flag from
          collect_data is true; if false, abort analysis and set ''is_analysis_successful''
          to false.'
      - complexity: LOW
        impact: MEDIUM
        method: Use NumPy or Pandas aggregation functions; store results in temporary
          variables.
        reason: Descriptive stats provide context for trend and correlation detection.
        text: 'Calculate descriptive statistics: Compute mean, median, standard deviation,
          min, and max for each numeric column in ''data_values'' to establish baseline
          variability.'
      - complexity: MEDIUM
        impact: HIGH
        method: Fit simple linear regression with observation index as predictor;
          extract slope and p‑value; record trend description if slope significant
          at alpha=0.05.
        reason: Temporal trends are often key insights in experimental data.
        text: 'Detect temporal or sequential trends: If data has an inherent order
          (e.g., observation index), apply a linear regression or moving‑average smoothing
          to identify monotonic increases or decreases.'
      - complexity: MEDIUM
        impact: HIGH
        method: Use SciPy stats.pearsonr or stats.spearmanr; filter pairs with |r|>0.5
          and p<0.05; compile correlation summary string.
        reason: Correlation analysis uncovers relationships that may inform hypothesis
          testing.
        text: 'Compute pairwise correlations: For each pair of variables (if multiple
          variables exist in data), calculate Pearson or Spearman correlation coefficients
          and corresponding p‑values.'
      - complexity: MEDIUM
        impact: HIGH
        method: Use SciPy stats.ttest_ind or stats.f_oneway; map significant variable
          names to 'significant_factors' list.
        reason: Highlights variables that drive the dependent outcome.
        text: 'Identify significant factors: Apply a simple univariate analysis (e.g.,
          t‑test or ANOVA) comparing outcome variable against each independent variable,
          recording those with p<0.05.'
      - complexity: MEDIUM
        impact: HIGH
        method: Template string formatting; include bullet points for each major finding;
          embed p‑value and r‑value values.
        reason: Provides a human‑readable output that downstream nodes can directly
          consume.
        text: 'Synthesize analysis summary: Concatenate key descriptive statistics,
          trend findings, correlation results, and significant factor list into a
          cohesive narrative, ensuring readability and inclusion of statistical significance
          statements.'
      - complexity: LOW
        impact: LOW
        method: Direct assignment of variables to output JSON structure.
        reason: Ensures the node's contract is fulfilled exactly as defined.
        text: 'Populate output fields: Assign computed values to ''analysis_summary'',
          ''trend_descriptions'', ''correlation_summary'', ''significant_factors'',
          and set ''is_analysis_successful'' to true upon successful completion of
          all steps.'
    prompt: Analyze the collected data using appropriate statistical methods and tools.
      Identify trends, patterns, or correlations.
    shims: []
  collect_data:
    agent: false
    code_node_type: stub
    description: Collect and record numerical data and observation notes from the
      completed experiment, ensuring accuracy and completeness.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ConductExperimentOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ conduct_experiment node outputs.\"\"\"\n    experiment_completed: bool = Field(...,\
      \ description=\"Indicates if the experiment was carried out to completion\"\
      )\n    safety_compliance: bool = Field(..., description=\"Indicates whether\
      \ all required safety protocols were followed\")\n    observation_count: int\
      \ = Field(..., description=\"Number of observations recorded during the experiment\"\
      )\n    observations: List[str] = Field(..., description=\"Textual notes of each\
      \ observation\")\n    anomalies_detected: bool = Field(..., description=\"Indicates\
      \ if any anomalies were encountered\")\n    anomaly_descriptions: List[str]\
      \ = Field(..., description=\"Descriptions of each anomaly encountered, if any\"\
      )\n    trial_number: int = Field(..., description=\"The trial number or batch\
      \ identifier for this run\")\n    data_collection_status: bool = Field(...,\
      \ description=\"Whether data collection was successfully performed\")\n\n\n\
      class CollectDataOutput(BaseModel):\n    \"\"\"Pydantic model for collect_data\
      \ node outputs.\"\"\"\n    observation_count: int = Field(..., description=\"\
      Number of observations recorded during the experiment.\")\n    data_values:\
      \ float = Field(..., description=\"Numeric values collected during the experiment.\"\
      )\n    is_data_valid: bool = Field(..., description=\"Whether the recorded data\
      \ meets quality criteria.\")\n    observation_notes: str = Field(..., description=\"\
      Textual notes or comments associated with each observation.\")\n\n\ndef collect_data(conduct_experiment_input:\
      \ ConductExperimentOutput, **kwargs) -> CollectDataOutput:\n    \"\"\"Collect\
      \ and record numerical data and observation notes from the completed experiment,\
      \ ensuring accuracy and completeness.\n\n    Args:\n        conduct_experiment_input:\
      \ Input from the 'conduct_experiment' node.\n        **kwargs: Additional keyword\
      \ arguments.\n\n    Returns:\n        CollectDataOutput: Object containing outputs\
      \ for this node.\n    \"\"\"\n    # TODO: Implement this function\n\n    # Return\
      \ stub output with placeholder values\n    return CollectDataOutput(\n     \
      \   observation_count=0,\n        data_values=0.0,\n        is_data_valid=False,\n\
      \        observation_notes=\"\",\n    )"
    name: collect_data
    nodes_depended_on:
    - conduct_experiment
    nodes_dependent_on: []
    output_structure:
    - description: Number of observations recorded during the experiment.
      key: observation_count
      type: int
    - description: Numeric values collected during the experiment.
      key: data_values
      type: float
    - description: Whether the recorded data meets quality criteria.
      key: is_data_valid
      type: bool
    - description: Textual notes or comments associated with each observation.
      key: observation_notes
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Implement a guard clause that checks all three boolean flags and raises
          a descriptive exception or returns an empty payload if any is false.
        reason: Ensures that data is only processed from a valid, complete experiment
          run, preventing propagation of incomplete or unsafe data.
        text: Verify experiment completion and data collection status by checking
          `experiment_completed`, `data_collection_status`, and `safety_compliance`
          flags from the parent node. If any of these flags indicate failure, abort
          data collection and log an error.
      - complexity: LOW
        impact: MEDIUM
        method: Use a simple `len()` comparison and conditional logic to adjust or
          record the discrepancy in a diagnostics field.
        reason: Consistency between declared count and actual notes guarantees accurate
          mapping between data entries and numeric values.
        text: Retrieve `observation_count` and `observations` from the input. Confirm
          that the integer `observation_count` equals the length of the `observations`
          list; if not, reconcile by truncating or flagging a mismatch.
      - complexity: MEDIUM
        impact: HIGH
        method: Use regex pattern `[-+]?[0-9]*\.?[0-9]+` to find all numeric tokens,
          then convert to float. If the pattern yields no matches, assign `float('nan')`.
        reason: The output `data_values` must be a list of floats matching the observation
          order; a flexible extraction ensures resilience to varied logging formats.
        text: For each observation string in `observations`, apply a robust numeric
          extraction routine that searches for floating‑point or integer representations,
          ignoring non‑numeric tokens. Store extracted numbers in `data_values`, inserting
          `NaN` for observations where no numeric data is found.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a helper function that returns a boolean by aggregating
          the three checks; optionally produce a `quality_report` for diagnostics.
        reason: Quality control prevents downstream analysis on corrupted or misleading
          data.
        text: 'Perform data quality validation: (a) detect any `NaN` values in `data_values`;
          (b) compute mean and standard deviation, flagging entries beyond ±3σ as
          outliers; (c) verify that all numeric values fall within plausible physical
          ranges defined by the experiment design (e.g., temperature 0–100 °C). If
          any check fails, set `is_data_valid` to false.'
      - complexity: LOW
        impact: MEDIUM
        method: Simple assignment statements in the output dictionary.
        reason: Direct mapping guarantees that downstream nodes receive correctly
          typed and validated data.
        text: 'Populate the output fields: copy the validated `observation_count`,
          the processed `data_values`, the boolean `is_data_valid`, and the original
          `observations` into `observation_notes`.'
      - complexity: LOW
        impact: LOW
        method: Serialize the payload to JSON, omitting hidden fields unless debugging
          mode is active.
        reason: Providing diagnostics supports traceability and facilitates quick
          identification of data issues.
        text: Return the output payload in the required JSON structure. Include an
          optional diagnostic log in a hidden field if `is_data_valid` is false to
          aid troubleshooting.
    prompt: '# Collect Data Prompt


      Collect and record data from the experiment. Ensure data is accurate and comprehensive.


      **Inputs (from conduct_experiment):**

      - `observation_count` (INT)

      - `observations` (LIST_STR) – textual notes for each observation

      - `data_collection_status` (BOOL)

      - `experiment_completed` (BOOL)

      - `safety_compliance` (BOOL)

      - `anomalies_detected` (BOOL)

      - `anomaly_descriptions` (LIST_STR)


      **Output Requirements:**

      - `observation_count` (INT)

      - `data_values` (LIST_FLOAT) – numeric values extracted from each observation

      - `is_data_valid` (BOOL) – result of quality checks

      - `observation_notes` (LIST_STR) – same as input `observations`


      Follow these steps:

      1. Verify that the experiment completed successfully and data collection was
      performed.

      2. Validate that `observation_count` matches the length of `observations`.

      3. Extract numeric values from each observation string; if extraction fails
      for an entry, record NaN.

      4. Perform data quality checks: missing values, outliers, and consistency with
      expected ranges.

      5. Set `is_data_valid` to true only if all checks pass; otherwise false.

      6. Return the four output fields.


      **Note:** Use robust text‑to‑number parsing (regex, NLP if needed) and statistical
      thresholds (e.g., 3σ outliers) for validation.

      '
    shims: []
  conduct_experiment:
    agent: false
    code_node_type: stub
    description: This node executes the laboratory or field experiment as specified
      in the design and preparation steps. It must follow the experimental protocol,
      enforce safety checks, log observations and anomalies, and signal whether data
      collection succeeded.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DesignExperimentOutput(BaseModel):\n    \"\"\"Pydantic model for design_experiment\
      \ node outputs.\"\"\"\n    hypothesis: str = Field(..., description=\"The testable\
      \ hypothesis to be examined\")\n    independent_variables: str = Field(...,\
      \ description=\"List of variables that will be manipulated in the experiment\"\
      )\n    dependent_variables: str = Field(..., description=\"List of variables\
      \ that will be measured as outcomes\")\n    control_variables: str = Field(...,\
      \ description=\"List of variables that will be held constant to avoid confounding\
      \ effects\")\n    measurement_methods: str = Field(..., description=\"Methods\
      \ or instruments used to quantify each dependent variable\")\n    sample_size:\
      \ int = Field(..., description=\"Number of experimental units or trials to be\
      \ performed\")\n    experimental_protocol: str = Field(..., description=\"Step\\\
      u2011by\\u2011step description of how the experiment will be executed\")\n\n\
      \nclass PrepareMaterialsOutput(BaseModel):\n    \"\"\"Pydantic model for prepare_materials\
      \ node outputs.\"\"\"\n    required_items: List[str] = Field(..., description=\"\
      Names of all materials and equipment items required for the experiment\")\n\
      \    quantities: List[int] = Field(..., description=\"Quantities of each corresponding\
      \ item listed in required_items\")\n    total_cost: float = Field(..., description=\"\
      Estimated total cost of all prepared items\")\n    is_prepared: bool = Field(...,\
      \ description=\"Whether all items have been successfully prepared and ready\
      \ for use\")\n    preparation_notes: str = Field(..., description=\"Any additional\
      \ notes or remarks about the preparation process\")\n\n\nclass ConductExperimentOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for conduct_experiment node outputs.\"\"\"\n    experiment_completed:\
      \ bool = Field(..., description=\"Indicates if the experiment was carried out\
      \ to completion\")\n    safety_compliance: bool = Field(..., description=\"\
      Indicates whether all required safety protocols were followed\")\n    observation_count:\
      \ int = Field(..., description=\"Number of observations recorded during the\
      \ experiment\")\n    observations: List[str] = Field(..., description=\"Textual\
      \ notes of each observation\")\n    anomalies_detected: bool = Field(..., description=\"\
      Indicates if any anomalies were encountered\")\n    anomaly_descriptions: List[str]\
      \ = Field(..., description=\"Descriptions of each anomaly encountered, if any\"\
      )\n    trial_number: int = Field(..., description=\"The trial number or batch\
      \ identifier for this run\")\n    data_collection_status: bool = Field(...,\
      \ description=\"Whether data collection was successfully performed\")\n\n\n\
      def conduct_experiment(design_experiment_input: DesignExperimentOutput, prepare_materials_input:\
      \ PrepareMaterialsOutput, **kwargs) -> ConductExperimentOutput:\n    \"\"\"\
      This node executes the laboratory or field experiment as specified in the design\
      \ and preparation steps. It must follow the experimental protocol, enforce safety\
      \ checks, log observations and anomalies, and signal whether data collection\
      \ succeeded.\n\n    Args:\n        design_experiment_input: Input from the 'design_experiment'\
      \ node.\n        prepare_materials_input: Input from the 'prepare_materials'\
      \ node.\n        **kwargs: Additional keyword arguments.\n\n    Returns:\n \
      \       ConductExperimentOutput: Object containing outputs for this node.\n\
      \    \"\"\"\n    # TODO: Implement this function\n\n    # Return stub output\
      \ with placeholder values\n    return ConductExperimentOutput(\n        experiment_completed=False,\n\
      \        safety_compliance=False,\n        observation_count=0,\n        observations=[],\n\
      \        anomalies_detected=False,\n        anomaly_descriptions=[],\n     \
      \   trial_number=0,\n        data_collection_status=False,\n    )"
    name: conduct_experiment
    nodes_depended_on:
    - design_experiment
    - prepare_materials
    nodes_dependent_on: []
    output_structure:
    - description: Indicates if the experiment was carried out to completion
      key: experiment_completed
      type: bool
    - description: Indicates whether all required safety protocols were followed
      key: safety_compliance
      type: bool
    - description: Number of observations recorded during the experiment
      key: observation_count
      type: int
    - description: Textual notes of each observation
      key: observations
      type: List[str]
    - description: Indicates if any anomalies were encountered
      key: anomalies_detected
      type: bool
    - description: Descriptions of each anomaly encountered, if any
      key: anomaly_descriptions
      type: List[str]
    - description: The trial number or batch identifier for this run
      key: trial_number
      type: int
    - description: Whether data collection was successfully performed
      key: data_collection_status
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: 'Implement a pre‑execution check: if !is_prepared then set experiment_completed
          = false, safety_compliance = false, exit loop.'
        reason: Ensures that the experiment only proceeds when the required resources
          are available, preventing equipment failures and safety incidents.
        text: Validate that all materials and equipment are prepared by checking the
          `is_prepared` flag from the `prepare_materials` output. If the flag is false,
          abort the experiment, set `experiment_completed` to false, and record a
          safety compliance failure.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use a simple delimiter (e.g., newline or semicolon) to split the protocol,
          trim whitespace, and validate step syntax against a known schema.
        reason: The protocol must be broken down into actionable operations that the
          system can iterate over.
        text: Parse the experimental protocol string from the `design_experiment`
          output into a list of executable steps. Store each step in an array `protocol_steps`
          for sequential iteration.
      - complexity: LOW
        impact: LOW
        method: Set trial_number = design_experiment.sample_size or 1; initialize
          arrays.
        reason: Establishes baseline state before experiment execution, allowing clear
          tracking of changes.
        text: Initialize empty collections for `observations` and `anomaly_descriptions`,
          and set boolean flags `safety_compliance` and `data_collection_status` to
          true. Assign the trial number from `design_experiment.sample_size` if it
          represents a run index, or default to 1 if not provided.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Implement a loop: for step in protocol_steps: execute_step(step);
          append observation = f''{timestamp}: {step_result}''.'
        reason: Sequential execution is essential to maintain experimental integrity.
        text: Iterate over each step in `protocol_steps`. For each step, perform the
          defined action (e.g., add reagent, adjust temperature, record measurement)
          and capture a timestamped observation note.
      - complexity: MEDIUM
        impact: HIGH
        method: Embed safety checks within each `execute_step` call; use a rule engine
          or conditional checks to flag violations.
        reason: Safety must be enforced at all times; early abort prevents escalation
          of hazards.
        text: During step execution, continuously monitor safety compliance against
          a predefined safety checklist (e.g., PPE usage, containment integrity, emergency
          procedures). If any violation is detected, set `safety_compliance` to false,
          log a detailed anomaly description, and abort remaining steps.
      - complexity: LOW
        impact: MEDIUM
        method: Use simple counters and append operations; perform range checks against
          expected min/max values.
        reason: Accurate observation recording is necessary for downstream data analysis.
        text: After each step, increment `observation_count` by one, append the observation
          to the `observations` list, and check if the data collected for that step
          meets quality criteria (e.g., range checks).
      - complexity: MEDIUM
        impact: MEDIUM
        method: Wrap critical operations in try/catch blocks; on exception, capture
          exception message and context.
        reason: Anomalies may influence data validity and should be transparently
          reported.
        text: If an unexpected event occurs—such as equipment failure, measurement
          out‑of‑range, or time lag—set `anomalies_detected` to true and append a
          descriptive message to `anomaly_descriptions`.
      - complexity: LOW
        impact: LOW
        method: Check safety_compliance flag; if true then experiment_completed =
          true.
        reason: Completion flag is required to determine if the experiment was fully
          executed.
        text: After all steps have been processed, set `experiment_completed` to true
          if no fatal safety violations occurred, otherwise leave it false.
      - complexity: LOW
        impact: HIGH
        method: Compare observation_count with sample_size; if equal, status = true.
        reason: Ensures that the experiment produced a complete dataset for analysis.
        text: Determine `data_collection_status` by verifying that the number of collected
          data points matches the expected count defined in `design_experiment.sample_size`.
          If mismatch, set `data_collection_status` to false.
      - complexity: LOW
        impact: LOW
        method: 'Package variables into a dict: {"experiment_completed":..., "safety_compliance":...,
          ...}; serialize as JSON.'
        reason: A consistent and typed output is required for downstream nodes.
        text: Return the constructed output dictionary containing all eight fields,
          ensuring correct data types (bool, int, List[str]) and that all lists are
          in the order of execution.
    prompt: Carry out the experiment according to the designed plan, ensuring to follow
      safety protocols and record any observations.
    shims: []
  design_experiment:
    agent: false
    code_node_type: stub
    description: Design the experiment to test the hypothesis
    implementation: "from pydantic import BaseModel, Field\n\n\nclass FormulateHypothesisOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for formulate_hypothesis node outputs.\"\"\"\n   \
      \ hypothesis_sentence: str = Field(..., description=\"A single-sentence, testable\
